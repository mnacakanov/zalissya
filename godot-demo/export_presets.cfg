[preset.0]

name="Web"
platform="Web"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="art/data.json,styles/*/layout.json"
exclude_filter="tools/*,styles/raw/*,styles/drova/hut_interior_and_horod_TOUCHING.png,styles/drova/hut_interior_bed.png"
export_path="build/index.html"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=false
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include="<script>/* a new build takes over at once, instead of waiting for every window of the app to close */if('serviceWorker' in navigator){navigator.serviceWorker.getRegistration().then(function(reg){if(!reg)return;var go=function(w){if(w&&navigator.serviceWorker.controller)w.postMessage('update');};go(reg.waiting);reg.addEventListener('updatefound',function(){var w=reg.installing;if(w)w.addEventListener('statechange',function(){if(w.state==='installed')go(w);});});reg.update();});}</script>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=true
progressive_web_app/ensure_cross_origin_isolation_headers=false
progressive_web_app/offline_page=""
progressive_web_app/display=0
progressive_web_app/orientation=0
progressive_web_app/icon_144x144="res://icons/icon_144.png"
progressive_web_app/icon_180x180="res://icons/icon_180.png"
progressive_web_app/icon_512x512="res://icons/icon_512.png"
progressive_web_app/background_color=Color(0.478, 0.29, 0.169, 1)
