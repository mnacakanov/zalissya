<!doctype html>
<!--
  Renders a model (otaman.js) from the Pillars-lite camera, the one the
  style's pictures are drawn from, and reports the plan in the pictures'
  own pixels. Driven by render.cjs; see README.md.
-->
<meta charset="utf-8">
<title>Model render</title>
<script type="importmap">
{ "imports": { "three": "./node_modules/three/build/three.module.js", "three/addons/": "./node_modules/three/examples/jsm/" } }
</script>
<body style="margin:0;background:#000">
<script type="module">
import * as THREE from "three";
import { GLTFExporter } from "three/addons/exporters/GLTFExporter.js";

const name = new URLSearchParams(location.search).get("model") || "otaman";
const M = await import(`./${name}.js`);

// The Pillars-lite camera, from the style's own hut (styles/pillars/
// layout.json) and the maidan's ground scale (hut 4.7 x 4.2 m): a metre east
// is (68.5, 21.3) px on the picture, a metre south (-65.5, 26.7), a metre up
// (0, -88). That is an orthographic camera, about 94.6 px a metre, looking
// down some 21 degrees.
const EAST = [68.51, 21.28], SOUTH = [-65.48, 26.67], UP = [0, -88];
const Rr = new THREE.Vector3(EAST[0], UP[0], SOUTH[0]);   // world → screen x
const Dd = new THREE.Vector3(EAST[1], UP[1], SOUTH[1]);   // world → screen y (down)
const s = (Rr.length() + Dd.length()) / 2;
const right = Rr.clone().normalize();
const down = Dd.clone().sub(right.clone().multiplyScalar(Dd.dot(right))).normalize();
const up = down.clone().negate();
const back = new THREE.Vector3().crossVectors(right, up).normalize();

const full = await M.build(THREE, {});
// (a building you only see from outside, like a cellar's mound, has no cutaway)
const cut = M.NO_INTERIOR ? null : M.build(THREE, { cutaway: true });

// the picture's frame: every vertex of the full house, plus a margin
const proj = (p) => [p.dot(right) * s, p.dot(down) * s];   // px, from the world origin
let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
// (and of the cutaway: a sunken room reaches below the house)
for (const mdl of [full, cut].filter(Boolean)) mdl.updateMatrixWorld(true);
[full, cut].filter(Boolean).forEach((mdl) => mdl.traverse((o) => {
  if (!o.geometry) return;
  const pos = o.geometry.attributes.position;
  const v = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i).applyMatrix4(o.matrixWorld);
    const [x, y] = proj(v);
    minX = Math.min(minX, x); maxX = Math.max(maxX, x); minY = Math.min(minY, y); maxY = Math.max(maxY, y);
  }
}));
const pad = 12;
minX -= pad; maxX += pad; minY -= pad; maxY += 2;
const W = Math.ceil(maxX - minX), H = Math.ceil(maxY - minY);
// a world point in px from the picture's bottom centre (the game's anchor)
const px = (p) => { const [x, y] = proj(new THREE.Vector3(...p)); return [Math.round(x - minX - W / 2), Math.round(y - minY - H)]; };

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const cam = new THREE.OrthographicCamera(minX / s, maxX / s, -minY / s, -maxY / s, 0.1, 200);
cam.position.copy(back.clone().multiplyScalar(60));
cam.up.copy(up);
cam.lookAt(0, 0, 0);
// (lookAt keeps 'right' only up to the camera's own basis; set it exactly)
cam.matrix.makeBasis(right, up, back).setPosition(cam.position);
cam.matrix.decompose(cam.position, cam.quaternion, cam.scale);
cam.matrixWorldNeedsUpdate = true;
// the frustum is measured from the camera's own axis, which passes through the origin
cam.updateProjectionMatrix();

function scene(model, kind) {
  const sc = new THREE.Scene();
  const m = model.clone(true);
  if (kind === "color") {
    sc.add(new THREE.HemisphereLight(0xf4efe2, 0x6b5f4a, 1.1));
    // the sun from the upper left, as the game's DirectionalLight2D
    const sun = new THREE.DirectionalLight(0xfff1d6, 2.2);
    // aimed at the house's middle, wherever the model stands
    const mid = [M.SIZE.x / 2, 0, -M.SIZE.z / 2];
    sun.position.set(mid[0] - 13.5, 14, mid[2] + 6.75);
    sun.target.position.set(...mid);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    Object.assign(sun.shadow.camera, { left: -12, right: 12, top: 12, bottom: -12, near: 1, far: 50 });
    sc.add(sun, sun.target);
  }
  m.traverse((o) => {
    if (o.userData.inkOnly) o.visible = kind === "ink";
    if (!o.isMesh) return;
    if (kind === "depth") o.material = new THREE.MeshDepthMaterial();
    if (kind === "normal") o.material = new THREE.MeshNormalMaterial({ side: THREE.DoubleSide });
    if (kind === "ink") {
      o.material = new THREE.MeshBasicMaterial({ color: 0xffffff, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1, side: THREE.DoubleSide });
      const e = new THREE.LineSegments(new THREE.EdgesGeometry(o.geometry, 20), new THREE.LineBasicMaterial({ color: 0x1c140d }));
      o.add(e);
    }
  });
  sc.add(m);
  return sc;
}

const out = {};
for (const [tag, model] of [["exterior", full], ["interior", cut]].filter(([, m]) => m)) {
  for (const kind of ["color", "ink", "depth", "normal"]) {
    if (kind === "depth") { cam.near = 50; cam.far = 70; cam.updateProjectionMatrix(); }
    else { cam.near = 0.1; cam.far = 200; cam.updateProjectionMatrix(); }
    renderer.setClearColor(0x000000, 0);
    renderer.render(scene(model, kind), cam);
    out[`${tag}_${kind}`] = renderer.domElement.toDataURL("image/png");
  }
}

// The near walls' mask: where the cutaway's knee-high south and east walls
// (and the pryzba before them) show. The game draws that part of the room's
// picture over the kobzar when he stands behind it, so his legs go behind
// the stub as they should. White where they show, transparent elsewhere;
// everything else in the room still hides what is behind it.
const NEAR = /^(wall_south|wall_east|pryzba_s|pryzba_e)/;
if (cut) {
  const sc = new THREE.Scene();
  const m = cut.clone(true);
  const white = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide });
  const hide = new THREE.MeshBasicMaterial({ colorWrite: false, side: THREE.DoubleSide });
  m.traverse((o) => {
    if (o.userData.inkOnly) o.visible = false;
    if (o.isMesh) o.material = NEAR.test(o.name) ? white : hide;
  });
  sc.add(m);
  cam.near = 0.1; cam.far = 200; cam.updateProjectionMatrix();
  renderer.setClearColor(0x000000, 0);
  renderer.render(sc, cam);
  out.interior_front = renderer.domElement.toDataURL("image/png");
}

// the plan, in the pictures' pixels: ready for the hut's hut.json
const P = M.plan();
const solids = [];
if (cut) cut.updateMatrixWorld(true);
if (cut) cut.traverse((o) => {
  if (!o.isMesh || !o.userData.solid) return;
  const b = new THREE.Box3().setFromObject(o);
  solids.push([[b.min.x, 0, b.max.z], [b.max.x, 0, b.max.z], [b.max.x, 0, b.min.z], [b.min.x, 0, b.min.z]].map(px));
});
const fp = P.footprint.map(px);
out.plan = {
  canvas: [W, H],
  px_per_metre: s,
  hut: {
    size: [M.SIZE.x, M.SIZE.z],
    exterior: { file: "hut_exterior", footprint: fp },
    interior: cut && {
      file: "hut_interior",
      front: "hut_interior_front",
      footprint: fp,
      ...(P.pich ? { pich: px(P.pich) } : {}),
      walls: P.partitions.map(([a, b]) => [...px(a), ...px(b)]),
      // a sunken room: how deep the kobzar stands where (metres, negative
      // down): flat regions {quad, h} and ramps {quad, foot, top, from, to}
      ...(P.heights ? { heights: P.heights.map((r) => r.foot
        ? { quad: r.quad.map(px), foot: px(r.foot), top: px(r.top), from: r.from, to: r.to }
        : { quad: r.quad.map(px), h: r.h }) } : {}),
      polys: solids,
    },
    // [t0, t1] along the south wall, or {wall, t} for a door in another wall
    ...(P.sunken ? { sunken: true } : {}),
    ...(P.lamp ? { lamp: px(P.lamp) } : {}),
    door: !P.door ? undefined : Array.isArray(P.door) ? P.door.map((v) => Math.round(v * 1000) / 1000)
      : { wall: P.door.wall, t: P.door.t.map((v) => Math.round(v * 1000) / 1000) },
  },
};

// A second level (the komora's lyokh): the model's cellar alone, on a canvas
// of its own, its floor as the picture's ground. The game lays it out as a
// room of its own and fades between the levels at the hatch and the steps.
if (P.cellar) {
  const cel = M.build(THREE, { level: "cellar" });
  cel.updateMatrixWorld(true);
  let a = Infinity, b = -Infinity, c = Infinity, d = -Infinity;
  cel.traverse((o) => {
    if (!o.geometry) return;
    const pos = o.geometry.attributes.position;
    const v = new THREE.Vector3();
    for (let i = 0; i < pos.count; i++) {
      v.fromBufferAttribute(pos, i).applyMatrix4(o.matrixWorld);
      const [x, y] = proj(v);
      a = Math.min(a, x); b = Math.max(b, x); c = Math.min(c, y); d = Math.max(d, y);
    }
  });
  a -= pad; b += pad; c -= pad; d += 2;
  const CW = Math.ceil(b - a), CH = Math.ceil(d - c);
  const cpx = (p) => { const [x, y] = proj(new THREE.Vector3(...p)); return [Math.round(x - a - CW / 2), Math.round(y - c - CH)]; };
  renderer.setSize(CW, CH);
  Object.assign(cam, { left: a / s, right: b / s, top: -c / s, bottom: -d / s });
  for (const kind of ["color", "ink", "depth", "normal"]) {
    if (kind === "depth") { cam.near = 50; cam.far = 70; } else { cam.near = 0.1; cam.far = 200; }
    cam.updateProjectionMatrix();
    renderer.setClearColor(0x000000, 0);
    renderer.render(scene(cel, kind), cam);
    out[`cellar_${kind}`] = renderer.domElement.toDataURL("image/png");
  }
  {
    const sc = new THREE.Scene();
    const m = cel.clone(true);
    const white = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide });
    const hide = new THREE.MeshBasicMaterial({ colorWrite: false, side: THREE.DoubleSide });
    m.traverse((o) => { if (o.userData.inkOnly) o.visible = false; if (o.isMesh) o.material = NEAR.test(o.name) ? white : hide; });
    sc.add(m);
    cam.near = 0.1; cam.far = 200; cam.updateProjectionMatrix();
    renderer.render(sc, cam);
    out.cellar_front = renderer.domElement.toDataURL("image/png");
  }
  const cs = [];
  cel.traverse((o) => {
    if (!o.isMesh || !o.userData.solid) return;
    const bb = new THREE.Box3().setFromObject(o);
    cs.push([[bb.min.x, 0, bb.max.z], [bb.max.x, 0, bb.max.z], [bb.max.x, 0, bb.min.z], [bb.min.x, 0, bb.min.z]].map(cpx));
  });
  const C = P.cellar;
  out.plan.cellar_canvas = [CW, CH];
  out.plan.hut.descend = { at: px(P.descend.at), out: px(P.descend.out) };
  out.plan.hut.cellar = {
    file: "cellar", front: "cellar_front",
    footprint: C.footprint.map(cpx),
    arrive: cpx(C.arrive), up: cpx(C.up), lamp: cpx(C.lamp),
    polys: cs,
    ...(C.walls ? { walls: C.walls.map(([p, q]) => [...cpx(p), ...cpx(q)]) } : {}),
    ...(C.gap ? { gap: C.gap } : {}),
    ...(C.stairs ? { stairs: { quad: C.stairs.quad.map(cpx), foot: cpx(C.stairs.foot), top: cpx(C.stairs.top), rise: C.stairs.rise } } : {}),
  };
  if (!out.plan.hut.interior) delete out.plan.hut.interior;
  if (!out.plan.hut.door) delete out.plan.hut.door;
}

// and the model itself, for Blender, Godot or anyone's own renders
const glb = await new GLTFExporter().parseAsync(full, { binary: true });
const bytes = new Uint8Array(glb);
let bin = "";
for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
out.glb = btoa(bin);
window.result = out;
</script>
