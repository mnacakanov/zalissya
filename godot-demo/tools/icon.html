<!doctype html>
<meta charset="utf-8">
<title>Zalissya icon</title>
<body style="margin:0;background:#222">
<script>
// The app icon, painted with canvas in the game's storybook style. Drawn at
// 1024 px; tools/icon.cjs saves each variant and the sizes the PWA needs.
// Full-bleed and opaque (iOS adds its own rounded corners), with the motif
// inside the central 80% so Android's maskable crops never cut it.
const INK = "rgba(34,22,14,0.9)";

function sky(c, S, top, bottom) {
  const g = c.createLinearGradient(0, 0, 0, S);
  g.addColorStop(0, top); g.addColorStop(1, bottom);
  c.fillStyle = g; c.fillRect(0, 0, S, S);
}
function stars(c, S, n, seed) {
  let r = seed;
  const rnd = () => (r = (r * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < n; i++) {
    const x = rnd() * S, y = rnd() * S * 0.5, s = 1.5 + rnd() * 3.5;
    c.fillStyle = `rgba(255,244,214,${0.35 + rnd() * 0.5})`;
    c.beginPath(); c.arc(x, y, s, 0, Math.PI * 2); c.fill();
  }
}
function moon(c, x, y, r) {
  const glow = c.createRadialGradient(x, y, r * 0.6, x, y, r * 2.6);
  glow.addColorStop(0, "rgba(255,240,200,0.35)"); glow.addColorStop(1, "rgba(255,240,200,0)");
  c.fillStyle = glow; c.fillRect(x - r * 3, y - r * 3, r * 6, r * 6);
  c.fillStyle = "#f6ecc8";
  c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill();
  c.fillStyle = "rgba(200,184,140,0.35)";
  c.beginPath(); c.arc(x - r * 0.3, y + r * 0.2, r * 0.18, 0, Math.PI * 2); c.fill();
  c.beginPath(); c.arc(x + r * 0.25, y - r * 0.3, r * 0.12, 0, Math.PI * 2); c.fill();
}

// the kobza: a deep round bowl of pale wood, the rose, a short neck with its
// head and pegs, the strings catching the light
function kobza(c, cx, cy, s, rot) {
  c.save(); c.translate(cx, cy); c.rotate(rot); c.scale(s, s);
  // neck
  c.fillStyle = "#6e4525";
  c.beginPath(); c.moveTo(-22, -150); c.lineTo(22, -150); c.lineTo(26, -470); c.lineTo(-26, -470); c.closePath(); c.fill();
  c.strokeStyle = INK; c.lineWidth = 8; c.stroke();
  // frets
  c.strokeStyle = "rgba(240,210,150,0.6)"; c.lineWidth = 5;
  for (let k = 0; k < 5; k++) { const y = -200 - k * 50; c.beginPath(); c.moveTo(-22, y); c.lineTo(22, y); c.stroke(); }
  // head, bent back, with pegs
  c.fillStyle = "#4a2c16";
  c.beginPath(); c.moveTo(-34, -470); c.lineTo(34, -470); c.lineTo(28, -580); c.lineTo(-28, -580); c.closePath(); c.fill();
  c.strokeStyle = INK; c.lineWidth = 8; c.stroke();
  c.fillStyle = "#e8c48a";
  for (let k = 0; k < 3; k++) for (const sd of [-1, 1]) {
    c.beginPath(); c.ellipse(sd * 48, -495 - k * 32, 16, 10, 0, 0, Math.PI * 2); c.fill();
    c.strokeStyle = INK; c.lineWidth = 5; c.stroke();
  }
  // body
  const g = c.createRadialGradient(-80, -60, 20, 0, 0, 260);
  g.addColorStop(0, "#f0c27a"); g.addColorStop(0.55, "#c98a46"); g.addColorStop(1, "#7a4a22");
  c.fillStyle = g;
  c.beginPath(); c.ellipse(0, 40, 210, 240, 0, 0, Math.PI * 2); c.fill();
  c.strokeStyle = INK; c.lineWidth = 10; c.stroke();
  // the soundboard's painted rim (red and gold, as kobzars liked)
  c.strokeStyle = "#b0302a"; c.lineWidth = 14;
  c.beginPath(); c.ellipse(0, 40, 180, 210, 0, 0, Math.PI * 2); c.stroke();
  c.strokeStyle = "#d9a441"; c.lineWidth = 5;
  c.beginPath(); c.ellipse(0, 40, 164, 194, 0, 0, Math.PI * 2); c.stroke();
  // rose
  c.fillStyle = "#2a1a0e";
  c.beginPath(); c.arc(0, -10, 58, 0, Math.PI * 2); c.fill();
  c.strokeStyle = "#d9a441"; c.lineWidth = 6;
  c.beginPath(); c.arc(0, -10, 70, 0, Math.PI * 2); c.stroke();
  for (let k = 0; k < 12; k++) {
    const a = (k / 12) * Math.PI * 2;
    c.fillStyle = "#d9a441";
    c.beginPath(); c.arc(Math.cos(a) * 84, -10 + Math.sin(a) * 84, 6, 0, Math.PI * 2); c.fill();
  }
  // bridge
  c.fillStyle = "#3a2414"; c.fillRect(-60, 150, 120, 18);
  // strings
  c.strokeStyle = "rgba(255,246,222,0.95)"; c.lineWidth = 3.2;
  for (let k = -3; k <= 3; k++) { c.beginPath(); c.moveTo(k * 7, 159); c.lineTo(k * 4.5, -470); c.stroke(); }
  // a highlight on the bowl
  c.strokeStyle = "rgba(255,240,210,0.45)"; c.lineWidth = 12; c.lineCap = "round";
  c.beginPath(); c.ellipse(0, 40, 190, 220, 0, Math.PI * 1.05, Math.PI * 1.35); c.stroke();
  c.restore();
}

// a thatched khata under the night, a lit window
function khata(c, x, y, w, h) {
  const wallTop = y - h * 0.5;
  c.fillStyle = "rgba(0,0,0,0.25)";
  c.beginPath(); c.ellipse(x, y + 10, w * 0.62, 26, 0, 0, Math.PI * 2); c.fill();
  // walls
  const g = c.createLinearGradient(x - w / 2, 0, x + w / 2, 0);
  g.addColorStop(0, "#e8e0cc"); g.addColorStop(1, "#a9a08c");
  c.fillStyle = g; c.fillRect(x - w / 2, wallTop, w, h * 0.5);
  c.strokeStyle = INK; c.lineWidth = 8; c.strokeRect(x - w / 2, wallTop, w, h * 0.5);
  c.fillStyle = "#b0302a"; c.fillRect(x - w / 2, y - 18, w, 18);
  // window, lit
  const wx = x - w * 0.28, wy = wallTop + h * 0.12, ww = w * 0.2, wh = h * 0.2;
  const lg = c.createRadialGradient(wx + ww / 2, wy + wh / 2, 4, wx + ww / 2, wy + wh / 2, w * 0.4);
  lg.addColorStop(0, "rgba(255,200,110,0.55)"); lg.addColorStop(1, "rgba(255,200,110,0)");
  c.fillStyle = lg; c.fillRect(wx - w * 0.4, wy - w * 0.4, ww + w * 0.8, wh + w * 0.8);
  c.fillStyle = "#ffd27a"; c.fillRect(wx, wy, ww, wh);
  c.strokeStyle = "#3a5a8a"; c.lineWidth = 8; c.strokeRect(wx, wy, ww, wh);
  c.beginPath(); c.moveTo(wx + ww / 2, wy); c.lineTo(wx + ww / 2, wy + wh); c.moveTo(wx, wy + wh / 2); c.lineTo(wx + ww, wy + wh / 2); c.stroke();
  // door
  c.fillStyle = "#5a3a22"; c.fillRect(x + w * 0.12, wallTop + h * 0.1, w * 0.16, h * 0.4 - 18);
  // thatch: a heavy rounded roof
  const rg = c.createLinearGradient(0, y - h * 1.15, 0, wallTop + 20);
  rg.addColorStop(0, "#b08a4a"); rg.addColorStop(1, "#7a5a2a");
  c.fillStyle = rg;
  c.beginPath();
  c.moveTo(x - w * 0.62, wallTop + 26);
  c.quadraticCurveTo(x - w * 0.6, y - h * 1.1, x, y - h * 1.12);
  c.quadraticCurveTo(x + w * 0.6, y - h * 1.1, x + w * 0.62, wallTop + 26);
  c.closePath(); c.fill(); c.strokeStyle = INK; c.lineWidth = 8; c.stroke();
  c.strokeStyle = "rgba(60,40,16,0.4)"; c.lineWidth = 4;
  for (let k = -5; k <= 5; k++) { c.beginPath(); c.moveTo(x + k * w * 0.1, wallTop + 22); c.lineTo(x + k * w * 0.07, y - h * 0.95); c.stroke(); }
  // chimney smoke
  c.fillStyle = "#cfc8b8"; c.fillRect(x + w * 0.22, y - h * 1.18, w * 0.08, h * 0.2);
  for (let k = 0; k < 4; k++) {
    c.fillStyle = `rgba(220,220,230,${0.35 - k * 0.07})`;
    c.beginPath(); c.arc(x + w * 0.26 + k * 22, y - h * 1.25 - k * 46, 22 + k * 10, 0, Math.PI * 2); c.fill();
  }
}

function variantKobza(c, S) {
  sky(c, S, "#1e2a52", "#5a2a3a");
  stars(c, S, 40, 7);
  moon(c, S * 0.76, S * 0.22, S * 0.075);
  // a fire glow from below
  const fg = c.createRadialGradient(S / 2, S * 0.95, 20, S / 2, S * 0.95, S * 0.7);
  fg.addColorStop(0, "rgba(255,150,60,0.7)"); fg.addColorStop(1, "rgba(255,150,60,0)");
  c.fillStyle = fg; c.fillRect(0, 0, S, S);
  kobza(c, S * 0.57, S * 0.6, S / 1024 * 0.8, -0.42);
}
function variantKhata(c, S) {
  sky(c, S, "#16204a", "#3a3a6a");
  stars(c, S, 50, 11);
  moon(c, S * 0.72, S * 0.24, S * 0.09);
  // the land
  c.fillStyle = "#2a3a24";
  c.beginPath(); c.moveTo(0, S * 0.74); c.quadraticCurveTo(S * 0.5, S * 0.66, S, S * 0.76); c.lineTo(S, S); c.lineTo(0, S); c.fill();
  khata(c, S * 0.5, S * 0.74, S * 0.5, S * 0.4);
  // a kobza leaning against the wall
  kobza(c, S * 0.2, S * 0.8, S / 1024 * 0.3, -0.2);
}
function variantDome(c, S) {
  sky(c, S, "#e8a250", "#7a2a3a");
  // the sun going down behind the chapel
  const sg = c.createRadialGradient(S / 2, S * 0.62, 10, S / 2, S * 0.62, S * 0.45);
  sg.addColorStop(0, "rgba(255,236,170,1)"); sg.addColorStop(0.4, "rgba(255,200,110,0.6)"); sg.addColorStop(1, "rgba(255,200,110,0)");
  c.fillStyle = sg; c.fillRect(0, 0, S, S);
  // silhouette: the chapel with its onion dome and cross, the khutir either side
  c.fillStyle = "#2a1a22";
  const cx = S / 2;
  c.beginPath();
  c.moveTo(0, S * 0.8); c.lineTo(S * 0.16, S * 0.8); c.quadraticCurveTo(S * 0.22, S * 0.66, S * 0.3, S * 0.8);
  c.lineTo(cx - S * 0.12, S * 0.8); c.lineTo(cx - S * 0.12, S * 0.6); c.lineTo(cx, S * 0.5); c.lineTo(cx + S * 0.12, S * 0.6); c.lineTo(cx + S * 0.12, S * 0.8);
  c.lineTo(S * 0.7, S * 0.8); c.quadraticCurveTo(S * 0.78, S * 0.68, S * 0.86, S * 0.8); c.lineTo(S, S * 0.8); c.lineTo(S, S); c.lineTo(0, S); c.closePath(); c.fill();
  // drum and dome
  c.fillRect(cx - S * 0.04, S * 0.43, S * 0.08, S * 0.09);
  c.beginPath();
  c.moveTo(cx - S * 0.06, S * 0.44);
  c.bezierCurveTo(cx - S * 0.09, S * 0.36, cx - S * 0.01, S * 0.33, cx, S * 0.28);
  c.bezierCurveTo(cx + S * 0.01, S * 0.33, cx + S * 0.09, S * 0.36, cx + S * 0.06, S * 0.44);
  c.closePath(); c.fill();
  c.fillStyle = "#f0c860";
  c.fillRect(cx - S * 0.006, S * 0.16, S * 0.012, S * 0.12);
  c.fillRect(cx - S * 0.035, S * 0.19, S * 0.07, S * 0.012);
  c.fillRect(cx - S * 0.025, S * 0.235, S * 0.05, S * 0.01);
  // a lit window
  c.fillStyle = "#ffd27a"; c.fillRect(cx - S * 0.02, S * 0.66, S * 0.04, S * 0.07);
}

window.VARIANTS = { kobza: variantKobza, khata: variantKhata, dome: variantDome };
window.render = (name, S) => {
  const cv = document.createElement("canvas");
  cv.width = cv.height = 1024;
  const c = cv.getContext("2d");
  window.VARIANTS[name](c, 1024);
  if (S === 1024) return cv.toDataURL("image/png");
  // downscale in halves for a clean small icon
  let cur = cv;
  while (cur.width / 2 >= S * 1.5) {
    const n = document.createElement("canvas");
    n.width = n.height = cur.width / 2;
    n.getContext("2d").drawImage(cur, 0, 0, n.width, n.height);
    cur = n;
  }
  const out = document.createElement("canvas");
  out.width = out.height = S;
  const oc = out.getContext("2d");
  oc.imageSmoothingQuality = "high";
  oc.drawImage(cur, 0, 0, S, S);
  return out.toDataURL("image/png");
};
</script>
