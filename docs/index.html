heard.","char.myroslav.name.0":"Myroslav","char.myroslav.pron.0":"my-ro-SLAHV","char.myroslav.role.0":"Otaman of the khutir · an old Zaporozhian","char.vesna.name.0":"Vesna","char.vesna.pron.0":"VEHS-nah","char.vesna.role.0":"Znakharka · heals folk and cattle","char.radek.name.0":"Radek","char.radek.pron.0":"RAH-dek","char.radek.role.0":"Smith · a Pole who ran from his lord","char.domovyk.name.0":"Domovyk","char.domovyk.pron.0":"do-mo-VYK","char.domovyk.role.0":"House spirit · master of the pich","char.lisovyk.name.0":"Lisovyk","char.lisovyk.pron.0":"lee-so-VYK","char.lisovyk.role.0":"Forest spirit · lord of the pines","char.chort.name.0":"Chort","char.chort.pron.0":"chort","char.chort.role.0":"Merchant of souls · loves a good tune","char.bolotianyk.name.0":"Bolotianyk","char.bolotianyk.pron.0":"bo-lo-TYAH-nyk","char.bolotianyk.role.0":"Keeper of the pond and the reeds","char.viy.name.0":"Viy","char.viy.pron.0":"veey","char.viy.role.0":"Asleep. Do not wake him.","char.domovyk.name.1":"Domovyk","char.domovyk.pron.1":"do-mo-VYK","char.domovyk.role.1":"House spirit · master of the pich","char.vesna.name.1":"Vesna","char.vesna.pron.1":"VEHS-nah","char.vesna.role.1":"Znakharka · heals folk and cattle","char.beelzebub.name.0":"Beelzebub","char.beelzebub.pron.0":"be-EL-ze-bub","char.beelzebub.role.0":"Host of the sabbath · lord of Lysa Hora","char.chort.name.1":"Chort","char.chort.pron.1":"chort","char.chort.role.1":"Tonight — master of the sabbath","char.solokha.name.0":"Solokha","char.solokha.pron.0":"so-lo-KHA","char.solokha.role.0":"Witch from Dykanka · a widow","char.motrya.name.0":"Motrya","char.motrya.pron.0":"MO-trya","char.motrya.role.0":"Witch · knows where the nichnyky bloom","char.LYSA_DANCERS.name.0":"Witch","char.LYSA_DANCERS.role.0":"Dancing at the sabbath","input.Joystick.0":"Game view — touch anywhere and drag to walk","input.Joystick.1":"Touch anywhere and drag to walk","time.timeLabel.0":"Day {day} · {hh}:{mm} {icon}","ui.continue":"Continue","ui.zalissya":"Zalissya","ui.next":"Next","ui.farewell":"Farewell","ui.quests":"Quests","ui.character":"Character","stat.soulless":"Soulless","quest.section.story":"Story","ui.hud.soulLost":"☠ No shadow — the Chort has your soul ({price} fish buys it back)","ui.hud.overfull":"🎒 Over-full ({carried}/{cap}) — no new pickups","ui.vigil.secondsLeft":"{s}s","ui.dialogue.youAsk":"You ask: “{question}”","ui.quests.intro":"{done} of {total} done. The {now} mark is where the story stands. The rest will wait: wandering is no sin.","ui.stats.from":"from {feeds}","ui.stats.footer":"No points handed out here. In Zalissya you become what you do. The Chort currently prices your soul at {price} fish.","ui.skills.feeds":"→ {stat}","ui.skills.level":"Lv {level}","ui.satchel.basics":"🌿 herbs: {herbStock} · 🎣 fish: {fish}","ui.satchel.carrying":"🎒 Carrying {carried} / {cap} (STR {str} sets the limit). Weights: fish 1 · herb 1 · horseshoe 2 · bog iron 3 · nichnyky 0.","line.chort.5b":"Hey, what's that smell? Pond and karas! THREE fish, I count without counting. Well, kobzar, shall we settle accounts?","ui.language":"Language","song.name.holota":"Duma of Cossack Holota","song.name.kolyskova":"Lullaby “Sleep walks by the window”","song.name.hopak":"Hopak","song.name.burya":"Duma of the Black Sea storm","song.topic.vesna.label":"A lullaby","song.topic.vesna.question":"Will you teach me a lullaby?","song.topic.vesna.0":"“Sleep walks by the window, drowse walks by the fence…” My mother sang it to me, and I sing it to every sick child on the khutir. Listen and remember.","song.topic.vesna.1":"Sing it in the Domovyk's hut when you lie down. He'll pretend not to listen, and you'll wake as if your mother had swaddled you. CON +1 until the next dawn.","song.topic.chort.label":"The hopak","song.topic.chort.question":"They say you're a musician. Teach me the hopak?","song.topic.chort.0":"I'll teach you! For free! See how it pains me to say it? The hopak is devil's music the Cossacks pinched from us, and we don't even mind: they dance it so well.","song.topic.chort.1":"There: one-two, one-two-three, then strike the strings as if a hundred Tatars were chasing you. Without the hopak they won't let you past the door on Lysa Hora.","song.topic.motrya.label":"The hopak","song.topic.motrya.question":"Will you teach me the hopak?","song.topic.motrya.0":"“Listen.” Motrya hums, stamping the beat, and within a minute your fingers know where to run. “The Chort would've taught you too, but then he'd tell everyone you owe him.”","ui.fire.name":"The campfire","ui.fire.role":"Where the khutir gathers in the evening","ui.play.audience.holota":"The duma of Holota — how a ragged Cossack taught a Polish lord a lesson. Radek laughs loudest: “Dobrze, serves him right!”","ui.play.audience.kolyskova":"The lullaby. The chatter dies down. An old woman dabs her eyes with her kerchief, and the otaman pretends smoke got in his eye.","ui.play.audience.hopak":"Hopak! In a moment the whole khutir is squat-dancing, even the otaman and his bad back. From somewhere in the dark comes a suspicious clatter of hooves.","ui.play.audience.burya":"The duma of the Black Sea storm. Over the fire the silence is so deep you hear the embers crack. Nobody says a word. Everyone knows the night you held.","ui.song.learned":"New song: {song} 🎶","ui.sleep.rested":"In the night the Domovyk quietly hummed your lullaby. You slept like a baby. CON +1 until dawn.","ui.dance.noHopak":"You take up the kobza — but what to play? Here they dance only to the hopak. The Chort and Motrya know it.","ui.play.daytime":"By day the khutir is in the fields. Nobody to listen — come in the evening, from six.","ui.play.alreadyPlayed":"You've already played tonight. Folk are drifting home — they'll ask for more tomorrow.","ui.play.first":"You sit on the log and the khutir drifts over: the otaman with his pipe, Vesna with her basket, Radek a little apart. Waiting. What will you play?","ui.play.prompt":"The khutir gathers by the fire. What will you play?","ui.promptLabel.play":"Play the kobza 🎶","ui.satchel.songs":"🎶 Songs: {songs}","ui.skillRows.name.music":"Music","ui.skillRows.stat.music":"CHA","stat.rested":"Slept to a lullaby","quest.evening.title":"First evening by the fire","quest.evening.done":"The khutir has listened · evenings: {played}","quest.evening.detail":"In the evening (from 18:00) sit on the log by the campfire and play for the khutir","quest.evening.now":"Evening! Sit by the campfire and play for the khutir","quest.evening.wait":"When evening comes (18:00), play by the campfire","quest.lysa-sabbath.hopak":"The sabbath dances only to the hopak — learn it from the Chort or Motrya","char.gnat.name":"Hnat","char.gnat.pron":"hnaht","char.gnat.role":"Chumak leader · hauling salt from Crimea","char.ostap.name":"Ostap","char.ostap.pron":"os-TAHP","char.ostap.role":"The youngest chumak · burning with fever","char.ostap.roleWell":"The youngest chumak · back on his feet","song.name.zhentsi":"“On the hill the reapers reap”","song.name.rozpriahaite":"“Unharness the horses, lads”","song.name.voly":"“Oh, my pale-grey oxen”","song.name.polechko":"“Oh, little field, field”","song.topic.myroslav.label":"A song from the Sich","song.topic.myroslav.question":"What did they sing at the Sich?","song.topic.myroslav.0":"“On the hill the reapers reap.” The host marched down the valley to it, and we young ones bellowed so loud the horses flattened their ears.","song.topic.myroslav.1":"Take it, kobzar. Sing it when folk are merry — it's a feast song. Only sing the line about Sahaidachny and his pipe louder: that one's my favourite.","song.topic.radek.label":"A Cossack song","song.topic.radek.question":"You, a Pole, know Cossack songs?","song.topic.radek.0":"I know one! “Unharness the horses, lads.” Learned it my first year so they'd stop beating me at weddings. It worked. Half the time.","song.topic.radek.1":"Take it. I sing it worse than I forge, and I forge dobrze. Meaning — well. A merry one. For feast days.","chumak.news.arrived":"Dawn. On the east road — a chumak camp: a cart of salt, grey oxen. And someone lying by the cart who doesn't get up.","chumak.news.died":"Dawn. By the chumak cart, men are digging. Ostap didn't live to see the morning.","chumak.toast.vesnaTonic":"Vesna silently slips a bottle of tonic into your satchel. “I never gave you anything.”","chumak.toast.persuaded":"The otaman waved a hand. Vesna is already running to the camp with her basket.","chumak.toast.treated":"You hold Ostap's head while he drinks. By evening the fever breaks. The khutir will find out — the khutir always does.","chumak.gnat.intro":"A grey chumak with tar on his shirt rises to meet you. “A kobzar? Thank God, someone finally came over. I'm Hnat. We're hauling salt from Crimea. And this… this is Ostap. My nephew.”","chumak.gnat.again":"Hnat raises eyes red from no sleep. “Well, kobzar?”","chumak.gnat.t.ostap.label":"What's wrong with the boy?","chumak.gnat.t.ostap.question":"What's wrong with Ostap?","chumak.gnat.ostap.0":"Fever. Drank from a marsh puddle near Perekop — young, foolish, thirsty. Three days burning. Yesterday he still talked. Today he doesn't know me.","chumak.gnat.ostap.1":"He won't live till morning if nobody helps. Thirty years I've been on the road. I know what it looks like.","chumak.gnat.t.why.label":"Why won't they let you in?","chumak.gnat.t.why.question":"Why are you out here and not in the khutir?","chumak.gnat.why.0":"Your otaman saw a sick man and put lads with stakes across the road. Says chumaky carry plague. Chuma, chumak — to him it's one word.","chumak.gnat.why.1":"I don't hold it against him. I've seen khutory after the plague. But this isn't plague, kobzar. It's marsh water. And he's forbidden your znakharka to come to us.","chumak.gnat.t.road.label":"The chumak road","chumak.gnat.t.road.question":"Where are you coming from?","chumak.gnat.road.0":"From Crimea, from the salt lakes. Salt, fish, and with luck — news. Half a year on the road, oxen's tails ahead, rain in your face.","chumak.gnat.road.1":"Know why chumaky tar their shirts? So the lice won't bite, and so a mother can recognise her son when they bring him home. That's how it is, kobzar. We ride — and songs follow us.","chumak.gnat.healedIntro":"Hnat smiles for the first time in a week. “He's alive, the rascal! Sitting up and already asking for porridge.”","chumak.gnat.t.thanks.label":"Thanks","chumak.gnat.t.thanks.question":"How is he?","chumak.gnat.thanks.0":"Weak as a kitten, but alive. We leave at dawn tomorrow — Poltava is still far.","chumak.gnat.thanks.1":"Chumaky don't forget their debts. If you're ever on the road, every camp from Crimea to Kyiv will feed you. Just say: Hnat sent me.","chumak.gnat.t.polechko.label":"A chumak song","chumak.gnat.t.polechko.question":"Will you sing me a chumak song?","chumak.gnat.polechko.0":"We have one: “Oh, little field, field.” We sing it on the road when the steppe has no end and home is out of sight. It's sad. But a chumak without it isn't a chumak.","chumak.gnat.polechko.1":"Hnat sings low and hoarse, and even the oxen stop chewing. Now it's yours. Sing it when people's hearts are heavy. Don't sing it to merry folk — they won't understand.","chumak.gnat.deadIntro":"Hnat sits by the fresh grave, his whip across his knees. He's silent a long time. “…Kobzar.”","chumak.gnat.t.grief.label":"Ostap","chumak.gnat.t.grief.question":"I'm sorry.","chumak.gnat.grief.0":"Sorry. Everyone's sorry. Your otaman too, I saw: stood on the road watching us dig. Didn't come over.","chumak.gnat.grief.1":"I'm not saying it's your fault. You're a stranger here, same as us. But when you sing a duma about chumaky someday — sing about this night too. Let them remember.","chumak.gnat.t.polechkoDead.label":"The song at the grave","chumak.gnat.t.polechkoDead.question":"What were you singing over him last night?","chumak.gnat.polechkoDead.0":"“Oh, little field, field.” It's sung over those who stay behind in the steppe. Ostap knew it from a boy, because his father didn't come back from the road either.","chumak.gnat.polechkoDead.1":"Take it. A kobzar must know this kind too. Sing it when people are grieving. And never for fun.","chumak.gnat.t.voly.label":"Ostap's song","chumak.gnat.t.voly.question":"What song did Ostap love?","chumak.gnat.voly.0":"“Oh, my pale-grey oxen.” He sang it to the oxen the whole way — off-key as a young rooster. You sing it too. Let at least the song make it home.","chumak.ostap.sickIntro":"The lad on the sheepskin barely opens his eyes. Cracked lips. “Mama?.. No. You're not Mama. Water…”","chumak.ostap.t.tonic.label":"Give him a tonic ⚗","chumak.ostap.t.tonic.question":"(Go against the otaman's word and give it to him.)","chumak.ostap.tonic.0":"You lift his head. He drinks greedily, chokes, drinks again. Hnat stands behind you, not breathing.","chumak.ostap.tonic.1":"Within an hour Ostap falls asleep — truly asleep, for the first time. His brow is wet. The fever is breaking. Someone from the khutir saw you walk to the camp.","chumak.ostap.t.help.label":"What can I give you?","chumak.ostap.t.help.question":"How can I help you?","chumak.ostap.help.0":"He doesn't answer, only shivers. Nothing will help without medicine. The znakharka would know what to do. Or someone who can brew a tonic.","chumak.ostap.t.home.label":"Home","chumak.ostap.t.home.question":"Where are you from?","chumak.ostap.home.0":"“Near Poltava… Mama paints the gate for Easter… Blue… Tell her I hauled salt… that I wasn't scared…”","chumak.ostap.wellIntro":"Ostap sits by the cart, pale but grinning, finishing his third bowl. “You're the kobzar! Hnat told me. I owe you now.”","chumak.ostap.t.voly.label":"Your song","chumak.ostap.t.voly.question":"How will you repay me? A song?","chumak.ostap.voly.0":"“Oh, my pale-grey oxen”! I sing it to the oxen all the way, and they put up with me. Listen.","chumak.ostap.voly.1":"He sings off-key and happy, and Hnat behind the cart wipes his eyes, pretending it's smoke. A steady road song — good for any evening.","chumak.ostap.t.otaman.label":"The otaman","chumak.ostap.t.otaman.question":"No grudge against the otaman?","chumak.ostap.otaman.defied":"“Hnat says he was scared. Well… I was scared too. Only nobody judges me for it.” He goes quiet. “But he'll judge you now, won't he?”","chumak.ostap.otaman.relented":"“He came himself. Stood right here, coughing and coughing, then said: ‘Forgive an old fool.’ And left. Strange otaman you've got. A good one.”","chumak.otaman.t.ask.label":"The chumaky","chumak.otaman.t.ask.question":"Why won't you let Vesna go to the chumaky?","chumak.otaman.no.0":"I was seven when a chumak caravan came to our village. With one sick man. A month later, nine houses were left out of forty. I buried my mother myself, kobzar. Myself.","chumak.otaman.no.1":"I have forty souls here. Children. We have only one Vesna. If she goes to them, she brings it back here. Let God judge me for this, not you.","chumak.otaman.no.2":"You've been here a few days, singer. The khutir doesn't listen to you yet — so neither will I. Let people come to love you first. (Needs CHA 3.)","chumak.otaman.yes.0":"I was seven when a chumak caravan brought the plague to our village. I buried my mother myself. You know that? …You know. People told you. People tell you everything now.","chumak.otaman.yes.1":"Every evening you sing to my people, and they listen to you the way the Sich once listened to me. And if you say it's marsh water, not plague…","chumak.otaman.yes.2":"…Vesna! Go. Take what you need. Just wash your hands in three waters after, you hear? And… tell that lad an old fool asks his forgiveness.","chumak.otaman.t.after.label":"The chumaky","chumak.otaman.t.after.question":"How are you now?","chumak.otaman.after.died":"I stood on the road watching them dig. I didn't go over. Couldn't. It wasn't plague, kobzar. Vesna says — water.","chumak.otaman.after.died2":"I saved forty souls from something that wasn't there. And lost one. Put that in a duma when you make one. Let them know what kind of otaman Zalissya had.","chumak.otaman.after.defied":"You went against my word. That's not how it's done on a khutir. At the Sich, for that… — he waves a hand. — And the lad's alive.","chumak.otaman.after.defied2":"I don't know what to do with you, kobzar. You were right. Don't get used to it.","chumak.otaman.after.relented":"Know what's hardest? Not the fear. Saying out loud that you're afraid. You made me. Thank you.","chumak.otaman.after.relented2":"The chumaky promised to bring us salt next summer. For free. Well, almost — Hnat wants you to sing.","chumak.vesna.t.ask.label":"The chumaky","chumak.vesna.t.ask.question":"Can you help that lad?","chumak.vesna.sick.0":"I can. It's marsh fever, not plague — I've treated it a hundred times. A tonic will break the fever. But the otaman forbade it. And I live among these people, kobzar. Not against them.","chumak.vesna.sick.give":"…But nobody forbade me to brew tonics. Or to slip them into other people's satchels when no one's looking. What you do with it is your conscience.","chumak.vesna.sick.1":"You already have a tonic. You know what to do with it. And you know what the otaman will say. Choose for yourself.","chumak.vesna.t.after.label":"The chumaky","chumak.vesna.t.after.question":"How are you?","chumak.vesna.after.died":"I could have saved him. From my door to the camp is three hundred steps. I never walked them. Don't ask me about it again.","chumak.vesna.after.healed":"The lad will live. Marsh fever, as I said. The otaman walks quiet now. Maybe that's for the best.","chumak.radek.t.label":"The chumaky","chumak.radek.t.question":"What do you think about the chumaky?","chumak.radek.0":"Once they wouldn't let me into a khutir either. A Pole, a runaway, who knows what's in his bag. I stood by the fence two days. The one who let me in was… your otaman. Strange, isn't it? People forget who they were.","chumak.radek.dead":"I made him a horseshoe for his ox. Now it hangs on the cross. Psiakrew, kobzar. Psiakrew.","chumak.chort.t.label":"The chumaky","chumak.chort.t.question":"Have you seen what's happening on the road?","chumak.chort.0":"Saw it, of course. The otaman is afraid of plague, so out of fear he lets the boy burn. And they say I'm the wicked one!","chumak.chort.1":"Want my best secret, kobzar? I hardly need to work. People are their own devils. I just collect the signatures.","chumak.domovyk.t.label":"Last night","chumak.domovyk.t.question":"Did you hear, last night?","chumak.domovyk.dead":"I heard. The whole hut heard them singing over him. I kept the pich burning all night, though it was warm. That's what you do when someone leaves. So they don't freeze on the way.","chumak.grave.name":"A grave by the road","chumak.grave.role":"Ostap, a chumak from near Poltava","chumak.grave.sing.0":"You sit by the cross and quietly strike the first chord of “Oh, little field, field.” The whip on the cross sways in the wind, as if nodding along.","chumak.grave.sing.1":"Nobody listens. Only the steppe. But after singing it here you understand something about the song you didn't before. (Music +1)","chumak.grave.after":"The fresh earth is already greening over. Someone from the khutir has brought field flowers. Maybe the otaman.","chumak.grave.quiet":"A cross of two poles and a chumak's whip. You stand silent a long time. You don't have a song for this yet.","ui.promptLabel.grave":"Stand by the grave","ui.play.match":"{song} — exactly what the khutir needed tonight. Music {level}.","ui.play.fine":"{song} — the khutir listened and brought a bowl of kulish. Music {level}.","ui.play.clash":"{song} — the wrong night for that song. Folk drift away. Music {level}.","ui.play.levelUpTail":"CHA is now {cha}.","ui.play.clash.sad":"You strike up something merry — and see the old women purse their lips and the otaman stare at the ground. Tonight the khutir is grieving. Someone mutters, “That singer has no shame.” Nobody brings you kulish.","ui.play.clash.happy":"You start a sad one — but folk came to be merry. The young ones exchange looks, the girls yawn, someone whispers, “Well, he's buried our feast.” Nobody brings kulish.","ui.mood.mourning":"It's quiet tonight: there's a fresh grave by the road.","ui.mood.chumakFeast":"The chumaky are feasting with the khutir — the lad lives! Everyone wants something merry.","ui.mood.wedding":"The Petrenkos are celebrating a betrothal — the young folk want something merry.","ui.mood.memorial":"Tonight is the wake for old Yavdokha. Folk are quiet.","ui.mood.ordinary":"An ordinary evening: the mowers are tired, the children sleepy.","ui.songMood.happy":"a merry song","ui.songMood.neutral":"for any evening","ui.songMood.sad":"a sad song","ui.play.audience.zhentsi":"“On the hill the reapers reap” — and the otaman is already singing bass, beating time with his pipe on his knee. At the line about Sahaidachny and his pipe the whole khutir roars along with him.","ui.play.audience.rozpriahaite":"“Unharness the horses, lads” — and the girls are already in a circle. Radek sings along with such an accent that even the horses laugh.","ui.play.audience.voly":"“Oh, my pale-grey oxen” — steady, a road song. The old folk nod to the beat, children fall asleep in their mothers' laps.","ui.play.audience.polechko":"“Oh, little field, field.” The song stretches out like a steppe road. Nobody speaks. Vesna stares into the fire; the otaman looks somewhere far to the east.","quest.section.chumaky":"The chumaky","quest.chumaky.title":"The fever","quest.chumaky.sick":"Young Ostap the chumak is burning with fever. The otaman won't let Vesna near the camp. Decide before dawn.","quest.chumaky.died":"Ostap died at dawn. There is a grave by the road.","quest.chumaky.defied":"You went against the otaman's word — and Ostap lives.","quest.chumaky.relented":"The otaman relented, Vesna went to the camp — Ostap lives.","quest.chumaky.objective":"A chumak on the east road is dying. Talk to Hnat — before dawn","tobacco.news.dry":"Dawn. On Vesna's rack the tobacco has dried — dark, fragrant, enough to tickle your nose. Take it to the otaman.","tobacco.toast.started":"The otaman needs tobacco. The old tobacco field is across the river, by the chumak road.","tobacco.toast.leaf":"Tobacco leaves · {n}/{need}","tobacco.toast.leavesDone":"Enough leaves ({n}/{need}), and you have the fibre. Take it all to Vesna's rack.","tobacco.toast.leavesNeedHemp":"Enough leaves ({n}/{need}). Now hemp fibre to tie them. The hemp field is south of the khutir.","tobacco.toast.hemp":"You strip a hank of strong fibre from the hemp. You could tie a cart with this, never mind tobacco.","tobacco.toast.hung":"You tie the leaves with the fibre and hang them on Vesna's rack. By morning they'll be dry.","tobacco.toast.lyulka":"The otaman gives you his old spare pipe. At Viy's vigil — Nerve +2.","tobacco.prompt.leaf":"Pick tobacco leaves 🍂","tobacco.prompt.hemp":"Strip hemp fibre","tobacco.prompt.hang":"Hang the tobacco to dry","tobacco.keepsake":"🪈 The otaman's old pipe (Nerve +2 at the vigil)","tobacco.otaman.t.ask.label":"A pipe without tobacco","tobacco.otaman.t.ask.question":"Why are you sucking on an empty pipe, otaman?","tobacco.otaman.ask.0":"Because there's no tobacco, son! Not since spring. The chumaky didn't bring any, and me without my pipe is like the Sich without an otaman: standing there, no use to anyone.","tobacco.otaman.ask.1":"Across the river, by the chumak road, there's an old tobacco field. Taras the Long planted it, then went off to the Sich and never came back. The field's gone wild, but tobacco still grows there. Folk say it's because the devil tends it. Tobacco is the devil's herb, after all.","tobacco.otaman.ask.2":"Bring me leaves, son. Three good ones. But I won't smoke them raw — Vesna knows how to dry them. Do it, and I'll repay you so well there'll be a duma about it.","tobacco.otaman.t.wait.label":"The tobacco","tobacco.otaman.t.wait.question":"I'm still looking for the tobacco.","tobacco.otaman.wait.0":"Keep looking. Across the river, by the chumak road. I'll sit here and suck my empty pipe. I'm used to it.","tobacco.otaman.wait.drying":"Drying, you say? Oh, son, this night will be the longest of my life. And I've seen a few long nights.","tobacco.otaman.t.give.label":"The tobacco ✦","tobacco.otaman.t.give.question":"Here's your tobacco, otaman. Dry.","tobacco.otaman.give.0":"The otaman sniffs the bundle, and his moustache actually quivers. He packs the pipe, strikes a spark with his flint, draws — and is silent for a long, long time.","tobacco.otaman.give.1":"…Taras's tobacco. He always said his was the best in the district. A lie, of course. But today it's true.","tobacco.otaman.give.2":"Here, son. This is my old pipe, from the Sich. I went against the Turk with it. Smoke it before a terrible night and your hands won't shake. Trust an old man.","tobacco.otaman.t.after.label":"The pipe","tobacco.otaman.t.after.question":"How's the tobacco?","tobacco.otaman.after.0":"Good as Taras's tall tales. A pipe every evening, and two on Sundays. That's how we live.","tobacco.vesna.t.label":"Tobacco","tobacco.vesna.t.question":"How do you dry tobacco?","tobacco.vesna.0":"You don't smoke it raw — it scrapes your throat and makes your head ache. Tie the leaves in a bundle and hang them in the shade, in the wind. My rack will do.","tobacco.vesna.1":"And tie them with hemp fibre — nothing else holds. The hemp field is south of the khutir, past the gardens. By morning it'll be dry.","tobacco.radek.t.label":"Tobacco","tobacco.radek.t.question":"Do you know where tobacco grows?","tobacco.radek.0":"Across the river, by the chumak road. Over the bridge and to the right. I went once — saw a devil on the field's edge and came back. Maybe I imagined it. Maybe not. Psiakrew.","tobacco.chort.t.label":"Tobacco","tobacco.chort.t.question":"They say tobacco is the devil's herb?","tobacco.chort.0":"My finest creation! Not the hopak, not horilka — tobacco! Plant it once, and people come to you on their own ever after, and thank you for it.","tobacco.chort.1":"Taras's field? Take it, take it, I'm not greedy. Let your otaman smoke to his health. To mine, rather.","quest.tobacco.title":"The otaman's pipe","quest.tobacco.gather":"Tobacco across the river, by the chumak road · leaves {leaves}/3. And hemp fibre from the field to the south","quest.tobacco.hang":"Hang the tobacco to dry on Vesna's rack","quest.tobacco.drying":"The tobacco is drying on Vesna's rack — until morning","quest.tobacco.ready":"The tobacco is dry — take it to the otaman","quest.tobacco.done":"The otaman smokes Taras's tobacco, and you have his old pipe","quest.tobacco.none":"—","map.button":"Map","map.open":"Open the map","map.zoom":"Map zoom","map.zoom.world":"Whole world","map.zoom.near":"Around me","map.aria":"Map: the khutir, fields, river, forests, steppe and Lysa Hora","map.legend":"● — you are here · ★ — where your current quest leads · ▲ — burial mounds · ✣ — windmill","map.khutir":"Zalissya","map.steppe":"The steppe","map.lysa":"Lysa Hora","map.river":"The river","map.forest":"Forest","map.fields":"Fields","map.hemp":"Hemp","map.tobacco":"Tobacco","map.pond":"Pond","map.none":"You have no map. The chumaky know every road — and they say the Chort sells everything, maps included.","map.title.chumak":"The chumak map","map.title.chort":"The devil's map (smells of sulphur)","map.keepsake.chumak":"🗺 The chumak map (M to open)","map.keepsake.chort":"🗺 The devil's map (M to open)","map.toast.chumak":"Hnat gives you the chumak map. You now have the Map — the button at the top, or M.","map.toast.chort":"Three fish — and the map is yours. You now have the Map — the button at the top, or M.","map.chort.label":"A map","map.chort.question":"They say you sell maps too?","map.chort.buy.0":"I do! The most accurate in the whole district: every path, every kurhan, every well I've ever spat into. Three fish.","map.chort.buy.1":"The Chort fishes a scroll out of his coat; it reeks of sulphur. The fish vanish even faster. “Pleasure doing business. Don't look at it at midnight. Well, maybe a little.”","map.chort.poor.0":"The map is three fish, kobzar. You have {fish}. My own gold I won't take back — I'm no fool. Go to the pond; the rod doesn't bite. Mostly. (Price: {price} fish.)","chumak.gnat.t.map.label":"The road ahead","chumak.gnat.t.map.question":"Where are you headed now?","chumak.gnat.map.0":"To Poltava, then home. And for you — here, take this. A chumak map: roads, fords, wells, kurhany, where to spend the night. I drew it myself, thirty years on the road.","chumak.gnat.map.1":"I don't need it any more — my feet remember these roads. And a kobzar without a map is like an ox without a yoke: walking, but who knows where.","char.odarka.name":"Odarka","char.odarka.pron":"o-DAR-ka","char.odarka.role":"Shynkarka · keeps the korchma on the road","char.okhrim.name":"Okhrim","char.okhrim.pron":"OKH-rim","char.okhrim.role":"Old Zaporozhian · drinks on credit","song.name.pidmanula":"“You fooled me”","song.name.dunai":"“A Cossack rode beyond the Danube”","ui.play.audience.pidmanula":"“You fooled me” — by the third verse the khutir is singing it for you. Vesna gives the otaman such a look that he coughs into his pipe.","ui.play.audience.dunai":"“A Cossack rode beyond the Danube.” The old men nod, the women sigh, and the girls watch the road as if someone might walk up it any moment.","korchma.name":"The korchma","korchma.role":"On the chumak road, past the khutir","ui.promptLabel.playKorchma":"Play for the korchma 🎶","ui.enterHut.korchma":"The korchma. Smoke under the ceiling, mugs banging on the table, a smell of horilka and pickles. Behind the counter a woman in a blue kerchief sizes you up: will you pay, or will you sing?","ui.hut.korchma":"🍺 The korchma","map.korchma":"Korchma","korchma.play.daytime":"By day the korchma holds only flies and Okhrim, and both are asleep. Come and play in the evening.","korchma.play.prompt":"Odarka nods you to the bench by the wall. The korchma quiets down. What will you play?","korchma.mood.mourning":"Tonight they drink in silence here, for the dead. Even the cups are set down gently.","korchma.mood.chumaky":"The chumaky are celebrating, and the korchma celebrates with them. Someone is already dancing on a bench.","korchma.mood.maudlin":"The korchma has gone soft tonight: two are weeping for the Sich, a third for his mother, a fourth doesn't know what for.","korchma.mood.merry":"An ordinary evening at the korchma: noise, laughter, somebody already arguing about horses.","korchma.play.match":"{song} — the korchma roars and the mugs beat the table in time. Odarka sets a bowl of varenyky in front of you. Music {level}.","korchma.play.fine":"{song} — they listened, and somebody even joined in. Odarka sets a bowl of varenyky in front of you. Music {level}.","korchma.play.clash":"{song} — the wrong song for this korchma. No varenyky tonight. Music {level}.","korchma.play.room.match":"When you stop, the korchma is silent for a moment, then roars so loud a jug falls off the shelf. Odarka doesn't scold. Odarka smiles.","korchma.play.room.fine":"The korchma listens with half an ear, the way people on the road do, and still somebody stands you a cup. You don't drink it. A kobzar needs his hands.","korchma.play.room.clash.sad":"You strike up something merry, and tonight the korchma is weeping. Someone throws a bacon rind at you: “Have you no shame!” Odarka only shakes her head.","korchma.play.room.clash.happy":"You start a sad one, and people came here to make merry. “Did you bring us to a funeral?” Somebody is already banging the door.","korchma.toast.supper":"Odarka puts a bowl of varenyky with sour cream in front of you. One fish less, one life more. 🥟","korchma.odarka.intro":"The woman behind the counter wipes a mug and takes her time. “A kobzar. Well, well. You pay in fish, you sing in the evening, and I pour nothing on credit. I pour for Okhrim, but he doesn't count. I'm Odarka.”","korchma.odarka.again":"“Ah, the singer. Sit down, only not where Okhrim is. That's Okhrim's.”","korchma.odarka.t.who.label":"About Odarka","korchma.odarka.t.who.question":"You keep the korchma on your own?","korchma.odarka.who.0":"“On my own. Seven years ago my husband rode off to the Sich. He said: back by Pokrova. He didn't say which Pokrova.”","korchma.odarka.who.1":"“At first I told every chumak: if you see my Stepan, give him word. I don't any more. I pour and keep quiet. It's easier for both of us.”","korchma.odarka.t.supper.label":"Have supper (1 fish)","korchma.odarka.t.supper.question":"What's to eat?","korchma.odarka.supper.0":"“Varenyky with curd cheese, the sour cream is my own. Give me the fish. Not that one, that one, the bigger one. There.” She takes it as if doing you a favour. She is.","korchma.odarka.supperPoor":"“Varenyky are for fish, singer. For {price}. Only Okhrim gets fed for his pretty eyes, and only because he can't see what he's eating any more.” You could still play here in the evening.","korchma.odarka.t.news.label":"News from the road","korchma.odarka.t.news.question":"What are people saying?","korchma.odarka.news.viy":"“They say something stirs at night in the hollow past the khutir. The chumaky won't camp there; they go the long way round. And it takes some doing to frighten a chumak, you know.”","korchma.odarka.news.viySealed":"“They say you sang all night in the hollow, and the thing listened and didn't get up. Lies, most likely. I'll give you double varenyky anyway.”","korchma.odarka.news.road":"“They also say salt's gone up and horilka hasn't. So the world's still standing.”","korchma.odarka.t.okhrim.label":"About Okhrim","korchma.odarka.t.okhrim.question":"Does he ever pay you anything?","korchma.odarka.okhrim.0":"She nods at the counter: rows of chalk marks run across it like wheat in a field. “That's Okhrim. That's three winters.”","korchma.odarka.okhrim.1":"“I won't collect. He's all that's left of a whole kurin, and my Stepan was out there somewhere too. Maybe someone's feeding mine the same way. So I keep count. Counting's no sin.”","korchma.odarka.t.song.label":"Ask for a song","korchma.odarka.t.song.question":"Do you sing yourself, Odarka?","korchma.odarka.song.0":"“Just one. About a girl leading a lad by the nose. My husband couldn't stand it.” She smiles for the first time tonight.","korchma.odarka.song.1":"She sings “You fooled me”, loud and angrily cheerful, and half the korchma beats time. You have it at once.","korchma.okhrim.intro":"Above the mug rises a grey oseledets, then moustaches, then one eye. “A kobza… I've not heard a kobza in a long time. Sit, son. I'm Okhrim. I used to be Okhrim the Bull; now I'm just Okhrim.”","korchma.okhrim.again":"“Ah, son. Sit down. I'm here, you see. Haven't gone anywhere. Nowhere to go.”","korchma.okhrim.t.sich.label":"About the Sich","korchma.okhrim.t.sich.question":"What was the Sich like?","korchma.okhrim.sich.0":"“The Sich, son, is when you've nothing but a sabre, a horse and your comrades, and it's enough. More enough than everything after.”","korchma.okhrim.sich.1":"“We prayed there, and fought, and drank. All of it honestly. Here in the korchma I only drink. And not so honestly any more.”","korchma.okhrim.t.kurin.label":"About his kurin","korchma.okhrim.t.kurin.question":"Where's your kurin now?","korchma.okhrim.kurin.0":"He is quiet for a long time. “Some at Khotyn, some in Turkish chains, some in the steppe under no cross. A hundred and forty souls. I alone came back. I don't know for which sins.”","korchma.okhrim.kurin.1":"“Odarka counts me in chalk. I count them. Every evening. When I get to a hundred and forty, I go to sleep.” He doesn't smile.","korchma.okhrim.t.viy.label":"About Viy","korchma.okhrim.t.viy.question":"Have you heard about the thing in the hollow?","korchma.okhrim.viy.0":"“I have. In Kyiv I knew a seminary student, Khoma. A clever lad, knew his prayers by heart. And he looked. He couldn't bear it and he looked. And that was that.”","korchma.okhrim.viy.1":"“When you're there, son, sing and don't look. Whatever calls you. Even if it's your mother. Don't look.” He grips your hand until it hurts.","korchma.okhrim.t.viySealed.label":"About that night","korchma.okhrim.t.viySealed.question":"I made it through that night, grandad.","korchma.okhrim.viySealed.0":"“I know. The whole korchma knows. I drank a cup to you, then another to Khoma. May it ease him, wherever he is, that at least somebody didn't look.”","korchma.okhrim.t.debt.label":"About the debt","korchma.okhrim.t.debt.question":"You owe Odarka, grandad.","korchma.okhrim.debt.0":"“I owe. I owe everyone, son: Odarka, my comrades, God. Odarka at least could be paid back. She won't take it.” He looks into the mug. “That's why I take only horilka from her, never bread. Bread would be shameful.”","korchma.okhrim.t.song.label":"Ask for a song","korchma.okhrim.t.song.question":"Will you teach me a Cossack song, grandad?","korchma.okhrim.song.0":"“A Cossack one? Listen, then. We rode out to this one. Not a duma, not a prayer: this.” He straightens, and for a moment you can see the Bull in him.","korchma.okhrim.song.1":"He sings “A Cossack rode beyond the Danube”, hoarse, off the note and exactly right. On the last line he falls silent, and you sing it to the end for him.","ui.enterHut.pustka":"The abandoned hut. The door creaks and doesn't close behind you. Dust, cobwebs, a cold pich. Somebody turned the icon to face the wall, and you decide to leave it that way.","ui.hut.pustka":"🏚 The abandoned hut","ui.promptLabel.pustkaChest":"Look in the chest","pustka.name":"Taras Dovhyi's chest","pustka.role":"The empty hut by the hollow","pustka.chest.0":"Under a rotten cloth: an empty sabre scabbard, a tobacco pouch with no tobacco, and a letter in crooked letters.","pustka.chest.1":"“If I'm not back by Pokrova, let the otaman smoke my tobacco, and leave the hut be: let it wait. Taras Dovhyi.” Seven Pokrovas have passed since. The hut is waiting still.","pustka.chest.again":"The empty scabbard, the pouch and Taras Dovhyi's letter. You put everything back as it lay.","ui.promptLabel.petDog":"Pet the dog 🐕","dog.pet.0":"The dog thumps its tail so hard the dust flies. It belongs to the otaman, but it loves anyone who pets it.","dog.pet.1":"The dog sniffs the kobza, sneezes, and acts as if it meant to.","dog.pet.2":"The dog offers an ear and shuts its eyes. Clearly it respects kobzars more than the otaman.","dog.pet.asleep":"The dog sleeps by the porch, a paw twitching. Chasing something in its dreams. Let it."};var oT={"line.myroslav.0":"О! Кобзар! Та ще й живий, та ще й з кобзою. Я Мирослав, отаман цього хутора. Сідай до вогню, синку, — у Заліссі співака не женуть.","line.myroslav.1":"Узліссям ходи чемно. Там Лісовик господарює. Хто бере без спросу — той потім три дні кружляє між трьох сосон.","line.myroslav.2":"Поселимо тебе в північній хаті. Хата пустує — тобто там лише Домовик. Покладеш йому хліба за піч — буде тобі тепло. Не покладеш — буде тобі цікаво.","line.myroslav.3":"Біля вогнища лежить окраєць. Віднеси йому. Тільки не дякуй уголос — домовики того не терплять, як я не терплю писарів.","line.myroslav.4":"А тепер слухай, бо двічі не скажу. У північно-східній улоговині спить Вій. Повіки до землі. Подивитися можна. Будити — НІ.","line.myroslav.5":"Радек у кузні — лях. Утік од свого пана, а в нас, бачиш, прижився. Лається по-своєму, кує по-нашому. Не цькуй його: добрий коваль на хуторі — як добра шабля.","line.myroslav.6":"Ще одне. Біля старого жорна вилежується Чорт. Чемний, як писар, і такий самий злодій. Душу не продавай, хоч би що він співав. І в очерет не лізь: там Болотяник, а він кобзарів не слухає — він їх збирає.","line.myroslav.7":"Стежкою на схід — Лиса Гора. Там у шабашні ночі чорти з відьмами гуляють так, що в Києві чути. Ходити не заборонено. Але йди з дарунком, гопака вмій, а що наллють — не пий. Ну, хіба трохи.","line.myroslav.8":"І запам'ятай, кобзарю: у нас людина стає тим, що робить. Траву рвеш — око гострішає. Рибу ловиш — руки спритніють. А як співаєш увечері біля вогню — то й люди до тебе тягнуться. Усе записано у вікні Персонажа.","line.vesna.0":"О, ти тільки глянь у свій кошик: кропива, полин, календула, звіробій, деревій! Та з тебе ще травник буде.","line.vesna.1":"Травам не вчаться з книжки. Їх збирають — по стеблинці, по ранку.","line.vesna.2":"Тепер руки твої годяться на більше. Над вогнищем казан: риба й трава — і буде куліш, а ситий козак і ходить жвавіше. А біля моєї хати, на подвір'ї, сушарка: дві трави — і настоянка, після якої світ стає ясний.","line.vesna.3":"Ти вже й голову маєш ясну — ІНТ 3. Тоді бери в мене міцну настоянку: три трави, і розум та око удвічі гостріші (ІНТ +2, МДР +2).","line.vesna.4":"Є в мене й міцна настоянка, на три трави. Але тільки для ясної голови — ІНТ 3. У тебе {intTotal}. Вари звичайну — сушарка все пам'ятає.","line.vesna.5":"І риба в торбі є. Ну, кобзарю, ти вже майже господар.","line.vesna.6":"Як трави відпочивають — іди з вудкою на західний берег. Риба любить терплячих. Як і я.","line.vesna.7":"Кобзар? От добре. Я Весна, знахарка. Лікую людей, худобу, а коли треба — то й отамана від похмілля.","line.vesna.8":"Бачиш, як у траві світиться? Кропива, полин, календула, звіробій, деревій. Нарви мені — і око в тебе стане травницьке.","line.vesna.9":"Тільки звіробій ховається від зеленого ока. Поки Мудрість не дійде до 2 — не впізнаєш його, хоч носом тицяйся.","line.vesna.10":"Принеси п'ять трав — і знатиму, що ліс тебе прийняв.","line.radek.0":"Słyszysz? Горно співає! Твоє болотяне залізо, кобзарю. Оце кузня, a nie сарай.","line.radek.1":"Підкову носи. Не на щастя, а для руки: залізо в кишені — сила в долоні. Перший урок ковальства. Безплатно, бо я сьогодні добрий.","line.radek.2":"Ковадло твоє. Бий — і рука сильнішає. А коли дуже сильна, то й шедевр вийде. Пан мій казав, що лях з руками — це гріх. Хай тепер подивиться.","line.radek.3":"Jezus Maria, три брили болотяного заліза! Кобзарю, ти щойно розпалив мою кузню.","line.radek.4":"Тримай — перше, що зійшло з ковадла: підкова, ще гаряча. Залізо пам'ятає, хто годував вогонь.","line.radek.5":"Тепер у Заліссі буде залізо. А коли той ваш Вій заворушиться — буде й чим зустріти.","line.radek.6":"Радек. Кую коней, лагоджу плуги, терплю отаманові жарти. Обережно з ковадлом — кусається.","line.radek.7":"Звідки я? З-під Любліна. Пан мій хотів, щоб я кував йому кайдани для його ж людей. Я подумав — і кував собі дорогу на схід. Тут лях — ворог, а коваль — друг. Я обираю бути ковалем.","line.radek.8":"Болотяне залізо! Добре око. Ще {n} — і горно знову загуде.","line.radek.9":"Кузня холодна, пся крев. Треба болотяного заліза — воно спить у мулі ставка, темні брили поблискують, де берег м'який. Три брили — і буде вогонь.","line.radek.10":"Лісовик дошкуляє? Приходь до мене. Холодне залізо з лісовими панами розмовляє коротко. І в нас під Любліном, і тут.","line.radek.11":"Про Вія чув. Повіки такі важкі, що слуги вилами піднімають. Кажуть, залізо проти таких співає. Коли прийде той день — хай моє горно вже буде гаряче.","line.domovyk.0":"Гм. Знову ти. …Хліб був добрий. Скоринка хрустка, солі в міру. Сто зим тут живу, а все одно дивуюся, коли хтось по-людськи.","line.domovyk.1":"Камінь, що я лишив, тримай у головах. У найлютішу ніч буде теплий. Це не обіцянка. Це Домовик. Ми кращі за обіцянки.","line.domovyk.2":"Спи, кобзарю. Піч гріє, миші чемні, кобза твоя не розстроїться. Я пильную.","line.domovyk.3":"…Окрайця нема, помітив? Самі крихти за піччю. Я нічого не кажу. Домовики «дякую» не кажуть.","line.domovyk.4":"Але глянь коло печі, як матимеш час. Іноді вдячність випадає в нас із кишені. Ненароком.","line.domovyk.5":"Тсс! Хто тупотить? …А, кобзар. Отаман казав. Я Домовик. Це моя хата, моя піч і мої миші. Ти тут на постої. Поводься.","line.domovyk.6":"Хліба ще не лишив. Ну-ну. Нові завжди забувають першої ночі. А потім дивуються, чого чоботи в печі.","line.domovyk.7":"Біля вогнища окраєць лежить. Принеси його сюди, до печі, і поклади тихо. Без пісень. Принаймні поки що.","line.domovyk.8":"Лісовик там зі своїми соснами задаваку корчить. Хай. Царства падають, а піч стоїть.","line.domovyk.9":"…Від тебе пахне улоговиною. Ти ходив до Вія. Не тупоти там, господарику. Як ті повіки піднімуться, жодна піч у Заліссі не вгріє.","line.lisovyk.0":"Стій, двоногий. …Тихо ходиш, як на співака. Я Лісовик. Сосни — мої. Стежки — мої. Заблукані — теж мої.","line.lisovyk.1":"Трави бери: кропиву, полин, ті маленькі сонця. Ліс дає тому, хто просить. А жадібному — крутить стежки, поки той не почне вітатися з власними слідами.","line.lisovyk.2":"Весна на тебе дивиться. Під таким оком добре. Не зіпсуй.","line.lisovyk.3":"Бачив його, так? Вія. Навіть я ту улоговину обходжу, а я — ліс. Його тримає тільки сон. Не підпилюй той ланцюг.","line.chort.0":"Мій найулюбленіший клієнт! Душу викупив, золото лишив, тінь пришив назад — та ти торгуєшся краще за половину пекла, а в них, між іншим, роги!","line.chort.1":"Без образ, кобзарю. Угода є угода. Хоча… сумую за твоєю тінню. Вона так гарно під кобзу пританцьовувала.","line.chort.2":"До речі, про танці. На Лисій Горі такий шабаш — у Дикані дахи підскакують! Стежкою на схід. Приходь із дарунком і з гопаком — і підеш звідти з більшим, ніж прийшов. Це обіцянка, а не угода. Майже.","line.chort.3":"А-а, мій безтінний друже! Опівдні під ногами — пусто. Красота! Зате золото справжнє. Пропий його десь у теплій корчмі.","line.chort.4":"А як набридне хутір — Лиса Гора, стежкою на схід. Мій гість — гість самого Вельзевула. З тінню чи без.","line.chort.5":"Ану, що то пахне? Ставком і карасем! ДВІ риби, рахую, навіть не рахуючи. Ну що, кобзарю, зведемо рахунки?","line.chort.7":" Дві, а не три — бо таким язиком і чорта переспіваєш. А я, між іншим, чорт.","line.chort.6":"Скучив за тією дрібничкою? Я не звір: {price} рибин зі ставка — і душа твоя.{n} Чорти люблять рибу. Не питай. НІХТО не знає чому.","line.chort.8":"Псст! Сюди, кобзарю, до жорна! Що, чорт не може на сонечку погрітися? Я Чорт: купець, музика й скромний збирач… підписів.","line.chort.9":"Колись ми на старому млині такі шабаші справляли — скрипки, гопак, козацькі весілля навиворіт! Козацька душа, кобзарю, — то вино, а не квас. Тепер гуляємо на Лисій Горі. А сьогодні я купую.","line.chort.10":"Отже, угода. Твоя душа — трохи ношена, власник один, дбайливий. Навзамін: золото, що не кінчається. Кінь, що не втомлюється. Кобза, що грає сама, поки ти спиш! Підпиши тут. І тут. І кров'ю ось тут — жартую! Чорнило теж годиться. Здебільшого.","line.bolotianyk.0":"Очерет розступається. З ряски виринають очі, тоді голова, як утоплена колода, і з неї ллється вода. Болотяник дивиться на тебе, як глибина на камінь.","line.bolotianyk.1":"«Сухоногий… Мій ставок. Мій мул. Мої дзвони — церковні, що потонули, коли твого хутора ще й не було. Я дзвоню в них. Для тих, хто забрів задалеко».","line.bolotianyk.2":"«Знахарка бере мій полин і не лізе далі. Мудро. А ти рви траву на сухому. Що в МОЇЙ воді росте — не для твого кошика».","line.bolotianyk.3":"«А проте рибалиш у моєму ставку, і я дозволяю. Волосінь у тебе чемна. А от тінь… тінь твоя пахне тим чортом від жорна». Очі опускаються нижче. Стежать.","line.bolotianyk.4":"«Перекажи селянам: Болотяник терплячий. Ставок був до хутора. Ставок — і той, хто спить в улоговині, — буде й після. Усе колись опускається до нас». Брижі змикаються, наче нічого й не було.","line.viy.0":"В улоговині недобра тиша. Ні пташки, ні коника. Тільки звук, ніби дихає гора — повільно, мокро, терпляче.","line.viy.1":"Він величезний. Голова — як камінь із кургану, сіра, мов давній попіл. Повіки звисають аж до землі, важкі, як мокре вітрило. Двоє висохлих слуг спираються на вила. Вони не дивляться на тебе. Вони дивляться на повіки.","line.viy.2":"Під однією повікою щось ворушиться. Розкривається шпаринка тьмяного червоного світла — тільки шпаринка — і кожна волосина на тобі стає дибки. Слуги завмирають. Дихання стихає.","line.viy.3":"…Шпаринка закривається. Дихання повертається. Що б не снилося Вієві — це не ти. Поки що. Ти задкуєш дуже-дуже тихо, і пташки знову співають, лише коли вже видно вогнище.","line.beelzebub.0":"Вельзевул схиляє рогату голову — маленька й страшна ввічливість. «ГОРА ПАМ'ЯТАЄ СВОЇХ ГОСТЕЙ, КОБЗАРЮ. ІДИ ВНИЗ У ТЕПЛІ».","line.beelzebub.1":"Унизу відьми досі танцюють. Вони танцюватимуть, коли Залісся вже стане бабусиною казкою. Ти сходиш стежкою з місячним сяйвом на плечах, як із позиченим кожухом.","line.beelzebub.2":"Вельзевул підводиться — повільно, як насувається гроза. Скрипки збиваються. Кожен чорт на вершині обертається до тебе, а вогонь нахиляється послухати.","line.beelzebub.3":"«ТИ ПРИНІС ГОРІ КВІТИ. ТИ ЗАГРАВ ЇЙ ГОПАКА. ТАКОГО ГОСТЯ ШАБАШ З ПОРОЖНІМИ РУКАМИ НЕ ВІДПУСКАЄ». Він розкриває долоню. На ній — місячний камінь, холодний і лагідний.","line.beelzebub.4":"«БЕРИ. НЕ УГОДА — БЛАГОСЛОВЕННЯ. ЦЕ РІЗНІ РЕЧІ, І СЬОГОДНІ ТИ ЗАСЛУЖИВ РІЗНИЦЮ». Десь під горою раз дзвонить дзвін, якого нема, — і Болотяник йому відповідає.","line.beelzebub.5":"З чорного кам'яного трону Вельзевул дивиться на тебе понад вогнем. Голос у нього не гучний. Гора несе його, як грім.","line.beelzebub.6":"«ДАР ПОКЛАДЕНО. ДОБРЕ. ТЕПЕР ГОПАК, КОБЗАРЮ. ГІСТЬ, ЯКИЙ ЛИШЕ ДИВИТЬСЯ, — ПІВГОСТЯ. ГРАЙ У КОЛІ НА ПІВДЕНЬ ВІД ВОГНЮ».","line.beelzebub.7":"Ти підходиш до трону, і шабаш стихає: скрипки замовкають, відьми застигають посеред оберту, сотня чортенят раптом дуже цікавиться своїми копитцями.","line.beelzebub.8":"Вельзевул старший за лисину цієї гори й вбраний, як найкращий похорон. «КОБЗАР. НА МОЇЙ ГОРІ. БЕЗ ДАРУ». Він каже це, як отаман помічає, що з тину вкрали кілок: не гнівно — записуючи.","line.beelzebub.9":"«ЗАКОНИ ДАВНІ, І Я ЇМ КОРЮСЯ. НА СХИЛАХ ЦВІТУТЬ НІЧНИКИ, БЛІДІ, ЯК КІСТКА. ТРИ — НА ЖЕРТОВНИЙ КАМІНЬ. ТОДІ Й ПОБАЧИМО, ЩО ТИ ЗА СПІВАК».","line.chort.11":"Прийшов, приніс, заграв — і сам Вельзевул тебе благословив! Знаєш, що це робить із моєю репутацією? Нічого. Вона й так розкішна.","line.chort.12":"Носи камінь гідно. А як у Заліссі спитають, звідки, — кажи: чорт подарував. Хай отаман подавиться люлькою.","line.chort.13":"Ти ЗАГРАВ! Усі бачили? Кобзар грав гопака, а гора навіть не тріснула! Тепер до великого крісла, там на тебе благословення чекає.","line.chort.14":"Дар покладено, камінь щасливий — а каміння щасливим не буває, отак добре вийшло! Тепер гопака, кобзарю! У коло на південь від вогню. Відьми вже копитами… тобто ногами тупотять.","line.chort.15":"Нічники! Три бліді красуні, жодної пом'ятої пелюстки. Неси їх на жертовний камінь, на північ від вогню. Гора любить, коли лагідно.","line.chort.16":"МІЙ ГІСТЬ! Ласкаво просимо на Лису Гору — мою контору, мій шинок, мою бальну залу! Вельзевул головує, відьми танцюють, а вогонь старший за твій хутір і вдвічі чесніший.","line.chort.17":"Правила тут Вельзевулові, тож вирізьблені в камені: гість приносить горі дар. На схилах цвітуть нічники — три на жертовний камінь. А тоді — гопак. Кобзар без гопака на шабаші — як козак без вуса.","line.chort.18":"І жодних підписів сьогодні! Шабашні правила. Навіть я раз на тиждень чесний. …Переважно.","line.solokha.0":"Солоха робить реверанс — відьомський, у якому неба більше, ніж треба. «Благословений самим великим! Іди гордо, кобзарику. А Весні перекажи, що гора добре береже її сестру».","line.solokha.1":"Вона нічого не тицяє тобі в руку й нічого не просить. Від відьми з Лисої Гори це найрідкісніший подарунок.","line.solokha.2":"Ох і грав! У мене аж спідниця сама в танець пішла. Біжи до Вельзевула, поки вогонь високий: благословення при високому вогні тримається довше.","line.solokha.3":"Камінь прийняв твої квіти — я відчула крізь черевики. Тепер гопака, кобзарику! Коло на південь від вогню. І не рахуй тактів — від рахунку смертні з музики випадають.","line.solokha.4":"Три нічники, і зірвані на першому подиху цвіту — добре тебе Весна вчила. Жертовний камінь — на північ від вогню. Кланятися не треба: гора не піп, гора — господиня.","line.solokha.5":"Ой, гляньте — кобзар! Я Солоха: відьма, вдова й найкраща куховарка на цій горі, хоч що там чорти з повними ротами кажуть.","line.solokha.6":"Хочеш, щоб шабаш тебе прийняв? Тоді як годиться. На голих схилах цвітуть нічники, бліді, мов місяченьки. Три — на жертовний камінь, на північ від вогню. Така ціна гори, і вона чесніша за чортову.","line.solokha.7":"А потім — гопака! Гостя, що не грає й не танцює, гора забуває. А пам'ять у неї довга, а манер — жодних.","line.motrya.0":"Мотря торкається двома пальцями сяйва каменя й усміхається на всі зуби. «Тобі личить. Повертайся, як згасне, кобзарику, — гори оновлюються».","line.motrya.1":"Мотря ще кружляє в луні гопака й наспівує. «Ти тримав темп. Велике крісло помітило. Іди по благословення».","line.motrya.2":"Мотря киває на жертовний камінь, де ледь світяться твої нічники. «Покладено правильно. Тепер гопак — на південь від вогню. І не думай про пальці: пальці не люблять, коли про них думають».","line.motrya.3":"Маленька відьма з голосом дрімлюги відривається від вінка з нічних квітів. «Мотря. Знаю, де ховаються нічники. І не така горда, щоб не сказати».","line.motrya.4":"«На схилах, кобзарику. Де камінь найлисіший, а місячне світло збирається калюжками. Три для каменя. Рви лагідно: пом'ятий нічник — пом'ята обіцянка, а ця гора рахує обіцянки».","line.motrya.5":"«Уже {flowers} у руці. Гора й це рахує. Ще {n}, кобзарику».","topic.myroslav.0":"А, кобзар. Сідай. Люлька є, тютюну нема, розмова — будь ласка.","topic.myroslav.forest.label.0":"Ліс і Лісовик","topic.myroslav.forest.question.0":"Хто ходить лісом?","topic.myroslav.domovyk.label.0":"Домовик і хліб","topic.myroslav.domovyk.question.0":"Що мені робити з Домовиком?","topic.myroslav.viy.label.0":"Вій","topic.myroslav.viy.question.0":"Хто такий Вій?","topic.myroslav.radek.label.0":"Коваль-лях","topic.myroslav.radek.question.0":"Звідки у вас лях?","topic.myroslav.dark.label.0":"Чорт і ставок","topic.myroslav.dark.question.0":"Чого тут боятися?","topic.myroslav.lysa.label.0":"Лиса Гора","topic.myroslav.lysa.question.0":"Що за Лиса Гора?","topic.myroslav.growth.label.0":"Як тут стають кимось","topic.myroslav.growth.question.0":"Як у Заліссі стати своїм?","topic.vesna.0":"Голова в тебе ясна — бери міцну настоянку: три трави, ІНТ +2 і МДР +2. Сушарка тобі її запропонує.","topic.vesna.1":"Міцна настоянка — для ясної голови, ІНТ 3. У тебе {intTotal}. Вари поки звичайну — сушарка пам'ятає кожну.","topic.vesna.2":"Від тебе пахне цілою левадою. Питай, травнику.","topic.vesna.3":"Що, кобзарю, болить чи просто цікаво?","topic.vesna.herbs.label.0":"П'ять трав","topic.vesna.herbs.question.0":"Навчи мене трав.","topic.vesna.zvirobiy.label.0":"Звіробій","topic.vesna.zvirobiy.question.0":"Чому звіробій від мене ховається?","topic.vesna.zvirobiy.0":"Уже не ховається. Твоє око його знає — і стебло, і жовту зірочку. Двері, що відчинило діло, не зачиняються.","topic.vesna.cooking.label.0":"Куліш","topic.vesna.cooking.question.0":"Що можна зварити?","topic.vesna.cooking.0":"Над вогнищем казан. Риба і трава з торби — і буде куліш, як на Січі. Ситий ходить жвавіше. З'їси його у вікні Персонажа.","topic.vesna.alchemy.label.0":"Настоянки","topic.vesna.alchemy.question.0":"Навчи мене настоянок.","topic.vesna.alchemy.0":"У мене на подвір'ї, біля хати, сушарка. Дві трави, терпіння — і настоянка. Вип'єш — і світ ясніє.","topic.vesna.pond.label.0":"Ставок","topic.vesna.pond.question.0":"А що зі ставком?","topic.vesna.pond.0":"Західний берег — для вудки. Терпляча волосінь ловить і карася, і тишу. Тільки Болотяника не дратуй: то його вода.","topic.vesna.errand.label.0":"Чим тобі допомогти","topic.vesna.errand.question.0":"Тобі щось треба?","topic.vesna.errand.0":"Ні, кобзарю. Ліс тебе прийняв. Тепер співай нам увечері — більше нічого й не треба.","topic.radek.0":"З-під Любліна. Пан хотів кайдани, я хотів волі. Ми не зійшлися в ціні.","topic.radek.1":"Бережися іскор, кобзарю. Питай.","topic.radek.2":"No? Обережно з ковадлом — кусається. Питай.","topic.radek.forge.label.0":"Кузня горить","topic.radek.forge.question.0":"Як кузня?","topic.radek.horseshoe.label.0":"Підкова","topic.radek.horseshoe.question.0":"Чому саме підкова?","topic.radek.smithing.label.0":"Ковальство","topic.radek.smithing.question.0":"Навчи мене ковадла.","topic.radek.home.label.0":"Звідки ти","topic.radek.home.question.0":"Як лях опинився серед козаків?","topic.radek.home.label.1":"Звідки ти","topic.radek.home.question.1":"Як лях опинився серед козаків?","topic.radek.iron.label.0":"Болотяне залізо","topic.radek.iron.question.0":"Чого бракує кузні?","topic.radek.lisovyk.label.0":"Залізо і Лісовик","topic.radek.lisovyk.question.0":"Залізо вгамує Лісовика?","topic.radek.viy.label.0":"Залізо і Вій","topic.radek.viy.question.0":"А проти Вія залізо допоможе?","topic.domovyk.0":"Гм. Знову ти. Ну, сідай. Питай — тихенько.","topic.domovyk.1":"Тихіше, постояльцю. Питай.","topic.domovyk.bread.label.0":"Хліб","topic.domovyk.bread.question.0":"Чого ти від мене хочеш?","topic.domovyk.hearth.0":"Тепла каменюка","topic.domovyk.hearth.1":"Хата і піч","topic.domovyk.hearth.2":"Розкажи про камінь.","topic.domovyk.hearth.3":"Розкажи про цю хату.","topic.domovyk.hearth.4":"Сто зим я тут: піч тепла, хліб пухкий, миші чемні. Робота не велика. Але без неї жодна інша не робиться.","topic.domovyk.lisovyk.label.0":"Лісовик","topic.domovyk.lisovyk.question.0":"А що Лісовик?","topic.domovyk.lisovyk.0":"Задавака з шишками. Хай собі. Царства падають, а піч стоїть.","topic.domovyk.viy.label.0":"Вій","topic.domovyk.viy.question.0":"А що Вій?","topic.domovyk.viy.0":"Від тебе улоговиною пахне. Не тупоти там, господарику. Як ті повіки піднімуться — жодна піч не вгріє.","topic.lisovyk.0":"Знову ти, співаче. Ходиш тихо. Питай.","topic.lisovyk.rules.label.0":"Закони лісу","topic.lisovyk.rules.question.0":"Які в лісі закони?","topic.lisovyk.vesna.label.0":"Весна","topic.lisovyk.vesna.question.0":"А що Весна?","topic.lisovyk.viy.label.0":"Вій","topic.lisovyk.viy.question.0":"А що Вій?","topic.lisovyk.domovyk.label.0":"Домовик","topic.lisovyk.domovyk.question.0":"А що Домовик?","topic.lisovyk.domovyk.0":"Божок крихт у теплій скрині. Хай стереже піч — я стережу світ, що ростить для неї дрова. Ми не сваримося. Майже.","topic.lisovyk.lost.label.0":"Заблукані","topic.lisovyk.lost.question.0":"Що буває із заблуканими?","topic.lisovyk.lost.0":"Хто йде жадібно чи гучно — тому стежки крутяться, і він до ночі вітається з власними слідами. Хто тихо — тому сосни розступаються, як чемні сусіди. А хто співає гарно — тому я іноді підспівую. Ти чув вітер?","topic.chort.0":"Мій найулюбленіший клієнт! Питай — пера в мене нема. Чесне чортівське.","topic.chort.settled.label.0":"Наша угода","topic.chort.settled.question.0":"Без образ?","topic.chort.lysa.label.0":"Шабаш","topic.chort.lysa.question.0":"Розкажи про шабаш.","topic.chort.mill.label.0":"Старий млин","topic.chort.mill.question.0":"Що бувало на старому млині?","topic.chort.mill.0":"О-о! Скрипки, гопак, козацькі весілля навиворіт, сам Вельзевул на почесному місці! Тепер гуляємо на Лисій Горі, але до жорна в мене слабкість. Тут я вперше купив душу. Запорожця. Він потім її відіграв у карти, шельма.","topic.chort.1":"Мій безтінний друг! Питай — усе обговорюється. Майже все.","topic.chort.soul.label.0":"Ціна моєї душі","topic.chort.soul.question.0":"Скільки коштує моя душа назад?","topic.chort.gold.label.0":"Золото і тінь","topic.chort.gold.question.0":"Чесна була угода?","topic.chort.lysa.label.1":"Лиса Гора","topic.chort.lysa.question.1":"Розкажи про гору.","topic.chort.2":"Псст. Знову ти? Питай — я знаю всяке. Дещо навіть правда.","topic.chort.who.label.0":"Хто ти?","topic.chort.who.question.0":"Що ти таке, власне?","topic.chort.mill.label.1":"Шабаш","topic.chort.mill.question.1":"Що за шабаш?","topic.chort.viy.label.0":"Чого бояться чорти","topic.chort.viy.question.0":"А чорти чогось бояться?","topic.chort.viy.0":"Вія. …Бачиш, навіть я стишую голос. Чорт торгує душами. Вій — кінцями. Як ті повіки піднімуться, весь мій шабаш танцюватиме йому на втіху — з дуже-дуже далекої відстані.","topic.chort.refused.label.0":"Відмова","topic.chort.refused.question.0":"Шкодуєш, чорте?","topic.chort.refused.0":"Я? Шкодую? Ха! Останній, хто мені відмовив, став отаманом. Пропозицію закрито, чорт тримає слово. Але як Вій заворушиться і тобі знадобиться друг із вилами — ти знаєш, де жорно. Ціни в мене тільки ростуть.","topic.chort.bargain.label.0":"Угода ✒","topic.chort.bargain.question.0":"Що ти пропонуєш?","topic.bolotianyk.0":"Очі знову виринають із ряски. «Сухоногий. Питай. У ставка є час».","topic.bolotianyk.bells.label.0":"Утоплені дзвони","topic.bolotianyk.bells.question.0":"Що за дзвони під водою?","topic.bolotianyk.water.label.0":"Що росте у воді","topic.bolotianyk.water.question.0":"Можна брати те, що тут росте?","topic.bolotianyk.fishing.label.0":"Риболовля","topic.bolotianyk.fishing.question.0":"Ти не проти моєї вудки?","topic.bolotianyk.fishing.0":"«Ти ще не каламутив мою воду. Лови, якщо мусиш, — із західного берега, чемно. Що ставок віддає — бери. Що тримає — те тримає».","topic.bolotianyk.old.label.0":"Найстаріше","topic.bolotianyk.old.question.0":"Що тут найстаріше?","topic.beelzebub.viy.label.0":"Вій","topic.beelzebub.viy.question.0":"Чого боїться гора?","topic.beelzebub.viy.0":"«ВІЙ. ТАК. НАВІТЬ У ГОРИ Є СУСІД, ДО ЯКОГО ВОНА НЕ ХОДИТЬ. ПІД ЙОГО ПОВІКАМИ — КІНЕЦЬ. ХАЙ СПИТЬ. ДЕЯКИХ ГОСТЕЙ НЕ ПРИЙМАЮ НАВІТЬ Я».","topic.beelzebub.court.label.0":"Твій двір","topic.beelzebub.court.question.0":"Хто тут збирається?","topic.beelzebub.court.0":"«ВІДЬМИ, ЩО ПЕРЕЖИЛИ СВОЇ СЕЛА. ЧОРТИ, ЩО ПЕРЕРОСЛИ СВОЇ МЛИНИ. І ОДИН КОБЗАР, ЩО ПРИЙШОВ УВІЧЛИВО. ВОГОНЬ СТАРШИЙ ЗА СІЧ. ТАНЕЦЬ СТАРШИЙ ЗА ВОГОНЬ».","topic.beelzebub.0":"«ГІСТЬ ГОРИ ПОВЕРНУВСЯ. ПИТАЙ, КОБЗАРЮ».","topic.beelzebub.moonstone.label.0":"Місячний камінь","topic.beelzebub.moonstone.question.0":"Що ти мені дав?","topic.beelzebub.leaving.label.0":"Спуск із гори","topic.beelzebub.leaving.question.0":"Можна йти з миром?","topic.beelzebub.1":"«ТИ ЗАГРАВ, КОБЗАРЮ. Є БЛАГОСЛОВЕННЯ З ТВОЇМ ІМ'ЯМ. ПОПРОСИ — І ВОНО ТВОЄ».","topic.beelzebub.blessing.label.0":"Прийняти благословення ✦","topic.beelzebub.blessing.question.0":"Я приніс дар і заграв гопака. Я прийшов по благословення.","topic.beelzebub.rules.label.0":"Закони гори","topic.beelzebub.rules.question.0":"Які тут закони?","topic.beelzebub.rules.0":"«ДАР ПОКЛАДЕНО. ГОПАК ЗАГРАНО. РЕШТА — МОЄ, ЩОБ ДАРУВАТИ. ТАКІ ЗАКОНИ, І Я ЇМ КОРЮСЯ».","topic.beelzebub.2":"«КАМІНЬ ПАМ'ЯТАЄ ТВОЇ КВІТИ. ПИТАЙ».","topic.beelzebub.dance.label.0":"Гопак","topic.beelzebub.dance.question.0":"Що мені тепер робити?","topic.beelzebub.offering.label.0":"Дар","topic.beelzebub.offering.question.0":"Чи гідний був мій дар?","topic.beelzebub.offering.0":"«ПОКЛАДЕНО ПРАВИЛЬНО, І КАМІНЬ ПАМ'ЯТАЄ. ТЕПЕР ПОКАЖИ ГОРІ СВОЮ КОБЗУ».","topic.beelzebub.3":"«ПИТАЙ, КОБЗАРЮ. ГОРА ВІДПОВІДАЄ НА ТЕ, НА ЩО ХОЧЕ».","topic.beelzebub.rules.label.1":"Закони і нічники","topic.beelzebub.rules.question.1":"Чого гора хоче від гостя?","topic.beelzebub.who.label.0":"Хто ти?","topic.beelzebub.who.question.0":"Хто тут головує?","topic.chort.rules.label.0":"Правила дому","topic.chort.rules.question.0":"Які тут правила?","topic.chort.beelzebub.label.0":"Вельзевул","topic.chort.beelzebub.question.0":"Який він?","topic.chort.beelzebub.0":"Велике крісло? Вельзевул для шабашу — як отаман для хутора. Тільки борода старша, пам'ять довша, а благословення СПРАВЖНІ. Як заграєш — іди по своє.","topic.chort.3":"Мій гість! Питай — правила ті самі: підписів нема, пліток повно.","topic.chort.blessing.label.0":"Благословення","topic.chort.blessing.question.0":"Він справді мене благословив?","topic.chort.telling.label.0":"Що сказати в Заліссі","topic.chort.telling.question.0":"Що мені розповідати на хуторі?","topic.chort.4":"Мій гість! Питай — правила ті самі: підписів нема, пліток повно.","topic.chort.dance.label.0":"Гопак","topic.chort.dance.question.0":"Як я грав?","topic.chort.5":"Мій гість! Питай — правила ті самі: підписів нема, пліток повно.","topic.chort.dance.label.1":"Гопак","topic.chort.dance.question.1":"А тепер що?","topic.chort.6":"Мій гість! Питай — правила ті самі: підписів нема, пліток повно.","topic.chort.offering.label.0":"Жертовний камінь","topic.chort.offering.question.0":"Куди нести нічники?","topic.chort.dance.label.2":"Гопак","topic.chort.dance.question.2":"Розкажи про гопак.","topic.chort.dance.0":"Спершу дар, кобзарю, а тоді гопак — у колі на південь від вогню. І грай так, щоб відьми забули, що вони старі. Я пробував за гостей грати — не можна. Двічі пробував. Були… наслідки.","topic.chort.7":"Мій гість! Питай — правила ті самі: підписів нема, пліток повно.","topic.chort.welcome.label.0":"Це місце","topic.chort.welcome.question.0":"Що це за місце?","topic.chort.nosign.label.0":"Без підписів?","topic.chort.nosign.question.0":"Сьогодні без угод?","topic.solokha.0":"Знову ти, кобзарику? Питай — відьомські вуха все чують.","topic.solokha.vesna.label.0":"Весна — твоя сестра?","topic.solokha.vesna.question.0":"Ти знаєш Весну?","topic.solokha.vesna.0":"«Весна — моя менша сестра. Вона лікує на хуторі тіла, я — таємниці. Між нами двома Залісся доглянуте повністю. Тільки не кажи їй, що я сказала „менша“».","topic.solokha.offering.label.0":"Дар","topic.solokha.offering.question.0":"Як іде дар?","topic.solokha.offering.0":"Поклав правильно, заграв гарно — більшого гора від гостя не просить. Вона пам'ятатиме тебе добром, а для гори це дуже багато пам'яті.","topic.solokha.dance.label.0":"Гопак","topic.solokha.dance.question.0":"Як я грав?","topic.solokha.dance.0":"Так грав, що старий Пацюк із Диканьки встав би з-за галушок! Відьми досі про твої пальці говорять — а відьомська похвала рідша за прокльони.","topic.solokha.cooking.label.0":"Куховарство","topic.solokha.cooking.question.0":"Ти справді найкраща куховарка гори?","topic.solokha.cooking.0":"«Найкраща, хоч що там чорти з повними ротами кажуть. Мій секрет? Не готуй тому, кого не могла б і прокляти. Приправа густіша».","topic.motrya.0":"«Уже {flowers} у руці. Гора й це рахує. Ще {n}, кобзарику».","topic.motrya.1":"Мотря відривається від вінка. «Питай, кобзарику. Квіти почекають».","topic.motrya.nichnyky.label.0":"Де нічники","topic.motrya.nichnyky.question.0":"Де ростуть нічні квіти?","topic.motrya.offering.label.0":"Жертовний камінь","topic.motrya.offering.question.0":"Розкажи про жертовний камінь.","topic.motrya.offering.0":"«На північ від вогню. Три нічники, покладені лагідно, — і гора нахиляється ближче. Я це відчуваю крізь черевики на кожному шабаші».","topic.motrya.dance.label.0":"Гопак","topic.motrya.dance.question.0":"Як тут танцюють?","topic.motrya.dance.0":"«Під гопака, і тільки під гопака. Грай у колі на південь від вогню. Але спершу дар: коло не чекає на того, хто прийшов із порожніми руками».","topic.motrya.moonstone.label.0":"Місячний камінь","topic.motrya.moonstone.question.0":"Що таке місячний камінь?","topic.motrya.moonstone.0":"«Коли велике крісло благословляє гостя, то місячним каменем: холодним, як криниця, лагідним, як місяць. Дар, гопак, тоді попроси. Саме так: гори вибагливі до порядку».","topic.LYSA_BLESSING_LINES.0":"Місячний камінь лягає в долоню — холодний, як вода з криниці, і вдвічі ясніший. Усередині обертається серпик — повільно, терпляче — обличчям до тебе.","topic.LYSA_BLESSING_LINES.1":"Відьми здіймають руки, чорти тупотять копитами, а Вельзевул схиляє рогату голову. У шабашу нова оповідка: про кобзаря, що прийшов увічливо, приніс чесно й заграв так, що гора підтанцьовувала.","topic.LYSA_BLESSING_LINES.2":"Дорога вниз до Залісся буде коротша, ніж угору. Для благословенних так завжди — у цьому, власне, і сенс.","topic.CHORT_SIGNED_LINES.0":"Підписано! ПІДПИСАНО! Ох, кобзарю, ти мені ціле століття зробив. Тримай золото. Чуєш, як воно не легшає? Оце добро. Оце ШАБАШНЕ добро.","topic.CHORT_SIGNED_LINES.1":"А повернення… ну, одне, бо ти мені подобаєшся: риба зі ставка будь-коли викупить душу назад. Ціна — у вікні Персонажа, під Харизмою. А тепер глянь собі під ноги на сонці. Хе. ХЕ.","topic.CHORT_REFUSED_LINES.0":"…Ні? НІ? Ха-ха! Ох, ти мені подобаєшся. Останній, хто мені відмовив, став отаманом, а передостанній — дуже здивованою жабою. Бережи душу, кобзарю. А як Вій заворушиться — ти знаєш, де жорно.","topic.CHORT_TRADE_LINES.0":"Риба, ще блищить. …Угода є угода. Тримай — одна душа, трохи з привидами, повертається до власника. А золото лиши. Чортове золото витрачається так само, а я не ШАХРАЙ.","topic.CHORT_TRADE_LINES.1":"Ось. Чуєш? Тепло. Вага. Тінь розливається біля ніг, ніби й не зникала. Приємно було мати справу. Нікому не кажи, що я розм'як.","topic.well.name.0":"Стара криниця","topic.well.role.0":"Кинь камінчик, загадай бажання","topic.brewbench.name.0":"Сушарка Весни","topic.brewbench.role.0":"Тут варять настоянки","topic.BREW_CHOICE_LINES.0":"Сушарка пахне полином і сонцем, казанок уже теплий. Тобі під силу два варива: звичайна настоянка (2 трави) і міцна настоянка Весни (3 трави; ІНТ +2 і МДР +2). Що вариш?","viy.myroslav.vigil-after.label.0":"Ніч, яку ти вистояв ✦","viy.myroslav.vigil-after.question.0":"Чи справді все?","viy.myroslav.vigil-after.0":"Усе. Півень заспівав, повіки впали, і улоговина тепер — просто яма з травою. Мій дід за таке поставив би тобі цілу бочку горілки, кобзарю.","viy.myroslav.vigil-after.1":"Бочки нема. Є хутір, що спить спокійно. А ще є дума, яку про тебе колись складе інший кобзар. Лишайся, скільки хочеш, — ти тут більше не гість.","viy.myroslav.oldway.label.0":"Вій ворушиться — давній звичай","viy.myroslav.oldway.question.0":"Вій ворушиться уві сні. Як його колись утримували?","viy.myroslav.oldway.0":"Бачив червону шпаринку? Мій дід бачив теж. Казав: Вій прокидається раз на кілька поколінь, і хтось мусить просидіти з ним одну ніч до півнів. Тоді засинає знову. Надовго.","viy.myroslav.oldway.1":"Тоді сидів бурсак. Читав молитви всю ніч у крейдяному колі. А ти — кобзар. Співатимеш думу. Дума, синку, — та сама молитва, тільки козацька.","viy.myroslav.oldway.2":"Слухай найголовніше. Коли він закричить «ПІДНІМІТЬ МЕНІ ПОВІКИ» — не дивись. Хоч що чуєш, хоч хто кличе. Хто глянув Вієві в очі, той додому не вертається.","viy.myroslav.oldway.3":"Ось тобі крейда, освячена, з церковної скрині. І дума — «Про бурю на Чорному морі», я її ще від діда знаю. Весна знає вінок проти його погляду, а Радекове залізо пече нечисть. Спитай їх. А тоді обирай ніч.","viy.myroslav.vigil.label.0":"Чування","viy.myroslav.vigil.question.0":"Нагадай, як воно.","viy.myroslav.vigil.0":"Після дев'ятої вечора крейдою коло біля улоговини. Співай думу — нечисть від неї відступає. Як повіки піднімаються — відвернися й не дивись, доки знову не впадуть. І так до півнів.","viy.myroslav.vigil.1":"Пробував уже {broken}× і щоразу вертався на своїх ногах. То вже більше, ніж у бурсака. Попоїж, виспися — і ще раз. Міцніше тіло (Статура) більше страху вміщає.","viy.myroslav.vigil.3":"І попоїж перед тим. Порожнє черево — то половина страху. Так моя баба казала, а вона трьох чоловіків поховала й жодного не злякалася.","viy.vesna.vigil-after.label.0":"Після чування","viy.vesna.vigil-after.question.0":"Вінок допоміг?","viy.vesna.vigil-after.0":"Допоміг. Але вистояв ти. Вінок тільки притуплює те, від чого тобі вистачило духу відвернутися. Відтоді й левада легша, і сон мій.","viy.vesna.wreath.label.0":"Вінок проти його очей","viy.vesna.wreath.question.0":"Отаман каже, ти знаєш вінок проти Вієвого погляду.","viy.vesna.wreath.0":"Знаю. Полин — бо нечисть гіркого не терпить. Звіробій — бо в ньому сонце. І деревій, щоб зв'язати. Дай три трави.","viy.vesna.wreath.1":"Ось. Надінь низько на чоло. Його погляд заплутається в листі, перш ніж дістане тебе, — візьме лише половину. Половину, травнику. Однаково не дивись.","viy.vesna.wreath.2":"Знаю: полин, звіробій, деревій, сплетені щільно. Він ловить половину Вієвого погляду.","viy.vesna.wreath.3":"Але звіробій треба впізнати, а твоє око ще не дозріло (МДР {wis}, треба {WREATH_WIS}). Рви інші трави — око росте зі збиранням.","viy.vesna.wreath.4":"Принеси {WREATH_HERBS} трави — у тебе {herbStock}. Світні латки в траві дадуть.","viy.radek.vigil-after.label.0":"Після чування","viy.radek.vigil-after.question.0":"Залізо співало?","viy.radek.vigil-after.0":"Співало? ВЕРЕЩАЛО, кажуть! Добре залізо. І добра рука, що кувала. У нас під Любліном твоє ім'я вирізали б над кузнею. Тут я тобі підкову з літерою зроблю.","viy.radek.ironward.label.0":"Залізо для чування","viy.radek.ironward.question.0":"Залізо допоможе проти Вієвої нечисті?","viy.radek.ironward.0":"Ще й як! Нечисть холодного заліза не терпить. Дай один виріб, що сам викував. Витягну з нього три цвяхи — заб'єш у крейдяне коло.","viy.radek.ironward.1":"Тримай. Перші троє, що торкнуться твого кола, згорять, як солома. Далі — твоя дума і твої нерви, кобзарю.","viy.radek.ironward.2":"Допоможе. Принеси виріб, що сам викував на моєму ковадлі, — і будуть цвяхи. Іди попрацюй.","viy.radek.ironward.3":"Допоможе, але горно холодне, пся крев. Спершу болотяне залізо з мулу, тоді виріб власною рукою.","viy.domovyk.vigil-after.label.0":"Після чування","viy.domovyk.vigil-after.question.0":"Ти чув півня?","viy.domovyk.vigil-after.0":"Чув? Я сам того півня окрайцем годував! Уся хата зітхнула. Спи в моєму ліжку, скільки хочеш. Я навіть перестану ховати твої чоботи. Майже.","viy.domovyk.vigil.label.0":"Чування","viy.domovyk.vigil.question.0":"Порадиш щось на ніч?","viy.domovyk.vigil.0":"Спершу виспись. Ляж у моє ліжко — розбуджу надвечір. І НЕ ДИВИСЬ. Я бачив, що буває з тими, хто дивився. Не хочу потім вимітати.","viy.lisovyk.vigil-after.label.0":"Після чування","viy.lisovyk.vigil-after.question.0":"У лісі тихіше.","viy.lisovyk.vigil-after.0":"Тихіше? Ліс СЛУХАЄ. Сто зим не чув він ту улоговину порожньою. Тепер там пташки. Може, я тобі й стежки рівно стелитиму. Іноді.","viy.lisovyk.vigil.label.0":"Чування","viy.lisovyk.vigil.question.0":"Ліс мені допоможе?","viy.lisovyk.vigil.0":"Ліс не допомагає — ліс дивиться. Але скажу лісову річ: нечисть іде з усіх боків разом. Мудрий підпускає ближче й відганяє всю гуртом одним рядком думи. Не трать слів на одну тінь.","viy.chort.vigil-after.label.0":"Після чування","viy.chort.vigil-after.question.0":"Ти дивився?","viy.chort.vigil-after.0":"Дивився? У мене було МІСЦЕ! Перший ряд, на жорні. Як та нечисть на Радековому залізі верещала — музика! А як півень заспівав… ну, скажімо, я пішов раніше. Справи.","viy.chort.vigil.label.0":"Чування","viy.chort.vigil.question.0":"Допоможеш із Вієм?","viy.chort.vigil.0":"Я чорт, а не отаман! …Але задарма скажу, хоч і болить: повіки піднімаються ПОВІЛЬНО. Поки піднімаються — співай, відганяй. А відвертайся в останню мить. Нікому не кажи, що я був корисний.","viy.bolotianyk.vigil-after.label.0":"Після чування","viy.bolotianyk.vigil-after.question.0":"Ставок відчув?","viy.bolotianyk.vigil-after.0":"«Ставок відчув, як він ПОТОНУВ, сухоногий. Глибоко, повз мої дзвони, повз дно всього. Крізь мою воду він не підніметься. Я вперше радий гостеві».","viy.bolotianyk.vigil.label.0":"Чування","viy.bolotianyk.vigil.question.0":"Що ти знаєш про Вієву нечисть?","viy.bolotianyk.vigil.0":"«Поки повіки піднімаються — нечисть повзе. Коли повіки ВІДКРИТІ — навіть нечисть завмирає: боїться того, що під ними. І принеси залізо. Вони ненавидять залізо».","viy.viyNarration.0":"Удень улоговина лише дихає. Слуги дрімають, спершись на вила. До темряви тут нічого не буде. Приходь після дев'ятої вечора — або виспися в ліжку Домовика до сутінків.","viy.viyNarration.1":"Уночі улоговина дихає гучніше. Слуги не сплять: шепочуть до повік. Червона шпаринка ширша, ніж була.","viy.viyNarration.2":"Із порожніми руками сюди не ходять. Отаман досить старий, щоб пам'ятати, як це робили колись. Спитай його.","viy.VIGIL_INTRO_LINES.0":"Ти стаєш на коліна й ведеш крейдою коло — одну нерозривну лінію. Слуги замовкають. Десь у темряві щось сміється. Потім — багато чогось.","viy.VIGIL_INTRO_LINES.1":"Береш кобзу. Пам'ятай: ДУМА відганяє нечисть від крейди. Як Вій закричить про повіки — вони піднімаються повільно. Відвернися, поки не розкрилися, і НЕ ДИВИСЬ, доки не впадуть. До півнів.","viy.VIGIL_WON_LINES.0":"Далеко в Заліссі кукурікає півень. Раз. Удруге. Нечисть верещить і розсипається, як попіл на вітрі.","viy.VIGIL_WON_LINES.1":"Слуги впускають вила. Повіки падають, наче під землею грюкнули двері. Тоді улоговина осідає: голова, повіки, слуги — усе під коріння. Трава змикається.","viy.VIGIL_WON_LINES.2":"Над соснами рожевіє. Ти досі в колі, і струни ще гудуть. Ти так і не глянув. ✦","viy.VIGIL_BROKEN_LINES.0":"Нерви не витримують. Ти вже за колом і біжиш, притискаючи кобзу до грудей. Гілля, тин, двері Домовика…","viy.VIGIL_BROKEN_LINES.1":"Прокидаєшся вранці в його ліжку, роззутий, укритий до підборіддя. Крейда в кишені. Вій спить. Ніч можна спробувати знову.","ui.bed.name.0":"Ліжко Домовика","ui.bed.role.0":"Солома, кожух і тепло від печі","ui.vigil.name.0":"Чування","ui.vigil.role.0":"Вієва улоговина · одна ніч","ui.enterHut.0":"Ти пригинаєшся під одвірок. Тепло від печі, пахне хлібом і димом. Десь за піччю хтось сопе.","ui.enterHut.1":"Хата Весни: під стелею пучки трав, а в казані дихає щось зелене. Краще не питати що.","ui.enterHut.2":"Сіни пахнуть дьогтем, квашеною капустою і владою. Ліворуч піч, праворуч світлиця, де отаман приймає людей. Хто йде з повинною, витирає ноги двічі.","ui.exitHut.0":"Знову надворі.","ui.chortChoice.0":"Підписав. Золото важке — а де це твоя тінь поділася?","ui.eatMeal.0":"Гарячий куліш з рибою. Аж вуса, яких у тебе нема, задоволено ворушаться. Статура +1, поки ситий.","ui.drinkTonic.0":"Гірко, ясно, прозоро. ІНТ +1 і МДР +1 до світанку.","ui.drinkStrongTonic.0":"Темна, густа, як ніч на Івана Купала. ІНТ +2 і МДР +2 до світанку.","ui.sleepUntil.0":"{msg} Учорашній куліш і настоянки вже не діють.","ui.pickOption.0":"Спиш як убитий і прокидаєшся від півнів.","ui.pickOption.1":"Продрімав увесь день. Щось маленьке смикає за рукав: смеркає. Домовик дотримав слова.","ui.applyGrant.0":"Освячена крейда і дума про бурю. Тепер до Вія можна йти після смеркання.","ui.applyGrant.1":"Вінок Весни з полину й звіробою. Вієвий погляд візьме лише половину.","ui.applyGrant.2":"Три залізні цвяхи для крейди. Перші троє з нечисті згорять.","ui.endVigil.0":"Вій під землею. Ти вистояв ніч: МДР +1, ХАР +1 ✦","ui.carryBlockedToast.0":"Заважко: несеш {carriedWeight}/{carryCap}, а треба ще {addWeight}. Межу задає СИЛ {str} — ковальство її підніме. Звари щось, з'їж або віддай залізо Радекові.","ui.performBrew.0":"Міцній настоянці треба 3 трави — у тебе {herbsIn}.","ui.performBrew.1":"Казанку треба 2 трави — у тебе {herbsIn}.","ui.performBrew.2":"Міцна настоянка вистоялась, темна, як криниця вночі! Алхімія {craftLevel} — ІНТ тепер {int}. Вип'єш у вікні Персонажа.","ui.performBrew.3":"Настоянка проясніла, як ранок у пляшці! Алхімія {craftLevel} — ІНТ тепер {int}. Вип'єш у вікні Персонажа.","ui.performBrew.4":"Дві пляшки міцної з одного казанка — ясна голова нічого не марнує (ІНТ {intNow}). · Алхімія {craftLevel}","ui.performBrew.5":"Дві пляшки з одного казанка — ясна голова нічого не марнує (ІНТ {intNow}). · Алхімія {craftLevel}","ui.performBrew.6":"Міцна настоянка Весни. · Алхімія {craftLevel} · у торбі: {stock}","ui.performBrew.7":"Настоянка, гірка і ясна. · Алхімія {craftLevel} · у торбі: {stock}","ui.doInteract.0":"Місячний камінь Лисої Гори твій. МДР +1, ХАР +1. 🌙","ui.doInteract.1":"Чобіт. Лівий. Ставок повертає те, що в нього кидають.","ui.doInteract.2":"Улов: {fish} — і вислизнув назад! Нема місця: несеш {carriedWeight}/{carryCap}. Межу задає СИЛ {str}.","ui.doInteract.3":"Улов: {caught}! Рибальство {fishLevel} — СПР тепер {total}.","ui.doInteract.4":"Улов: {caught}! · Рибальство {fishLevel} · усього {total}","ui.talk.0":"Душа — і тінь — знову твої.","ui.talk.1":"Радек тицяє тобі в руку гарячу ще підкову. СИЛ +1, поки носиш.","ui.gather.0":"Тягнешся до звіробою — і вагаєшся. Не знаєш ти ще цієї трави: МДР {wisNow}, треба 2. Нарви спершу інших.","ui.gather.1":"Зірвано: {name}. Травництво {herbLevel} — МДР тепер {wis}.","ui.gather.2":"{name} — і під нею ще стеблинка! Гостре око (МДР {wis}).","ui.gath
