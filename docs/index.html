0},IN={x:626,y:374,w:68,h:50},fl={x:660,y:268},x0={x:660,y:492},vh={x:612,y:148,w:96,h:44},E0=148,bh=[];for(let e=0;e<11;e++){let t=e/11*Math.PI*2+0.3,i=nt.x+Math.cos(t)*E0,a=nt.y+Math.sin(t)*E0*0.68;if(Math.abs(i-(nt.x-E0))<30)continue;bh.push({x:i,y:a,h:26+I(e,733)*16})}var Hw=[IN,vh,{x:fl.x-20,y:fl.y-8,w:40,h:20},...bh.map((e)=>({x:e.x-7,y:e.y-10,w:14,h:14})),{x:300,y:250,w:34,h:20},{x:980,y:300,w:40,h:22},{x:420,y:640,w:30,h:18},{x:900,y:660,w:36,h:20},{x:1080,y:520,w:28,h:18},{x:210,y:560,w:26,h:16}],Bw=[{x:380,y:330},{x:520,y:560},{x:830,y:580},{x:950,y:240},{x:300,y:700},{x:1080,y:430}];var Iw={"line.myroslav.0":"Well now — a new face in Zalissya. I am Myroslav, starosta of this village. You are welcome at our fire.","line.myroslav.1":"Mind the forest edge, traveller. The Lisovyk walks among the pines, and he does not love strangers who take without asking.","line.myroslav.2":"And be kind to the Domovyk in your hut — leave him bread by the pich, and he will keep your hearth warm through the winter.","line.myroslav.3":"You will find him by the north hut most days, fussing over the woodpile. Do not thank him aloud — house spirits hate fuss. There is a crust by the campfire, if you have a mind to leave it for him.","line.myroslav.4":"And one thing more, traveller, and hear me well: far off in the north-east hollow sleeps Viy — Вій — the biggest and worst of the old things. His eyelids hang down to the very ground. Look upon him if you must. Do NOT wake him.","line.myroslav.5":"Radek at the forge is a guest among us — a Pole from a village many days' road from here. Treat him kindly; a traveller under your roof is a gift.","line.myroslav.6":"Two more warnings, and then I will let you be. A Chort has taken to lounging by the old millstone south of the clearing — all bargains and grins. Whatever he offers, traveller, your soul is not spare change. And keep out of the pond reeds: the Bolotianyk has drowned better swimmers than you.","line.myroslav.7":"East of here a trail climbs out of the clearing to Lysa Hora — the Bald Mountain, bare as a skull. On sabbath nights the devils and vidmy gather there around a great fire, and the Chort plays host. It is not forbidden ground, traveller — but go polite, go with empty hands for no one, and do not eat what you are offered. Much.","line.myroslav.8":"One last thing, and it is the truest thing I know: in Zalissya a person becomes what they do. Gather, and your eye sharpens. Fish, and your hands quicken. Cook, smith, brew — the work makes the worker. Keep an eye on your Character — it is all written there, plain as a tally stick.","line.vesna.0":"Look at your basket — kropyva, polyn, kalendula, zvirobiy, dereviy! Your eye has grown keen, just as I promised.","line.vesna.1":"Herbalism is not taught, it is gathered — one plant, one walk, one season at a time. You understand now.","line.vesna.2":"Two crafts wait for hands like yours now. At the campfire hangs a pot: one pond fish and one herb from your satchel makes a proper karas soup — that is Cooking, and a fed traveller walks brisker. And by the north-east hut stands my drying rack: two herbs, worked patiently, become a tonic — that is Alchemy. Drink one and the world goes clear for a while.","line.vesna.3":"And look at you — bright as bottled morning. Your INT has reached 3, so the deep work is open to you now: at my rack you may choose Vesna's strong tonic — three herbs, and drunk it sharpens mind AND eye twice as deep as the common brew (INT +2, WIS +2). Some knowledge only trusts a ready mind, traveller. Yours is ready.","line.vesna.4":"One secret I keep for a readier mind: my strong tonic — a deeper draught, three herbs, worth INT +2 and WIS +2 to whoever drinks it. It unlocks at INT 3, and no sooner; a green mind would only waste good polyn. Your INT stands at {intTotal} today. Keep brewing the common tonic — every batch teaches, and the rack remembers.","line.vesna.5":"And the pond provides too, I see. Your satchel holds the makings of soup already, znakharka that you are becoming.","line.vesna.6":"When the herbs rest, try the pond shore, west bank. A patient line catches more than karas — it catches quiet. And quiet is a remedy too.","line.vesna.7":"You have gentle hands. I am Vesna — I tend the sick of Zalissya, and the horod both.","line.vesna.8":"See the glowing patches among the grass? Kropyva the nettle, bitter polyn, kalendula like little suns, zvirobiy, and dereviy. Gather any of them for me — every herb teaches your eye.","line.vesna.9":"One caution, gentle hands: the yellow zvirobiy hides from a green eye. Until your Wisdom reaches 2 it will not let itself be known or gathered — learn the other herbs first, and in time it will open to you.","line.vesna.10":"Bring me five herbs in all, and I will know the forest has accepted you.","line.radek.0":"The forge sings again, thanks to your bog iron. Feel that heat? THAT is a kuznya.","line.radek.1":"That horseshoe I gave you — carry it, and not for luck alone: iron in the pocket puts strength in the arm. You will feel it. That is Smithing's first lesson, and it is free.","line.radek.2":"The anvil is yours to learn on now, traveller. Stand to it and work the forge — piece by piece, your Smithing grows, and with it your Strength. A strong arm now and then turns out a masterwork. When Viy's day comes, we will be glad of both.","line.radek.3":"What is that weight in your arms — bog iron! Three good lumps, marsh-born and heavy. Traveller, you have just lit my forge.","line.radek.4":"Here — the first thing off the anvil is yours: a horseshoe, still warm. Carry it for luck. Iron remembers who fed the fire.","line.radek.5":"Now the kuznya stands ready. When the day comes that Viy stirs, traveller, there will be iron enough in Zalissya. See that you are here for it.","line.radek.6":"Radek. I shoe the horses and mend the ploughs of Zalissya — though I am only a guest here. Mind the anvil — she bites.","line.radek.7":"My home is a village many days' road from here, far to the west. I came with the spring to lend them my hammer — and the road home can wait until the work is done.","line.radek.8":"Bog iron! You found a lump in the pond mud — good eye. {n} more like that and this forge roars again.","line.radek.9":"My kuznya stands cold until I get good iron from the marsh. Bog iron sleeps in the pond mud, traveller — dark lumps that glint where the shore is soft. Three good lumps would light my fire.","line.radek.10":"If the Lisovyk troubles you, come to me. Iron has a way of settling arguments with the old things of the wood — in my country, and here too.","line.radek.11":"And if it is Viy you are asking after — aye, I have heard the tales. Lids so heavy they must be forked up by his servants. They say iron sings against such things. When that day comes, traveller, my forge had better be hot.","line.domovyk.0":"Hmph. You again. …The bread was good. Crust crisp, salt enough. A hundred winters I have kept this hut, and kindness still surprises the pich out of me.","line.domovyk.1":"The stone I left you — keep it by your bed. It will be warm on the coldest night of the year. That is not a promise. That is a Domovyk, and we are better than promises.","line.domovyk.2":"Sleep well in Zalissya, little landlord. Your hearth is watched. Your soup is minded. Your mice — polite.","line.domovyk.3":"…You came back. The crust is gone, did you notice? Behind the pich, nothing but crumbs and a warm smell. I said nothing. House spirits do NOT say thank you.","line.domovyk.4":"But check the doorstep of this hut when you leave, new one. Sometimes gratitude… falls out of our pockets. By accident. Mind you do not trip on it.","line.domovyk.5":"Hush, hush — soft feet by my hut. …Oh. It is the new one. I am Domovyk. I keep this house: the pich warm, the bread risen, the mice polite.","line.domovyk.6":"You left no bread yet. Hmm. New ones never do, the first night. Behind the pich, a crust, a little salt — that is all I ask, and I ask it every winter for a hundred years.","line.domovyk.7":"There is a crust by the village campfire, if your hands are empty and your heart is not. Bring it to my pich — the north hut, mind — and leave it quiet.","line.domovyk.8":"The Lisovyk thinks himself grand out there with his pines. Let him. Empires fall; a warm hearth does not.","line.domovyk.9":"…You smell of the north-east path. You have been near Viy. Do not go clattering about up there, little landlord. If those eyelids ever lift, no pich in Zalissya will keep out the cold that follows.","line.lisovyk.0":"Stop there, two-legs. …You walk softly for one of the hut folk. I am Lisovyk. These pines are mine; the paths through them are mine; the lost are mine also.","line.lisovyk.1":"Take your herbs — kropyva, polyn, the little suns — the forest gives to hands that ask. But take greedily, and the paths will turn, and turn, and you will greet your own footprints until dark.","line.lisovyk.2":"Vesna's eye is on you. That is a good eye to be under. Mind it stays so.","line.lisovyk.3":"You have seen him, then — Viy, in his hollow. Even I walk wide of that place, and I am the forest. Sleep is the only chain that holds him, traveller. See that you never file at it.","line.chort.0":"My favourite customer! Soul returned, gold kept, shadow reattached — you drive a harder bargain than half the sabbath host, and THEY have horns.","line.chort.1":"No hard feelings, traveller. A deal is a deal. …Though between us? I shall miss your shadow. It danced beautifully.","line.chort.2":"Speaking of dancing — you should see it dance on Lysa Hora. The Bald Mountain, east trail out of the clearing, bare rock and a great fire. Sabbath nights I host up there: witches, fiddles, Beelzebub himself presiding. Come as my guest. Guests who bring an offering and join the dance leave with more than they came with — that is a promise, not a bargain. Mostly.","line.chort.3":"Ahh, my shadowless friend. Notice anything missing at noon? Look down. NOTHING. Beautiful, is it not? The gold, though — the gold is real. Spend it somewhere warm.","line.chort.4":"And when you tire of the village's little fires — Lysa Hora, traveller. The Bald Mountain, by the east trail. Sabbath nights the whole host dances there, and a guest of mine is a guest of Beelzebub. Shadow or no shadow.","line.chort.5":"Hm? What is that smell — pond water and karas? TWO fish, I count, without counting. …You know the price of a soul, traveller. Shall we settle accounts?","line.chort.7":" Two, not three — that tongue of yours could talk a saint into a sabbath, and I am only a devil.","line.chort.6":"If you miss the little thing, I am not unreasonable: {price} pond fish buys your soul back.{n} Devils love fish. Do not ask why. NOBODY knows why.","line.chort.8":"Psst. Psst! Over here, by the millstone. …What? A devil can't enjoy a sunny day? I am Chort, traveller — merchant, musician, and modest collector of… signatures.","line.chort.9":"In the old days we kept a fine sabbath up at the old mill — fiddles, dancing, the whole host! These nights we keep it grander: on Lysa Hora, the Bald Mountain — east trail out of the clearing, bare rock, a fire you can see from Zalissya. And SUCH weddings we used to crash. A Cossack's soul is a vintage thing, my friend. But business is business, and today I am buying.","line.chort.10":"So — a bargain, just between us. Your soul: slightly used, one careful owner. In exchange? Gold that never runs out. A horse that never tires. Vesna's heart, Radek's hammer, Myroslav's beard — name it! Sign here. And here. And in blood, here — kidding! Ink is fine. Mostly.","line.bolotianyk.0":"The reeds part. Two eyes rise out of the pond scum, then a head like a drowned log, green-grey and streaming. Bolotianyk looks at you the way deep water looks at a stone.","line.bolotianyk.1":"“Little dry one… my pond. My mud. My bells — the church bells that sank here before your village had a name. I ring them, sometimes, for the ones who waded too far.”","line.bolotianyk.2":"“The znakharka takes my polyn and leaves me be. Wise. You — take your herbs from the grass, dry one. What grows in MY water is not for your basket.”","line.bolotianyk.3":"“And yet you fish my pond, dry one, and I allow it. Your line is polite. Your shadow… hmm. Your shadow smells of the millstone devil lately. Curious.” Bolotianyk's eyes sink a little, watching.","line.bolotianyk.4":"“And tell the hut folk: Bolotianyk is patient. The pond was here before Zalissya. The pond — and what sleeps in the hollow — will be here after. Everything sinks to us, in the end.” The eyes slide back under, and the ripples close like nothing happened.","line.viy.0":"The hollow is wrong-quiet. No birds. No insects. Only a sound like a mountain breathing — slow, wet, patient.","line.viy.1":"He is enormous. A head like a boulder, grey as old ash, and eyelids — eyelids that hang from his brow all the way down to the earth, veined and heavy as wet sailcloth. Two withered servants lean on the forks that would lift them. They do not look at you. They look at the lids.","line.viy.2":"Under one lid, something shifts. A seam of dull red light opens — just a seam — and every hair on your body stands. The servants freeze. The breathing stops.","line.viy.3":"…The seam closes. The breathing resumes. Whatever Viy dreams of, it is not you. Not yet. You back away very, very quietly, and the birds only start again when the village fire is in sight.","line.beelzebub.0":"The great figure on the stone seat inclines his horned head — a small, terrible courtesy. “The mountain remembers its guests, little mortal. The stone at your heart remembers too. Go down warm.”","line.beelzebub.1":"Below, the witches are still dancing. They will be dancing, one way or another, long after Zalissya is a story grandmothers tell. You walk down the trail with moonlight on your shoulders like a cloak someone lent you — and does not want back yet.","line.beelzebub.2":"Beelzebub rises — slowly, the way weather rises. The fiddles falter. Every devil on the summit turns to look at you, and the fire leans in to listen.","line.beelzebub.3":"“YOU BROUGHT THE MOUNTAIN ITS FLOWERS. YOU DANCED ITS DANCE. THE SABBATH DOES NOT LET SUCH A GUEST GO DOWN EMPTY.” He opens one vast hand. In it, small as a coin and bright as the moon's edge: a moonstone, cold and kind.","line.beelzebub.4":"“TAKE IT. NOT A BARGAIN — A BLESSING. THERE IS A DIFFERENCE, AND TONIGHT YOU HAVE EARNED THE DIFFERENCE.” Somewhere below the summit, very faintly, a church bell that does not exist rings once — and the Bolotianyk answers it.","line.beelzebub.5":"From his seat of black stone, Beelzebub regards you over the fire. His voice is not loud. It does not need to be; the mountain carries it the way it carries thunder.","line.beelzebub.6":"“THE OFFERING IS LAID. GOOD. NOW — THE DANCE, LITTLE MORTAL. A GUEST WHO ONLY WATCHES IS ONLY HALF A GUEST. STEP INTO THE RING, SOUTH OF THE FIRE, AND KEEP THE TURN.” One clawed hand gestures at the circling witches, almost — almost — kindly.","line.beelzebub.7":"You approach the stone seat at the summit's north edge, and the sabbath goes quiet around you — fiddles trailing off, witches pausing mid-turn, a hundred small devils suddenly very interested in their hooves.","line.beelzebub.8":"Beelzebub is older than the mountain's baldness and dressed like the best funeral you have ever imagined. “A MORTAL. ON MY MOUNTAIN. WITHOUT AN OFFERING.” He says it the way a starosta notes a missing fence-post: not angry — recording.","line.beelzebub.9":"“THE RULES ARE OLD, LITTLE MORTAL, AND EVEN I OBEY THEM. NICHNYKY GROW ON THESE SLOPES — NIGHT-BLOOMS, PALE AS BONE. BRING THREE TO THE OFFERING STONE. THEN WE SHALL SEE WHAT YOU ARE.”","line.chort.11":"You came, you offered, you danced, and Beelzebub HIMSELF blessed you. Do you know what that does to my reputation? NOTHING. It was already magnificent.","line.chort.12":"Wear the moonstone well, traveller. And if anyone in Zalissya asks where you got it — a devil's guest-price. Let them chew on that.","line.chort.13":"You DANCED! Did everyone see? The mortal danced and the mountain did not even crack! Now — up to the big chair with you. Beelzebub has a blessing with your name scratched on it, and he scratches DEEP.","line.chort.14":"The offering is laid and the stone is HAPPY — stones are never happy, that is how good it was. Now the dance, traveller! South of the fire, into the ring, keep the turn. Even I cannot waltz a guest's place for them — I checked. Twice. There were… incidents.","line.chort.15":"Nichnyky! Three pale beauties, and not a petal bruised — you handle night-flowers like a vidma born. The offering stone waits, north of the fire. Lay them down gentle. The mountain notices gentle.","line.chort.16":"MY GUEST ARRIVES! Welcome to Lysa Hora, traveller — the Bald Mountain, my office, my ballroom, my cathedral! Beelzebub presides, the vidmy dance, and the fire — the fire is older than your village and twice as honest.","line.chort.17":"House rules, and they are Beelzebub's, so they are carved deeper than stone: a guest brings the mountain an offering. Nichnyky — night-blooms — open on these slopes, pale little moons in the rock. Gather three, lay them on the offering stone north of the fire, and the sabbath is yours. Dance with us after, and who knows what blessings fall off the big chair.","line.chort.18":"And no signatures tonight! Sabbath rules. Even I keep ONE night a week honest. …Mostly.","line.solokha.0":"Solokha curtseys — a witch's curtsey, which involves more of the sky than seems necessary. “Blessed by the big one himself. Walk down proud, ditko. And if Vesna asks after me — tell her the mountain keeps her sister well.”","line.solokha.1":"She presses nothing into your hand, asks for nothing. From a witch of Lysa Hora, that is the rarest gift of all.","line.solokha.2":"You dance like a mortal who intends to survive it — clever feet! Up with you to Beelzebub now, before the fire burns lower. A blessing given at high fire is a blessing that keeps.","line.solokha.3":"The stone took your flowers kindly — I felt it through my shoes. Now dance, ditko. The ring is south of the fire. Do not count the steps; counting is how mortals fall out of the music.","line.solokha.4":"Three nichnyky, and picked at the bloom's first breath — Vesna taught you well, whoever you are. The offering stone, north of the fire. Lay them down and bow to no one; the mountain is not a priest. It is a host.","line.solokha.5":"Well — a face from under the roofs! I am Solokha, vidma, widow, and the best cook on this mountain, whatever the devils say with their mouths full. You climb well for a lowlander.","line.solokha.6":"You want the sabbath's welcome? Then do it properly, ditko. Nichnyky — night-blooms — open on the bare slopes, pale as little moons. Three of them on the offering stone, north of the fire. That is the mountain's price, and it is fairer than any devil's.","line.solokha.7":"And afterwards — dance. A guest who will not dance is a guest the mountain forgets. And you do not want to be forgotten by a mountain. It has a long memory and no manners at all.","line.motrya.0":"Motrya touches two fingers to the moonstone's light and smiles with all her teeth. “It suits you. Moonlight usually does, on the ones the mountain chooses. Come back when it fades, ditko — mountains renew.”","line.motrya.1":"Motrya is still turning in the ring's echo, humming. “You kept the turn. The big chair noticed. Go and be blessed, dancer — I shall keep your place warm in the circle.”","line.motrya.2":"Motrya nods at the offering stone, where your nichnyky glow faintly. “Laid true. Now the dance — south of the fire, ditko, and do not think about your feet. Feet hate being thought about.”","line.motrya.3":"A small witch with a voice like a nightjar looks up from braiding night-blooms into her hair. “Motrya. I keep the nichnyky of Lysa Hora — which is to say, I know where they hide and I am not too proud to say.”","line.motrya.4":"“The slopes, ditko. Where the rock is baldest and the moonlight pools — that is where they open. Three for the offering stone. Pick them gentle: a night-bloom bruised is a promise bruised, and this mountain counts promises.”","line.motrya.5":"“{flowers} already in your hand, I see — the mountain counts those too. {n} more, ditko.”","topic.myroslav.0":"Back again, traveller? Zalissya keeps, mostly. Ask what you will.","topic.myroslav.forest.label.0":"The forest & the Lisovyk","topic.myroslav.forest.question.0":"What walks in the forest?","topic.myroslav.domovyk.label.0":"The Domovyk & the bread","topic.myroslav.domovyk.question.0":"Tell me of the house spirit.","topic.myroslav.viy.label.0":"Viy","topic.myroslav.viy.question.0":"Who is Viy?","topic.myroslav.radek.label.0":"Radek the smith","topic.myroslav.radek.question.0":"Who is the smith?","topic.myroslav.dark.label.0":"The Chort & the pond","topic.myroslav.dark.question.0":"What should I fear here?","topic.myroslav.lysa.label.0":"Lysa Hora","topic.myroslav.lysa.question.0":"What is Lysa Hora?","topic.myroslav.growth.label.0":"How a person grows here","topic.myroslav.growth.question.0":"How does one become someone in Zalissya?","topic.vesna.0":"And the deep work is open to you: my strong tonic — three herbs, and drunk it sharpens mind AND eye twice as deep as the common brew (INT +2, WIS +2). Your INT has reached 3, znakharka. The rack will offer it.","topic.vesna.1":"One secret I keep for a readier mind: my strong tonic — three herbs, worth INT +2 and WIS +2 to whoever drinks it. It unlocks at INT 3; yours stands at {intTotal}. Keep brewing the common tonic — the rack remembers every batch.","topic.vesna.2":"Your basket smells of the whole meadow. Ask, znakharka — I keep few secrets from keen hands.","topic.vesna.3":"Gentle hands. What would you know?","topic.vesna.herbs.label.0":"The five herbs","topic.vesna.herbs.question.0":"Teach me the herbs.","topic.vesna.zvirobiy.label.0":"Zvirobiy, the shy herb","topic.vesna.zvirobiy.question.0":"Why does zvirobiy hide from me?","topic.vesna.zvirobiy.0":"Zvirobiy hides from no one in this village now — your eye knows it, stem and yellow star. Wisdom opened that door, and doors opened by doing stay open.","topic.vesna.cooking.label.0":"Cooking at the campfire","topic.vesna.cooking.question.0":"What can I cook?","topic.vesna.cooking.0":"At the campfire hangs a pot, and it is not decoration: one pond fish and one herb from your satchel makes a proper karas soup. That is Cooking — and a fed traveller walks brisker. Eat it from your Character sheet.","topic.vesna.alchemy.label.0":"Alchemy & the strong tonic","topic.vesna.alchemy.question.0":"Teach me alchemy.","topic.vesna.alchemy.0":"By the north-east hut stands my drying rack: two herbs, worked patiently, become a tonic — that is Alchemy. Drink one and the world goes clear for a while.","topic.vesna.pond.label.0":"The pond & fishing","topic.vesna.pond.question.0":"What of the pond?","topic.vesna.pond.0":"When the herbs rest, try the pond shore, west bank. A patient line catches more than karas — it catches quiet. And quiet is a remedy too. Mind the Bolotianyk, though: it is his water first.","topic.vesna.errand.label.0":"What you ask of me","topic.vesna.errand.question.0":"What do you need?","topic.vesna.errand.0":"Nothing today, keen one. The forest has accepted you — now Zalissya asks only that you keep being what you do.","topic.radek.0":"My home is a village many days' road from here, far to the west. I came with the spring to lend them my hammer — and the road home can wait until the work is done.","topic.radek.1":"Mind the sparks, traveller. Ask away.","topic.radek.2":"Aye? Mind the anvil — she bites. Ask.","topic.radek.forge.label.0":"The lit forge","topic.radek.forge.question.0":"How does the forge fare?","topic.radek.horseshoe.label.0":"The horseshoe you gave me","topic.radek.horseshoe.question.0":"Why a horseshoe?","topic.radek.smithing.label.0":"Learning smithing","topic.radek.smithing.question.0":"Teach me the anvil.","topic.radek.home.label.0":"Your home in the west","topic.radek.home.question.0":"Where are you from, Radek?","topic.radek.home.label.1":"Your home in the west","topic.radek.home.question.1":"Where are you from, Radek?","topic.radek.iron.label.0":"Bog iron for the forge","topic.radek.iron.question.0":"What does your forge need?","topic.radek.lisovyk.label.0":"Iron & the Lisovyk","topic.radek.lisovyk.question.0":"Can iron settle the Lisovyk?","topic.radek.viy.label.0":"Viy & iron","topic.radek.viy.question.0":"Would iron serve against Viy?","topic.domovyk.0":"Hmph. You again. …Sit a moment, then. Ask — quietly.","topic.domovyk.1":"Soft feet, new one. Ask, then — quietly.","topic.domovyk.bread.label.0":"The bread","topic.domovyk.bread.question.0":"What do you want of me?","topic.domovyk.hearth.0":"The warm stone","topic.domovyk.hearth.1":"Your hut & the pich","topic.domovyk.hearth.2":"Tell me of the stone.","topic.domovyk.hearth.3":"Tell me of this hut.","topic.domovyk.hearth.4":"A hundred winters I have kept this hut: the pich warm, the bread risen, the mice polite. It is not grand work. It is the work that lets all other work happen.","topic.domovyk.lisovyk.label.0":"The Lisovyk","topic.domovyk.lisovyk.question.0":"What of the forest spirit?","topic.domovyk.lisovyk.0":"The Lisovyk thinks himself grand out there with his pines. Let him. Empires fall; a warm hearth does not.","topic.domovyk.viy.label.0":"Viy","topic.domovyk.viy.question.0":"What of Viy?","topic.domovyk.viy.0":"…You smell of the north-east path. You have been near Viy. Do not go clattering about up there, little landlord. If those eyelids ever lift, no pich in Zalissya will keep out the cold that follows.","topic.lisovyk.0":"You again, two-legs. You walk softer than most. Ask.","topic.lisovyk.rules.label.0":"The forest's rules","topic.lisovyk.rules.question.0":"What are your rules?","topic.lisovyk.vesna.label.0":"Vesna's eye","topic.lisovyk.vesna.question.0":"What of Vesna?","topic.lisovyk.viy.label.0":"Viy","topic.lisovyk.viy.question.0":"What of Viy?","topic.lisovyk.domovyk.label.0":"The Domovyk","topic.lisovyk.domovyk.question.0":"What of the house spirit?","topic.lisovyk.domovyk.0":"The Domovyk? A crumb-god in a warm box, fed on crusts and courtesy. Let him keep his pich — I keep the world that grows the wood for it. We do not quarrel. Much.","topic.lisovyk.lost.label.0":"Getting lost","topic.lisovyk.lost.question.0":"What happens to the lost?","topic.lisovyk.lost.0":"The lost are mine also — I said it when we met, and it is no threat. Walk out greedy or loud, and the paths turn, and turn, and you greet your own footprints until dark. Walk soft, take only what is given, and the pines lean apart like polite neighbours.","topic.chort.0":"My favourite customer returns! Ask away — no pens in sight. Promise.","topic.chort.settled.label.0":"Our bargain, settled","topic.chort.settled.question.0":"No hard feelings?","topic.chort.lysa.label.0":"Lysa Hora & the sabbath","topic.chort.lysa.question.0":"Tell me of the sabbath.","topic.chort.mill.label.0":"The old mill sabbaths","topic.chort.mill.question.0":"What happened at the old mill?","topic.chort.mill.0":"In the old days we kept a fine sabbath up at the old mill — fiddles, dancing, the whole host, and Beelzebub himself presiding! Weddings we crashed by the dozen. A Cossack's soul is a vintage thing, my friend. These nights we keep it grander on Lysa Hora — but I keep a soft spot for a millstone.","topic.chort.1":"My shadowless friend returns! Ask — everything is negotiable. Almost everything.","topic.chort.soul.label.0":"My soul — the price","topic.chort.soul.question.0":"What will my soul cost me?","topic.chort.gold.label.0":"The gold & my shadow","topic.chort.gold.question.0":"Was the bargain fair?","topic.chort.lysa.label.1":"Lysa Hora","topic.chort.lysa.question.1":"Tell me of the mountain.","topic.chort.2":"Psst. Back again, traveller? Ask — I know things. Some of them are even true.","topic.chort.who.label.0":"Who are you?","topic.chort.who.question.0":"What are you, exactly?","topic.chort.mill.label.1":"The mill & the sabbath","topic.chort.mill.question.1":"What is this sabbath you speak of?","topic.chort.viy.label.0":"Viy","topic.chort.viy.question.0":"What do devils fear?","topic.chort.viy.0":"Viy? …Even I lower my voice, traveller. A devil deals in souls; Viy deals in endings. If those lids ever lift, my whole sabbath dances attendance — from very, very far away.","topic.chort.refused.label.0":"Your bargain — refused","topic.chort.refused.question.0":"Any regrets, devil?","topic.chort.refused.0":"Regrets? ME? Hah! You refused like a starosta, traveller — I told you, the last one who refused me became one. The offer stands closed, and a devil keeps his word: no pen, no pitch. But when Viy stirs and you need a friend with a pitchfork — you know where the millstone is. My prices only go UP.","topic.chort.bargain.label.0":"Your bargain ✒","topic.chort.bargain.question.0":"What are you offering?","topic.bolotianyk.0":"The eyes rise again from the pond scum. “Dry one. Ask, then. The pond has time.”","topic.bolotianyk.bells.label.0":"The drowned bells","topic.bolotianyk.bells.question.0":"What bells ring under the pond?","topic.bolotianyk.water.label.0":"What grows in your water","topic.bolotianyk.water.question.0":"May I take what grows here?","topic.bolotianyk.fishing.label.0":"Fishing your pond","topic.bolotianyk.fishing.question.0":"Do you mind my line?","topic.bolotianyk.fishing.0":"“You have not troubled my water with a line yet, dry one. Fish if you must — from the west shore, politely, and take only what the pond gives up. What it keeps, it keeps.”","topic.bolotianyk.old.label.0":"Viy & the old things","topic.bolotianyk.old.question.0":"What is oldest here?","topic.beelzebub.viy.label.0":"Viy","topic.beelzebub.viy.question.0":"What does the mountain fear?","topic.beelzebub.viy.0":"“VIY. YES. EVEN THE MOUNTAIN HAS A NEIGHBOUR IT DOES NOT VISIT. HIS LIDS HANG TO THE GROUND, AND UNDER THEM — AN ENDING. LET HIM SLEEP, LITTLE MORTAL. SOME GUESTS EVEN I WILL NOT RECEIVE.”","topic.beelzebub.court.label.0":"Your court","topic.beelzebub.court.question.0":"Who gathers here?","topic.beelzebub.court.0":"“MY COURT: WITCHES WHO OUTLIVED THEIR VILLAGES, DEVILS WHO OUTGREW THEIR MILLS, AND ONE MORTAL WHO CAME POLITE. THE FIRE IS OLDER THAN ZALISSYA. THE DANCING IS OLDER THAN THE FIRE.”","topic.beelzebub.0":"“THE MOUNTAIN'S GUEST RETURNS. ASK, LITTLE MORTAL.”","topic.beelzebub.moonstone.label.0":"The Moonstone","topic.beelzebub.moonstone.question.0":"What did you give me?","topic.beelzebub.leaving.label.0":"Going down the mountain","topic.beelzebub.leaving.question.0":"May I go in peace?","topic.beelzebub.1":"“YOU DANCED, LITTLE MORTAL. THERE IS A BLESSING WITH YOUR NAME SCRATCHED ON IT. ASK, AND IT IS YOURS.”","topic.beelzebub.blessing.label.0":"Receive the blessing ✦","topic.beelzebub.blessing.question.0":"I offered, and I danced. I have come for the blessing.","topic.beelzebub.rules.label.0":"The mountain's rules","topic.beelzebub.rules.question.0":"What are the rules here?","topic.beelzebub.rules.0":"“THE OFFERING IS LAID. THE DANCE IS DANCED. WHAT REMAINS IS MINE TO GIVE. THOSE WERE ALWAYS THE RULES, AND EVEN I OBEY THEM.”","topic.beelzebub.2":"“THE STONE REMEMBERS YOUR FLOWERS. ASK, LITTLE MORTAL.”","topic.beelzebub.dance.label.0":"The dance","topic.beelzebub.dance.question.0":"What must I do now?","topic.beelzebub.offering.label.0":"The offering","topic.beelzebub.offering.question.0":"Was my offering worthy?","topic.beelzebub.offering.0":"“IT WAS LAID TRUE, AND THE STONE REMEMBERS. NOW SHOW THE MOUNTAIN YOUR FEET, LITTLE MORTAL.”","topic.beelzebub.3":"“ASK, LITTLE MORTAL. THE MOUNTAIN ANSWERS WHAT IT CHOOSES.”","topic.beelzebub.rules.label.1":"The rules & the nichnyky","topic.beelzebub.rules.question.1":"What does the mountain ask of a guest?","topic.beelzebub.who.label.0":"Who are you?","topic.beelzebub.who.question.0":"Who presides here?","topic.chort.rules.label.0":"House rules","topic.chort.rules.question.0":"What are the house rules?","topic.chort.beelzebub.label.0":"Beelzebub","topic.chort.beelzebub.question.0":"What is he like?","topic.chort.beelzebub.0":"The big chair? Beelzebub is the sabbath the way the starosta is the village — except his beard is older, his memory is longer, and his blessings are REAL. When you have danced, go and collect yours.","topic.chort.3":"My guest returns! Ask — house rules still apply: no signatures, all gossip.","topic.chort.blessing.label.0":"Beelzebub's blessing","topic.chort.blessing.question.0":"Did he really bless me?","topic.chort.telling.label.0":"Telling Zalissya","topic.chort.telling.question.0":"What do I tell the village?","topic.chort.4":"My guest returns! Ask — house rules still apply: no signatures, all gossip.","topic.chort.dance.label.0":"The dance","topic.chort.dance.question.0":"How did I dance?","topic.chort.5":"My guest returns! Ask — house rules still apply: no signatures, all gossip.","topic.chort.dance.label.1":"The dance","topic.chort.dance.question.1":"What now?","topic.chort.6":"My guest returns! Ask — house rules still apply: no signatures, all gossip.","topic.chort.offering.label.0":"The offering stone","topic.chort.offering.question.0":"What do I do with the nichnyky?","topic.chort.dance.label.2":"The dance","topic.chort.dance.question.2":"Tell me of the dance.","topic.chort.dance.0":"The dance comes after the offering, traveller — ring south of the fire, keep the turn, do not count the steps. Even I cannot waltz a guest's place for them. I checked. Twice. There were incidents.","topic.chort.7":"My guest returns! Ask — house rules still apply: no signatures, all gossip.","topic.chort.welcome.label.0":"This place","topic.chort.welcome.question.0":"What is this place?","topic.chort.nosign.label.0":"No signatures?","topic.chort.nosign.question.0":"No bargains tonight?","topic.solokha.0":"Back again, ditko? Ask — a witch's ears are her fortune.","topic.solokha.vesna.label.0":"Vesna — your sister?","topic.solokha.vesna.question.0":"You know Vesna?","topic.solokha.vesna.0":"“Vesna? My little sister keeps the village's bodies — broth, bandages, babies. I keep its secrets. Between us, Zalissya is entirely kept. Do not tell her I said 'little'.”","topic.solokha.offering.label.0":"The offering","topic.solokha.offering.question.0":"How does the offering go?","topic.solokha.offering.0":"Laid true and danced after, ditko — the mountain could not ask more of a guest. It will remember you kindly, which for a mountain is a great deal of remembering.","topic.solokha.dance.label.0":"The dance","topic.solokha.dance.question.0":"Tell me of the dance.","topic.solokha.dance.0":"You kept the turn like you were born in the ring, ditko. The witches still talk about your feet — witches' praise, which is rarer than their curses and twice as binding.","topic.solokha.cooking.label.0":"Cooking on the mountain","topic.solokha.cooking.question.0":"Are you really the mountain's best cook?","topic.solokha.cooking.0":"“The best cook on this mountain, whatever the devils say with their mouths full. My secret? Never cook for anyone you would not also curse. It concentrates the seasoning.”","topic.motrya.0":"“{flowers} already in your hand, I see — the mountain counts those too. {n} more, ditko.”","topic.motrya.1":"Motrya looks up from her braiding. “Ask, ditko. The blooms keep.”","topic.motrya.nichnyky.label.0":"Where nichnyky hide","topic.motrya.nichnyky.question.0":"Where do the night-blooms grow?","topic.motrya.offering.label.0":"The offering stone","topic.motrya.offering.question.0":"Tell me of the offering stone.","topic.motrya.offering.0":"“The offering stone stands north of the fire. Three nichnyky, laid gentle, and the mountain leans closer — I have felt it through my shoes, every sabbath of my life.”","topic.motrya.dance.label.0":"The dance","topic.motrya.dance.question.0":"How does one dance here?","topic.motrya.dance.0":"“South of the fire, ditko, and do not think about your feet. Feet hate being thought about. First the offering, though — the ring keeps no step for the empty-handed.”","topic.motrya.moonstone.label.0":"The Moonstone","topic.motrya.moonstone.question.0":"What is the Moonstone?","topic.motrya.moonstone.0":"“When the big chair blesses a guest, it is with a moonstone — cold as well-water, kind as moonlight. Offer, dance, and ask him, ditko. In that order; mountains are particular about order.”","topic.LYSA_BLESSING_LINES.0":"The moonstone settles into your palm, cold as well-water and twice as clear. Somewhere inside it, a crescent turns — slowly, patiently — to face you.","topic.LYSA_BLESSING_LINES.1":"Around the bonfire the witches raise their arms, the devils stamp their hooves, and Beelzebub himself inclines his horned head. The sabbath has a new story to tell about a mortal who came polite, offered fairly, and danced.","topic.LYSA_BLESSING_LINES.2":"You wear Lysa Hora's blessing now. The night road down to Zalissya will be shorter than the road up. It always is, for the blessed — that is rather the point of blessings.","topic.CHORT_SIGNED_LINES.0":"Signed! SIGNED! Oh, traveller — you have made a devil's whole century. Here: your gold. Feel how it never gets lighter? That is the good stuff. That is the SABBATH stuff.","topic.CHORT_SIGNED_LINES.1":"And no take-backs… well. One take-back, because I LIKE you: pond fish buys your soul back any time — the price is in your Character sheet, under Charisma. Devils and fish, traveller. Do not ask. Now — notice anything missing when you walk in the sun? Look down. Heh. HEH.","topic.CHORT_REFUSED_LINES.0":"…No? NO? Hah! Hahaha! Oh, I LIKE you. The last one who refused me became a starosta; the one before — a very surprised frog. Keep your soul then, traveller. But when Viy stirs and you need a friend with a pitchfork — you know where the millstone is. My prices only go UP.","topic.CHORT_TRADE_LINES.0":"Pond fish, still shining. …A deal is a deal, traveller. Here — one soul, slightly haunted, returns to its owner. And keep the gold. A devil's gold spends the same, and I am not a CHEAT.","topic.CHORT_TRADE_LINES.1":"There. Feel that? Warmth. Weight. A shadow pooling at your feet like it never left. Pleasure doing business. Tell NO ONE I went soft.","topic.well.name.0":"The Old Well","topic.well.role.0":"Drop a pebble, make a wish","topic.brewbench.name.0":"Vesna's drying rack","topic.brewbench.role.0":"Alchemy bench · choose a brew","topic.BREW_CHOICE_LINES.0":"The rack smells of polyn and sun, and the little cauldron is already warm. Two brews are within your craft: the common tonic (2 herbs — bright and clarifying), and Vesna's strong tonic (3 herbs — the deep draught she teaches only at INT 3; drunk, it is worth INT +2 and WIS +2). The cauldron waits. Which do you work?","viy.myroslav.vigil-after.label.0":"The night you kept ✦","viy.myroslav.vigil-after.question.0":"Is it truly over?","viy.myroslav.vigil-after.0":"Over? The rooster crowed, the lids fell, and the hollow is only a hollow now — grass, stones, a ring of chalk the rain has not dared to wash. My grandfather's grandfather would have stood you a whole barrel for this, traveller.","viy.myroslav.vigil-after.1":"I have no barrel. I have a village that sleeps easy. Stay as long as you like — you are no guest in Zalissya any more.","viy.myroslav.oldway.label.0":"Viy stirs — the old way","viy.myroslav.oldway.question.0":"Viy stirs in his sleep. How did Zalissya keep him down before?","viy.myroslav.oldway.0":"You saw the seam of red under his lid. So did my grandfather's grandfather, once. He said Viy stirs every few lifetimes, and someone must sit up with him through one whole night, or he wakes for good.","viy.myroslav.oldway.1":"The old way is this. Draw a ring of blessed chalk by his hollow, after dark. Stand inside it until the rooster crows. The nechyst, the unclean host, will crawl at the chalk, and you drive them back with the old words.","viy.myroslav.oldway.2":"And when he roars for his servants to LIFT HIS EYELIDS, look away. Whatever you hear, look away. Those who meet Viy's eyes do not come home.","viy.myroslav.oldway.3":"Here, the chalk. It has sat in the church chest for eighty years, waiting. Vesna knows a wreath that dulls his gaze, and Radek's iron burns the unclean. Ask them. Then pick your night.","viy.myroslav.vigil.label.0":"The vigil","viy.myroslav.vigil.question.0":"Tell me the old way again.","viy.myroslav.vigil.0":"After dark (from nine in the evening until four) draw the chalk ring at his hollow. Ward the host back from the chalk. When the lids rise, LOOK AWAY, and keep looking away while the gaze is open. Hold until the rooster crows.","viy.myroslav.vigil.1":"You have tried {broken}× and come back on your own feet each time. That is more than most. Eat well, rest, and go again. A steadier heart (Constitution) holds more fear.","viy.myroslav.vigil.3":"Eat before you go. A full belly holds more fear than an empty one, my grandmother said, and she buried three husbands and no regrets.","viy.vesna.vigil-after.label.0":"After the vigil","viy.vesna.vigil-after.question.0":"Did the wreath help?","viy.vesna.vigil-after.0":"It helped, but you held. A wreath only dulls what you are brave enough to turn away from. The meadow feels lighter since that night, and so does my sleep.","viy.vesna.wreath.label.0":"A wreath against his eyes","viy.vesna.wreath.question.0":"Myroslav says you know a wreath against Viy's gaze.","viy.vesna.wreath.0":"I do. Polyn for bitterness, which the unclean hate, zvirobiy for the sun it keeps in its petals, and a sprig of dereviy to bind them. Give me three herbs from your satchel.","viy.vesna.wreath.1":"There. Wear it low over your brow. When the lids rise, his gaze will catch in the leaves before it catches you: it takes half the harm. Half, znakharka. Still look away.","viy.vesna.wreath.2":"I do: polyn, zvirobiy and dereviy, woven tight. It catches half of Viy's gaze before it reaches you.","viy.vesna.wreath.3":"But you must know zvirobiy to pick it rightly, and your eye is not there yet (WIS {wis}, it takes {WREATH_WIS}). Gather the other herbs; the eye grows with the gathering.","viy.vesna.wreath.4":"Bring me {WREATH_HERBS} herbs in your satchel; you have {herbStock}. The glowing patches provide.","viy.radek.vigil-after.label.0":"After the vigil","viy.radek.vigil-after.question.0":"Did the iron sing?","viy.radek.vigil-after.0":"Sang? It SCREAMED, I hear, the moment the first of them touched it. Good iron, that. Good arm that hammered it, too. In my village they would carve your name over the smithy door. Here, I will settle for a horseshoe with your initial.","viy.radek.ironward.label.0":"Iron for the vigil","viy.radek.ironward.question.0":"Can iron help against Viy's host?","viy.radek.ironward.0":"Can it? Unclean things cannot abide cold iron. Give me one of the pieces you forged here. I will draw it into nails, three of them, and you drive them into the chalk.","viy.radek.ironward.1":"There. The first three of that host to touch your ring will burn like straw. After that it is your words and your nerve, friend.","viy.radek.ironward.2":"It can. Bring me one piece you have forged yourself, from my anvil, and I will draw it into nails for your chalk ring. Work the forge, then come back.","viy.radek.ironward.3":"It can, but my forge is cold. Bring me the bog iron from the pond mud first, and when the fire is lit, forge me a piece with your own arm.","viy.domovyk.vigil-after.label.0":"After the vigil","viy.domovyk.vigil-after.question.0":"Did you hear the rooster, little landlord?","viy.domovyk.vigil-after.0":"Hear him? I fed him a crust that morning myself! Oh, the whole hut sighed when he crowed. You can sleep in my bed as long as you like, keeper. I will even stop hiding your boots. Mostly.","viy.domovyk.vigil.label.0":"The vigil","viy.domovyk.vigil.question.0":"Any advice for the night?","viy.domovyk.vigil.0":"Sleep first. My bed is yours: lie down, and if you ask nicely I will wake you at dusk. And look AWAY, keeper. I have seen what looking does. I do not want to sweep it up.","viy.lisovyk.vigil-after.label.0":"After the vigil","viy.lisovyk.vigil-after.question.0":"The forest is quieter.","viy.lisovyk.vigil-after.0":"Quieter? The forest is LISTENING. It has not heard that hollow empty in a hundred winters. The birds sing there now. I may let the paths go straight for you, keeper. Now and then.","viy.lisovyk.vigil.label.0":"The vigil","viy.lisovyk.vigil.question.0":"Will the forest help me?","viy.lisovyk.vigil.0":"The forest helps no one; it watches. But I will tell you a forest thing: the host comes from every side at once, and the wise one lets them come close and drives them all back together. Waste no words on one shadow.","viy.chort.vigil-after.label.0":"After the vigil","viy.chort.vigil-after.question.0":"Were you watching?","viy.chort.vigil-after.0":"Watching? I had a SEAT. Front row, on the millstone. Oh, the screaming of that nechyst on Radek's iron, music! And when the rooster went off… well. Let us say I left early. Business reasons. You owe me nothing. That is a first.","viy.chort.vigil.label.0":"The vigil","viy.chort.vigil.question.0":"Will you help with Viy?","viy.chort.vigil.0":"Help? I am a devil, not a starosta! …But I will give you this for free, which hurts me: the lids rise SLOWLY. You have time to drive back the host while they are rising, then turn away at the last moment. Do not tell anyone I was useful.","viy.bolotianyk.vigil-after.label.0":"After the vigil","viy.bolotianyk.vigil-after.question.0":"Did the pond feel it?","viy.bolotianyk.vigil-after.0":"“The pond felt him SINK, dry one. Deep, past my bells, past the bottom of everything. He will not come up through my water. I have never been glad of a guest before.”","viy.bolotianyk.vigil.label.0":"The vigil","viy.bolotianyk.vigil.question.0":"What do you know of Viy's host?","viy.bolotianyk.vigil.0":"“While the lids are rising, the host still crawls. When the lids are OPEN, even the host holds still: they fear what is under there too. Count on that, dry one. And bring the iron. They hate iron.”","viy.viyNarration.0":"In daylight the hollow only breathes. The servants doze against their forks. Nothing will happen here until dark. The chalk waits in your pocket. Come back after nine in the evening, or rest in the Domovyk's bed until dusk.","viy.viyNarration.1":"By night the hollow breathes louder. The servants are awake, leaning on their forks, whispering at the lids. The red seam under one of them is wider than before.","viy.viyNarration.2":"This is not a thing to face with empty hands. Myroslav is old enough to remember what Zalissya used to do. Ask him.","viy.VIGIL_INTRO_LINES.0":"You kneel and draw the chalk ring, one unbroken line around you. The servants stop whispering. Somewhere in the dark something laughs, then many somethings.","viy.VIGIL_INTRO_LINES.1":"Remember. WARD drives back every spirit near the chalk. When Viy roars for his lids, the lids rise slowly; turn away before they open, and hold LOOK AWAY until they fall. Hold until the rooster crows.","viy.VIGIL_WON_LINES.0":"Far off in Zalissya the rooster crows. Once. Twice. The host shrieks and scatters like ash in wind.","viy.VIGIL_WON_LINES.1":"The servants drop their forks. Viy's lids fall closed with a sound like a door slamming under the earth. Then the hollow sinks: boulder-head, lids, servants and all, down past the roots. The grass closes over it.","viy.VIGIL_WON_LINES.2":"Dawn comes up pink over the pines. You are still inside the chalk. You never looked. ✦","viy.VIGIL_BROKEN_LINES.0":"Your nerve breaks. You are out of the circle and running before you know it. Branches, the fence, the Domovyk's door…","viy.VIGIL_BROKEN_LINES.1":"You wake in his bed at morning, boots off and a blanket tucked to your chin. The chalk is still in your pocket. Viy still sleeps, and the night can be tried again.","ui.bed.name.0":"The Domovyk's bed","ui.bed.role.0":"Straw, sheepskin, and the pich's warmth","ui.vigil.name.0":"The vigil","ui.vigil.role.0":"Viy's hollow · one night","ui.enterHut.0":"You duck into the Domovyk's hut — pich-warm, smelling of bread and woodsmoke.","ui.enterHut.1":"You duck into Vesna's hut — herbs overhead, and something green breathing in the cauldron.","ui.exitHut.0":"Back out into the clearing's daylight.","ui.chortChoice.0":"You signed. The gold is heavy — and where did your shadow go?","ui.eatMeal.0":"Hot karas soup, herbs and all. You feel sturdier — CON +1 while well fed.","ui.drinkTonic.0":"Bitter, bright, clarifying. INT +1 and WIS +1 while the tonic lasts.","ui.drinkStrongTonic.0":"Dark, deep, twice as clarifying — Vesna's strong tonic. INT +2 and WIS +2 while it lasts.","ui.sleepUntil.0":"{msg} Yesterday's meal and tonics have worn off.","ui.pickOption.0":"You sleep like a stone on the Domovyk's warm bed and wake to birdsong.","ui.pickOption.1":"You doze the day away. Something small tugs your sleeve: dusk. The Domovyk kept his word.","ui.applyGrant.0":"Myroslav's blessed chalk — and the old way with it. Viy can be faced after dark.","ui.applyGrant.1":"Vesna's wreath of polyn and zvirobiy. Viy's gaze will take half.","ui.applyGrant.2":"Three iron nails for the chalk. The first three of the host will burn.","ui.endVigil.0":"Viy is sealed under the hollow. Keeper of the vigil: WIS +1, CHA +1 ✦","ui.carryBlockedToast.0":"Too heavy — you are carrying {carriedWeight}/{carryCap}, and that needs {addWeight} more room. Your STR {str} sets the limit; smithing raises it. Put something down first — cook, brew, eat, or hand the iron to Radek.","ui.performBrew.0":"Vesna's strong tonic wants 3 herbs — you have {herbsIn}. The glowing patches provide.","ui.performBrew.1":"The cauldron wants 2 herbs from your satchel — you have {herbsIn}. The glowing patches provide.","ui.performBrew.2":"The strong tonic settles, dark as well-water at dusk! Alchemy Lv {craftLevel} — INT is now {int}. Drink it from your Character sheet.","ui.performBrew.3":"The tonic clears, bright as bottled morning! Alchemy Lv {craftLevel} — INT is now {int}. Drink it from your Character sheet.","ui.performBrew.4":"Two bottles of the strong brew from one batch — a bright mind wastes nothing (INT {intNow}). · Alchemy Lv {craftLevel}","ui.performBrew.5":"Two bottles from one batch — a bright mind wastes nothing (INT {intNow}). · Alchemy Lv {craftLevel}","ui.performBrew.6":"Vesna's strong tonic, dark and deep. · Alchemy Lv {craftLevel} · {stock} in satchel","ui.performBrew.7":"A tonic, bitter and bright. · Alchemy Lv {craftLevel} · {stock} in satchel","ui.doInteract.0":"The Moonstone of Lysa Hora is yours — WIS +1, CHA +1 while you carry it. 🌙","ui.doInteract.1":"You caught an old boot. The pond gives back what the village throws in.","ui.doInteract.2":"Your catch: {fish} — in your hands, and gone again! No room: carrying {carriedWeight}/{carryCap}, and a fish weighs 1. Your STR {str} sets the limit.","ui.doInteract.3":"Caught {caught}! Fishing Lv {fishLevel} — DEX is now {total}. The bite window widens.","ui.doInteract.4":"Caught {caught}! · Fishing Lv {fishLevel} ({total} caught)","ui.talk.0":"Your soul — and your shadow — are yours again.","ui.talk.1":"Radek presses a warm horseshoe into your hand — STR +1 while you carry it.","ui.gather.0":"You reach for the Zvirobiy — and hesitate. You do not truly know this herb yet: WIS check failed (your WIS {wisNow}, it takes 2). Gather the other herbs first; Vesna's eye will teach yours. The patch stays, unpicked.","ui.gather.1":"{name} gathered. Herbalism Lv {herbLevel} — WIS is now {wis}.","ui.gather.2":"{name} — and a second stem hiding beneath it! Keen eye (WIS {wis}).","ui.gather.3":"{name} gathered · Herbalism Lv {herbLevel} · {flagCount} in satchel","ui.cast.0":"Cast… now wait for the bobber to dip.","ui.crust.0":"You take the crust — and the pinch of salt. For the Domovyk.","ui.offer.0":"You leave the crust behind the pich, quiet as you can. Something in the hut sighs — happily.","ui.gift.0":"A smooth river stone, warm as fresh bread. The Domovyk's thanks — CON +1 while you keep it.","ui.iron.0":"No way to haul a lump — your satchel load is {satchelWeight}/{carryCap} before iron, and a lump of bog iron weighs 3. Your STR {str} sets the limit. Cook, brew or eat something down first.","ui.iron.1":"You heave — the deepest lump does not budge, bedded in black mud. STR check failed (your STR {str}: it takes STR 3 to force it free, or luck on another heave). Nothing lost — try again.","ui.iron.2":"Bog iron — that's three lumps! Your arms are full: haul them to Radek at the forge.","ui.iron.3":"With a sucking pop, the deepest lump comes FREE! Bog iron ({n}/3 for Radek).","ui.iron.4":"Bog iron! A heavy, rust-dark lump ({n}/3 for Radek).","ui.wish.0":"Something glints on the well's rim — a lucky pebble. The well liked your wishing (CHA check passed). It puts spring in your hands (DEX +1).","ui.wish.1":"The well gives back only your face — no pebble this time. CHA check missed (your CHA {cha}); the well favours a warmer tongue. Meet more of Zalissya and wish again.","ui.cook.0":"The pot wants 1 fish and 1 herb from your satchel. The pond is west, the herbs glow in the grass.","ui.cook.1":"The pot wants a fish — cast a line from the pond's west shore first.","ui.cook.2":"The pot wants an herb — gather any glowing patch first (Kropyva, Polyn, Kalendula, Zvirobiy, Dereviy).","ui.cook.3":"Karas soup! Cooking Lv {craftLevel} — CON is now {con}. Eat it from your Character sheet.","ui.cook.4":"Karas soup, rich and steaming. · Cooking Lv {craftLevel} · {flagCount} meal(s) in satchel","ui.smith.0":"The forge is cold. It needs bog iron from the pond mud — three lumps for Radek — before anyone can work it.","ui.smith.1":"The iron needs a moment in the heat — and so does your arm. A breath, then hammer again.","ui.smith.2":"The hammer rings true! Smithing Lv {craftLevel} — STR is now {str}.","ui.smith.3":"A masterwork! Two fine pieces off one heat (STR {str}). · Smithing Lv {craftLevel}","ui.smith.4":"Clang… clang… a sound piece of ironwork. · Smithing Lv {craftLevel} · {flagCount} forged in satchel","ui.brew.0":"The cauldron wants 2 herbs from your satchel — you have {herbsIn}. The glowing patches provide.","ui.bloom.0":"Nichnyk gathered — that's three. Lay them on the offering stone, north of the bonfire.","ui.bloom.1":"Nichnyk gathered · night-blooms {n}/3 for the offering","ui.offering.0":"The offering stone wants 3 nichnyky — night-blooms from the slopes. You carry {have}. Motrya knows where they hide.","ui.offering.1":"You lay the nichnyky on the cold stone. One by one, they open — and the whole ring of standing stones seems to lean closer.","ui.dance.0":"The witches shake their heads — no dance before the offering. Three nichnyky on the stone, north of the fire, first.","ui.dance.1":"You step into the ring and keep the turn — the witches whoop, the devils stamp, and the fire dances with you. Now: Beelzebub is waiting.","ui.sleep.0":"Straw, a sheepskin, and the pich's warmth through the wall. {timeLabel}. How long will you lie down?","ui.sleep.morning.label.0":"Sleep until morning 🌅","ui.sleep.morning.aria.0":"Sleep until seven in the morning","ui.sleep.night.label.0":"Rest until nightfall 🌙","ui.sleep.night.aria.0":"Rest until nine in the evening","ui.sleep.cancel.label.0":"Not now","ui.sleep.cancel.aria.0":"Get up again","ui.frame.0":"Dawn over Zalissya. Last night's meal and tonics have worn off.","ui.frame.1":"“LIFT MY EYELIDS: I CANNOT SEE!” The servants strain at their forks. Look away before they open!","ui.frame.2":"You met his eyes! Nerve −{damage}.","ui.frame.3":"The lids fall again. You never looked.","ui.frame.4":"The trail climbs… and climbs… and the trees give up. Lysa Hora. The Bald Mountain. Something is dancing around a fire up there.","ui.frame.5":"Lysa Hora — the sabbath is still going.","ui.frame.6":"Down the trail, back under the trees — Zalissya, and honest daylight.","ui.frame.7":"It slipped away… the bobber settles. Cast again when ready.","ui.tagText.0":"Вій · Viy","ui.objective.0":"Hold the chalk circle until the rooster crows","ui.promptLabel.0":"Approach · Viy","ui.promptLabel.1":"Talk · {name}","ui.promptLabel.2":"Step inside 🚪","ui.promptLabel.3":"Step outside","ui.promptLabel.4":"Gather {herb} 🌿","ui.promptLabel.5":"Cast a line 🎣","ui.promptLabel.6":"REEL IN! 🎣","ui.promptLabel.7":"Take the crust 🍞","ui.promptLabel.8":"Leave the crust by the pich","ui.promptLabel.9":"Something glints by the door…","ui.promptLabel.10":"Dig bog iron","ui.promptLabel.11":"Cook karas soup 🍲","ui.promptLabel.12":"Work the forge 🔨","ui.promptLabel.13":"Brew — choose a recipe ⚗","ui.promptLabel.14":"Brew a tonic ⚗","ui.promptLabel.15":"Gather nichnyk 🌙","ui.promptLabel.16":"Lay the offering 🌙","ui.promptLabel.17":"Join the dance 💃","ui.promptLabel.18":"Lie down 🛏","ui.promptLabel.19":"Draw the chalk circle ◯","ui.promptLabel.20":"Make a wish ✨","ui.promptAria.0":"Approach Viy — carefully","ui.promptAria.1":"Talk to {name}","ui.promptAria.2":"Draw the chalk circle and begin Viy's vigil","ui.keepsakes.0":"✦ Keeper of the vigil (WIS +1, CHA +1)","ui.keepsakes.1":"◯ Blessed chalk","ui.keepsakes.2":"🌿 Vesna's wreath","ui.keepsakes.3":"⚒ Iron nails for the chalk","ui.keepsakes.4":"🌙 Moonstone (WIS +1, CHA +1)","ui.keepsakes.5":"🪙 Devil's gold (CHA +2)","ui.keepsakes.6":"🪨 Warm stone (CON +1)","ui.keepsakes.7":"✦ Horseshoe (STR +1)","ui.keepsakes.8":"✨ Lucky pebble (DEX +1)","ui.keepsakes.9":"🍞 Domovyk's crust","ui.skillRows.name.0":"Herbalism","ui.skillRows.stat.0":"WIS","ui.skillRows.name.1":"Fishing","ui.skillRows.stat.1":"DEX","ui.skillRows.name.2":"Cooking","ui.skillRows.stat.2":"CON","ui.skillRows.name.3":"Smithing","ui.skillRows.stat.3":"STR","ui.skillRows.name.4":"Alchemy","ui.
