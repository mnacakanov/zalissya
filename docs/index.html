lzebub"},{id:"chort",name:"Chort",pron:"chort",role:"Чорт · master of ceremonies tonight",x:770,y:330,tunic:"#7e2430",hair:"#2b2320",style:"chort"},{id:"solokha",name:"Solokha",pron:"so-lo-KHA",role:"Vidma · witch of Dikanka way",x:545,y:330,tunic:"#4a2c5a",hair:"#c8c2b8",style:"witch"},{id:"motrya",name:"Motrya",pron:"MO-trya",role:"Vidma · keeper of the night-blooms",x:520,y:480,tunic:"#2c4a5a",hair:"#3a2a1a",style:"witch"}],$2=[0,1,2,3].map((e)=>({id:`dancer${e}`,name:"Dancing witch",pron:"",role:"Of the sabbath",x:$e.x,y:$e.y,tunic:["#5a2c44","#2c3a5a","#5a442c","#3a5a2c"][e]??"#444",hair:["#d8d2c4","#2e2018","#8a4a2a","#555"][e]??"#333",style:"dancer"}));function Ar(e,t){if(e.id==="domovyk")return{x:e.x+Math.sin(t*0.00031)*22,y:e.y+Math.cos(t*0.00043)*6};if(e.id==="lisovyk")return{x:e.x+Math.sin(t*0.00011)*155,y:e.y+Math.sin(t*0.00023)*13};if(e.id==="chort")return{x:e.x+Math.sin(t*0.00019)*72,y:e.y+Math.cos(t*0.00029)*8};if(e.id==="bolotianyk")return{x:e.x,y:e.y+Math.sin(t*0.0009)*4};if(e.style==="dancer"){let a=Number(e.id.replace("dancer",""))||0,l=t*0.00042+a*Math.PI/2;return{x:$e.x+Math.cos(l)*92,y:$e.y+Math.sin(l)*62}}if(e.id==="solokha")return{x:e.x+Math.sin(t*0.00021)*16,y:e.y+Math.cos(t*0.00033)*5};return{x:e.x,y:e.y}}function N(e,t){return e.has(t)}function Z(e,t){for(let a of e)if(a.startsWith(`${t}=`)){let l=Number(a.slice(t.length+1));return Number.isFinite(l)?l:0}return 0}function ag(e,t,a,l,n=3,i=1){switch(e.id){case"myroslav":return["Well now — a new face in Zalissya. I am Myroslav, starosta of this village. You are welcome at our fire.","Mind the forest edge, traveller. The Lisovyk walks among the pines, and he does not love strangers who take without asking.","And be kind to the Domovyk in your hut — leave him bread by the pich, and he will keep your hearth warm through the winter.","You will find him by the north hut most days, fussing over the woodpile. Do not thank him aloud — house spirits hate fuss. There is a crust by the campfire, if you have a mind to leave it for him.","And one thing more, traveller, and hear me well: far off in the north-east hollow sleeps Vij — Вій — the biggest and worst of the old things. His eyelids hang down to the very ground. Look upon him if you must. Do NOT wake him.","Radek at the forge is a guest among us — a Pole from a village many days' road from here. Treat him kindly; a traveller under your roof is a gift.","Two more warnings, and then I will let you be. A Chort has taken to lounging by the old millstone south of the clearing — all bargains and grins. Whatever he offers, traveller, your soul is not spare change. And keep out of the pond reeds: the Bolotianyk has drowned better swimmers than you.","East of here a trail climbs out of the clearing to Lysa Hora — the Bald Mountain, bare as a skull. On sabbath nights the devils and vidmy gather there around a great fire, and the Chort plays host. It is not forbidden ground, traveller — but go polite, go with empty hands for no one, and do not eat what you are offered. Much.","One last thing, and it is the truest thing I know: in Zalissya a person becomes what they do. Gather, and your eye sharpens. Fish, and your hands quicken. Cook, smith, brew — the work makes the worker. Keep an eye on your Character — it is all written there, plain as a tally stick."];case"vesna":return t>=5?["Look at your basket — kropyva, polyn, kalendula, zvirobij, derevij! Your eye has grown keen, just as I promised.","Herbalism is not taught, it is gathered — one plant, one walk, one season at a time. You understand now.","Two crafts wait for hands like yours now. At the campfire hangs a pot: one pond fish and one herb from your satchel makes a proper karas soup — that is Cooking, and a fed traveller walks brisker. And by the north-east hut stands my drying rack: two herbs, worked patiently, become a tonic — that is Alchemy. Drink one and the world goes clear for a while.",...i>=3?["And look at you — bright as bottled morning. Your INT has reached 3, so the deep work is open to you now: at my rack you may choose Vesna's strong tonic — three herbs, and drunk it sharpens mind AND eye twice as deep as the common brew (INT +2, WIS +2). Some knowledge only trusts a ready mind, traveller. Yours is ready."]:[`One secret I keep for a readier mind: my strong tonic — a deeper draught, three herbs, worth INT +2 and WIS +2 to whoever drinks it. It unlocks at INT 3, and no sooner; a green mind would only waste good polyn. Your INT stands at ${i} today. Keep brewing the common tonic — every batch teaches, and the rack remembers.`],...l>0?["And the pond provides too, I see. Your satchel holds the makings of soup already, znak harka that you are becoming."]:["When the herbs rest, try the pond shore, west bank. A patient line catches more than karas — it catches quiet. And quiet is a remedy too."]]:["You have gentle hands. I am Vesna — I tend the sick of Zalissya, and the horod both.","See the glowing patches among the grass? Kropyva the nettle, bitter polyn, kalendula like little suns, zvirobij, and derevij. Gather any of them for me — every herb teaches your eye.","One caution, gentle hands: the yellow zvirobij hides from a green eye. Until your Wisdom reaches 2 it will not let itself be known or gathered — learn the other herbs first, and in time it will open to you.","Bring me five herbs in all, and I will know the forest has accepted you."];case"radek":{let o=Z(a,"iron");if(N(a,"horseshoe"))return["The forge sings again, thanks to your bog iron. Feel that heat? THAT is a kuznya.","That horseshoe I gave you — carry it, and not for luck alone: iron in the pocket puts strength in the arm. You will feel it. That is Smithing's first lesson, and it is free.","The anvil is yours to learn on now, traveller. Stand to it and work the forge — piece by piece, your Smithing grows, and with it your Strength. A strong arm now and then turns out a masterwork. When Vij's day comes, we will be glad of both."];if(o>=3)return["What is that weight in your arms — bog iron! Three good lumps, marsh-born and heavy. Traveller, you have just lit my forge.","Here — the first thing off the anvil is yours: a horseshoe, still warm. Carry it for luck. Iron remembers who fed the fire.","Now the kuznya stands ready. When the day comes that Vij stirs, traveller, there will be iron enough in Zalissya. See that you are here for it."];return["Radek. I shoe the horses and mend the ploughs of Zalissya — though I am only a guest here. Mind the anvil — she bites.","My home is a village many days' road from here, far to the west. I came with the spring to lend them my hammer — and the road home can wait until the work is done.",...o>0?[`Bog iron! You found a lump in the pond mud — good eye. ${3-o} more like that and this forge roars again.`]:["My kuznya stands cold until I get good iron from the marsh. Bog iron sleeps in the pond mud, traveller — dark lumps that glint where the shore is soft. Three good lumps would light my fire."],"If the Lisovyk troubles you, come to me. Iron has a way of settling arguments with the old things of the wood — in my country, and here too.","And if it is Vij you are asking after — aye, I have heard the tales. Lids so heavy they must be forked up by his servants. They say iron sings against such things. When that day comes, traveller, my forge had better be hot."]}case"domovyk":if(N(a,"stone"))return["Hmph. You again. …The bread was good. Crust crisp, salt enough. A hundred winters I have kept this hut, and kindness still surprises the pich out of me.","The stone I left you — keep it by your bed. It will be warm on the coldest night of the year. That is not a promise. That is a Domovyk, and we are better than promises.","Sleep well in Zalissya, little landlord. Your hearth is watched. Your soup is minded. Your mice — polite."];if(N(a,"offering"))return["…You came back. The crust is gone, did you notice? Behind the pich, nothing but crumbs and a warm smell. I said nothing. House spirits do NOT say thank you.","But check the doorstep of this hut when you leave, new one. Sometimes gratitude… falls out of our pockets. By accident. Mind you do not trip on it."];return["Hush, hush — soft feet by my hut. …Oh. It is the new one. I am Domovyk. I keep this house: the pich warm, the bread risen, the mice polite.","You left no bread yet. Hmm. New ones never do, the first night. Behind the pich, a crust, a little salt — that is all I ask, and I ask it every winter for a hundred years.","There is a crust by the village campfire, if your hands are empty and your heart is not. Bring it to my pich — the north hut, mind — and leave it quiet.","The Lisovyk thinks himself grand out there with his pines. Let him. Empires fall; a warm hearth does not.","…You smell of the north-east path. You have been near Vij. Do not go clattering about up there, little landlord. If those eyelids ever lift, no pich in Zalissya will keep out the cold that follows."];case"lisovyk":return["Stop there, two-legs. …You walk softly for one of the hut folk. I am Lisovyk. These pines are mine; the paths through them are mine; the lost are mine also.","Take your herbs — kropyva, polyn, the little suns — the forest gives to hands that ask. But take greedily, and the paths will turn, and turn, and you will greet your own footprints until dark.","Vesna's eye is on you. That is a good eye to be under. Mind it stays so.","You have seen him, then — Vij, in his hollow. Even I walk wide of that place, and I am the forest. Sleep is the only chain that holds him, traveller. See that you never file at it."];case"chort":{if(N(a,"soulback"))return["My favourite customer! Soul returned, gold kept, shadow reattached — you drive a harder bargain than half the sabbath host, and THEY have horns.","No hard feelings, traveller. A deal is a deal. …Though between us? I shall miss your shadow. It danced beautifully.","Speaking of dancing — you should see it dance on Lysa Hora. The Bald Mountain, east trail out of the clearing, bare rock and a great fire. Sabbath nights I host up there: witches, fiddles, Beelzebub himself presiding. Come as my guest. Guests who bring an offering and join the dance leave with more than they came with — that is a promise, not a bargain. Mostly."];if(N(a,"soulsold"))return["Ahh, my shadowless friend. Notice anything missing at noon? Look down. NOTHING. Beautiful, is it not? The gold, though — the gold is real. Spend it somewhere warm.","And when you tire of the village's little fires — Lysa Hora, traveller. The Bald Mountain, by the east trail. Sabbath nights the whole host dances there, and a guest of mine is a guest of Beelzebub. Shadow or no shadow.",...l>=n?[`Hm? What is that smell — pond water and karas? ${n===2?"TWO":"THREE"} fish, I count, without counting. …You know the price of a soul, traveller. Shall we settle accounts?`]:[`If you miss the little thing, I am not unreasonable: ${n} pond fish buys your soul back.${n===2?" Two, not three — that tongue of yours could talk a saint into a sabbath, and I am only a devil.":""} Devils love fish. Do not ask why. NOBODY knows why.`]];return["Psst. Psst! Over here, by the millstone. …What? A devil can't enjoy a sunny day? I am Chort, traveller — merchant, musician, and modest collector of… signatures.","In the old days we kept a fine sabbath up at the old mill — fiddles, dancing, the whole host! These nights we keep it grander: on Lysa Hora, the Bald Mountain — east trail out of the clearing, bare rock, a fire you can see from Zalissya. And SUCH weddings we used to crash. A Cossack's soul is a vintage thing, my friend. But business is business, and today I am buying.","So — a bargain, just between us. Your soul: slightly used, one careful owner. In exchange? Gold that never runs out. A horse that never tires. Vesna's heart, Radek's hammer, Myroslav's beard — name it! Sign here. And here. And in blood, here — kidding! Ink is fine. Mostly."]}case"bolotianyk":return["The reeds part. Two eyes rise out of the pond scum, then a head like a drowned log, green-grey and streaming. Bolotianyk looks at you the way deep water looks at a stone.","“Little dry one… my pond. My mud. My bells — the church bells that sank here before your village had a name. I ring them, sometimes, for the ones who waded too far.”","“The znak harka takes my polyn and leaves me be. Wise. You — take your herbs from the grass, dry one. What grows in MY water is not for your basket.”",...l>0?["“And yet you fish my pond, dry one, and I allow it. Your line is polite. Your shadow… hmm. Your shadow smells of the millstone devil lately. Curious.” Bolotianyk's eyes sink a little, watching."]:[],"“And tell the hut folk: Bolotianyk is patient. The pond was here before Zalissya. The pond — and what sleeps in the hollow — will be here after. Everything sinks to us, in the end.” The eyes slide back under, and the ripples close like nothing happened."];case"vij":return["The hollow is wrong-quiet. No birds. No insects. Only a sound like a mountain breathing — slow, wet, patient.","He is enormous. A head like a boulder, grey as old ash, and eyelids — eyelids that hang from his brow all the way down to the earth, veined and heavy as wet sailcloth. Two withered servants lean on the forks that would lift them. They do not look at you. They look at the lids.","Under one lid, something shifts. A seam of dull red light opens — just a seam — and every hair on your body stands. The servants freeze. The breathing stops.","…The seam closes. The breathing resumes. Whatever Vij dreams of, it is not you. Not yet. You back away very, very quietly, and the birds only start again when the village fire is in sight."];default:return["…"]}}function To(e,t){let a=Z(t,"lysaFlower"),l=N(t,"lysaOffering"),n=N(t,"lysaDanced"),i=N(t,"moonstone");switch(e.id){case"beelzebub":if(i)return["The great figure on the stone seat inclines his horned head — a small, terrible courtesy. “The mountain remembers its guests, little mortal. The stone at your heart remembers too. Go down warm.”","Below, the witches are still dancing. They will be dancing, one way or another, long after Zalissya is a story grandmothers tell. You walk down the trail with moonlight on your shoulders like a cloak someone lent you — and does not want back yet."];if(n)return["Beelzebub rises — slowly, the way weather rises. The fiddles falter. Every devil on the summit turns to look at you, and the fire leans in to listen.","“YOU BROUGHT THE MOUNTAIN ITS FLOWERS. YOU DANCED ITS DANCE. THE SABBATH DOES NOT LET SUCH A GUEST GO DOWN EMPTY.” He opens one vast hand. In it, small as a coin and bright as the moon's edge: a moonstone, cold and kind.","“TAKE IT. NOT A BARGAIN — A BLESSING. THERE IS A DIFFERENCE, AND TONIGHT YOU HAVE EARNED THE DIFFERENCE.” Somewhere below the summit, very faintly, a church bell that does not exist rings once — and the Bolotianyk answers it."];if(l)return["From his seat of black stone, Beelzebub regards you over the fire. His voice is not loud. It does not need to be; the mountain carries it the way it carries thunder.","“THE OFFERING IS LAID. GOOD. NOW — THE DANCE, LITTLE MORTAL. A GUEST WHO ONLY WATCHES IS ONLY HALF A GUEST. STEP INTO THE RING, SOUTH OF THE FIRE, AND KEEP THE TURN.” One clawed hand gestures at the circling witches, almost — almost — kindly."];return["You approach the stone seat at the summit's north edge, and the sabbath goes quiet around you — fiddles trailing off, witches pausing mid-turn, a hundred small devils suddenly very interested in their hooves.","Beelzebub is older than the mountain's baldness and dressed like the best funeral you have ever imagined. “A MORTAL. ON MY MOUNTAIN. WITHOUT AN OFFERING.” He says it the way a starosta notes a missing fence-post: not angry — recording.","“THE RULES ARE OLD, LITTLE MORTAL, AND EVEN I OBEY THEM. NICHNYKY GROW ON THESE SLOPES — NIGHT-BLOOMS, PALE AS BONE. BRING THREE TO THE OFFERING STONE. THEN WE SHALL SEE WHAT YOU ARE.”"];case"chort":if(i)return["You came, you offered, you danced, and Beelzebub HIMSELF blessed you. Do you know what that does to my reputation? NOTHING. It was already magnificent.","Wear the moonstone well, traveller. And if anyone in Zalissya asks where you got it — a devil's guest-price. Let them chew on that."];if(n)return["You DANCED! Did everyone see? The mortal danced and the mountain did not even crack! Now — up to the big chair with you. Beelzebub has a blessing with your name scratched on it, and he scratches DEEP."];if(l)return["The offering is laid and the stone is HAPPY — stones are never happy, that is how good it was. Now the dance, traveller! South of the fire, into the ring, keep the turn. Even I cannot waltz a guest's place for them — I checked. Twice. There were… incidents."];if(a>=3)return["Nichnyky! Three pale beauties, and not a petal bruised — you handle night-flowers like a vidma born. The offering stone waits, north of the fire. Lay them down gentle. The mountain notices gentle."];return["MY GUEST ARRIVES! Welcome to Lysa Hora, traveller — the Bald Mountain, my office, my ballroom, my cathedral! Beelzebub presides, the vidmy dance, and the fire — the fire is older than your village and twice as honest.","House rules, and they are Beelzebub's, so they are carved deeper than stone: a guest brings the mountain an offering. Nichnyky — night-blooms — open on these slopes, pale little moons in the rock. Gather three, lay them on the offering stone north of the fire, and the sabbath is yours. Dance with us after, and who knows what blessings fall off the big chair.","And no signatures tonight! Sabbath rules. Even I keep ONE night a week honest. …Mostly."];case"solokha":if(i)return["Solokha curtseys — a witch's curtsey, which involves more of the sky than seems necessary. “Blessed by the big one himself. Walk down proud, ditko. And if Vesna asks after me — tell her the mountain keeps her sister well.”","She presses nothing into your hand, asks for nothing. From a witch of Lysa Hora, that is the rarest gift of all."];if(n)return["You dance like a mortal who intends to survive it — clever feet! Up with you to Beelzebub now, before the fire burns lower. A blessing given at high fire is a blessing that keeps."];if(l)return["The stone took your flowers kindly — I felt it through my shoes. Now dance, ditko. The ring is south of the fire. Do not count the steps; counting is how mortals fall out of the music."];if(a>=3)return["Three nichnyky, and picked at the bloom's first breath — Vesna taught you well, whoever you are. The offering stone, north of the fire. Lay them down and bow to no one; the mountain is not a priest. It is a host."];return["Well — a face from under the roofs! I am Solokha, vidma, widow, and the best cook on this mountain, whatever the devils say with their mouths full. You climb well for a lowlander.","You want the sabbath's welcome? Then do it properly, ditko. Nichnyky — night-blooms — open on the bare slopes, pale as little moons. Three of them on the offering stone, north of the fire. That is the mountain's price, and it is fairer than any devil's.","And afterwards — dance. A guest who will not dance is a guest the mountain forgets. And you do not want to be forgotten by a mountain. It has a long memory and no manners at all."];case"motrya":if(i)return["Motrya touches two fingers to the moonstone's light and smiles with all her teeth. “It suits you. Moonlight usually does, on the ones the mountain chooses. Come back when it fades, ditko — mountains renew.”"];if(n)return["Motrya is still turning in the ring's echo, humming. “You kept the turn. The big chair noticed. Go and be blessed, dancer — I shall keep your place warm in the circle.”"];if(l)return["Motrya nods at the offering stone, where your nichnyky glow faintly. “Laid true. Now the dance — south of the fire, ditko, and do not think about your feet. Feet hate being thought about.”"];return["A small witch with a voice like a nightjar looks up from braiding night-blooms into her hair. “Motrya. I keep the nichnyky of Lysa Hora — which is to say, I know where they hide and I am not too proud to say.”","“The slopes, ditko. Where the rock is baldest and the moonlight pools — that is where they open. Three for the offering stone. Pick them gentle: a night-bloom bruised is a promise bruised, and this mountain counts promises.”",...a>0&&a<3?[`“${a} already in your hand, I see — the mountain counts those too. ${3-a} more, ditko.”`]:[]];default:return["…"]}}function O(e,...t){return t.map((a)=>e[a]).filter((a)=>typeof a==="string"&&a.length>0)}function ev(e,t,a,l,n,i,o){let s=ag(e,t,a,l,n,i);switch(e.id){case"myroslav":return{intro:o?O(s,0):["Back again, traveller? Zalissya keeps, mostly. Ask what you will."],topics:[{id:"forest",label:"The forest & the Lisovyk",question:"What walks in the forest?",lines:O(s,1)},{id:"domovyk",label:"The Domovyk & the bread",question:"Tell me of the house spirit.",lines:O(s,2,3)},{id:"vij",label:"Vij",question:"Who is Vij?",lines:O(s,4)},{id:"radek",label:"Radek the smith",question:"Who is the smith?",lines:O(s,5)},{id:"dark",label:"The Chort & the pond",question:"What should I fear here?",lines:O(s,6)},{id:"lysa",label:"Lysa Hora",question:"What is Lysa Hora?",lines:O(s,7)},{id:"growth",label:"How a person grows here",question:"How does one become someone in Zalissya?",lines:O(s,8)}]};case"vesna":{let r=i>=3?"And the deep work is open to you: my strong tonic — three herbs, and drunk it sharpens mind AND eye twice as deep as the common brew (INT +2, WIS +2). Your INT has reached 3, znak harka. The rack will offer it.":`One secret I keep for a readier mind: my strong tonic — three herbs, worth INT +2 and WIS +2 to whoever drinks it. It unlocks at INT 3; yours stands at ${i}. Keep brewing the common tonic — the rack remembers every batch.`;return{intro:o?O(s,0):[t>=5?"Your basket smells of the whole meadow. Ask, znak harka — I keep few secrets from keen hands.":"Gentle hands. What would you know?"],topics:[{id:"herbs",label:"The five herbs",question:"Teach me the herbs.",lines:O(s,1)},{id:"zvirobij",label:"Zvirobij, the shy herb",question:"Why does zvirobij hide from me?",lines:t>=5?["Zvirobij hides from no one in this village now — your eye knows it, stem and yellow star. Wisdom opened that door, and doors opened by doing stay open."]:O(s,2)},{id:"cooking",label:"Cooking at the campfire",question:"What can I cook?",lines:t>=5?O(s,2):["At the campfire hangs a pot, and it is not decoration: one pond fish and one herb from your satchel makes a proper karas soup. That is Cooking — and a fed traveller walks brisker. Eat it from your Character sheet."]},{id:"alchemy",label:"Alchemy & the strong tonic",question:"Teach me alchemy.",lines:t>=5?O(s,2,3):["By the north-east hut stands my drying rack: two herbs, worked patiently, become a tonic — that is Alchemy. Drink one and the world goes clear for a while.",r]},{id:"pond",label:"The pond & fishing",question:"What of the pond?",lines:t>=5?O(s,4):["When the herbs rest, try the pond shore, west bank. A patient line catches more than karas — it catches quiet. And quiet is a remedy too. Mind the Bolotianyk, though: it is his water first."]},{id:"errand",label:"What you ask of me",question:"What do you need?",lines:t>=5?["Nothing today, keen one. The forest has accepted you — now Zalissya asks only that you keep being what you do."]:O(s,3)}]}}case"radek":{let c=N(a,"horseshoe");return{intro:o?O(s,0):[c?"Mind the sparks, traveller. Ask away.":"Aye? Mind the anvil — she bites. Ask."],topics:c?[{id:"forge",label:"The lit forge",question:"How does the forge fare?",lines:O(s,0)},{id:"horseshoe",label:"The horseshoe you gave me",question:"Why a horseshoe?",lines:O(s,1)},{id:"smithing",label:"Learning smithing",question:"Teach me the anvil.",lines:O(s,2)},{id:"home",label:"Your home in the west",question:"Where are you from, Radek?",lines:["My home is a village many days' road from here, far to the west. I came with the spring to lend them my hammer — and the road home can wait until the work is done."]}]:[{id:"home",label:"Your home in the west",question:"Where are you from, Radek?",lines:O(s,1)},{id:"iron",label:"Bog iron for the forge",question:"What does your forge need?",lines:O(s,2)},{id:"lisovyk",label:"Iron & the Lisovyk",question:"Can iron settle the Lisovyk?",lines:O(s,3)},{id:"vij",label:"Vij & iron",question:"Would iron serve against Vij?",lines:O(s,4)}]}}case"domovyk":{let r=N(a,"stone"),c=N(a,"offering");return{intro:o?O(s,0):[r?"Hmph. You again. …Sit a moment, then. Ask — quietly.":"Soft feet, new one. Ask, then — quietly."],topics:[{id:"bread",label:"The bread",question:"What do you want of me?",lines:r?O(s,0):c?O(s,0,1):O(s,1,2)},{id:"hearth",label:r?"The warm stone":"Your hut & the pich",question:r?"Tell me of the stone.":"Tell me of this hut.",lines:r?O(s,1,2):c?["A hundred winters I have kept this hut: the pich warm, the bread risen, the mice polite. It is not grand work. It is the work that lets all other work happen."]:O(s,0)},{id:"lisovyk",label:"The Lisovyk",question:"What of the forest spirit?",lines:r||c?["The Lisovyk thinks himself grand out there with his pines. Let him. Empires fall; a warm hearth does not."]:O(s,3)},{id:"vij",label:"Vij",question:"What of Vij?",lines:r||c?["…You smell of the north-east path. You have been near Vij. Do not go clattering about up there, little landlord. If those eyelids ever lift, no pich in Zalissya will keep out the cold that follows."]:O(s,4)}]}}case"lisovyk":return{intro:o?O(s,0):["You again, two-legs. You walk softer than most. Ask."],topics:[{id:"rules",label:"The forest's rules",question:"What are your rules?",lines:O(s,1)},{id:"vesna",label:"Vesna's eye",question:"What of Vesna?",lines:O(s,2)},{id:"vij",label:"Vij",question:"What of Vij?",lines:O(s,3)},{id:"domovyk",label:"The Domovyk",question:"What of the house spirit?",lines:["The Domovyk? A crumb-god in a warm box, fed on crusts and courtesy. Let him keep his pich — I keep the world that grows the wood for it. We do not quarrel. Much."]},{id:"lost",label:"Getting lost",question:"What happens to the lost?",lines:["The lost are mine also — I said it when we met, and it is no threat. Walk out greedy or loud, and the paths turn, and turn, and you greet your own footprints until dark. Walk soft, take only what is given, and the pines lean apart like polite neighbours."]}]};case"chort":{if(N(a,"soulback"))return{intro:o?O(s,0):["My favourite customer returns! Ask away — no pens in sight. Promise."],topics:[{id:"settled",label:"Our bargain, settled",question:"No hard feelings?",lines:O(s,0,1)},{id:"lysa",label:"Lysa Hora & the sabbath",question:"Tell me of the sabbath.",lines:O(s,2)},{id:"mill",label:"The old mill sabbaths",question:"What happened at the old mill?",lines:["In the old days we kept a fine sabbath up at the old mill — fiddles, dancing, the whole host, and Beelzebub himself presiding! Weddings we crashed by the dozen. A Cossack's soul is a vintage thing, my friend. These nights we keep it grander on Lysa Hora — but I keep a soft spot for a millstone."]}]};if(N(a,"soulsold"))return{intro:o?O(s,0):["My shadowless friend returns! Ask — everything is negotiable. Almost everything."],topics:[{id:"soul",label:"My soul — the price",question:"What will my soul cost me?",lines:O(s,2)},{id:"gold",label:"The gold & my shadow",question:"Was the bargain fair?",lines:O(s,0)},{id:"lysa",label:"Lysa Hora",question:"Tell me of the mountain.",lines:O(s,1)}]};return{intro:o?O(s,0):["Psst. Back again, traveller? Ask — I know things. Some of them are even true."],topics:[{id:"who",label:"Who are you?",question:"What are you, exactly?",lines:O(s,0)},{id:"mill",label:"The mill & the sabbath",question:"What is this sabbath you speak of?",lines:O(s,1)},{id:"vij",label:"Vij",question:"What do devils fear?",lines:["Vij? …Even I lower my voice, traveller. A devil deals in souls; Vij deals in endings. If those lids ever lift, my whole sabbath dances attendance — from very, very far away."]},...N(a,"soulkept")?[{id:"refused",label:"Your bargain — refused",question:"Any regrets, devil?",lines:["Regrets? ME? Hah! You refused like a starosta, traveller — I told you, the last one who refused me became one. The offer stands closed, and a devil keeps his word: no pen, no pitch. But when Vij stirs and you need a friend with a pitchfork — you know where the millstone is. My prices only go UP."]}]:[{id:"bargain",label:"Your bargain ✒",question:"What are you offering?",lines:O(s,2),action:"bargain"}]]}}case"bolotianyk":return{intro:o?O(s,0):["The eyes rise again from the pond scum. “Dry one. Ask, then. The pond has time.”"],topics:[{id:"bells",label:"The drowned bells",question:"What bells ring under the pond?",lines:O(s,1)},{id:"water",label:"What grows in your water",question:"May I take what grows here?",lines:O(s,2)},{id:"fishing",label:"Fishing your pond",question:"Do you mind my line?",lines:l>0?O(s,3):["“You have not troubled my water with a line yet, dry one. Fish if you must — from the west shore, politely, and take only what the pond gives up. What it keeps, it keeps.”"]},{id:"old",label:"Vij & the old things",question:"What is oldest here?",lines:O(s,l>0?4:3)}]};default:return null}}function tv(e,t,a){let l=To(e,t),n=Z(t,"lysaFlower"),i=N(t,"lysaOffering"),o=N(t,"lysaDanced"),s=N(t,"moonstone");switch(e.id){case"beelzebub":{let r={id:"vij",label:"Vij",question:"What does the mountain fear?",lines:["“VIJ. YES. EVEN THE MOUNTAIN HAS A NEIGHBOUR IT DOES NOT VISIT. HIS LIDS HANG TO THE GROUND, AND UNDER THEM — AN ENDING. LET HIM SLEEP, LITTLE MORTAL. SOME GUESTS EVEN I WILL NOT RECEIVE.”"]},c={id:"court",label:"Your court",question:"Who gathers here?",lines:["“MY COURT: WITCHES WHO OUTLIVED THEIR VILLAGES, DEVILS WHO OUTGREW THEIR MILLS, AND ONE MORTAL WHO CAME POLITE. THE FIRE IS OLDER THAN ZALISSYA. THE DANCING IS OLDER THAN THE FIRE.”"]};if(s)return{intro:a?O(l,0):["“THE MOUNTAIN'S GUEST RETURNS. ASK, LITTLE MORTAL.”"],topics:[{id:"moonstone",label:"The Moonstone",question:"What did you give me?",lines:O(l,0)},{id:"leaving",label:"Going down the mountain",question:"May I go in peace?",lines:O(l,1)},r,c]};if(o)return{intro:a?O(l,0):["“YOU DANCED, LITTLE MORTAL. THERE IS A BLESSING WITH YOUR NAME SCRATCHED ON IT. ASK, AND IT IS YOURS.”"],topics:[{id:"blessing",label:"Receive the blessing ✦",question:"I offered, and I danced. I have come for the blessing.",lines:[],action:"blessing"},{id:"rules",label:"The mountain's rules",question:"What are the rules here?",lines:["“THE OFFERING IS LAID. THE DANCE IS DANCED. WHAT REMAINS IS MINE TO GIVE. THOSE WERE ALWAYS THE RULES, AND EVEN I OBEY THEM.”"]},r,c]};if(i)return{intro:a?O(l,0):["“THE STONE REMEMBERS YOUR FLOWERS. ASK, LITTLE MORTAL.”"],topics:[{id:"dance",label:"The dance",question:"What must I do now?",lines:O(l,0,1)},{id:"offering",label:"The offering",question:"Was my offering worthy?",lines:["“IT WAS LAID TRUE, AND THE STONE REMEMBERS. NOW SHOW THE MOUNTAIN YOUR FEET, LITTLE MORTAL.”"]},r,c]};return{intro:a?O(l,0):["“ASK, LITTLE MORTAL. THE MOUNTAIN ANSWERS WHAT IT CHOOSES.”"],topics:[{id:"rules",label:"The rules & the nichnyky",question:"What does the mountain ask of a guest?",lines:O(l,1,2)},{id:"who",label:"Who are you?",question:"Who presides here?",lines:O(l,0)},r,c]}}case"chort":{let r=To(e,new Set),c={id:"rules",label:"House rules",question:"What are the house rules?",lines:O(r,1)},y={id:"beelzebub",label:"Beelzebub",question:"What is he like?",lines:["The big chair? Beelzebub is the sabbath the way the starosta is the village — except his beard is older, his memory is longer, and his blessings are REAL. When you have danced, go and collect yours."]};if(s)return{intro:a?O(l,0):["My guest returns! Ask — house rules still apply: no signatures, all gossip."],topics:[{id:"blessing",label:"Beelzebub's blessing",question:"Did he really bless me?",lines:O(l,0)},{id:"telling",label:"Telling Zalissya",question:"What do I tell the village?",lines:O(l,1)},c]};if(o)return{intro:a?O(l,0):["My guest returns! Ask — house rules still apply: no signatures, all gossip."],topics:[{id:"dance",label:"The dance",question:"How did I dance?",lines:O(l,0)},y,c]};if(i)return{intro:a?O(l,0):["My guest returns! Ask — house rules still apply: no signatures, all gossip."],topics:[{id:"dance",label:"The dance",question:"What now?",lines:O(l,0)},y,c]};if(n>=3)return{intro:a?O(l,0):["My guest returns! Ask — house rules still apply: no signatures, all gossip."],topics:[{id:"offering",label:"The offering stone",question:"What do I do with the nichnyky?",lines:O(l,0)},{id:"dance",label:"The dance",question:"Tell me of the dance.",lines:["The dance comes after the offering, traveller — ring south of the fire, keep the turn, do not count the steps. Even I cannot waltz a guest's place for them. I checked. Twice. There were incidents."]},c]};return{intro:a?O(l,0):["My guest returns! Ask — house rules still apply: no signatures, all gossip."],topics:[{id:"welcome",label:"This place",question:"What is this place?",lines:O(l,0)},c,{id:"nosign",label:"No signatures?",question:"No bargains tonight?",lines:O(l,2)}]}}case"solokha":return{intro:a?O(l,0):["Back again, ditko? Ask — a witch's ears are her fortune."],topics:[{id:"vesna",label:"Vesna — your sister?",question:"You know Vesna?",lines:s?O(l,0):["“Vesna? My little sister keeps the village's bodies — broth, bandages, babies. I keep its secrets. Between us, Zalissya is entirely kept. Do not tell her I said 'little'.”"]},{id:"offering",label:"The offering",question:"How does the offering go?",lines:s||o?["Laid true and danced after, ditko — the mountain could not ask more of a guest. It will remember you kindly, which for a mountain is a great deal of remembering."]:i?O(l,0):n>=3?O(l,0):O(l,1)},{id:"dance",label:"The dance",question:"Tell me of the dance.",lines:s?["You kept the turn like you were born in the ring, ditko. The witches still talk about your feet — witches' praise, which is rarer than their curses and twice as binding."]:o?O(l,0):i?O(l,0):O(l,2)},{id:"cooking",label:"Cooking on the mountain",question:"Are you really the mountain's best cook?",lines:["“The best cook on this mountain, whatever the devils say with their mouths full. My secret? Never cook for anyone you would not also curse. It concentrates the seasoning.”"]}]};case"motrya":{let r=To(e,new Set),c=O(r,1);if(n>0&&n<3)c.push(`“${n} already in your hand, I see — the mountain counts those too. ${3-n} more, ditko.”`);return{intro:a?O(l,0):["Motrya looks up from her braiding. “Ask, ditko. The blooms keep.”"],topics:[{id:"nichnyky",label:"Where nichnyky hide",question:"Where do the night-blooms grow?",lines:c},{id:"offering",label:"The offering stone",question:"Tell me of the offering stone.",lines:i?O(l,0):["“The offering stone stands north of the fire. Three nichnyky, laid gentle, and the mountain leans closer — I have felt it through my shoes, every sabbath of my life.”"]},{id:"dance",label:"The dance",question:"How does one dance here?",lines:o||i?O(l,0):["“South of the fire, ditko, and do not think about your feet. Feet hate being thought about. First the offering, though — the ring keeps no step for the empty-handed.”"]},{id:"moonstone",label:"The Moonstone",question:"What is the Moonstone?",lines:s?O(l,0):["“When the big chair blesses a guest, it is with a moonstone — cold as well-water, kind as moonlight. Offer, dance, and ask him, ditko. In that order; mountains are particular about order.”"]}]}}default:return null}}var av=["The moonstone settles into your palm, cold as well-water and twice as clear. Somewhere inside it, a crescent turns — slowly, patiently — to face you.","Around the bonfire the witches raise their arms, the devils stamp their hooves, and Beelzebub himself inclines his horned head. The sabbath has a new story to tell about a mortal who came polite, offered fairly, and danced.","You wear Lysa Hora's blessing now. The night road down to Zalissya will be shorter than the road up. It always is, for the blessed — that is rather the point of blessings."],lv=["Signed! SIGNED! Oh, traveller — you have made a devil's whole century. Here: your gold. Feel how it never gets lighter? That is the good stuff. That is the SABBATH stuff.","And no take-backs… well. One take-back, because I LIKE you: pond fish buys your soul back any time — the price is in your Character sheet, under Charisma. Devils and fish, traveller. Do not ask. Now — notice anything missing when you walk in the sun? Look down. Heh. HEH."],nv=["…No? NO? Hah! Hahaha! Oh, I LIKE you. The last one who refused me became a starosta; the one before — a very surprised frog. Keep your soul then, traveller. But when Vij stirs and you need a friend with a pitchfork — you know where the millstone is. My prices only go UP."],iv=["Pond fish, still shining. …A deal is a deal, traveller. Here — one soul, slightly haunted, returns to its owner. And keep the gold. A devil's gold spends the same, and I am not a CHEAT.","There. Feel that? Warmth. Weight. A shadow pooling at your feet like it never left. Pleasure doing business. Tell NO ONE I went soft."],ov={id:"well",name:"The Old Well",pron:"",role:"Drop a pebble, make a wish",x:840,y:496,tunic:"#5d6b72",hair:"#8d8b85",style:"elder"},sv={id:"brewbench",name:"Vesna's drying rack",pron:"",role:"Alchemy bench · choose a brew",x:$n.x,y:$n.y,tunic:"#4c6b35",hair:"#5d3a1a",style:"herbalist"},rv=["The rack smells of polyn and sun, and the little cauldron is already warm. Two brews are within your craft: the common tonic (2 herbs — bright and clarifying), and Vesna's strong tonic (3 herbs — the deep draught she teaches only at INT 3; drunk, it is worth INT +2 and WIS +2). The cauldron waits. Which do you work?"],lh=[0,3,7,12,18,25,34];function Xn(e){let t=1;for(let a=0;a<lh.length;a++)if(e>=(lh[a]??0))t=a+1;return t}var nh=[0,2,5,9,14,20];function Jn(e){let t=1;for(let a=0;a<nh.length;a++)if(e>=(nh[a]??0))t=a+1;return t}va
