lotianyk lives there, and he doesn't listen to kobzars — he collects them.","line.myroslav.7":"Take the trail east — Lysa Hora. On sabbath nights the devils and witches carouse so loud they hear it in Kyiv. Going isn't forbidden. But bring a gift, know the hopak, and don't drink what they pour. Well — maybe a little.","line.myroslav.8":"And remember, kobzar: here a man becomes what he does. Pick herbs and your eye sharpens. Catch fish and your hands quicken. Sing by the fire in the evening and people warm to you. It's all written in the Character sheet.","line.vesna.0":"Oh, look in your basket: kropyva, polyn, kalendula, zvirobiy, dereviy! You'll make a herbalist yet.","line.vesna.1":"You don't learn herbs from a book. You gather them — a stem at a time, a morning at a time.","line.vesna.2":"Your hands are good for more now. There's a cauldron over the fire: a fish and a herb make kulish, and a fed Cossack walks brisker. In my yard, by my hut, stands my drying rack: two herbs make a tonic that clears the whole world.","line.vesna.3":"Your head's clear now — INT 3. Then take my strong tonic: three herbs, and mind and eye are twice as sharp (INT +2, WIS +2).","line.vesna.4":"I have a strong tonic too, three herbs' worth. But only for a clear head — INT 3. Yours is {intTotal}. Brew the common one — the rack remembers every batch.","line.vesna.5":"And fish in the satchel too. Well, kobzar, you're nearly a proper householder.","line.vesna.6":"When the herbs are resting, take a line to the west shore. Fish like the patient. So do I.","line.vesna.7":"A kobzar? Good. I'm Vesna, the znakharka. I heal people, cattle, and when needed — the otaman's hangovers.","line.vesna.8":"See the glow in the grass? Kropyva, polyn, kalendula, zvirobiy, dereviy. Pick them for me, and you'll get a herbalist's eye.","line.vesna.9":"But zvirobiy hides from a green eye. Until your Wisdom reaches 2, you won't know it even if you trip over it.","line.vesna.10":"Bring me five herbs, and I'll know the forest has taken to you.","line.radek.0":"Słyszysz? The forge is singing! Your bog iron, kobzar. Now that's a forge, a nie a shed.","line.radek.1":"Keep that horseshoe on you. Not for luck — for the arm: iron in the pocket, strength in the palm. First lesson of smithing. Free, because I'm in a good mood.","line.radek.2":"The anvil's yours. Hammer and your arm grows stronger. Strong enough, and you'll turn out a masterwork. My lord used to say a Pole with skilled hands was a sin. Let him look now.","line.radek.3":"Jezus Maria, three lumps of bog iron! Kobzar, you've just lit my forge.","line.radek.4":"Here — the first thing off the anvil: a horseshoe, still hot. Iron remembers who fed the fire.","line.radek.5":"Now Zalissya will have iron. And when that Viy of yours stirs, we'll have something to greet him with.","line.radek.6":"Radek. I shoe horses, mend ploughs, and suffer the otaman's jokes. Careful with the anvil — she bites.","line.radek.7":"Where from? Near Lublin. My lord wanted me forging shackles for his own people. I thought it over — and forged myself a road east. Here a Pole is an enemy, but a smith is a friend. I choose to be a smith.","line.radek.8":"Bog iron! Good eye. {n} more and this forge roars again.","line.radek.9":"The forge is cold, psiakrew. I need bog iron — it sleeps in the pond mud, dark lumps glinting where the bank is soft. Three lumps, and there'll be fire.","line.radek.10":"The Lisovyk bothering you? Come to me. Cold iron keeps conversations with forest lords short. Back near Lublin and here alike.","line.radek.11":"I've heard of Viy. Eyelids so heavy his servants lift them with pitchforks. They say iron sings against such things. When that day comes, let my forge already be hot.","line.domovyk.0":"Hmph. You again. …The bread was good. Crisp crust, salt just right. A hundred winters I've lived here, and decency still surprises me.","line.domovyk.1":"The stone I left — keep it by your pillow. On the bitterest night it'll be warm. That's not a promise. That's a Domovyk. We're better than promises.","line.domovyk.2":"Sleep, kobzar. The pich is warm, the mice are polite, your kobza won't go out of tune. I'm watching.","line.domovyk.3":"…The crust's gone, did you notice? Only crumbs behind the pich. I'm saying nothing. Domovyky don't say thank you.","line.domovyk.4":"But look by the pich when you've a moment. Sometimes gratitude falls out of our pockets. By accident.","line.domovyk.5":"Shh! Who's stomping? …Ah, the kobzar. The otaman said. I'm the Domovyk. This is my hut, my pich, and my mice. You're a lodger. Behave.","line.domovyk.6":"No bread yet. Well, well. New ones always forget the first night. Then they wonder why their boots are in the pich.","line.domovyk.7":"There's a crust by the campfire. Bring it here, to the pich, and set it down quietly. No songs. Not yet, anyway.","line.domovyk.8":"The Lisovyk out there plays the grand lord with his pines. Let him. Kingdoms fall; a pich stands.","line.domovyk.9":"…You smell of the hollow. You've been to Viy. Don't go stomping about up there. If those lids lift, no pich in Zalissya will keep anyone warm.","line.lisovyk.0":"Stop, two-legs. …You walk quietly, for a singer. I'm the Lisovyk. The pines are mine. The paths are mine. The lost are mine too.","line.lisovyk.1":"Take your herbs: kropyva, polyn, those little suns. The forest gives to those who ask. The greedy ones it walks in circles until they start greeting their own footprints.","line.lisovyk.2":"Vesna has her eye on you. That's a good eye to be under. Don't spoil it.","line.lisovyk.3":"You've seen him, then. Viy. Even I go round that hollow, and I am the forest. Only sleep holds him. Don't file at that chain.","line.chort.0":"My very favourite customer! Bought back the soul, kept the gold, sewed the shadow back on — you haggle better than half of hell, and they have horns!","line.chort.1":"No hard feelings, kobzar. A deal's a deal. Though… I miss your shadow. It used to dance so nicely to the kobza.","line.chort.2":"Speaking of dancing. There's a sabbath on Lysa Hora that makes the roofs in Dykanka jump! Trail to the east. Come with a gift and a hopak, and you'll leave with more than you brought. That's a promise, not a bargain. Mostly.","line.chort.3":"Ah, my shadowless friend! Noon, and nothing at your feet. Beautiful! But the gold is real. Drink it away in some warm tavern.","line.chort.4":"And when the khutir bores you — Lysa Hora, east trail. My guest is Beelzebub's own guest. Shadow or no shadow.","line.chort.5":"Hey, what's that smell? Pond and karas! TWO fish, I count without counting. Well, kobzar, shall we settle accounts?","line.chort.7":" Two, not three — with a tongue like yours you could out-sing a devil. And I, incidentally, am one.","line.chort.6":"Miss the little thing? I'm not a beast: {price} pond fish and your soul's yours again.{n} Devils love fish. Don't ask. NOBODY knows why.","line.chort.8":"Psst! Over here, kobzar, by the millstone! What, a devil can't warm himself in the sun? I'm the Chort: merchant, musician, and modest collector of… signatures.","line.chort.9":"Back in the day we threw such sabbaths at the old mill — fiddles, hopak, Cossack weddings turned inside out! A Cossack soul, kobzar, is wine, not kvass. These days we carouse on Lysa Hora. And today I'm buying.","line.chort.10":"So, the bargain. Your soul — slightly worn, one careful owner. In return: gold that never runs out. A horse that never tires. A kobza that plays by itself while you sleep! Sign here. And here. And in blood, here — kidding! Ink will do. Mostly.","line.bolotianyk.0":"The reeds part. Eyes rise out of the duckweed, then a head like a drowned log, water pouring off it. The Bolotianyk looks at you the way deep water looks at a stone.","line.bolotianyk.1":"“Dry-foot… My pond. My mud. My bells — church bells, sunk before your khutir existed. I ring them. For those who wade too far.”","line.bolotianyk.2":"“The znakharka takes my polyn and goes no further. Wise. You — pick your herbs on dry land. What grows in MY water is not for your basket.”","line.bolotianyk.3":"“And yet you fish my pond, and I allow it. Your line is polite. But your shadow… your shadow smells of that devil by the millstone.” The eyes sink lower. Watching.","line.bolotianyk.4":"“Tell the villagers: the Bolotianyk is patient. The pond was here before the khutir. The pond — and the one asleep in the hollow — will be here after. Everything sinks to us, in the end.” The ripples close as if nothing happened.","line.viy.0":"The hollow is wrong-quiet. Not a bird, not a cricket. Only a sound like a mountain breathing — slow, wet, patient.","line.viy.1":"He is enormous. A head like a stone from a burial mound, grey as old ash. Eyelids hang to the ground, heavy as a wet sail. Two withered servants lean on pitchforks. They don't look at you. They look at the lids.","line.viy.2":"Under one lid, something shifts. A seam of dull red light opens — only a seam — and every hair on you stands up. The servants freeze. The breathing stops.","line.viy.3":"…The seam closes. The breathing returns. Whatever Viy dreams, it isn't you. Not yet. You back away very, very quietly, and the birds sing again only once the campfire is in sight.","line.beelzebub.0":"Beelzebub inclines his horned head — a small, terrible courtesy. “THE MOUNTAIN REMEMBERS ITS GUESTS, KOBZAR. GO DOWN WARM.”","line.beelzebub.1":"Below, the witches are still dancing. They'll be dancing when Zalissya is a grandmother's tale. You walk down the trail with moonlight on your shoulders like a borrowed sheepskin.","line.beelzebub.2":"Beelzebub rises — slowly, the way a storm rolls in. The fiddles falter. Every devil on the summit turns to you, and the fire leans in to listen.","line.beelzebub.3":"“YOU BROUGHT THE MOUNTAIN FLOWERS. YOU PLAYED IT THE HOPAK. THE SABBATH DOES NOT SEND SUCH A GUEST AWAY EMPTY-HANDED.” He opens a palm. On it — a moonstone, cold and kind.","line.beelzebub.4":"“TAKE IT. NOT A BARGAIN — A BLESSING. THEY ARE DIFFERENT THINGS, AND TONIGHT YOU HAVE EARNED THE DIFFERENCE.” Somewhere below the mountain a bell that doesn't exist rings once — and the Bolotianyk answers.","line.beelzebub.5":"From his throne of black stone Beelzebub regards you over the fire. His voice isn't loud. The mountain carries it like thunder.","line.beelzebub.6":"“THE GIFT IS LAID. GOOD. NOW THE HOPAK, KOBZAR. A GUEST WHO ONLY WATCHES IS HALF A GUEST. PLAY IN THE RING SOUTH OF THE FIRE.”","line.beelzebub.7":"You approach the throne and the sabbath goes quiet: fiddles stop, witches freeze mid-turn, a hundred imps suddenly find their hooves fascinating.","line.beelzebub.8":"Beelzebub is older than this mountain's baldness and dressed like the finest funeral. “A KOBZAR. ON MY MOUNTAIN. WITHOUT A GIFT.” He says it the way an otaman notes a stolen fence-post: not angry — taking note.","line.beelzebub.9":"“THE LAWS ARE OLD, AND I OBEY THEM. NICHNYKY BLOOM ON THE SLOPES, PALE AS BONE. THREE ON THE OFFERING STONE. THEN WE SHALL SEE WHAT SORT OF SINGER YOU ARE.”","line.chort.11":"You came, you gave, you played — and Beelzebub himself blessed you! Know what that does for my reputation? Nothing. It was already magnificent.","line.chort.12":"Wear the stone well. And if they ask in Zalissya where you got it — say a devil gave it. Let the otaman choke on his pipe.","line.chort.13":"You PLAYED! Did everyone see? A kobzar played the hopak and the mountain didn't even crack! Now off to the big chair — a blessing's waiting for you.","line.chort.14":"The gift is laid and the stone is happy — and stones are never happy, that's how well it went! Now the hopak, kobzar! Into the ring south of the fire. The witches are already stamping their hooves… their feet, I mean.","line.chort.15":"Nichnyky! Three pale beauties, not a petal bruised. Take them to the offering stone, north of the fire. The mountain likes gentle.","line.chort.16":"MY GUEST! Welcome to Lysa Hora — my office, my tavern, my ballroom! Beelzebub presides, witches dance, and the fire is older than your khutir and twice as honest.","line.chort.17":"The rules here are Beelzebub's, so they're carved in stone: a guest brings the mountain a gift. Nichnyky bloom on the slopes — three for the offering stone. Then — the hopak. A kobzar without a hopak at a sabbath is like a Cossack without a moustache.","line.chort.18":"And no signatures tonight! Sabbath rules. Even I am honest once a week. …Mostly.","line.solokha.0":"Solokha curtseys — a witch's curtsey, with more sky in it than necessary. “Blessed by the big one himself! Walk proud, little kobzar. And tell Vesna the mountain is keeping her sister well.”","line.solokha.1":"She presses nothing into your hand and asks for nothing. From a witch of Lysa Hora, that's the rarest gift of all.","line.solokha.2":"Oh, how you played! My skirt went dancing on its own. Run to Beelzebub while the fire's high: a blessing given at high fire keeps longer.","line.solokha.3":"The stone took your flowers — I felt it through my shoes. Now the hopak, little kobzar! The ring's south of the fire. And don't count the beats — counting is how mortals fall out of the music.","line.solokha.4":"Three nichnyky, picked at the bloom's first breath — Vesna taught you well. The offering stone is north of the fire. No need to bow: the mountain isn't a priest, it's a hostess.","line.solokha.5":"Oh, look — a kobzar! I'm Solokha: witch, widow, and the best cook on this mountain, whatever the devils say with their mouths full.","line.solokha.6":"Want the sabbath to take you in? Then do it properly. Nichnyky bloom on the bare slopes, pale as little moons. Three on the offering stone, north of the fire. That's the mountain's price, and it's fairer than any devil's.","line.solokha.7":"And after — the hopak! A guest who won't play or dance, the mountain forgets. And its memory is long, and its manners non-existent.","line.motrya.0":"Motrya touches two fingers to the stone's glow and grins with every tooth. “It suits you. Come back when it fades, little kobzar — mountains renew.”","line.motrya.1":"Motrya is still spinning in the hopak's echo, humming. “You kept the beat. The big chair noticed. Go get your blessing.”","line.motrya.2":"Motrya nods at the offering stone where your nichnyky faintly glow. “Laid right. Now the hopak — south of the fire. And don't think about your fingers: fingers hate being thought about.”","line.motrya.3":"A small witch with a nightjar's voice looks up from a wreath of night-blooms. “Motrya. I know where the nichnyky hide. And I'm not too proud to say.”","line.motrya.4":"“On the slopes, little kobzar. Where the rock is baldest and the moonlight gathers in puddles. Three for the stone. Pick them gently: a bruised night-bloom is a bruised promise, and this mountain counts promises.”","line.motrya.5":"“{flowers} in hand already. The mountain counts that too. {n} more, little kobzar.”","topic.myroslav.0":"Ah, the kobzar. Sit. I've a pipe, no tobacco, and conversation's free.","topic.myroslav.forest.label.0":"The forest & the Lisovyk","topic.myroslav.forest.question.0":"Who walks the forest?","topic.myroslav.domovyk.label.0":"The Domovyk & the bread","topic.myroslav.domovyk.question.0":"What do I do about the Domovyk?","topic.myroslav.viy.label.0":"Viy","topic.myroslav.viy.question.0":"Who is Viy?","topic.myroslav.radek.label.0":"The Polish smith","topic.myroslav.radek.question.0":"Why is there a Pole here?","topic.myroslav.dark.label.0":"The Chort & the pond","topic.myroslav.dark.question.0":"What should I fear here?","topic.myroslav.lysa.label.0":"Lysa Hora","topic.myroslav.lysa.question.0":"What's Lysa Hora?","topic.myroslav.growth.label.0":"How one becomes someone","topic.myroslav.growth.question.0":"How does one become one of you?","topic.vesna.0":"Your head is clear — take the strong tonic: three herbs, INT +2 and WIS +2. The rack will offer it.","topic.vesna.1":"The strong tonic is for a clear head, INT 3. Yours is {intTotal}. Brew the common one for now — the rack remembers every one.","topic.vesna.2":"You smell like a whole meadow. Ask, herbalist.","topic.vesna.3":"Well, kobzar — something hurt, or just curious?","topic.vesna.herbs.label.0":"The five herbs","topic.vesna.herbs.question.0":"Teach me the herbs.","topic.vesna.zvirobiy.label.0":"Zvirobiy","topic.vesna.zvirobiy.question.0":"Why does zvirobiy hide from me?","topic.vesna.zvirobiy.0":"It doesn't hide any more. Your eye knows it — stem and yellow star. Doors opened by doing stay open.","topic.vesna.cooking.label.0":"Kulish","topic.vesna.cooking.question.0":"What can I cook?","topic.vesna.cooking.0":"There's a cauldron over the fire. A fish and a herb from your satchel make kulish, Sich-style. A fed man walks brisker. Eat it in the Character sheet.","topic.vesna.alchemy.label.0":"Tonics","topic.vesna.alchemy.question.0":"Teach me tonics.","topic.vesna.alchemy.0":"My drying rack stands in my yard, by my hut. Two herbs, some patience — a tonic. Drink it and the world clears.","topic.vesna.pond.label.0":"The pond","topic.vesna.pond.question.0":"And the pond?","topic.vesna.pond.0":"The west shore is for fishing. A patient line catches karas and quiet both. Just don't annoy the Bolotianyk: it's his water.","topic.vesna.errand.label.0":"How can I help","topic.vesna.errand.question.0":"Do you need anything?","topic.vesna.errand.0":"No, kobzar. The forest has taken you in. Now just sing to us in the evenings — that's all we need.","topic.radek.0":"Near Lublin. My lord wanted shackles, I wanted freedom. We couldn't agree on a price.","topic.radek.1":"Mind the sparks, kobzar. Ask.","topic.radek.2":"No? Careful with the anvil — she bites. Ask.","topic.radek.forge.label.0":"The forge is lit","topic.radek.forge.question.0":"How's the forge?","topic.radek.horseshoe.label.0":"The horseshoe","topic.radek.horseshoe.question.0":"Why a horseshoe?","topic.radek.smithing.label.0":"Smithing","topic.radek.smithing.question.0":"Teach me the anvil.","topic.radek.home.label.0":"Where you're from","topic.radek.home.question.0":"How does a Pole end up among Cossacks?","topic.radek.home.label.1":"Where you're from","topic.radek.home.question.1":"How does a Pole end up among Cossacks?","topic.radek.iron.label.0":"Bog iron","topic.radek.iron.question.0":"What does the forge need?","topic.radek.lisovyk.label.0":"Iron & the Lisovyk","topic.radek.lisovyk.question.0":"Will iron settle the Lisovyk?","topic.radek.viy.label.0":"Iron & Viy","topic.radek.viy.question.0":"Will iron work against Viy?","topic.domovyk.0":"Hmph. You again. Fine, sit. Ask — quietly.","topic.domovyk.1":"Quieter, lodger. Ask.","topic.domovyk.bread.label.0":"The bread","topic.domovyk.bread.question.0":"What do you want from me?","topic.domovyk.hearth.0":"The warm stone","topic.domovyk.hearth.1":"The hut & the pich","topic.domovyk.hearth.2":"Tell me about the stone.","topic.domovyk.hearth.3":"Tell me about this hut.","topic.domovyk.hearth.4":"A hundred winters here: pich warm, bread risen, mice polite. Not grand work. But no other work happens without it.","topic.domovyk.lisovyk.label.0":"The Lisovyk","topic.domovyk.lisovyk.question.0":"And the Lisovyk?","topic.domovyk.lisovyk.0":"A show-off with pinecones. Let him be. Kingdoms fall; a pich stands.","topic.domovyk.viy.label.0":"Viy","topic.domovyk.viy.question.0":"And Viy?","topic.domovyk.viy.0":"You smell of the hollow. Don't go stomping about up there. If those lids lift, no pich will keep anyone warm.","topic.lisovyk.0":"You again, singer. You walk quietly. Ask.","topic.lisovyk.rules.label.0":"The forest's laws","topic.lisovyk.rules.question.0":"What are the forest's laws?","topic.lisovyk.vesna.label.0":"Vesna","topic.lisovyk.vesna.question.0":"And Vesna?","topic.lisovyk.viy.label.0":"Viy","topic.lisovyk.viy.question.0":"And Viy?","topic.lisovyk.domovyk.label.0":"The Domovyk","topic.lisovyk.domovyk.question.0":"And the Domovyk?","topic.lisovyk.domovyk.0":"A crumb-god in a warm box. Let him guard his pich — I guard the world that grows its firewood. We don't quarrel. Much.","topic.lisovyk.lost.label.0":"The lost","topic.lisovyk.lost.question.0":"What happens to the lost?","topic.lisovyk.lost.0":"Walk greedy or loud, and the paths turn until you're greeting your own footprints at nightfall. Walk soft, and the pines step aside like polite neighbours. Sing well, and sometimes I sing along. Did you hear the wind?","topic.chort.0":"My very favourite customer! Ask — no pen on me. Devil's honour.","topic.chort.settled.label.0":"Our bargain","topic.chort.settled.question.0":"No hard feelings?","topic.chort.lysa.label.0":"The sabbath","topic.chort.lysa.question.0":"Tell me about the sabbath.","topic.chort.mill.label.0":"The old mill","topic.chort.mill.question.0":"What went on at the old mill?","topic.chort.mill.0":"Oh-ho! Fiddles, hopak, Cossack weddings turned inside out, Beelzebub himself at the head of the table! Now we carouse on Lysa Hora, but I've a soft spot for the millstone. I bought my first soul here. A Zaporozhian's. He won it back at cards, the rascal.","topic.chort.1":"My shadowless friend! Ask — everything's negotiable. Almost everything.","topic.chort.soul.label.0":"The price of my soul","topic.chort.soul.question.0":"What does my soul cost back?","topic.chort.gold.label.0":"The gold & my shadow","topic.chort.gold.question.0":"Was it a fair deal?","topic.chort.lysa.label.1":"Lysa Hora","topic.chort.lysa.question.1":"Tell me about the mountain.","topic.chort.2":"Psst. You again? Ask — I know all sorts. Some of it's even true.","topic.chort.who.label.0":"Who are you?","topic.chort.who.question.0":"What exactly are you?","topic.chort.mill.label.1":"The sabbath","topic.chort.mill.question.1":"What sabbath?","topic.chort.viy.label.0":"What devils fear","topic.chort.viy.question.0":"Do devils fear anything?","topic.chort.viy.0":"Viy. …See, even I lower my voice. A devil deals in souls. Viy deals in endings. If those lids lift, my whole sabbath will dance for his pleasure — from very, very far away.","topic.chort.refused.label.0":"Your refusal","topic.chort.refused.question.0":"Any regrets, devil?","topic.chort.refused.0":"Me? Regret? Ha! The last man who refused me became an otaman. The offer's closed; a devil keeps his word. But when Viy stirs and you need a friend with a pitchfork — you know where the millstone is. My prices only go up.","topic.chort.bargain.label.0":"The bargain ✒","topic.chort.bargain.question.0":"What are you offering?","topic.bolotianyk.0":"The eyes rise again from the duckweed. “Dry-foot. Ask. The pond has time.”","topic.bolotianyk.bells.label.0":"The drowned bells","topic.bolotianyk.bells.question.0":"What bells are under the water?","topic.bolotianyk.water.label.0":"What grows in the water","topic.bolotianyk.water.question.0":"May I take what grows here?","topic.bolotianyk.fishing.label.0":"Fishing","topic.bolotianyk.fishing.question.0":"Do you mind my line?","topic.bolotianyk.fishing.0":"“You haven't troubled my water yet. Fish if you must — from the west shore, politely. Take what the pond gives. What it keeps, it keeps.”","topic.bolotianyk.old.label.0":"The oldest things","topic.bolotianyk.old.question.0":"What's oldest here?","topic.beelzebub.viy.label.0":"Viy","topic.beelzebub.viy.question.0":"What does the mountain fear?","topic.beelzebub.viy.0":"“VIY. YES. EVEN THE MOUNTAIN HAS A NEIGHBOUR IT DOES NOT VISIT. UNDER HIS LIDS — AN ENDING. LET HIM SLEEP. SOME GUESTS EVEN I DO NOT RECEIVE.”","topic.beelzebub.court.label.0":"Your court","topic.beelzebub.court.question.0":"Who gathers here?","topic.beelzebub.court.0":"“WITCHES WHO OUTLIVED THEIR VILLAGES. DEVILS WHO OUTGREW THEIR MILLS. AND ONE KOBZAR WHO CAME POLITELY. THE FIRE IS OLDER THAN THE SICH. THE DANCE IS OLDER THAN THE FIRE.”","topic.beelzebub.0":"“THE MOUNTAIN'S GUEST RETURNS. ASK, KOBZAR.”","topic.beelzebub.moonstone.label.0":"The Moonstone","topic.beelzebub.moonstone.question.0":"What did you give me?","topic.beelzebub.leaving.label.0":"Going down","topic.beelzebub.leaving.question.0":"May I go in peace?","topic.beelzebub.1":"“YOU PLAYED, KOBZAR. THERE IS A BLESSING WITH YOUR NAME ON IT. ASK, AND IT IS YOURS.”","topic.beelzebub.blessing.label.0":"Receive the blessing ✦","topic.beelzebub.blessing.question.0":"I brought the gift and played the hopak. I've come for the blessing.","topic.beelzebub.rules.label.0":"The mountain's laws","topic.beelzebub.rules.question.0":"What are the laws here?","topic.beelzebub.rules.0":"“THE GIFT IS LAID. THE HOPAK IS PLAYED. THE REST IS MINE TO GIVE. SUCH ARE THE LAWS, AND I OBEY THEM.”","topic.beelzebub.2":"“THE STONE REMEMBERS YOUR FLOWERS. ASK.”","topic.beelzebub.dance.label.0":"The hopak","topic.beelzebub.dance.question.0":"What now?","topic.beelzebub.offering.label.0":"The gift","topic.beelzebub.offering.question.0":"Was my gift worthy?","topic.beelzebub.offering.0":"“LAID RIGHT, AND THE STONE REMEMBERS. NOW SHOW THE MOUNTAIN YOUR KOBZA.”","topic.beelzebub.3":"“ASK, KOBZAR. THE MOUNTAIN ANSWERS WHAT IT CHOOSES.”","topic.beelzebub.rules.label.1":"The laws & the nichnyky","topic.beelzebub.rules.question.1":"What does the mountain ask of a guest?","topic.beelzebub.who.label.0":"Who are you?","topic.beelzebub.who.question.0":"Who presides here?","topic.chort.rules.label.0":"House rules","topic.chort.rules.question.0":"What are the rules here?","topic.chort.beelzebub.label.0":"Beelzebub","topic.chort.beelzebub.question.0":"What's he like?","topic.chort.beelzebub.0":"The big chair? Beelzebub is to the sabbath what the otaman is to the khutir. Only his beard is older, his memory longer, and his blessings REAL. Once you've played — go collect yours.","topic.chort.3":"My guest! Ask — same rules: no signatures, plenty of gossip.","topic.chort.blessing.label.0":"The blessing","topic.chort.blessing.question.0":"Did he really bless me?","topic.chort.telling.label.0":"What to tell Zalissya","topic.chort.telling.question.0":"What do I tell the khutir?","topic.chort.4":"My guest! Ask — same rules: no signatures, plenty of gossip.","topic.chort.dance.label.0":"The hopak","topic.chort.dance.question.0":"How did I play?","topic.chort.5":"My guest! Ask — same rules: no signatures, plenty of gossip.","topic.chort.dance.label.1":"The hopak","topic.chort.dance.question.1":"What now?","topic.chort.6":"My guest! Ask — same rules: no signatures, plenty of gossip.","topic.chort.offering.label.0":"The offering stone","topic.chort.offering.question.0":"Where do the nichnyky go?","topic.chort.dance.label.2":"The hopak","topic.chort.dance.question.2":"Tell me about the hopak.","topic.chort.dance.0":"First the gift, kobzar, then the hopak — in the ring south of the fire. And play so the witches forget they're old. I tried playing in a guest's place once — not allowed. Tried twice. There were… consequences.","topic.chort.7":"My guest! Ask — same rules: no signatures, plenty of gossip.","topic.chort.welcome.label.0":"This place","topic.chort.welcome.question.0":"What is this place?","topic.chort.nosign.label.0":"No signatures?","topic.chort.nosign.question.0":"No bargains tonight?","topic.solokha.0":"You again, little kobzar? Ask — a witch's ears hear everything.","topic.solokha.vesna.label.0":"Vesna — your sister?","topic.solokha.vesna.question.0":"You know Vesna?","topic.solokha.vesna.0":"“Vesna's my little sister. She tends the khutir's bodies, I tend its secrets. Between the two of us Zalissya is fully looked after. Just don't tell her I said ‘little’.”","topic.solokha.offering.label.0":"The gift","topic.solokha.offering.question.0":"How's the gift going?","topic.solokha.offering.0":"Laid right, played well — the mountain asks no more of a guest. It'll remember you kindly, and for a mountain that's a great deal of remembering.","topic.solokha.dance.label.0":"The hopak","topic.solokha.dance.question.0":"How did I play?","topic.solokha.dance.0":"You played so well old Patsiuk from Dykanka would've left his dumplings! The witches still talk about your fingers — and a witch's praise is rarer than her curses.","topic.solokha.cooking.label.0":"Cooking","topic.solokha.cooking.question.0":"Are you really the mountain's best cook?","topic.solokha.cooking.0":"“The best, whatever the devils say with their mouths full. My secret? Never cook for anyone you couldn't also curse. Thickens the seasoning.”","topic.motrya.0":"“{flowers} in hand already. The mountain counts that too. {n} more, little kobzar.”","topic.motrya.1":"Motrya looks up from her wreath. “Ask, little kobzar. The flowers can wait.”","topic.motrya.nichnyky.label.0":"Where the nichnyky are","topic.motrya.nichnyky.question.0":"Where do the night-blooms grow?","topic.motrya.offering.label.0":"The offering stone","topic.motrya.offering.question.0":"Tell me about the offering stone.","topic.motrya.offering.0":"“North of the fire. Three nichnyky, laid gently, and the mountain leans closer. I feel it through my shoes every sabbath.”","topic.motrya.dance.label.0":"The hopak","topic.motrya.dance.question.0":"How does one dance here?","topic.motrya.dance.0":"“To the hopak, and only the hopak. Play in the ring south of the fire. But the gift first: the ring doesn't wait for empty hands.”","topic.motrya.moonstone.label.0":"The Moonstone","topic.motrya.moonstone.question.0":"What's the Moonstone?","topic.motrya.moonstone.0":"“When the big chair blesses a guest, it's with a moonstone: cold as a well, kind as the moon. Gift, hopak, then ask. In that order: mountains are fussy about order.”","topic.LYSA_BLESSING_LINES.0":"The moonstone settles in your palm — cold as well-water and twice as clear. Inside, a crescent turns — slowly, patiently — to face you.","topic.LYSA_BLESSING_LINES.1":"The witches raise their arms, the devils stamp their hooves, and Beelzebub bows his horned head. The sabbath has a new tale: of a kobzar who came politely, gave honestly, and played so the mountain danced.","topic.LYSA_BLESSING_LINES.2":"The road down to Zalissya will be shorter than the road up. It always is, for the blessed — that's rather the point.","topic.CHORT_SIGNED_LINES.0":"Signed! SIGNED! Oh, kobzar, you've made my century. Here's your gold. Feel how it never gets lighter? That's the good stuff. That's SABBATH stuff.","topic.CHORT_SIGNED_LINES.1":"As for returns… well, one, because I like you: pond fish buys your soul back any time. The price is in the Character sheet, under Charisma. Now look down at your feet in the sun. Heh. HEH.","topic.CHORT_REFUSED_LINES.0":"…No? NO? Ha-ha! Oh, I like you. The last man who refused me became an otaman; the one before that, a very surprised frog. Keep your soul, kobzar. And when Viy stirs — you know where the millstone is.","topic.CHORT_TRADE_LINES.0":"Fish, still shining. …A deal's a deal. Here — one soul, slightly haunted, returns to its owner. Keep the gold. Devil's gold spends just the same, and I'm no CHEAT.","topic.CHORT_TRADE_LINES.1":"There. Feel it? Warmth. Weight. A shadow pooling at your feet as if it never left. Pleasure doing business. Tell no one I went soft.","topic.well.name.0":"The old well","topic.well.role.0":"Drop a pebble, make a wish","topic.brewbench.name.0":"Vesna's drying rack","topic.brewbench.role.0":"Where tonics are brewed","topic.BREW_CHOICE_LINES.0":"The rack smells of polyn and sun, the little cauldron is already warm. Two brews are within your craft: the common tonic (2 herbs) and Vesna's strong tonic (3 herbs; INT +2 and WIS +2). Which will it be?","viy.myroslav.vigil-after.label.0":"The night you held ✦","viy.myroslav.vigil-after.question.0":"Is it really over?","viy.myroslav.vigil-after.0":"Over. The rooster crowed, the lids fell, and the hollow's just a grassy pit now. My grandfather would have stood you a whole barrel of horilka for this, kobzar.","viy.myroslav.vigil-after.1":"No barrel. But a khutir that sleeps easy. And a duma some other kobzar will one day make about you. Stay as long as you like — you're no guest here any more.","viy.myroslav.oldway.label.0":"Viy stirs — the old way","viy.myroslav.oldway.question.0":"Viy stirs in his sleep. How was he held before?","viy.myroslav.oldway.0":"You saw the red seam? My grandfather saw it too. He said Viy wakes once every few generations, and someone must sit up with him one night until the cockcrow. Then he sleeps again. For a long time.","viy.myroslav.oldway.1":"Back then a seminarian sat up. Read prayers all night in a chalk circle. You're a kobzar. You'll sing a duma. A duma, son, is the same as a prayer — just a Cossack one.","viy.myroslav.oldway.2":"Now the most important part. When he shouts “LIFT MY EYELIDS” — don't look. Whatever you hear, whoever calls. Whoever meets Viy's eyes doesn't come home.","viy.myroslav.oldway.3":"Here's the chalk, blessed, from the church chest. And a duma — “The Black Sea Storm”, I learned it from my grandfather. Vesna knows a wreath against his gaze, and Radek's iron burns the unclean. Ask them. Then pick your night.","viy.myroslav.vigil.label.0":"The vigil","viy.myroslav.vigil.question.0":"Remind me how it goes.","viy.myroslav.vigil.0":"After nine in the evening, a chalk circle by the hollow. Sing your duma — the unclean shy from it. When the lids rise, turn away and don't look until they fall. Until the rooster crows.","viy.myroslav.vigil.1":"You've tried {broken}× and come back on your own feet each time. That's more than the seminarian managed. Eat, sleep — and again. A sturdier body (Constitution) holds more fear.","viy.myroslav.vigil.3":"And eat first. An empty belly is half of fear. So my granny said, and she buried three husbands without being scared of one.","viy.vesna.vigil-after.label.0":"After the vigil","viy.vesna.vigil-after.question.0":"Did the wreath help?","viy.vesna.vigil-after.0":"It helped. But you held. A wreath only dulls what you had the nerve to turn from. The meadow's lighter since that night, and so is my sleep.","viy.vesna.wreath.label.0":"A wreath against his eyes","viy.vesna.wreath.question.0":"The otaman says you know a wreath against Viy's gaze.","viy.vesna.wreath.0":"I do. Polyn — the unclean can't stand bitterness. Zvirobiy — it holds the sun. And dereviy to bind them. Give me three herbs.","viy.vesna.wreath.1":"There. Wear it low on your brow. His gaze will tangle in the leaves before it reaches you — it'll take only half. Half, herbalist. Still don't look.","viy.vesna.wreath.2":"I do: polyn, zvirobiy, dereviy, woven tight. It catches half of Viy's gaze.","viy.vesna.wreath.3":"But you need to know zvirobiy, and your eye isn't ready (WIS {wis}, needs {WREATH_WIS}). Pick the other herbs — the eye grows with gathering.","viy.vesna.wreath.4":"Bring {WREATH_HERBS} herbs — you have {herbStock}. The glowing patches will provide.","viy.radek.vigil-after.label.0":"After the vigil","viy.radek.vigil-after.question.0":"Did the iron sing?","viy.radek.vigil-after.0":"Sing? It SCREAMED, they say! Good iron. And a good arm that forged it. Back near Lublin they'd carve your name over the smithy. Here I'll make you a horseshoe with your initial.","viy.radek.ironward.label.0":"Iron for the vigil","viy.radek.ironward.question.0":"Will iron help against Viy's host?","viy.radek.ironward.0":"And how! The unclean can't stand cold iron. Give me a piece you forged yourself. I'll draw three nails from it — drive them into the chalk circle.","viy.radek.ironward.1":"Here. The first three to touch your circle will burn like straw. After that — your duma and your nerve, kobzar.","viy.radek.ironward.2":"It will. Bring a piece you forged yourself on my anvil, and you'll have nails. Go and work.","viy.radek.ironward.3":"It will, but the forge is cold, psiakrew. First bog iron from the mud, then a piece by your own hand.","viy.domovyk.vigil-after.label.0":"After the vigil","viy.domovyk.vigil-after.question.0":"Did you hear the rooster?","viy.domovyk.vigil-after.0":"Hear him? I fed that rooster a crust myself! The whole hut sighed. Sleep in my bed as long as you like. I'll even stop hiding your boots. Almost.","viy.domovyk.vigil.label.0":"The vigil","viy.domovyk.vigil.question.0":"Any advice for the night?","viy.domovyk.vigil.0":"Sleep first. Lie in my bed — I'll wake you at dusk. And DON'T LOOK. I've seen what happens to those who looked. I don't want to sweep it up.","viy.lisovyk.vigil-after.label.0":"After the vigil","viy.lisovyk.vigil-after.question.0":"The forest is quieter.","viy.lisovyk.vigil-after.0":"Quieter? The forest is LISTENING. A hundred winters it hasn't heard that hollow empty. Now there are birds. Maybe I'll lay the paths straight for you. Sometimes.","viy.lisovyk.vigil.label.0":"The vigil","viy.lisovyk.vigil.question.0":"Will the forest help me?","viy.lisovyk.vigil.0":"The forest doesn't help — it watches. But here's a forest thing: the host comes from every side at once. The wise one lets them close and drives them all back with one line of the duma. Don't waste words on a single shadow.","viy.chort.vigil-after.label.0":"After the vigil","viy.chort.vigil-after.question.0":"Were you watching?","viy.chort.vigil-after.0":"Watching? I had a SEAT! Front row, on the millstone. The way that host screeched on Radek's iron — music! And when the rooster crowed… let's say I left early. Business.","viy.chort.vigil.label.0":"The vigil","viy.chort.vigil.question.0":"Will you help with Viy?","viy.chort.vigil.0":"I'm a devil, not an otaman! …But I'll tell you for free, though it hurts: the lids rise SLOWLY. While they rise — sing, drive them back. Turn away at the last moment. Tell no one I was useful.","viy.bolotianyk.vigil-after.label.0":"After the vigil","viy.bolotianyk.vigil-after.question.0":"Did the pond feel it?","viy.bolotianyk.vigil-after.0":"“The pond felt him SINK, dry-foot. Deep, past my bells, past the bottom of everything. He won't rise through my water. For the first time, I'm glad of a guest.”","viy.bolotianyk.vigil.label.0":"The vigil","viy.bolotianyk.vigil.question.0":"What do you know about Viy's host?","viy.bolotianyk.vigil.0":"“While the lids are rising, the host crawls. When the lids are OPEN, even the host goes still: it fears what's under them. And bring iron. They hate iron.”","viy.viyNarration.0":"By day the hollow only breathes. The servants doze on their pitchforks. Nothing will happen here before dark. Come back after nine in the evening — or sleep in the Domovyk's bed until dusk.","viy.viyNarration.1":"At night the hollow breathes louder. The servants are awake, whispering to the lids. The red seam is wider than before.","viy.viyNarration.2":"One doesn't come here empty-handed. The otaman is old enough to remember how it was done. Ask him.","viy.VIGIL_INTRO_LINES.0":"You kneel and draw the chalk circle — one unbroken line. The servants fall silent. Somewhere in the dark, something laughs. Then many somethings.","viy.VIGIL_INTRO_LINES.1":"You take up the kobza. Remember: the DUMA drives the host back from the chalk. When Viy shouts for his lids, they rise slowly. Turn away before they open, and DON'T LOOK until they fall. Until the cockcrow.","viy.VIGIL_WON_LINES.0":"Far off in Zalissya a rooster crows. Once. Twice. The host shrieks and scatters like ash in the wind.","viy.VIGIL_WON_LINES.1":"The servants drop their pitchforks. The lids fall like a door slamming under the earth. Then the hollow sinks: head, lids, servants — all beneath the roots. The grass closes over.","viy.VIGIL_WON_LINES.2":"Pink light over the pines. You're still in the circle, the strings still humming. You never looked. ✦","viy.VIGIL_BROKEN_LINES.0":"Your nerve breaks. You're out of the circle and running, the kobza clutched to your chest. Branches, the fence, the Domovyk's door…","viy.VIGIL_BROKEN_LINES.1":"You wake in the morning in his bed, boots off, tucked in to the chin. The chalk is in your pocket. Viy sleeps. The night can be tried again.","ui.bed.name.0":"The Domovyk's bed","ui.bed.role.0":"Straw, a sheepskin, and the pich's warmth","ui.vigil.name.0":"The vigil","ui.vigil.role.0":"Viy's hollow · one night","ui.enterHut.0":"You duck under the lintel. Warmth from the pich, a smell of bread and smoke. Something behind the pich is snuffling.","ui.enterHut.1":"Vesna's hut: bundles of herbs under the ceiling, and something green breathing in the cauldron. Better not to ask what.","ui.enterHut.2":"The passage smells of tar, sauerkraut and authority. Left is the pich; right is the best room, where the otaman receives people. Whoever comes to confess wipes his feet twice.","ui.exitHut.0":"Back outside.","ui.chortChoice.0":"Signed. The gold is heavy — and where did your shadow go?","ui.eatMeal.0":"Hot kulish with fish. Even the moustache you don't have twitches with pleasure. CON +1 while well fed.","ui.drinkTonic.0":"Bitter, bright, clear. INT +1 and WIS +1 until dawn.","ui.drinkStrongTonic.0":"Dark and thick as Kupala night. INT +2 and WIS +2 until dawn.","ui.sleepUntil.0":"{msg} Yesterday's kulish and tonics have worn off.","ui.pickOption.0":"You sleep like a log and wake to the roosters.","ui.pickOption.1":"You doze the day away. Something small tugs your sleeve: dusk. The Domovyk kept his word.","ui.applyGrant.0":"Blessed chalk and the storm duma. Now Viy can be faced after dark.","ui.applyGrant.1":"Vesna's wreath of polyn and zvirobiy. Viy's gaze will take only half.","ui.applyGrant.2":"Three iron nails for the chalk. The first three of the host will burn.","ui.endVigil.0":"Viy is under the earth. You held the night: WIS +1, CHA +1 ✦","ui.carryBlockedToast.0":"Too heavy: carrying {carriedWeight}/{carryCap}, need {addWeight} more. Your STR {str} sets the limit — smithing raises it. Cook, eat, or hand the iron to Radek.","ui.performBrew.0":"The strong tonic wants 3 herbs — you have {herbsIn}.","ui.performBrew.1":"The cauldron wants 2 herbs — you have {herbsIn}.","ui.performBrew.2":"The strong tonic settles, dark as a well at night! Alchemy {craftLevel} — INT is now {int}. Drink it in the Character sheet.","ui.performBrew.3":"The tonic clears like morning in a bottle! Alchemy {craftLevel} — INT is now {int}. Drink it in the Character sheet.","ui.performBrew.4":"Two bottles of the strong one from one pot — a clear head wastes nothing (INT {intNow}). · Alchemy {craftLevel}","ui.performBrew.5":"Two bottles from one pot — a clear head wastes nothing (INT {intNow}). · Alchemy {craftLevel}","ui.performBrew.6":"Vesna's strong tonic. · Alchemy {craftLevel} · in satchel: {stock}","ui.performBrew.7":"A tonic, bitter and bright. · Alchemy {craftLevel} · in satchel: {stock}","ui.doInteract.0":"The Moonstone of Lysa Hora is yours. WIS +1, CHA +1. 🌙","ui.doInteract.1":"A boot. The left one. The pond gives back what it's given.","ui.doInteract.2":"Catch: {fish} — and it slips back! No room: carrying {carriedWeight}/{carryCap}. Your STR {str} sets the limit.","ui.doInteract.3":"Catch: {caught}! Fishing {fishLevel} — DEX is now {total}.","ui.doInteract.4":"Catch: {caught}! · Fishing {fishLevel} · {total} in all","ui.talk.0":"Soul — and shadow — yours again.","ui.talk.1":"Radek presses a still-hot horseshoe into your hand. STR +1 while you carry it.","ui.gather.0":"You reach for the zvirobiy — and hesitate. You don't know this herb yet: WIS {wisNow}, needs 2. Pick the others first.","ui.gather.1":"Picked: {name}. Herbalism {herbLevel} — WIS is now {wis}.","ui.gather.2":"{name} — and another stem underneath! Keen eye (WIS {wis}).","ui.gather.3":"Picked: {name} · Herbalism {herbLevel} · in satchel: {flagCount}","ui.cast.0":"Cast. Now wait for the float to dip.","ui.crust.0":"You take the crust and a pinch of salt. For the Domovyk.","ui.offer.0":"You set the crust behind the pich. Something in the hut sighs contentedly.","ui.gift.0":"A smooth river stone, warm as fresh bread. The Domovyk's thanks: CON +1.","ui.iron.0":"No way to carry it: your satchel is at {satchelWeight}/{carryCap}, and a lump weighs 3. Your STR {str} sets the limit.","ui.iron.1":"You heave — the deepest lump won't budge. It takes STR 3 (you have {str}) or luck. Try again.","ui.iron.2":"Three lumps of bog iron! Arms full — take them to Radek.","ui.iron.3":"Shlup! The deepest lump comes free! Iron ({n}/3 for Radek).","ui.iron.4":"Bog iron! A heavy rust-dark lump ({n}/3 for Radek).","ui.wish.0":"Something glints on the well's rim — a lucky pebble! The well liked the singer. DEX +1.","ui.wish.1":"The well is silent. It likes those the khutir likes (CHA {cha}). Play for people in the evening — then wish again.","ui.cook.0":"The cauldron wants a fish and a herb. The pond is west; the herbs glow in the grass.","ui.cook.1":"The cauldron wants a fish — cast from the west shore first.","ui.cook.2":"The cauldron wants a herb — pick any glowing one.","ui.cook.3":"Kulish! Cooking {craftLevel} — CON is now {con}. Eat it in the Character sheet.","ui.cook.4":"Kulish, thick and fragrant. · Cooking {craftLevel} · in satchel: {flagCount}","ui.smith.0":"The forge is cold. First Radek needs three lumps of bog iron.","ui.smith.1":"The iron needs to heat, and your arm needs a breath.","ui.smith.2":"The hammer rings true! Smithing {craftLevel} — STR is now {str}.","ui.smith.3":"A masterwork! Two horseshoes from one heat (STR {str}). · Smithing {craftLevel}","ui.smith.4":"Clang… clang… a good horseshoe. · Smithing {craftLevel} · in satchel: {flagCount}","ui.brew.0":"The cauldron wants 2 herbs — you have {herbsIn}.","ui.bloom.0":"The third nichnyk! Take them to the offering stone, north of the fire.","ui.bloom.1":"Nichnyk · {n}/3 for the gift","ui.offering.0":"The stone wants 3 nichnyky; you have {have}. Motrya knows where they hide.","ui.offering.1":"You lay the nichnyky on the cold stone. They open one by one — and the whole ring of stones seems to lean closer.","ui.dance.0":"The witches shake their heads: the gift first. Three nichnyky on the stone north of the fire.","ui.dance.1":"You strike up the hopak! Witches whoop, devils squat-kick, the fire dances. Beelzebub nods, barely, to the beat.","ui.sleep.0":"Straw, a sheepskin, the warm pich through the wall. {timeLabel}. How long heard.","char.myroslav.name.0":"Myroslav","char.myroslav.pron.0":"my-ro-SLAHV","char.myroslav.role.0":"Otaman of the khutir · an old Zaporozhian","char.vesna.name.0":"Vesna","char.vesna.pron.0":"VEHS-nah","char.vesna.role.0":"Znakharka · heals folk and cattle","char.radek.name.0":"Radek","char.radek.pron.0":"RAH-dek","char.radek.role.0":"Smith · a Pole who ran from his lord","char.domovyk.name.0":"Domovyk","char.domovyk.pron.0":"do-mo-VYK","char.domovyk.role.0":"House spirit · master of the pich","char.lisovyk.name.0":"Lisovyk","char.lisovyk.pron.0":"lee-so-VYK","char.lisovyk.role.0":"Forest spirit · lord of the pines","char.chort.name.0":"Chort","char.chort.pron.0":"chort","char.chort.role.0":"Merchant of souls · loves a good tune","char.bolotianyk.name.0":"Bolotianyk","char.bolotianyk.pron.0":"bo-lo-TYAH-nyk","char.bolotianyk.role.0":"Keeper of the pond and the reeds","char.viy.name.0":"Viy","char.viy.pron.0":"veey","char.viy.role.0":"Asleep. Do not wake him.","char.domovyk.name.1":"Domovyk","char.domovyk.pron.1":"do-mo-VYK","char.domovyk.role.1":"House spirit · master of the pich","char.vesna.name.1":"Vesna","char.vesna.pron.1":"VEHS-nah","char.vesna.role.1":"Znakharka · heals folk and cattle","char.beelzebub.name.0":"Beelzebub","char.beelzebub.pron.0":"be-EL-ze-bub","char.beelzebub.role.0":"Host of the sabbath · lord of Lysa Hora","char.chort.name.1":"Chort","char.chort.pron.1":"chort","char.chort.role.1":"Tonight — master of the sabbath","char.solokha.name.0":"Solokha","char.solokha.pron.0":"so-lo-KHA","char.solokha.role.0":"Witch from Dykanka · a widow","char.motrya.name.0":"Motrya","char.motrya.pron.0":"MO-trya","char.motrya.role.0":"Witch · knows where the nichnyky bloom","char.LYSA_DANCERS.name.0":"Witch","char.LYSA_DANCERS.role.0":"Dancing at the sabbath","input.Joystick.0":"Game view — touch anywhere and drag to walk","input.Joystick.1":"Touch anywhere and drag to walk","time.timeLabel.0":"Day {day} · {hh}:{mm} {icon}","ui.continue":"Continue","ui.zalissya":"Zalissya","ui.next":"Next","ui.farewell":"Farewell","ui.quests":"Quests","ui.character":"Character","stat.soulless":"Soulless","quest.section.story":"Story","ui.hud.soulLost":"☠ No shadow — the Chort has your soul ({price} fish buys it back)","ui.hud.overfull":"🎒 Over-full ({carried}/{cap}) — no new pickups","ui.vigil.secondsLeft":"{s}s","ui.dialogue.youAsk":"You ask: “{question}”","ui.quests.intro":"{done} of {total} done. The {now} mark is where the story stands. The rest will wait: wandering is no sin.","ui.stats.from":"from {feeds}","ui.stats.footer":"No points handed out here. In Zalissya you become what you do. The Chort currently prices your soul at {price} fish.","ui.skills.feeds":"→ {stat}","ui.skills.level":"Lv {level}","ui.satchel.basics":"🌿 herbs: {herbStock} · 🎣 fish: {fish}","ui.satchel.carrying":"🎒 Carrying {carried} / {cap} (STR {str} sets the limit). Weights: fish 1 · herb 1 · horseshoe 2 · bog iron 3 · nichnyky 0.","line.chort.5b":"Hey, what's that smell? Pond and karas! THREE fish, I count without counting. Well, kobzar, shall we settle accounts?","ui.language":"Language","song.name.holota":"Duma of Cossack Holota","song.name.kolyskova":"Lullaby “Sleep walks by the window”","song.name.hopak":"Hopak","song.name.burya":"Duma of the Black Sea storm","song.topic.vesna.label":"A lullaby","song.topic.vesna.question":"Will you teach me a lullaby?","song.topic.vesna.0":"“Sleep walks by the window, drowse walks by the fence…” My mother sang it to me, and I sing it to every sick child on the khutir. Listen and remember.","song.topic.vesna.1":"Sing it in the Domovyk's hut when you lie down. He'll pretend not to listen, and you'll wake as if your mother had swaddled you. CON +1 until the next dawn.","song.topic.chort.label":"The hopak","song.topic.chort.question":"They say you're a musician. Teach me the hopak?","song.topic.chort.0":"I'll teach you! For free! See how it pains me to say it? The hopak is devil's music the Cossacks pinched from us, and we don't even mind: they dance it so well.","song.topic.chort.1":"There: one-two, one-two-three, then strike the strings as if a hundred Tatars were chasing you. Without the hopak they won't let you past the door on Lysa Hora.","song.topic.motrya.label":"The hopak","song.topic.motrya.question":"Will you teach me the hopak?","song.topic.motrya.0":"“Listen.” Motrya hums, stamping the beat, and within a minute your fingers know where to run. “The Chort would've taught you too, but then he'd tell everyone you owe him.”","ui.fire.name":"The campfire","ui.fire.role":"Where the khutir gathers in the evening","ui.play.audience.holota":"The duma of Holota — how a ragged Cossack taught a Polish lord a lesson. Radek laughs loudest: “Dobrze, serves him right!”","ui.play.audience.kolyskova":"The lullaby. The chatter dies down. An old woman dabs her eyes with her kerchief, and the otaman pretends smoke got in his eye.","ui.play.audience.hopak":"Hopak! In a moment the whole khutir is squat-dancing, even the otaman and his bad back. From somewhere in the dark comes a suspicious clatter of hooves.","ui.play.audience.burya":"The duma of the Black Sea storm. Over the fire the silence is so deep you hear the embers crack. Nobody says a word. Everyone knows the night you held.","ui.song.learned":"New song: {song} 🎶","ui.sleep.rested":"In the night the Domovyk quietly hummed your lullaby. You slept like a baby. CON +1 until dawn.","ui.dance.noHopak":"You take up the kobza — but what to play? Here they dance only to the hopak. The Chort and Motrya know it.","ui.play.daytime":"By day the khutir is in the fields. Nobody to listen — come in the evening, from six.","ui.play.alreadyPlayed":"You've already played tonight. Folk are drifting home — they'll ask for more tomorrow.","ui.play.first":"You sit on the log and the khutir drifts over: the otaman with his pipe, Vesna with her basket, Radek a little apart. Waiting. What will you play?","ui.play.prompt":"The khutir gathers by the fire. What will you play?","ui.promptLabel.play":"Play the kobza 🎶","ui.satchel.songs":"🎶 Songs: {songs}","ui.skillRows.name.music":"Music","ui.skillRows.stat.music":"CHA","stat.rested":"Slept to a lullaby","quest.evening.title":"First evening by the fire","quest.evening.done":"The khutir has listened · evenings: {played}","quest.evening.detail":"In the evening (from 18:00) sit on the log by the campfire and play for the khutir","quest.evening.now":"Evening! Sit by the campfire and play for the khutir","quest.evening.wait":"When evening comes (18:00), play by the campfire","quest.lysa-sabbath.hopak":"The sabbath dances only to the hopak — learn it from the Chort or Motrya","char.gnat.name":"Hnat","char.gnat.pron":"hnaht","char.gnat.role":"Chumak leader · hauling salt from Crimea","char.ostap.name":"Ostap","char.ostap.pron":"os-TAHP","char.ostap.role":"The youngest chumak · burning with fever","char.ostap.roleWell":"The youngest chumak · back on his feet","song.name.zhentsi":"“On the hill the reapers reap”","song.name.rozpriahaite":"“Unharness the horses, lads”","song.name.voly":"“Oh, my pale-grey oxen”","song.name.polechko":"“Oh, little field, field”","song.topic.myroslav.label":"A song from the Sich","song.topic.myroslav.question":"What did they sing at the Sich?","song.topic.myroslav.0":"“On the hill the reapers reap.” The host marched down the valley to it, and we young ones bellowed so loud the horses flattened their ears.","song.topic.myroslav.1":"Take it, kobzar. Sing it when folk are merry — it's a feast song. Only sing the line about Sahaidachny and his pipe louder: that one's my favourite.","song.topic.radek.label":"A Cossack song","song.topic.radek.question":"You, a Pole, know Cossack songs?","song.topic.radek.0":"I know one! “Unharness the horses, lads.” Learned it my first year so they'd stop beating me at weddings. It worked. Half the time.","song.topic.radek.1":"Take it. I sing it worse than I forge, and I forge dobrze. Meaning — well. A merry one. For feast days.","chumak.news.arrived":"Dawn. On the east road — a chumak camp: a cart of salt, grey oxen. And someone lying by the cart who doesn't get up.","chumak.news.died":"Dawn. By the chumak cart, men are digging. Ostap didn't live to see the morning.","chumak.toast.vesnaTonic":"Vesna silently slips a bottle of tonic into your satchel. “I never gave you anything.”","chumak.toast.persuaded":"The otaman waved a hand. Vesna is already running to the camp with her basket.","chumak.toast.treated":"You hold Ostap's head while he drinks. By evening the fever breaks. The khutir will find out — the khutir always does.","chumak.gnat.intro":"A grey chumak with tar on his shirt rises to meet you. “A kobzar? Thank God, someone finally came over. I'm Hnat. We're hauling salt from Crimea. And this… this is Ostap. My nephew.”","chumak.gnat.again":"Hnat raises eyes red from no sleep. “Well, kobzar?”","chumak.gnat.t.ostap.label":"What's wrong with the boy?","chumak.gnat.t.ostap.question":"What's wrong with Ostap?","chumak.gnat.ostap.0":"Fever. Drank from a marsh puddle near Perekop — young, foolish, thirsty. Three days burning. Yesterday he still talked. Today he doesn't know me.","chumak.gnat.ostap.1":"He won't live till morning if nobody helps. Thirty years I've been on the road. I know what it looks like.","chumak.gnat.t.why.label":"Why won't they let you in?","chumak.gnat.t.why.question":"Why are you out here and not in the khutir?","chumak.gnat.why.0":"Your otaman saw a sick man and put lads with stakes across the road. Says chumaky carry plague. Chuma, chumak — to him it's one word.","chumak.gnat.why.1":"I don't hold it against him. I've seen khutory after the plague. But this isn't plague, kobzar. It's marsh water. And he's forbidden your znakharka to come to us.","chumak.gnat.t.road.label":"The chumak road","chumak.gnat.t.road.question":"Where are you coming from?","chumak.gnat.road.0":"From Crimea, from the salt lakes. Salt, fish, and with luck — news. Half a year on the road, oxen's tails ahead, rain in your face.","chumak.gnat.road.1":"Know why chumaky tar their shirts? So the lice won't bite, and so a mother can recognise her son when they bring him home. That's how it is, kobzar. We ride — and songs follow us.","chumak.gnat.healedIntro":"Hnat smiles for the first time in a week. “He's alive, the rascal! Sitting up and already asking for porridge.”","chumak.gnat.t.thanks.label":"Thanks","chumak.gnat.t.thanks.question":"How is he?","chumak.gnat.thanks.0":"Weak as a kitten, but alive. We leave at dawn tomorrow — Poltava is still far.","chumak.gnat.thanks.1":"Chumaky don't forget their debts. If you're ever on the road, every camp from Crimea to Kyiv will feed you. Just say: Hnat sent me.","chumak.gnat.t.polechko.label":"A chumak song","chumak.gnat.t.polechko.question":"Will you sing me a chumak song?","chumak.gnat.polechko.0":"We have one: “Oh, little field, field.” We sing it on the road when the steppe has no end and home is out of sight. It's sad. But a chumak without it isn't a chumak.","chumak.gnat.polechko.1":"Hnat sings low and hoarse, and even the oxen stop chewing. Now it's yours. Sing it when people's hearts are heavy. Don't sing it to merry folk — they won't understand.","chumak.gnat.deadIntro":"Hnat sits by the fresh grave, his whip across his knees. He's silent a long time. “…Kobzar.”","chumak.gnat.t.grief.label":"Ostap","chumak.gnat.t.grief.question":"I'm sorry.","chumak.gnat.grief.0":"Sorry. Everyone's sorry. Your otaman too, I saw: stood on the road watching us dig. Didn't come over.","chumak.gnat.grief.1":"I'm not saying it's your fault. You're a stranger here, same as us. But when you sing a duma about chumaky someday — sing about this night too. Let them remember.","chumak.gnat.t.polechkoDead.label":"The song at the grave","chumak.gnat.t.polechkoDead.question":"What were you singing over him last night?","chumak.gnat.polechkoDead.0":"“Oh, little field, field.” It's sung over those who stay behind in the steppe. Ostap knew it from a boy, because his father didn't come back from the road either.","chumak.gnat.polechkoDead.1":"Take it. A kobzar must know this kind too. Sing it when people are grieving. And never for fun.","chumak.gnat.t.voly.label":"Ostap's song","chumak.gnat.t.voly.question":"What song did Ostap love?","chumak.gnat.voly.0":"“Oh, my pale-grey oxen.” He sang it to the oxen the whole way — off-key as a young rooster. You sing it too. Let at least the song make it home.","chumak.ostap.sickIntro":"The lad on the sheepskin barely opens his eyes. Cracked lips. “Mama?.. No. You're not Mama. Water…”","chumak.ostap.t.tonic.label":"Give him a tonic ⚗","chumak.ostap.t.tonic.question":"(Go against the otaman's word and give it to him.)","chumak.ostap.tonic.0":"You lift his head. He drinks greedily, chokes, drinks again. Hnat stands behind you, not breathing.","chumak.ostap.tonic.1":"Within an hour Ostap falls asleep — truly asleep, for the first time. His brow is wet. The fever is breaking. Someone from the khutir saw you walk to the camp.","chumak.ostap.t.help.label":"What can I give you?","chumak.ostap.t.help.question":"How can I help you?","chumak.ostap.help.0":"He doesn't answer, only shivers. Nothing will help without medicine. The znakharka would know what to do. Or someone who can brew a tonic.","chumak.ostap.t.home.label":"Home","chumak.ostap.t.home.question":"Where are you from?","chumak.ostap.home.0":"“Near Poltava… Mama paints the gate for Easter… Blue… Tell her I hauled salt… that I wasn't scared…”","chumak.ostap.wellIntro":"Ostap sits by the cart, pale but grinning, finishing his third bowl. “You're the kobzar! Hnat told me. I owe you now.”","chumak.ostap.t.voly.label":"Your song","chumak.ostap.t.voly.question":"How will you repay me? A song?","chumak.ostap.voly.0":"“Oh, my pale-grey oxen”! I sing it to the oxen all the way, and they put up with me. Listen.","chumak.ostap.voly.1":"He sings off-key and happy, and Hnat behind the cart wipes his eyes, pretending it's smoke. A steady road song — good for any evening.","chumak.ostap.t.otaman.label":"The otaman","chumak.ostap.t.otaman.question":"No grudge against the otaman?","chumak.ostap.otaman.defied":"“Hnat says he was scared. Well… I was scared too. Only nobody judges me for it.” He goes quiet. “But he'll judge you now, won't he?”","chumak.ostap.otaman.relented":"“He came himself. Stood right here, coughing and coughing, then said: ‘Forgive an old fool.’ And left. Strange otaman you've got. A good one.”","chumak.otaman.t.ask.label":"The chumaky","chumak.otaman.t.ask.question":"Why won't you let Vesna go to the chumaky?","chumak.otaman.no.0":"I was seven when a chumak caravan came to our village. With one sick man. A month later, nine houses were left out of forty. I buried my mother myself, kobzar. Myself.","chumak.otaman.no.1":"I have forty souls here. Children. We have only one Vesna. If she goes to them, she brings it back here. Let God judge me for this, not you.","chumak.otaman.no.2":"You've been here a few days, singer. The khutir doesn't listen to you yet — so neither will I. Let people come to love you first. (Needs CHA 3.)","chumak.otaman.yes.0":"I was seven when a chumak caravan brought the plague to our village. I buried my mother myself. You know that? …You know. People told you. People tell you everything now.","chumak.otaman.yes.1":"Every evening you sing to my people, and they listen to you the way the Sich once listened to me. And if you say it's marsh water, not plague…","chumak.otaman.yes.2":"…Vesna! Go. Take what you need. Just wash your hands in three waters after, you hear? And… tell that lad an old fool asks his forgiveness.","chumak.otaman.t.after.label":"The chumaky","chumak.otaman.t.after.question":"How are you now?","chumak.otaman.after.died":"I stood on the road watching them dig. I didn't go over. Couldn't. It wasn't plague, kobzar. Vesna says — water.","chumak.otaman.after.died2":"I saved forty souls from something that wasn't there. And lost one. Put that in a duma when you make one. Let them know what kind of otaman Zalissya had.","chumak.otaman.after.defied":"You went against my word. That's not how it's done on a khutir. At the Sich, for that… — he waves a hand. — And the lad's alive.","chumak.otaman.after.defied2":"I don't know what to do with you, kobzar. You were right. Don't get used to it.","chumak.otaman.after.relented":"Know what's hardest? Not the fear. Saying out loud that you're afraid. You made me. Thank you.","chumak.otaman.after.relented2":"The chumaky promised to bring us salt next summer. For free. Well, almost — Hnat wants you to sing.","chumak.vesna.t.ask.label":"The chumaky","chumak.vesna.t.ask.question":"Can you help that lad?","chumak.vesna.sick.0":"I can. It's marsh fever, not plague — I've treated it a hundred times. A tonic will break the fever. But the otaman forbade it. And I live among these people, kobzar. Not against them.","chumak.vesna.sick.give":"…But nobody forbade me to brew tonics. Or to slip them into other people's satchels when no one's looking. What you do with it is your conscience.","chumak.vesna.sick.1":"You already have a tonic. You know what to do with it. And you know what the otaman will say. Choose for yourself.","chumak.vesna.t.after.label":"The chumaky","chumak.vesna.t.after.question":"How are you?","chumak.vesna.after.died":"I could have saved him. From my door to the camp is three hundred steps. I never walked them. Don't ask me about it again.","chumak.vesna.after.healed":"The lad will live. Marsh fever, as I said. The otaman walks quiet now. Maybe that's for the best.","chumak.radek.t.label":"The chumaky","chumak.radek.t.question":"What do you think about the chumaky?","chumak.radek.0":"Once they wouldn't let me into a khutir either. A Pole, a runaway, who knows what's in his bag. I stood by the fence two days. The one who let me in was… your otaman. Strange, isn't it? People forget who they were.","chumak.radek.dead":"I made him a horseshoe for his ox. Now it hangs on the cross. Psiakrew, kobzar. Psiakrew.","chumak.chort.t.label":"The chumaky","chumak.chort.t.question":"Have you seen what's happening on the road?","chumak.chort.0":"Saw it, of course. The otaman is afraid of plague, so out of fear he lets the boy burn. And they say I'm the wicked one!","chumak.chort.1":"Want my best secret, kobzar? I hardly need to work. People are their own devils. I just collect the signatures.","chumak.domovyk.t.label":"Last night","chumak.domovyk.t.question":"Did you hear, last night?","chumak.domovyk.dead":"I heard. The whole hut heard them singing over him. I kept the pich burning all night, though it was warm. That's what you do when someone leaves. So they don't freeze on the way.","chumak.grave.name":"A grave by the road","chumak.grave.role":"Ostap, a chumak from near Poltava","chumak.grave.sing.0":"You sit by the cross and quietly strike the first chord of “Oh, little field, field.” The whip on the cross sways in the wind, as if nodding along.","chumak.grave.sing.1":"Nobody listens. Only the steppe. But after singing it here you understand something about the song you didn't before. (Music +1)","chumak.grave.after":"The fresh earth is already greening over. Someone from the khutir has brought field flowers. Maybe the otaman.","chumak.grave.quiet":"A cross of two poles and a chumak's whip. You stand silent a long time. You don't have a song for this yet.","ui.promptLabel.grave":"Stand by the grave","ui.play.match":"{song} — exactly what the khutir needed tonight. Music {level}.","ui.play.fine":"{song} — the khutir listened and brought a bowl of kulish. Music {level}.","ui.play.clash":"{song} — the wrong night for that song. Folk drift away. Music {level}.","ui.play.levelUpTail":"CHA is now {cha}.","ui.play.clash.sad":"You strike up something merry — and see the old women purse their lips and the otaman stare at the ground. Tonight the khutir is grieving. Someone mutters, “That singer has no shame.” Nobody brings you kulish.","ui.play.clash.happy":"You start a sad one — but folk came to be merry. The young ones exchange looks, the girls yawn, someone whispers, “Well, he's buried our feast.” Nobody brings kulish.","ui.mood.mourning":"It's quiet tonight: there's a fresh grave by the road.","ui.mood.chumakFeast":"The chumaky are feasting with the khutir — the lad lives! Everyone wants something merry.","ui.mood.wedding":"The Petrenkos are celebrating a betrothal — the young folk want something merry.","ui.mood.memorial":"Tonight is the wake for old Yavdokha. Folk are quiet.","ui.mood.ordinary":"An ordinary evening: the mowers are tired, the children sleepy.","ui.songMood.happy":"a merry song","ui.songMood.neutral":"for any evening","ui.songMood.sad":"a sad song","ui.play.audience.zhentsi":"“On the hill the reapers reap” — and the otaman is already singing bass, beating time with his pipe on his knee. At the line about Sahaidachny and his pipe the whole khutir roars along with him.","ui.play.audience.rozpriahaite":"“Unharness the horses, lads” — and the girls are already in a circle. Radek sings along with such an accent that even the horses laugh.","ui.play.audience.voly":"“Oh, my pale-grey oxen” — steady, a road song. The old folk nod to the beat, children fall asleep in their mothers' laps.","ui.play.audience.polechko":"“Oh, little field, field.” The song stretches out like a steppe road. Nobody speaks. Vesna stares into the fire; the otaman looks somewhere far to the east.","quest.section.chumaky":"The chumaky","quest.chumaky.title":"The fever","quest.chumaky.sick":"Young Ostap the chumak is burning with fever. The otaman won't let Vesna near the camp. Decide before dawn.","quest.chumaky.died":"Ostap died at dawn. There is a grave by the road.","quest.chumaky.defied":"You went against the otaman's word — and Ostap lives.","quest.chumaky.relented":"The otaman relented, Vesna went to the camp — Ostap lives.","quest.chumaky.objective":"A chumak on the east road is dying. Talk to Hnat — before dawn","tobacco.news.dry":"Dawn. On Vesna's rack the tobacco has dried — dark, fragrant, enough to tickle your nose. Take it to the otaman.","tobacco.toast.started":"The otaman needs tobacco. The old tobacco field is across the river, by the chumak road.","tobacco.toast.leaf":"Tobacco leaves · {n}/{need}","tobacco.toast.leavesDone":"Enough leaves ({n}/{need}), and you have the fibre. Take it all to Vesna's rack.","tobacco.toast.leavesNeedHemp":"Enough leaves ({n}/{need}). Now hemp fibre to tie them. The hemp field is south of the khutir.","tobacco.toast.hemp":"You strip a hank of strong fibre from the hemp. You could tie a cart with this, never mind tobacco.","tobacco.toast.hung":"You tie the leaves with the fibre and hang them on Vesna's rack. By morning they'll be dry.","tobacco.toast.lyulka":"The otaman gives you his old spare pipe. At Viy's vigil — Nerve +2.","tobacco.prompt.leaf":"Pick tobacco leaves 🍂","tobacco.prompt.hemp":"Strip hemp fibre","tobacco.prompt.hang":"Hang the tobacco to dry","tobacco.keepsake":"🪈 The otaman's old pipe (Nerve +2 at the vigil)","tobacco.otaman.t.ask.label":"A pipe without tobacco","tobacco.otaman.t.ask.question":"Why are you sucking on an empty pipe, otaman?","tobacco.otaman.ask.0":"Because there's no tobacco, son! Not since spring. The chumaky didn't bring any, and me without my pipe is like the Sich without an otaman: standing there, no use to anyone.","tobacco.otaman.ask.1":"Across the river, by the chumak road, there's an old tobacco field. Taras the Long planted it, then went off to the Sich and never came back. The field's gone wild, but tobacco still grows there. Folk say it's because the devil tends it. Tobacco is the devil's herb, after all.","tobacco.otaman.ask.2":"Bring me leaves, son. Three good ones. But I won't smoke them raw — Vesna knows how to dry them. Do it, and I'll repay you so well there'll be a duma about it.","tobacco.otaman.t.wait.label":"The tobacco","tobacco.otaman.t.wait.question":"I'm still looking for the tobacco.","tobacco.otaman.wait.0":"Keep looking. Across the river, by the chumak road. I'll sit here and suck my empty pipe. I'm used to it.","tobacco.otaman.wait.drying":"Drying, you say? Oh, son, this night will be the longest of my life. And I've seen a few long nights.","tobacco.otaman.t.give.label":"The tobacco ✦","tobacco.otaman.t.give.question":"Here's your tobacco, otaman. Dry.","tobacco.otaman.give.0":"The otaman sniffs the bundle, and his moustache actually quivers. He packs the pipe, strikes a spark with his flint, draws — and is silent for a long, long time.","tobacco.otaman.give.1":"…Taras's tobacco. He always said his was the best in the district. A lie, of course. But today it's true.","tobacco.otaman.give.2":"Here, son. This is my old pipe, from the Sich. I went against the Turk with it. Smoke it before a terrible night and your hands won't shake. Trust an old man.","tobacco.otaman.t.after.label":"The pipe","tobacco.otaman.t.after.question":"How's the tobacco?","tobacco.otaman.after.0":"Good as Taras's tall tales. A pipe every evening, and two on Sundays. That's how we live.","tobacco.vesna.t.label":"Tobacco","tobacco.vesna.t.question":"How do you dry tobacco?","tobacco.vesna.0":"You don't smoke it raw — it scrapes your throat and makes your head ache. Tie the leaves in a bundle and hang them in the shade, in the wind. My rack will do.","tobacco.vesna.1":"And tie them with hemp fibre — nothing else holds. The hemp field is south of the khutir, past the gardens. By morning it'll be dry.","tobacco.radek.t.label":"Tobacco","tobacco.radek.t.question":"Do you know where tobacco grows?","tobacco.radek.0":"Across the river, by the chumak road. Over the bridge and to the right. I went once — saw a devil on the field's edge and came back. Maybe I imagined it. Maybe not. Psiakrew.","tobacco.chort.t.label":"Tobacco","tobacco.chort.t.question":"They say tobacco is the devil's herb?","tobacco.chort.0":"My finest creation! Not the hopak, not horilka — tobacco! Plant it once, and people come to you on their own ever after, and thank you for it.","tobacco.chort.1":"Taras's field? Take it, take it, I'm not greedy. Let your otaman smoke to his health. To mine, rather.","quest.tobacco.title":"The otaman's pipe","quest.tobacco.gather":"Tobacco across the river, by the chumak road · leaves {leaves}/3. And hemp fibre from the field to the south","quest.tobacco.hang":"Hang the tobacco to dry on Vesna's rack","quest.tobacco.drying":"The tobacco is drying on Vesna's rack — until morning","quest.tobacco.ready":"The tobacco is dry — take it to the otaman","quest.tobacco.done":"The otaman smokes Taras's tobacco, and you have his old pipe","quest.tobacco.none":"—","map.button":"Map","map.open":"Open the map","map.zoom":"Map zoom","map.zoom.world":"Whole world","map.zoom.near":"Around me","map.aria":"Map: the khutir, fields, river, forests, steppe and Lysa Hora","map.legend":"● — you are here · ★ — where your current quest leads · ▲ — burial mounds · ✣ — windmill","map.khutir":"Zalissya","map.steppe":"The steppe","map.lysa":"Lysa Hora","map.river":"The river","map.forest":"Forest","map.fields":"Fields","map.hemp":"Hemp","map.tobacco":"Tobacco","map.pond":"Pond","map.none":"You have no map. The chumaky know every road — and they say the Chort sells everything, maps included.","map.title.chumak":"The chumak map","map.title.chort":"The devil's map (smells of sulphur)","map.keepsake.chumak":"🗺 The chumak map (M to open)","map.keepsake.chort":"🗺 The devil's map (M to open)","map.toast.chumak":"Hnat gives you the chumak map. You now have the Map — the button at the top, or M.","map.toast.chort":"Three fish — and the map is yours. You now have the Map — the button at the top, or M.","map.chort.label":"A map","map.chort.question":"They say you sell maps too?","map.chort.buy.0":"I do! The most accurate in the whole district: every path, every kurhan, every well I've ever spat into. Three fish.","map.chort.buy.1":"The Chort fishes a scroll out of his coat; it reeks of sulphur. The fish vanish even faster. “Pleasure doing business. Don't look at it at midnight. Well, maybe a little.”","map.chort.poor.0":"The map is three fish, kobzar. You have {fish}. My own gold I won't take back — I'm no fool. Go to the pond; the rod doesn't bite. Mostly. (Price: {price} fish.)","chumak.gnat.t.map.label":"The road ahead","chumak.gnat.t.map.question":"Where are you headed now?","chumak.gnat.map.0":"To Poltava, then home. And for you — here, take this. A chumak map: roads, fords, wells, kurhany, where to spend the night. I drew it myself, thirty years on the road.","chumak.gnat.map.1":"I don't need it any more — my feet remember these roads. And a kobzar without a map is like an ox without a yoke: walking, but who knows where.","char.odarka.name":"Odarka","char.odarka.pron":"o-DAR-ka","char.odarka.role":"Shynkarka · keeps the korchma on the road","char.okhrim.name":"Okhrim","char.okhrim.pron":"OKH-rim","char.okhrim.role":"Old Zaporozhian · drinks on credit","song.name.pidmanula":"“You fooled me”","song.name.dunai":"“A Cossack rode beyond the Danube”","ui.play.audience.pidmanula":"“You fooled me” — by the third verse the khutir is singing it for you. Vesna gives the otaman such a look that he coughs into his pipe.","ui.play.audience.dunai":"“A Cossack rode beyond the Danube.” The old men nod, the women sigh, and the girls watch the road as if someone might walk up it any moment.","korchma.name":"The korchma","korchma.role":"On the chumak road, past the khutir","ui.promptLabel.playKorchma":"Play for the korchma 🎶","ui.enterHut.korchma":"The korchma. Smoke under the ceiling, mugs banging on the table, a smell of horilka and pickles. Behind the counter a woman in a blue kerchief sizes you up: will you pay, or will you sing?","ui.hut.korchma":"🍺 The korchma","map.korchma":"Korchma","korchma.play.daytime":"By day the korchma holds only flies and Okhrim, and both are asleep. Come and play in the evening.","korchma.play.prompt":"Odarka nods you to the bench by the wall. The korchma quiets down. What will you play?","korchma.mood.mourning":"Tonight they drink in silence here, for the dead. Even the cups are set down gently.","korchma.mood.chumaky":"The chumaky are celebrating, and the korchma celebrates with them. Someone is already dancing on a bench.","korchma.mood.maudlin":"The korchma has gone soft tonight: two are weeping for the Sich, a third for his mother, a fourth doesn't know what for.","korchma.mood.merry":"An ordinary evening at the korchma: noise, laughter, somebody already arguing about horses.","korchma.play.match":"{song} — the korchma roars and the mugs beat the table in time. Odarka sets a bowl of varenyky in front of you. Music {level}.","korchma.play.fine":"{song} — they listened, and somebody even joined in. Odarka sets a bowl of varenyky in front of you. Music {level}.","korchma.play.clash":"{song} — the wrong song for this korchma. No varenyky tonight. Music {level}.","korchma.play.room.match":"When you stop, the korchma is silent for a moment, then roars so loud a jug falls off the shelf. Odarka doesn't scold. Odarka smiles.","korchma.play.room.fine":"The korchma listens with half an ear, the way people on the road do, and still somebody stands you a cup. You don't drink it. A kobzar needs his hands.","korchma.play.room.clash.sad":"You strike up something merry, and tonight the korchma is weeping. Someone throws a bacon rind at you: “Have you no shame!” Odarka only shakes her head.","korchma.play.room.clash.happy":"You start a sad one, and people came here to make merry. “Did you bring us to a funeral?” Somebody is already banging the door.","korchma.toast.supper":"Odarka puts a bowl of varenyky with sour cream in front of you. One fish less, one life more. 🥟","korchma.odarka.intro":"The woman behind the counter wipes a mug and takes her time. “A kobzar. Well, well. You pay in fish, you sing in the evening, and I pour nothing on credit. I pour for Okhrim, but he doesn't count. I'm Odarka.”","korchma.odarka.again":"“Ah, the singer. Sit down, only not where Okhrim is. That's Okhrim's.”","korchma.odarka.t.who.label":"About Odarka","korchma.odarka.t.who.question":"You keep the korchma on your own?","korchma.odarka.who.0":"“On my own. Seven years ago my husband rode off to the Sich. He said: back by Pokrova. He didn't say which Pokrova.”","korchma.odarka.who.1":"“At first I told every chumak: if you see my Stepan, give him word. I don't any more. I pour and keep quiet. It's easier for both of us.”","korchma.odarka.t.supper.label":"Have supper (1 fish)","korchma.odarka.t.supper.question":"What's to eat?","korchma.odarka.supper.0":"“Varenyky with curd cheese, the sour cream is my own. Give me the fish. Not that one, that one, the bigger one. There.” She takes it as if doing you a favour. She is.","korchma.odarka.supperPoor":"“Varenyky are for fish, singer. For {price}. Only Okhrim gets fed for his pretty eyes, and only because he can't see what he's eating any more.” You could still play here in the evening.","korchma.odarka.t.news.label":"News from the road","korchma.odarka.t.news.question":"What are people saying?","korchma.odarka.news.viy":"“They say something stirs at night in the hollow past the khutir. The chumaky won't camp there; they go the long way round. And it takes some doing to frighten a chumak, you know.”","korchma.odarka.news.viySealed":"“They say you sang all night in the hollow, and the thing listened and didn't get up. Lies, most likely. I'll give you double varenyky anyway.”","korchma.odarka.news.road":"“They also say salt's gone up and horilka hasn't. So the world's still standing.”","korchma.odarka.t.okhrim.label":"About Okhrim","korchma.odarka.t.okhrim.question":"Does he ever pay you anything?","korchma.odarka.okhrim.0":"She nods at the counter: rows of chalk marks run across it like wheat in a field. “That's Okhrim. That's three winters.”","korchma.odarka.okhrim.1":"“I won't collect. He's all that's left of a whole k
