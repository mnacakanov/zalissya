ly, the way the old ones teach: not for gold, not for glory — those wishes curdle. The rope creaks, approving.","item.WISH_LINES.4":"Down in the dark, something small and silver turns once — a fish where no fish should live. The znakharky say a well-fish means the wish was heard.","char.myroslav.name.0":"Myroslav","char.myroslav.pron.0":"my-ro-SLAHV","char.myroslav.role.0":"Starosta · village elder","char.vesna.name.0":"Vesna","char.vesna.pron.0":"VEHS-nah","char.vesna.role.0":"Znakharka · healer","char.radek.name.0":"Radek","char.radek.pron.0":"RAH-dek","char.radek.role.0":"Blacksmith · a guest from afar","char.domovyk.name.0":"Domovyk","char.domovyk.pron.0":"do-mo-VYK","char.domovyk.role.0":"House spirit · keeper of the pich","char.lisovyk.name.0":"Lisovyk","char.lisovyk.pron.0":"lee-so-VYK","char.lisovyk.role.0":"Forest spirit · lord of the pines","char.chort.name.0":"Chort","char.chort.pron.0":"chort","char.chort.role.0":"Чорт · devil and trickster — mind your soul","char.bolotianyk.name.0":"Bolotianyk","char.bolotianyk.pron.0":"bo-lo-TYAH-nyk","char.bolotianyk.role.0":"Swamp demon · the pond's dark keeper","char.viy.name.0":"Viy","char.viy.pron.0":"veey","char.viy.role.0":"Вій · the Big Boss — asleep, for now","char.domovyk.name.1":"Domovyk","char.domovyk.pron.1":"do-mo-VYK","char.domovyk.role.1":"House spirit · keeper of the pich","char.vesna.name.1":"Vesna","char.vesna.pron.1":"VEHS-nah","char.vesna.role.1":"Znakharka · healer","char.beelzebub.name.0":"Beelzebub","char.beelzebub.pron.0":"be-EL-ze-bub","char.beelzebub.role.0":"Host of the sabbath · lord of Lysa Hora","char.chort.name.1":"Chort","char.chort.pron.1":"chort","char.chort.role.1":"Чорт · master of ceremonies tonight","char.solokha.name.0":"Solokha","char.solokha.pron.0":"so-lo-KHA","char.solokha.role.0":"Vidma · witch of Dikanka way","char.motrya.name.0":"Motrya","char.motrya.pron.0":"MO-trya","char.motrya.role.0":"Vidma · keeper of the night-blooms","char.LYSA_DANCERS.name.0":"Dancing witch","char.LYSA_DANCERS.role.0":"Of the sabbath","input.Joystick.0":"Game view — touch anywhere and drag to walk","input.Joystick.1":"Touch anywhere and drag to walk · WASD works too","time.timeLabel.0":"Day {day} · {hh}:{mm} {icon}","ui.continue":"Continue","ui.zalissya":"Zalissya","ui.next":"Next","ui.farewell":"Farewell","ui.quests":"Quests","ui.character":"Character","stat.soulless":"Soulless","quest.section.story":"Story","ui.hud.soulLost":"☠ No shadow — the Chort has your soul ({price} fish buys it back)","ui.hud.overfull":"🎒 Over-full ({carried}/{cap}) — no new pickups until the load lightens","ui.vigil.secondsLeft":"{s}s","ui.dialogue.youAsk":"You ask — “{question}”","ui.quests.intro":"{done} of {total} done. The step marked {now} is where the story stands — the rest wait their turn, and nothing is lost by wandering.","ui.stats.from":"from {feeds}","ui.stats.footer":"No points to spend and no dump stats — in Zalissya you become what you do. The Chort currently prices your soul at {price} fish.","ui.skills.feeds":"feeds {stat}","ui.skills.level":"Lv {level}","ui.satchel.basics":"🌿 {herbStock} herbs · 🎣 {fish} fish","ui.satchel.carrying":"🎒 Carrying {carried} / {cap} — your STR {str} sets the limit. Weights: fish 1 · herb 1 · forged piece 2 · bog iron 3 · nichnyky 0.","line.chort.5b":"Hm? What is that smell — pond water and karas? THREE fish, I count, without counting. …You know the price of a soul, traveller. Shall we settle accounts?","ui.language":"Language"};var Qw={"line.myroslav.0":"Ну от — нове обличчя в Заліссі. Я Мирослав, староста цього села. Ласкаво просимо до нашого вогнища.","line.myroslav.1":"Остерігайся узлісся, мандрівнику. Між соснами ходить Лісовик, і він не любить чужинців, що беруть без дозволу.","line.myroslav.2":"І будь добрим до Домовика у своїй хаті — залиш йому хліба біля печі, і він берегтиме твоє вогнище всю зиму.","line.myroslav.3":"Здебільшого він тиняється біля північної хати, порається з дровами. Не дякуй йому вголос — хатні духи не терплять метушні. Біля вогнища лежить окрайчик, якщо маєш намір залишити його для нього.","line.myroslav.4":"І ще одне, мандрівнику, і слухай уважно: далеко, у північно-східній улоговині, спить Вій — найбільший і найгірший зі старих. Повіки в нього звисають аж до самої землі. Глянь на нього, якщо мусиш. Але НЕ буди його.","line.myroslav.5":"Радек у кузні — гість серед нас, поляк із села за багато днів дороги звідси. Будь до нього добрим: мандрівник під твоїм дахом — то дар.","line.myroslav.6":"Ще два застереження, і дам тобі спокій. Біля старого жорна, на південь від галявини, повадився вилежуватися Чорт — самі угоди та усмішки. Хоч би що він пропонував, мандрівнику, твоя душа — не дрібна монета. І тримайся подалі від очерету в ставку: Болотяник топив кращих плавців за тебе.","line.myroslav.7":"На схід звідси стежка виводить із галявини на Лису Гору — голу, мов череп. У ночі шабашу там збираються чорти й відьми довкола великого вогнища, а Чорт за господаря. Це не заборонена земля, мандрівнику, — але йди ввічливо, не йди з порожніми руками й не їж того, що пригощають. Принаймні небагато.","line.myroslav.8":"Наостанок — найправдивіше, що я знаю: у Заліссі людина стає тим, що робить. Збирай — і око гострішає. Рибаль — і руки спритнішають. Готуй, кувай, вари — праця робить працівника. Заглядай у вікно Персонажа — там усе записано, ясно, мов на бирці.","line.vesna.0":"Глянь на свій кошик — кропива, полин, календула, звіробій, деревій! Твоє око загострилося, як я й обіцяла.","line.vesna.1":"Травництву не навчають, його збирають — по рослині, по прогулянці, по сезону. Тепер ти розумієш.","line.vesna.2":"Тепер на руки, як твої, чекають два ремесла. Над вогнищем висить казанок: одна риба зі ставка й одна трава з торби — і вийде справжня юшка з карася. Це Куховарство, а ситий мандрівник ходить жвавіше. А біля північно-східної хати стоїть моя сушарка: дві трави, оброблені терпляче, стають настоєм — це Алхімія. Вип'єш — і світ на якийсь час проясніє.","line.vesna.3":"А ти тільки глянь на себе — ясний, мов ранок у пляшці. Твій ІНТ сягнув 3, тож глибока робота тепер відкрита: біля моєї сушарки можеш вибрати міцний настій Весни — три трави, і випитий він гострить і розум, І око вдвічі глибше за звичайний (ІНТ +2, МДР +2). Деякі знання довіряють лише готовому розуму, мандрівнику. Твій готовий.","line.vesna.4":"Одну таємницю я бережу для готовішого розуму: мій міцний настій — глибший трунок, три трави, і дає ІНТ +2 та МДР +2 тому, хто його вип'є. Він відкривається з ІНТ 3, не раніше: зелений розум лише змарнує добрий полин. Сьогодні твій ІНТ — {intTotal}. Вари звичайний настій — кожна партія вчить, а сушарка пам'ятає.","line.vesna.5":"І ставок теж годує, бачу. У твоїй торбі вже є все на юшку — знахарю, яким ти стаєш.","line.vesna.6":"Коли трави відпочивають, спробуй берег ставка, західний. Терпляча волосінь ловить не лише карася — вона ловить тишу. А тиша теж ліки.","line.vesna.7":"У тебе лагідні руки. Я Весна — лікую хворих у Заліссі, а заразом і город.","line.vesna.8":"Бачиш, як світяться латки серед трави? Кропива пекуча, гіркий полин, календула, мов маленькі сонця, звіробій і деревій. Збирай будь-яку для мене — кожна трава вчить твоє око.","line.vesna.9":"Одне застереження, лагідні руки: жовтий звіробій ховається від зеленого ока. Поки твоя Мудрість не сягне 2, він не дасться ні впізнати, ні зірвати — вивчи спершу інші трави, і з часом він тобі відкриється.","line.vesna.10":"Принеси мені п'ять трав, і я знатиму, що ліс тебе прийняв.","line.radek.0":"Горно знову співає завдяки твоєму болотяному залізняку. Чуєш цей жар? ОТО кузня.","line.radek.1":"Ту підкову, що я тобі дав, — носи при собі, і не лише на щастя: залізо в кишені додає сили руці. Ти відчуєш. Це перший урок Ковальства, і він безкоштовний.","line.radek.2":"Тепер ковадло твоє — вчися на ньому, мандрівнику. Ставай до нього й працюй у кузні — виріб за виробом росте твоє Ковальство, а з ним і Сила. Сильна рука часом видає шедевр. Коли прийде день Вія, ми радітимемо і тому, й іншому.","line.radek.3":"Що то в тебе в руках таке важке — болотяний залізняк! Три добрі брили, народжені в болоті. Мандрівнику, ти щойно розпалив мою кузню.","line.radek.4":"Ось — перше, що зійшло з ковадла, твоє: підкова, ще тепла. Носи на щастя. Залізо пам'ятає, хто годував вогонь.","line.radek.5":"Тепер кузня готова. Коли настане день, як Вій заворушиться, мандрівнику, у Заліссі буде доволі заліза. Гляди, щоб ти був тут.","line.radek.6":"Радек. Я кую коней і лагоджу плуги в Заліссі — хоч я тут лише гість. Обережно з ковадлом — воно кусається.","line.radek.7":"Мій дім — село за багато днів дороги звідси, далеко на заході. Я прийшов із весною, щоб позичити їм свій молот, — а дорога додому почекає, доки робота не скінчиться.","line.radek.8":"Болотяний залізняк! Ти знайшов брилу в мулі ставка — гостре око. Ще {n} таких — і це горно знову загуде.","line.radek.9":"Моя кузня стоїть холодна, доки я не дістану доброго заліза з болота. Болотяний залізняк спить у мулі ставка, мандрівнику, — темні брили, що поблискують там, де берег м'який. Три добрі брили розпалили б мій вогонь.","line.radek.10":"Якщо Лісовик тобі докучатиме, приходь до мене. Залізо вміє залагоджувати суперечки зі старими лісовими силами — у моїй країні, і тут теж.","line.radek.11":"А якщо ти питаєш про Вія — так, я чув перекази. Повіки такі важкі, що слуги мусять підіймати їх вилами. Кажуть, залізо співає проти таких. Коли настане той день, мандрівнику, моє горно краще б уже гріло.","line.domovyk.0":"Гм. Знову ти. …Хліб був добрий. Окраєць хрусткий, солі доволі. Сотню зим я стережу цю хату, а доброта й досі мене дивує, аж до печі.","line.domovyk.1":"Камінь, що я тобі залишив, — тримай біля ліжка. Він буде теплим у найхолоднішу ніч року. Це не обіцянка. Це Домовик, а ми кращі за обіцянки.","line.domovyk.2":"Спи спокійно в Заліссі, господарику. Твоє вогнище стережуть. Твою юшку доглядають. Твої миші — чемні.","line.domovyk.3":"…Ти повернувся. Окрайця вже нема, помітив? За піччю лише крихти й теплий дух. Я нічого не сказав. Хатні духи НЕ кажуть «дякую».","line.domovyk.4":"Але як виходитимеш, глянь на поріг цієї хати, новенький. Іноді вдячність… випадає з наших кишень. Ненароком. Гляди не перечепись.","line.domovyk.5":"Тсс, тсс — тихі кроки біля моєї хати. …А. Це новенький. Я Домовик. Я стережу цю хату: піч теплу, хліб пухкий, мишей чемних.","line.domovyk.6":"Ти ще не залишив хліба. Гм. Новенькі ніколи не залишають першої ночі. За піччю окраєць, дрібка солі — це все, чого я прошу, і прошу щозими вже сто років.","line.domovyk.7":"Біля сільського вогнища лежить окраєць, якщо руки в тебе порожні, а серце ні. Принеси його до моєї печі — до північної хати, гляди — і залиш тихенько.","line.domovyk.8":"Лісовик там зі своїми соснами вважає себе великим паном. Хай. Царства падають; тепле вогнище — ні.","line.domovyk.9":"…Від тебе пахне північно-східною стежкою. Ти був біля Вія. Не тупочи там, господарику. Якщо ті повіки колись піднімуться, жодна піч у Заліссі не втримає холоду, що прийде слідом.","line.lisovyk.0":"Стій, двоногий. …Як на селянина, ходиш ти тихо. Я Лісовик. Ці сосни — мої; стежки між ними — мої; заблукані — теж мої.","line.lisovyk.1":"Бери свої трави — кропиву, полин, маленькі сонця — ліс дає рукам, що просять. Але бери жадібно — і стежки закрутяться, і закрутяться, і ти до темряви вітатимешся з власними слідами.","line.lisovyk.2":"Око Весни на тобі. Під таким оком добре бути. Гляди, щоб так і лишалося.","line.lisovyk.3":"То ти його бачив — Вія в його улоговині. Навіть я обходжу те місце десятою дорогою, а я — сам ліс. Сон — єдиний ланцюг, що його тримає, мандрівнику. Гляди, щоб ніколи його не підпилював.","line.chort.0":"Мій улюблений клієнт! Душу повернуто, золото залишено, тінь пришито назад — ти торгуєшся жорсткіше за половину шабашу, а в НИХ є роги.","line.chort.1":"Без образ, мандрівнику. Угода є угода. …Хоча між нами? Я сумуватиму за твоєю тінню. Вона так гарно танцювала.","line.chort.2":"До речі, про танці — ти б бачив, як вона танцює на Лисій Горі. Гола гора, східна стежка з галявини, голе каміння й велике вогнище. У ночі шабашу я там господарюю: відьми, скрипки, сам Вельзевул на чолі. Приходь як мій гість. Гості, що приносять дар і стають до танцю, ідуть із більшим, ніж прийшли, — це обіцянка, а не угода. Здебільшого.","line.chort.3":"А-а, мій безтінний друже. Нічого не бракує опівдні? Глянь униз. НІЧОГО. Гарно, правда? А от золото — золото справжнє. Витрать його десь у теплі.","line.chort.4":"А як набриднуть тобі сільські вогники — Лиса Гора, мандрівнику. Гола гора, за східною стежкою. У ночі шабашу там танцює все військо, а мій гість — гість самого Вельзевула. З тінню чи без.","line.chort.5":"Га? Що то за запах — ставкова вода й карась? ДВІ риби, рахую, не рахуючи. …Ти знаєш ціну душі, мандрівнику. Зведемо рахунки?","line.chort.7":" Дві, а не три — твій язик і святого на шабаш умовить, а я лише чорт.","line.chort.6":"Якщо скучаєш за тією дрібничкою, я не безрозсудний: {price} рибин зі ставка — і душа знову твоя.{n} Чорти люблять рибу. Не питай чому. НІХТО не знає чому.","line.chort.8":"Псст. Псст! Сюди, біля жорна. …Що? Чорт не може потішитися сонячним днем? Я Чорт, мандрівнику, — купець, музика і скромний збирач… підписів.","line.chort.9":"За старих часів ми справляли добрий шабаш на старому млині — скрипки, танці, все військо! Тепер справляємо пишніше: на Лисій Горі — за східною стежкою, голе каміння, вогнище видно аж із Залісся. А на які весілля ми колись вривалися! Козацька душа — то марочне вино, друже. Але діло є діло, і сьогодні я купую.","line.chort.10":"Отже — угода, тільки між нами. Твоя душа: трохи вживана, один дбайливий власник. Навзамін? Золото, що ніколи не скінчиться. Кінь, що ніколи не втомиться. Серце Весни, молот Радека, борода Мирослава — називай! Підпиши тут. І тут. І кров'ю, отут — жартую! Чорнило теж годиться. Здебільшого.","line.bolotianyk.0":"Очерет розступається. З ряски здіймаються двоє очей, тоді голова, мов утоплена колода, сіро-зелена, і з неї стікає вода. Болотяник дивиться на тебе так, як глибока вода дивиться на камінь.","line.bolotianyk.1":"«Маленький сухоногий… мій ставок. Мій мул. Мої дзвони — церковні дзвони, що потонули тут іще до того, як твоє село мало назву. Я часом калатаю в них — для тих, хто забрів задалеко».","line.bolotianyk.2":"«Знахарка бере мій полин і дає мені спокій. Мудро. А ти — бери свої трави з трави, сухоногий. Те, що росте в МОЇЙ воді, не для твого кошика».","line.bolotianyk.3":"«А проте ти рибалиш у моєму ставку, сухоногий, і я дозволяю. Твоя волосінь чемна. Твоя тінь… гм. Твоя тінь останнім часом пахне тим чортом від жорна. Цікаво». Очі Болотяника трохи опускаються, стежачи.","line.bolotianyk.4":"«І перекажи селянам: Болотяник терплячий. Ставок був тут до Залісся. Ставок — і те, що спить в улоговині, — буде тут і після. Усе зрештою опускається до нас». Очі знову ховаються під воду, і брижі змикаються, ніби нічого й не було.","line.viy.0":"В улоговині — недобра тиша. Ні птахів. Ні комах. Лише звук, наче дихає гора — повільно, волого, терпляче.","line.viy.1":"Він величезний. Голова, мов валун, сіра, як давній попіл, і повіки — повіки, що звисають з чола аж до самої землі, жилаві й важкі, мов мокре вітрило. Двоє висохлих слуг спираються на вила, якими їх мали б підіймати. Вони не дивляться на тебе. Вони дивляться на повіки.","line.viy.2":"Під однією повікою щось ворушиться. Розкривається шпаринка тьмяного червоного світла — лише шпаринка, — і кожна волосина на тобі стає дибки. Слуги завмирають. Дихання стихає.","line.viy.3":"…Шпаринка закривається. Дихання поновлюється. Хоч би що снилося Вієві, це не ти. Поки що. Ти задкуєш дуже-дуже тихо, і птахи знову співають, лише коли вже видно сільське вогнище.","line.beelzebub.0":"Велетенська постать на кам'яному троні схиляє рогату голову — маленька, страхітлива чемність. «Гора пам'ятає своїх гостей, маленький смертний. Пам'ятає й камінь біля твого серця. Спускайся в теплі».","line.beelzebub.1":"Унизу відьми досі танцюють. Вони танцюватимуть так чи інакше ще довго після того, як Залісся стане казкою, яку розповідають бабусі. Ти сходиш стежкою з місячним сяйвом на плечах, наче плащем, який тобі позичили — і поки не хочуть забирати.","line.beelzebub.2":"Вельзевул підводиться — повільно, як підіймається негода. Скрипки збиваються. Кожен чорт на вершині обертається до тебе, а вогонь нахиляється, щоб слухати.","line.beelzebub.3":"«ТИ ПРИНІС ГОРІ ЇЇ КВІТИ. ТИ ТАНЦЮВАВ ЇЇ ТАНЕЦЬ. ШАБАШ НЕ ВІДПУСКАЄ ТАКОГО ГОСТЯ З ПОРОЖНІМИ РУКАМИ». Він розкриває одну величезну долоню. На ній, маленький, мов монета, і ясний, як край місяця: місячний камінь, холодний і лагідний.","line.beelzebub.4":"«БЕРИ. НЕ УГОДА — БЛАГОСЛОВЕННЯ. ЦЕ РІЗНІ РЕЧІ, І СЬОГОДНІ ТИ ЗАСЛУЖИВ ЦЮ РІЗНИЦЮ». Десь під вершиною, ледь чутно, раз дзвонить церковний дзвін, якого не існує, — і Болотяник йому відповідає.","line.beelzebub.5":"Зі свого трону з чорного каменю Вельзевул дивиться на тебе понад вогнем. Голос його не гучний. Він і не мусить бути гучним: гора несе його так, як несе грім.","line.beelzebub.6":"«ДАР ПОКЛАДЕНО. ДОБРЕ. ТЕПЕР — ТАНЕЦЬ, МАЛЕНЬКИЙ СМЕРТНИЙ. ГІСТЬ, ЩО ЛИШЕ ДИВИТЬСЯ, — ЛИШЕ ПІВГОСТЯ. СТАНЬ У КОЛО НА ПІВДЕНЬ ВІД ВОГНЮ І ТРИМАЙ ОБЕРТ». Одна пазуриста рука вказує на відьом у колі — майже, майже лагідно.","line.beelzebub.7":"Ти підходиш до кам'яного трону на північному краю вершини, і шабаш довкола тебе стихає: скрипки замовкають, відьми спиняються посеред оберту, сотня маленьких чортиків раптом дуже цікавиться своїми копитцями.","line.beelzebub.8":"Вельзевул старший за лисину цієї гори і вбраний, як найкращий похорон, який ти можеш уявити. «СМЕРТНИЙ. НА МОЇЙ ГОРІ. БЕЗ ДАРУ». Він каже це так, як староста помічає, що бракує стовпчика в паркані: не гнівно — занотовуючи.","line.beelzebub.9":"«ПРАВИЛА ДАВНІ, МАЛЕНЬКИЙ СМЕРТНИЙ, І НАВІТЬ Я ЇМ КОРЮСЯ. НА ЦИХ СХИЛАХ РОСТУТЬ НІЧНИКИ — НІЧНІ КВІТИ, БЛІДІ, ЯК КІСТКА. ПРИНЕСИ ТРИ ДО ЖЕРТОВНОГО КАМЕНЯ. ТОДІ Й ПОБАЧИМО, ХТО ТИ Є».","line.chort.11":"Ти прийшов, приніс дар, станцював, і сам Вельзевул тебе благословив. Знаєш, що це робить із моєю репутацією? НІЧОГО. Вона й так була пишна.","line.chort.12":"Носи місячний камінь гідно, мандрівнику. А як у Заліссі спитають, звідки він, — скажи: чортова гостинна ціна. Хай поміркують.","line.chort.13":"Ти ТАНЦЮВАВ! Усі бачили? Смертний танцював, а гора навіть не тріснула! А тепер — до великого крісла. У Вельзевула є благословення з твоїм ім'ям, видряпаним на ньому, а дряпає він ГЛИБОКО.","line.chort.14":"Дар покладено, і камінь ЩАСЛИВИЙ — а каміння ніколи не буває щасливим, от наскільки добре вийшло. Тепер танець, мандрівнику! На південь від вогню, у коло, тримай оберт. Навіть я не можу відтанцювати за гостя — я перевіряв. Двічі. Були… прикрощі.","line.chort.15":"Нічники! Три бліді красуні, і жодна пелюстка не пом'ята — ти поводишся з нічними квітами, мов природжена відьма. Жертовний камінь чекає на північ від вогню. Поклади їх лагідно. Гора помічає лагідність.","line.chort.16":"МІЙ ГІСТЬ ПРИБУВ! Ласкаво просимо на Лису Гору, мандрівнику, — мою контору, мою бальну залу, мій собор! Вельзевул головує, відьми танцюють, а вогонь — вогонь старший за твоє село і вдвічі чесніший.","line.chort.17":"Правила дому, а вони Вельзевулові, тож вирізьблені глибше за камінь: гість приносить горі дар. Нічники — нічні квіти — розкриваються на цих схилах, бліді місяченьки серед каміння. Збери три, поклади їх на жертовний камінь на північ від вогню, і шабаш твій. А потім танцюй з нами, і хтозна, які благословення впадуть із великого крісла.","line.chort.18":"І жодних підписів сьогодні! Правила шабашу. Навіть я раз на тиждень буваю чесним. …Здебільшого.","line.solokha.0":"Солоха робить реверанс — відьомський реверанс, у якому більше неба, ніж, здавалося б, потрібно. «Благословений самим великим. Спускайся гордо, дитино. А як Весна спитає про мене — скажи їй, що гора добре береже її сестру».","line.solokha.1":"Вона нічого не тицяє тобі в руку й нічого не просить. Від відьми з Лисої Гори це найрідкісніший дарунок.","line.solokha.2":"Ти танцюєш, як смертний, що збирається це пережити, — спритні ноги! А тепер до Вельзевула, поки вогонь не пригас. Благословення, дане при високому вогні, — то благословення, що тримається.","line.solokha.3":"Камінь прийняв твої квіти ласкаво — я відчула це крізь черевики. Тепер танцюй, дитино. Коло на південь від вогню. Не рахуй кроків: через рахунок смертні й випадають із музики.","line.solokha.4":"Три нічники, і зірвані на першому подиху цвіту — добре тебе Весна навчила, хто б ти не був. Жертовний камінь — на північ від вогню. Поклади їх і нікому не вклоняйся: гора не піп. Гора — господиня.","line.solokha.5":"Ну от — обличчя з-під стріх! Я Солоха: відьма, вдова й найкраща куховарка на цій горі, хоч що там кажуть чорти з повними ротами. Як на того, хто живе в долині, ти добре лазиш.","line.solokha.6":"Хочеш, щоб шабаш тебе привітав? То зроби все як слід, дитино. Нічники — нічні квіти — розкриваються на голих схилах, бліді, мов маленькі місяці. Три з них — на жертовний камінь, на північ від вогню. Така ціна гори, і вона чесніша за будь-яку чортову.","line.solokha.7":"А потім — танцюй. Гостя, що не танцює, гора забуває. А ти не хочеш, щоб тебе забула гора. Пам'ять у неї довга, а манер жодних.","line.motrya.0":"Мотря торкається двома пальцями світла місячного каменя й усміхається на всі зуби. «Тобі личить. Місячне сяйво зазвичай личить тим, кого обирає гора. Повертайся, коли воно згасне, дитино, — гори оновлюються».","line.motrya.1":"Мотря досі кружляє в луні кола й наспівує. «Ти втримав оберт. Велике крісло помітило. Іди по благословення, танцюристе, — я триматиму твоє місце в колі теплим».","line.motrya.2":"Мотря кивком показує на жертовний камінь, де ледь світяться твої нічники. «Покладено правильно. Тепер танець — на південь від вогню, дитино, і не думай про ноги. Ноги не люблять, коли про них думають».","line.motrya.3":"Маленька відьма з голосом, як у дрімлюги, відриває погляд від нічних квітів, які вплітає собі в коси. «Мотря. Я бережу нічники Лисої Гори — тобто знаю, де вони ховаються, і не така горда, щоб не сказати».","line.motrya.4":"«Схили, дитино. Там, де камінь найлисіший і збирається місячне світло, — там вони й розкриваються. Три для жертовного каменя. Рви їх лагідно: пом'ятий нічник — то пом'ята обіцянка, а ця гора рахує обіцянки».","line.motrya.5":"«Уже {flowers} у твоїй руці, бачу, — гора й це рахує. Ще {n}, дитино».","topic.myroslav.0":"Знову ти, мандрівнику? Залісся стоїть, здебільшого. Питай, що хочеш.","topic.myroslav.forest.label.0":"Ліс і Лісовик","topic.myroslav.forest.question.0":"Хто ходить лісом?","topic.myroslav.domovyk.label.0":"Домовик і хліб","topic.myroslav.domovyk.question.0":"Розкажи про хатнього духа.","topic.myroslav.viy.label.0":"Вій","topic.myroslav.viy.question.0":"Хто такий Вій?","topic.myroslav.radek.label.0":"Коваль Радек","topic.myroslav.radek.question.0":"Хто цей коваль?","topic.myroslav.dark.label.0":"Чорт і ставок","topic.myroslav.dark.question.0":"Чого тут варто боятися?","topic.myroslav.lysa.label.0":"Лиса Гора","topic.myroslav.lysa.question.0":"Що таке Лиса Гора?","topic.myroslav.growth.label.0":"Як тут стають кимось","topic.myroslav.growth.question.0":"Як у Заліссі стати кимось?","topic.vesna.0":"І глибока робота тобі відкрита: мій міцний настій — три трави, і випитий він гострить розум І око вдвічі глибше за звичайний (ІНТ +2, МДР +2). Твій ІНТ сягнув 3, знахарю. Сушарка його запропонує.","topic.vesna.1":"Одну таємницю я бережу для готовішого розуму: мій міцний настій — три трави, що дають ІНТ +2 і МДР +2 тому, хто вип'є. Відкривається з ІНТ 3; у тебе — {intTotal}. Вари звичайний настій — сушарка пам'ятає кожну партію.","topic.vesna.2":"Твій кошик пахне цілою левадою. Питай, знахарю, — від спритних рук у мене мало таємниць.","topic.vesna.3":"Лагідні руки. Що б ти хотів знати?","topic.vesna.herbs.label.0":"П'ять трав","topic.vesna.herbs.question.0":"Навчи мене трав.","topic.vesna.zvirobiy.label.0":"Звіробій, сором'язлива трава","topic.vesna.zvirobiy.question.0":"Чому звіробій від мене ховається?","topic.vesna.zvirobiy.0":"Звіробій тепер ні від кого в цьому селі не ховається — твоє око знає його, і стебло, і жовту зірочку. Ці двері відчинила Мудрість, а двері, відчинені ділом, стоять відчинені.","topic.vesna.cooking.label.0":"Куховарство біля вогнища","topic.vesna.cooking.question.0":"Що я можу зварити?","topic.vesna.cooking.0":"Над вогнищем висить казанок, і він не для краси: одна риба зі ставка й одна трава з торби — і вийде справжня юшка з карася. Це Куховарство, а ситий мандрівник ходить жвавіше. З'їж її у вікні Персонажа.","topic.vesna.alchemy.label.0":"Алхімія і міцний настій","topic.vesna.alchemy.question.0":"Навчи мене алхімії.","topic.vesna.alchemy.0":"Біля північно-східної хати стоїть моя сушарка: дві трави, оброблені терпляче, стають настоєм — це Алхімія. Вип'єш — і світ на якийсь час проясніє.","topic.vesna.pond.label.0":"Ставок і рибальство","topic.vesna.pond.question.0":"А що зі ставком?","topic.vesna.pond.0":"Коли трави відпочивають, спробуй берег ставка, західний. Терпляча волосінь ловить не лише карася — вона ловить тишу. А тиша теж ліки. Тільки зважай на Болотяника: то насамперед його вода.","topic.vesna.errand.label.0":"Чого ти від мене хочеш","topic.vesna.errand.question.0":"Чого тобі треба?","topic.vesna.errand.0":"Сьогодні нічого, гостроокий. Ліс тебе прийняв — тепер Залісся просить лише, щоб ти й далі був тим, що робиш.","topic.radek.0":"Мій дім — село за багато днів дороги звідси, далеко на заході. Я прийшов із весною, щоб позичити їм свій молот, — а дорога додому почекає, доки робота не скінчиться.","topic.radek.1":"Бережися іскор, мандрівнику. Питай.","topic.radek.2":"Ну? Обережно з ковадлом — воно кусається. Питай.","topic.radek.forge.label.0":"Розпалена кузня","topic.radek.forge.question.0":"Як там кузня?","topic.radek.horseshoe.label.0":"Підкова, що ти мені дав","topic.radek.horseshoe.question.0":"Чому саме підкова?","topic.radek.smithing.label.0":"Навчитися ковальства","topic.radek.smithing.question.0":"Навчи мене ковадла.","topic.radek.home.label.0":"Твій дім на заході","topic.radek.home.question.0":"Звідки ти, Радеку?","topic.radek.home.label.1":"Твій дім на заході","topic.radek.home.question.1":"Звідки ти, Радеку?","topic.radek.iron.label.0":"Болотяний залізняк для кузні","topic.radek.iron.question.0":"Чого бракує твоїй кузні?","topic.radek.lisovyk.label.0":"Залізо і Лісовик","topic.radek.lisovyk.question.0":"Чи залізо вгамує Лісовика?","topic.radek.viy.label.0":"Вій і залізо","topic.radek.viy.question.0":"Чи допоможе залізо проти Вія?","topic.domovyk.0":"Гм. Знову ти. …Ну, посидь трохи. Питай — тихенько.","topic.domovyk.1":"Тихі кроки, новенький. Ну, питай — тихенько.","topic.domovyk.bread.label.0":"Хліб","topic.domovyk.bread.question.0":"Чого ти від мене хочеш?","topic.domovyk.hearth.0":"Тепла каменюка","topic.domovyk.hearth.1":"Твоя хата і піч","topic.domovyk.hearth.2":"Розкажи про камінь.","topic.domovyk.hearth.3":"Розкажи про цю хату.","topic.domovyk.hearth.4":"Сотню зим я стережу цю хату: піч теплу, хліб пухкий, мишей чемних. Це не велика робота. Це робота, завдяки якій можлива вся інша.","topic.domovyk.lisovyk.label.0":"Лісовик","topic.domovyk.lisovyk.question.0":"А що лісовий дух?","topic.domovyk.lisovyk.0":"Лісовик там зі своїми соснами вважає себе великим паном. Хай. Царства падають; тепле вогнище — ні.","topic.domovyk.viy.label.0":"Вій","topic.domovyk.viy.question.0":"А що Вій?","topic.domovyk.viy.0":"…Від тебе пахне північно-східною стежкою. Ти був біля Вія. Не тупочи там, господарику. Якщо ті повіки колись піднімуться, жодна піч у Заліссі не втримає холоду, що прийде слідом.","topic.lisovyk.0":"Знову ти, двоногий. Ходиш тихіше за більшість. Питай.","topic.lisovyk.rules.label.0":"Закони лісу","topic.lisovyk.rules.question.0":"Які в тебе закони?","topic.lisovyk.vesna.label.0":"Око Весни","topic.lisovyk.vesna.question.0":"А що Весна?","topic.lisovyk.viy.label.0":"Вій","topic.lisovyk.viy.question.0":"А що Вій?","topic.lisovyk.domovyk.label.0":"Домовик","topic.lisovyk.domovyk.question.0":"А що хатній дух?","topic.lisovyk.domovyk.0":"Домовик? Божок крихт у теплій скрині, що живиться окрайцями й чемністю. Хай стереже свою піч — я стережу світ, що ростить для неї дрова. Ми не сваримося. Майже.","topic.lisovyk.lost.label.0":"Як блукають","topic.lisovyk.lost.question.0":"Що стається із заблуканими?","topic.lisovyk.lost.0":"Заблукані теж мої — я сказав це при першій зустрічі, і це не погроза. Ходи жадібно чи гучно — і стежки закрутяться, і закрутяться, і ти до темряви вітатимешся з власними слідами. Ходи тихо, бери лише дане — і сосни розступляться, мов чемні сусіди.","topic.chort.0":"Мій улюблений клієнт повернувся! Питай — жодного пера на видноті. Чесне слово.","topic.chort.settled.label.0":"Наша угода, закрита","topic.chort.settled.question.0":"Без образ?","topic.chort.lysa.label.0":"Лиса Гора і шабаш","topic.chort.lysa.question.0":"Розкажи про шабаш.","topic.chort.mill.label.0":"Шабаші на старому млині","topic.chort.mill.question.0":"Що бувало на старому млині?","topic.chort.mill.0":"За старих часів ми справляли добрий шабаш на старому млині — скрипки, танці, все військо, і сам Вельзевул на чолі! На весілля вривалися десятками. Козацька душа — то марочне вино, друже. Тепер справляємо пишніше на Лисій Горі — але до жорна в мене слабкість.","topic.chort.1":"Мій безтінний друг повернувся! Питай — усе обговорюється. Майже все.","topic.chort.soul.label.0":"Моя душа — ціна","topic.chort.soul.question.0":"Скільки коштуватиме моя душа?","topic.chort.gold.label.0":"Золото і моя тінь","topic.chort.gold.question.0":"Чи чесна була угода?","topic.chort.lysa.label.1":"Лиса Гора","topic.chort.lysa.question.1":"Розкажи про гору.","topic.chort.2":"Псст. Знову ти, мандрівнику? Питай — я знаю всяке. Дещо навіть правда.","topic.chort.who.label.0":"Хто ти?","topic.chort.who.question.0":"Що ти таке, власне?","topic.chort.mill.label.1":"Млин і шабаш","topic.chort.mill.question.1":"Що це за шабаш, про який ти кажеш?","topic.chort.viy.label.0":"Вій","topic.chort.viy.question.0":"Чого бояться чорти?","topic.chort.viy.0":"Вія? …Навіть я стишую голос, мандрівнику. Чорт торгує душами; Вій торгує кінцями. Якщо ті повіки колись піднімуться, весь мій шабаш танцюватиме йому на догоду — з дуже-дуже далекої відстані.","topic.chort.refused.label.0":"Твоя угода — відхилена","topic.chort.refused.question.0":"Шкодуєш, чорте?","topic.chort.refused.0":"Шкодую? Я? Ха! Ти відмовив, як староста, мандрівнику, — я ж казав, останній, хто мені відмовив, ним і став. Пропозицію закрито, а чорт тримає слово: ні пера, ні вмовлянь. Але коли Вій заворушиться і тобі знадобиться друг із вилами — ти знаєш, де жорно. Мої ціни лише РОСТУТЬ.","topic.chort.bargain.label.0":"Твоя угода ✒","topic.chort.bargain.question.0":"Що ти пропонуєш?","topic.bolotianyk.0":"Очі знову здіймаються з ряски. «Сухоногий. Ну, питай. Ставок має час».","topic.bolotianyk.bells.label.0":"Утоплені дзвони","topic.bolotianyk.bells.question.0":"Які дзвони дзвонять під ставком?","topic.bolotianyk.water.label.0":"Що росте у твоїй воді","topic.bolotianyk.water.question.0":"Чи можна брати те, що тут росте?","topic.bolotianyk.fishing.label.0":"Рибальство у твоєму ставку","topic.bolotianyk.fishing.question.0":"Ти не проти моєї вудки?","topic.bolotianyk.fishing.0":"«Ти ще не турбував моєї води волосінню, сухоногий. Рибаль, якщо мусиш, — із західного берега, чемно, і бери лише те, що ставок віддає. Що він тримає, те він тримає».","topic.bolotianyk.old.label.0":"Вій і старі сили","topic.bolotianyk.old.question.0":"Що тут найстаріше?","topic.beelzebub.viy.label.0":"Вій","topic.beelzebub.viy.question.0":"Чого боїться гора?","topic.beelzebub.viy.0":"«ВІЙ. ТАК. НАВІТЬ У ГОРИ Є СУСІД, ЯКОГО ВОНА НЕ ВІДВІДУЄ. ЙОГО ПОВІКИ ЗВИСАЮТЬ ДО ЗЕМЛІ, А ПІД НИМИ — КІНЕЦЬ. ХАЙ СПИТЬ, МАЛЕНЬКИЙ СМЕРТНИЙ. ДЕЯКИХ ГОСТЕЙ НЕ ПРИЙМАЮ НАВІТЬ Я».","topic.beelzebub.court.label.0":"Твій двір","topic.beelzebub.court.question.0":"Хто тут збирається?","topic.beelzebub.court.0":"«МІЙ ДВІР: ВІДЬМИ, ЩО ПЕРЕЖИЛИ СВОЇ СЕЛА, ЧОРТИ, ЩО ПЕРЕРОСЛИ СВОЇ МЛИНИ, І ОДИН СМЕРТНИЙ, ЩО ПРИЙШОВ УВІЧЛИВО. ВОГОНЬ СТАРШИЙ ЗА ЗАЛІССЯ. ТАНЕЦЬ СТАРШИЙ ЗА ВОГОНЬ».","topic.beelzebub.0":"«ГІСТЬ ГОРИ ПОВЕРНУВСЯ. ПИТАЙ, МАЛЕНЬКИЙ СМЕРТНИЙ».","topic.beelzebub.moonstone.label.0":"Місячний камінь","topic.beelzebub.moonstone.question.0":"Що ти мені дав?","topic.beelzebub.leaving.label.0":"Спуск із гори","topic.beelzebub.leaving.question.0":"Чи можу я йти з миром?","topic.beelzebub.1":"«ТИ ТАНЦЮВАВ, МАЛЕНЬКИЙ СМЕРТНИЙ. Є БЛАГОСЛОВЕННЯ З ТВОЇМ ІМ'ЯМ, ВИДРЯПАНИМ НА НЬОМУ. ПОПРОСИ — І ВОНО ТВОЄ».","topic.beelzebub.blessing.label.0":"Прийняти благословення ✦","topic.beelzebub.blessing.question.0":"Я приніс дар і танцював. Я прийшов по благословення.","topic.beelzebub.rules.label.0":"Закони гори","topic.beelzebub.rules.question.0":"Які тут закони?","topic.beelzebub.rules.0":"«ДАР ПОКЛАДЕНО. ТАНЕЦЬ ВІДТАНЦЬОВАНО. ТЕ, ЩО ЛИШИЛОСЯ, — МОЄ, ЩОБ ДАРУВАТИ. ТАКІ ЗАВЖДИ БУЛИ ЗАКОНИ, І НАВІТЬ Я ЇМ КОРЮСЯ».","topic.beelzebub.2":"«КАМІНЬ ПАМ'ЯТАЄ ТВОЇ КВІТИ. ПИТАЙ, МАЛЕНЬКИЙ СМЕРТНИЙ».","topic.beelzebub.dance.label.0":"Танець","topic.beelzebub.dance.question.0":"Що мені тепер робити?","topic.beelzebub.offering.label.0":"Дар","topic.beelzebub.offering.question.0":"Чи гідний був мій дар?","topic.beelzebub.offering.0":"«ЙОГО ПОКЛАДЕНО ПРАВИЛЬНО, І КАМІНЬ ПАМ'ЯТАЄ. ТЕПЕР ПОКАЖИ ГОРІ СВОЇ НОГИ, МАЛЕНЬКИЙ СМЕРТНИЙ».","topic.beelzebub.3":"«ПИТАЙ, МАЛЕНЬКИЙ СМЕРТНИЙ. ГОРА ВІДПОВІДАЄ НА ТЕ, ЩО САМА ОБИРАЄ».","topic.beelzebub.rules.label.1":"Закони і нічники","topic.beelzebub.rules.question.1":"Чого гора просить від гостя?","topic.beelzebub.who.label.0":"Хто ти?","topic.beelzebub.who.question.0":"Хто тут головує?","topic.chort.rules.label.0":"Правила дому","topic.chort.rules.question.0":"Які тут правила?","topic.chort.beelzebub.label.0":"Вельзевул","topic.chort.beelzebub.question.0":"Який він?","topic.chort.beelzebub.0":"Велике крісло? Вельзевул — це шабаш так само, як староста — це село, тільки борода в нього старша, пам'ять довша, а благословення СПРАВЖНІ. Як відтанцюєш — іди по своє.","topic.chort.3":"Мій гість повернувся! Питай — правила дому ті самі: жодних підписів, самі плітки.","topic.chort.blessing.label.0":"Благословення Вельзевула","topic.chort.blessing.question.0":"Він справді мене благословив?","topic.chort.telling.label.0":"Що сказати в Заліссі","topic.chort.telling.question.0":"Що мені розповісти селу?","topic.chort.4":"Мій гість повернувся! Питай — правила дому ті самі: жодних підписів, самі плітки.","topic.chort.dance.label.0":"Танець","topic.chort.dance.question.0":"Як я танцював?","topic.chort.5":"Мій гість повернувся! Питай — правила дому ті самі: жодних підписів, самі плітки.","topic.chort.dance.label.1":"Танець","topic.chort.dance.question.1":"Що тепер?","topic.chort.6":"Мій гість повернувся! Питай — правила дому ті самі: жодних підписів, самі плітки.","topic.chort.offering.label.0":"Жертовний камінь","topic.chort.offering.question.0":"Що робити з нічниками?","topic.chort.dance.label.2":"Танець","topic.chort.dance.question.2":"Розкажи про танець.","topic.chort.dance.0":"Танець — після дару, мандрівнику: коло на південь від вогню, тримай оберт, не рахуй кроків. Навіть я не можу відтанцювати за гостя. Я перевіряв. Двічі. Були прикрощі.","topic.chort.7":"Мій гість повернувся! Питай — правила дому ті самі: жодних підписів, самі плітки.","topic.chort.welcome.label.0":"Це місце","topic.chort.welcome.question.0":"Що це за місце?","topic.chort.nosign.label.0":"Жодних підписів?","topic.chort.nosign.question.0":"Сьогодні без угод?","topic.solokha.0":"Знову ти, дитино? Питай — вуха відьми — то її статок.","topic.solokha.vesna.label.0":"Весна — твоя сестра?","topic.solokha.vesna.question.0":"Ти знаєш Весну?","topic.solokha.vesna.0":"«Весну? Моя менша сестра доглядає тіла села — юшки, перев'язки, немовлята. Я доглядаю його таємниці. Між нами двома Залісся доглянуте повністю. Не кажи їй, що я назвала її „меншою“».","topic.solokha.offering.label.0":"Дар","topic.solokha.offering.question.0":"Як іде дарування?","topic.solokha.offering.0":"Покладено правильно, а потім станцьовано, дитино, — більшого гора від гостя й не попросила б. Вона пам'ятатиме тебе добром, а для гори це дуже багато пам'яті.","topic.solokha.dance.label.0":"Танець","topic.solokha.dance.question.0":"Розкажи про танець.","topic.solokha.dance.0":"Ти тримав оберт, ніби народився в колі, дитино. Відьми досі говорять про твої ноги — відьомська похвала, рідкісніша за їхні прокльони й удвічі міцніша.","topic.solokha.cooking.label.0":"Куховарство на горі","topic.solokha.cooking.question.0":"Ти справді найкраща куховарка гори?","topic.solokha.cooking.0":"«Найкраща куховарка на цій горі, хоч що там кажуть чорти з повними ротами. Мій секрет? Ніколи не готуй для того, кого не могла б і прокляти. Це загущує приправу».","topic.motrya.0":"«Уже {flowers} у твоїй руці, бачу, — гора й це рахує. Ще {n}, дитино».","topic.motrya.1":"Мотря відривається від плетіння. «Питай, дитино. Квіти почекають».","topic.motrya.nichnyky.label.0":"Де ховаються нічники","topic.motrya.nichnyky.question.0":"Де ростуть нічні квіти?","topic.motrya.offering.label.0":"Жертовний камінь","topic.motrya.offering.question.0":"Розкажи про жертовний камінь.","topic.motrya.offering.0":"«Жертовний камінь стоїть на північ від вогню. Три нічники, покладені лагідно, — і гора нахиляється ближче. Я відчувала це крізь черевики на кожному шабаші свого життя».","topic.motrya.dance.label.0":"Танець","topic.motrya.dance.question.0":"Як тут танцюють?","topic.motrya.dance.0":"«На південь від вогню, дитино, і не думай про ноги. Ноги не люблять, коли про них думають. Але спершу дар — коло не тримає місця для тих, хто прийшов із порожніми руками».","topic.motrya.moonstone.label.0":"Місячний камінь","topic.motrya.moonstone.question.0":"Що таке місячний камінь?","topic.motrya.moonstone.0":"«Коли велике крісло благословляє гостя, то місячним каменем — холодним, як вода з криниці, лагідним, як місячне сяйво. Принеси дар, станцюй і попроси його, дитино. Саме в такому порядку: гори вибагливі щодо порядку».","topic.LYSA_BLESSING_LINES.0":"Місячний камінь лягає тобі в долоню, холодний, як вода з криниці, і вдвічі ясніший. Десь усередині нього обертається серпик — повільно, терпляче — обличчям до тебе.","topic.LYSA_BLESSING_LINES.1":"Довкола вогнища відьми здіймають руки, чорти тупотять копитами, а сам Вельзевул схиляє рогату голову. У шабашу нова оповідка — про смертного, що прийшов увічливо, чесно приніс дар і танцював.","topic.LYSA_BLESSING_LINES.2":"Тепер на тобі благословення Лисої Гори. Нічна дорога вниз до Залісся буде коротшою за дорогу вгору. Для благословенних так завжди — у цьому, власне, й сенс благословень.","topic.CHORT_SIGNED_LINES.0":"Підписано! ПІДПИСАНО! Ох, мандрівнику, — ти зробив чортові ціле століття. Ось твоє золото. Чуєш, як воно ніколи не легшає? Оце добра штука. Оце ШАБАШНА штука.","topic.CHORT_SIGNED_LINES.1":"І жодних повернень… ну. Одне повернення, бо ти мені ПОДОБАЄШСЯ: риба зі ставка будь-коли викупить твою душу — ціна у вікні Персонажа, під Харизмою. Чорти й риба, мандрівнику. Не питай. А тепер — не помічаєш, чого бракує, коли йдеш на сонці? Глянь униз. Хе. ХЕ.","topic.CHORT_REFUSED_LINES.0":"…Ні? НІ? Ха! Ха-ха-ха! Ох, ти мені ПОДОБАЄШСЯ. Останній, хто мені відмовив, став старостою; той, що перед ним, — дуже здивованою жабою. Тоді бережи свою душу, мандрівнику. Але коли Вій заворушиться і тобі знадобиться друг із вилами — ти знаєш, де жорно. Мої ціни лише РОСТУТЬ.","topic.CHORT_TRADE_LINES.0":"Риба зі ставка, ще блищить. …Угода є угода, мандрівнику. Ось — одна душа, трохи з привидами, повертається до власника. А золото лиши собі. Чортове золото витрачається так само, а я не ШАХРАЙ.","topic.CHORT_TRADE_LINES.1":"Ось. Чуєш? Тепло. Вага. Тінь розливається біля твоїх ніг, ніби й не зникала. Приємно було мати справу. НІКОМУ не кажи, що я розм'як.","topic.well.name.0":"Стара криниця","topic.well.role.0":"Кинь камінчик, загадай бажання","topic.brewbench.name.0":"Сушарка Весни","topic.brewbench.role.0":"Алхімічний стіл · обери настій","topic.BREW_CHOICE_LINES.0":"Сушарка пахне полином і сонцем, а маленький казанок уже теплий. Тобі під силу два варива: звичайний настій (2 трави — ясний і проясняльний) і міцний настій Весни (3 трави — глибокий трунок, якого вона вчить лише з ІНТ 3; випитий, він дає ІНТ +2 і МДР +2). Казанок чекає. Що вариш?","viy.myroslav.vigil-after.label.0":"Ніч, яку ти вистояв ✦","viy.myroslav.vigil-after.question.0":"Чи справді все скінчилося?","viy.myroslav.vigil-after.0":"Скінчилося? Півень заспівав, повіки впали, і улоговина тепер — просто улоговина: трава, каміння, коло крейди, яке дощ не наважується змити. Прадід мого діда виставив би тобі за це цілу діжку, мандрівнику.","viy.myroslav.vigil-after.1":"Діжки в мене нема. Є село, що спить спокійно. Залишайся, скільки хочеш, — у Заліссі ти більше не гість.","viy.myroslav.oldway.label.0":"Вій ворушиться — давній звичай","viy.myroslav.oldway.question.0":"Вій ворушиться уві сні. Як Залісся колись його втримувало?","viy.myroslav.oldway.0":"Ти бачив червону шпаринку під його повікою. Бачив її колись і прадід мого діда. Він казав, що Вій ворушиться раз на кілька людських віків, і хтось мусить просидіти з ним одну цілу ніч, інакше він прокинеться назавжди.","viy.myroslav.oldway.1":"Давній звичай такий. Після смеркання накресли коло освяченою крейдою біля його улоговини. Стій у ньому, доки не заспіває півень. Нечисть повзтиме до крейди, а ти відганяй її давніми словами.","viy.myroslav.oldway.2":"А коли він закричить слугам ПІДНІМІТЬ МЕНІ ПОВІКИ — не дивись. Що б ти не чув, не дивись. Хто зустрінеться з Вієм очима, той додому не вертається.","viy.myroslav.oldway.3":"Ось крейда. Вісімдесят років вона пролежала в церковній скрині, чекаючи. Весна знає вінок, що притуплює його погляд, а Радекове залізо пече нечисть. Попроси їх. А тоді обирай свою ніч.","viy.myroslav.vigil.label.0":"Чування","viy.myroslav.vigil.question.0":"Розкажи ще раз про давній звичай.","viy.myroslav.vigil.0":"Після смеркання (з дев'ятої вечора до четвертої) накресли крейдяне коло біля його улоговини. Відганяй нечисть від крейди. Коли повіки підіймаються — НЕ ДИВИСЬ, і не дивись, доки погляд відкритий. Тримайся, доки не заспіває півень.","viy.myroslav.vigil.1":"Ти пробував {broken}× і щоразу повертався на власних ногах. Це більше, ніж більшість. Попоїж, відпочинь і йди знову. Міцніше серце (Витривалість) вміщає більше страху.","viy.myroslav.vigil.3":"Попоїж, перш ніж іти. Повне черево вміщає більше страху, ніж порожнє, казала моя бабуся, а вона поховала трьох чоловіків і жодного жалю.","viy.vesna.vigil-after.label.0":"Після чування","viy.vesna.vigil-after.question.0":"Вінок допоміг?","viy.vesna.vigil-after.0":"Допоміг, але вистояв ти. Вінок лише притуплює те, від чого тобі вистачає сміливості відвернутися. Відтоді левада легша, і мій сон теж.","viy.vesna.wreath.label.0":"Вінок проти його очей","viy.vesna.wreath.question.0":"Мирослав каже, ти знаєш вінок проти Вієвого погляду.","viy.vesna.wreath.0":"Знаю. Полин — на гіркоту, якої нечисть не терпить, звіробій — на сонце, яке він береже в пелюстках, і гілочка деревію, щоб їх зв'язати. Дай мені три трави з торби.","viy.vesna.wreath.1":"Ось. Носи його низько над чолом. Коли повіки підіймуться, його погляд заплутається в листі раніше, ніж дістане тебе: забере половину шкоди. Половину, знахарю. Однаково не дивись.","viy.vesna.wreath.2":"Знаю: полин, звіробій і деревій, щільно сплетені. Він ловить половину Вієвого погляду, перш ніж той дістане тебе.","viy.vesna.wreath.3":"Але треба знати звіробій, щоб зірвати його правильно, а твоє око ще не дозріло (МДР {wis}, а треба {WREATH_WIS}). Збирай інші трави — око росте зі збиранням.","viy.vesna.wreath.4":"Принеси мені в торбі {WREATH_HERBS} трави; у тебе {herbStock}. Світні латки дадуть.","viy.radek.vigil-after.label.0":"Після чування","viy.radek.vigil-after.question.0":"Залізо співало?","viy.radek.vigil-after.0":"Співало? Воно ВЕРЕЩАЛО, кажуть, щойно перша з них його торкнулася. Добре залізо. І добра рука, що його кувала. У моєму селі вирізали б твоє ім'я над дверима кузні. Тут я обійдуся підковою з твоєю літерою.","viy.radek.ironward.label.0":"Залізо для чування","viy.radek.ironward.question.0":"Чи допоможе залізо проти Вієвої нечисті?","viy.radek.ironward.0":"Чи допоможе? Нечисть не терпить холодного заліза. Дай мені один із виробів, що ти тут викував. Я витягну з нього цвяхи, три штуки, а ти вб'єш їх у крейду.","viy.radek.ironward.1":"Ось. Перші троє з тієї нечисті, що торкнуться твого кола, згорять, як солома. Далі — твої слова й твій дух, друже.","viy.radek.ironward.2":"Допоможе. Принеси мені один виріб, що ти сам викував на моєму ковадлі, і я витягну з нього цвяхи для твого крейдяного кола. Попрацюй у кузні й повертайся.","viy.radek.ironward.3":"Допоможе, але моє горно холодне. Спершу принеси болотяний залізняк із мулу ставка, а коли вогонь розгориться — викуй мені виріб власною рукою.","viy.domovyk.vigil-after.label.0":"Після чування","viy.domovyk.vigil-after.question.0":"Ти чув півня, господарику?","viy.domovyk.vigil-after.0":"Чув? Я сам його того ранку окрайцем годував! Ох, уся хата зітхнула, коли він заспівав. Спи в моєму ліжку, скільки хочеш, хранителю. Я навіть перестану ховати твої чоботи. Здебільшого.","viy.domovyk.vigil.label.0":"Чування","viy.domovyk.vigil.question.0":"Порадиш щось на ніч?","viy.domovyk.vigil.0":"Спершу виспись. Моє ліжко — твоє: лягай, і якщо гарно попросиш, я збуджу тебе надвечір. І НЕ ДИВИСЬ, хранителю. Я бачив, що робить дивлення. Не хочу потім те вимітати.","viy.lisovyk.vigil-after.label.0":"Після чування","viy.lisovyk.vigil-after.question.0":"У лісі стало тихіше.","viy.lisovyk.vigil-after.0":"Тихіше? Ліс СЛУХАЄ. Він сотню зим не чув ту улоговину порожньою. Тепер там співають птахи. Може, я й дозволю стежкам іти для тебе прямо, хранителю. Часом.","viy.lisovyk.vigil.label.0":"Чування","viy.lisovyk.vigil.question.0":"Чи допоможе мені ліс?","viy.lisovyk.vigil.0":"Ліс нікому не допомагає; він дивиться. Але скажу тобі лісову річ: нечисть іде з усіх боків разом, а мудрий підпускає її ближче й відганяє всю гуртом. Не марнуй слів на одну тінь.","viy.chort.vigil-after.label.0":"Після чування","viy.chort.vigil-after.question.0":"Ти дивився?","viy.chort.vigil-after.0":"Дивився? У мене було МІСЦЕ. Перший ряд, на жорні. Ох, як верещала та нечисть на Радековому залізі — музика! А коли півень заспівав… ну. Скажімо, я пішов раніше. Справи. Ти мені нічого не винен. Таке вперше.","viy.chort.vigil.label.0":"Чування","viy.chort.vigil.question.0":"Допоможеш із Вієм?","viy.chort.vigil.0":"Допомогти? Я чорт, а не староста! …Але дам тобі дещо задарма, хоч мені й боляче: повіки підіймаються ПОВІЛЬНО. Поки вони підіймаються, встигнеш відігнати нечисть, а тоді відвернися в останню мить. Нікому не кажи, що я був корисним.","viy.bolotianyk.vigil-after.label.0":"Після чування","viy.bolotianyk.vigil-after.question.0":"Ставок це відчув?","viy.bolotianyk.vigil-after.0":"«Ставок відчув, як він ПОТОНУВ, сухоногий. Глибоко, повз мої дзвони, повз дно всього. Крізь мою воду він не підніметься. Я ще ніколи не радів гостеві».","viy.bolotianyk.vigil.label.0":"Чування","viy.bolotianyk.vigil.question.0":"Що ти знаєш про Вієву нечисть?","viy.bolotianyk.vigil.0":"«Поки повіки підіймаються, нечисть іще повзе. Коли повіки ВІДКРИТІ, навіть нечисть завмирає: вона теж боїться того, що там під ними. На це й розраховуй, сухоногий. І принеси залізо. Вони ненавидять залізо».","viy.viyNarration.0":"Удень улоговина лише дихає. Слуги дрімають, спершись на вила. До темряви тут нічого не станеться. Крейда чекає в кишені. Повертайся після дев'ятої вечора або відпочинь у ліжку Домовика до сутінків.","viy.viyNarration.1":"Уночі улоговина дихає гучніше. Слуги не сплять: спираються на вила й шепочуть до повік. Червона шпаринка під однією з них ширша, ніж була.","viy.viyNarration.2":"Це не те, до чого виходять із порожніми руками. Мирослав досить старий, щоб пам'ятати, що робило Залісся колись. Спитай його.","viy.VIGIL_INTRO_LINES.0":"Ти стаєш на коліна й креслиш крейдяне коло — одну нерозривну лінію довкола себе. Слуги замовкають. Десь у темряві щось сміється, а тоді — багато чогось.","viy.VIGIL_INTRO_LINES.1":"Пам'ятай. ОБЕРІГ відганяє кожного духа біля крейди. Коли Вій закричить про повіки, вони підіймаються повільно; відвернися, перш ніж вони розкриються, і тримай «НЕ ДИВИТИСЬ», доки не впадуть. Тримайся, доки не заспіває півень.","viy.VIGIL_WON_LINES.0":"Далеко в Заліссі співає півень. Раз. Удруге. Нечисть верещить і розсипається, як попіл на вітрі.","viy.VIGIL_WON_LINES.1":"Слуги впускають вила. Вієві повіки падають зі звуком, наче під землею грюкнули двері. А тоді улоговина опускається: голова-валун, повіки, слуги — усе, нижче коріння. Трава змикається над ним.","viy.VIGIL_WON_LINES.2":"Над соснами рожевіє світанок. Ти досі в колі. Ти так і не глянув. ✦","viy.VIGIL_BROKEN_LINES.0":"Нерви не витримують. Не встигнувши й подумати, ти вже за колом і біжиш. Гілля, тин, двері Домовика…","viy.VIGIL_BROKEN_LINES.1":"Ти прокидаєшся вранці в його ліжку, роззутий, ковдра підіткнута під підборіддя. Крейда досі в кишені. Вій досі спить, і ніч можна спробувати знову.","ui.bed.name.0":"Ліжко Домовика","ui.bed.role.0":"Солома, овчина й тепло печі","ui.vigil.name.0":"Чування","ui.vigil.role.0":"Вієва улоговина · одна ніч","ui.enterHut.0":"Ти пригинаєшся й заходиш у хату Домовика — тепло від печі, пахне хлібом і димком.","ui.enterHut.1":"Ти пригинаєшся й заходиш у хату Весни — над головою трави, а в казанку дихає щось зелене.","ui.exitHut.0":"Знову надворі, на денному світлі галявини.","ui.chortChoice.0":"Ти підписав. Золото важке — а куди поділася твоя тінь?","ui.eatMeal.0":"Гаряча юшка з карася, ще й із травами. Ти почуваєшся міцнішим — ВИТ +1, поки ситий.","ui.drinkTonic.0":"Гірко, ясно, прозоро. ІНТ +1 і МДР +1, поки діє настій.","ui.drinkStrongTonic.0":"Темний, глибокий, удвічі ясніший — міцний настій Весни. ІНТ +2 і МДР +2, поки діє.","ui.sleepUntil.0":"{msg} Учорашня їжа й настої вже не діють.","ui.pickOption.0":"Ти спиш як убитий на теплому ліжку Домовика й прокидаєшся від пташиного співу.","ui.pickOption.1":"Ти продрімав увесь день. Щось маленьке смикає тебе за рукав: сутінки. Домовик дотримав слова.","ui.applyGrant.0":"Освячена крейда Мирослава — а з нею й давній звичай. До Вія можна вийти після смеркання.","ui.applyGrant.1":"Вінок Весни з полину й звіробою. Вієвий погляд забиратиме лише половину.","ui.applyGrant.2":"Три залізні цвяхи для крейди. Перші троє з нечисті згорять.","ui.endVigil.0":"Вія запечатано під улоговиною. Хранитель чування: МДР +1, ХАР +1 ✦","ui.carryBlockedToast.0":"Заважко — ти несеш {carriedWeight}/{carryCap}, а треба ще {addWeight} місця. Межу задає твоя СИЛ {str}; ковальство її підіймає. Спершу щось відклади — звари, свари настій, з'їж або віддай залізо Радекові.","ui.performBrew.0":"Міцному настою Весни треба 3 трави — у тебе {herbsIn}. Світні латки дадуть.","ui.performBrew.1":"Казанку треба 2 трави з торби — у тебе {herbsIn}. Світні латки дадуть.","ui.performBrew.2":"Міцний настій устоявся, темний, як криничана вода в сутінках! Алхімія, рівень {craftLevel} — ІНТ тепер {int}. Випий його у вікні Персонажа.","ui.performBrew.3":"Настій проясніє, ясний, як ранок у пляшці! Алхімія, рівень {craftLevel} — ІНТ тепер {int}. Випий його у вікні Персонажа.","ui.performBrew.4":"Дві пляшки міцного з однієї партії — ясний розум нічого не марнує (ІНТ {intNow}). · Алхімія, рівень {craftLevel}","ui.performBrew.5":"Дві пляшки з однієї партії — ясний розум нічого не марнує (ІНТ {intNow}). · Алхімія, рівень {craftLevel}","ui.performBrew.6":"Міцний настій Весни, темний і глибокий. · Алхімія, рівень {craftLevel} · у торбі: {stock}","ui.performBrew.7":"Настій, гіркий і ясний. · Алхімія, рівень {craftLevel} · у торбі: {stock}","ui.doInteract.0":"Місячний камінь Лисої Гори твій — МДР +1, ХАР +1, поки носиш його. 🌙","ui.doInteract.1":"Ти витяг старий чобіт. Ставок повертає те, що в нього кидає село.","ui.doInteract.2":"Улов: {fish} — уже в руках, і знову нема! Немає місця: несеш {carriedWeight}/{carryCap}, а риба важить 1. Межу задає твоя СИЛ {str}.","ui.doInteract.3":"Улов: {caught}! Рибальство, рівень {fishLevel} — СПР тепер {total}. Вікно клювання ширшає.","ui.doInteract.4":"Улов: {caught}! · Рибальство, рівень {fishLevel} (спіймано: {total})","ui.talk.0":"Твоя душа — і твоя тінь — знову твої.","ui.talk.1":"Радек тицяє тобі в руку теплу підкову — СИЛ +1, поки носиш її.","ui.gather.0":"Ти тягнешся до звіробою — і вагаєшся. Ти ще не знаєш цієї трави по-справжньому: перевірка МДР не вдалася (твоя МДР {wisNow}, треба 2). Спершу збери інші трави; око Весни навчить твоє. Латка лишається незірваною.","ui.gather.1":"Зібрано: {name}. Травництво, рівень {herbLevel} — МДР тепер {wis}.","ui.gather.2":"{name} — а під нею ховається ще одне стебло! Гостре око (МДР {wis}).","ui.gather.3":"Зібрано: {name} · Травництво, рівень {herbLevel} · у торбі: {flagCount}","ui.cast.0":"Закинув… тепер чекай, поки поплавець пірне.","ui.crust.0":"Ти береш окраєць — і дрібку солі. Для Домовика.","ui.offer.0":"Ти залишаєш окраєць за піччю, якнайтихіше. Щось у хаті зітхає — радісно.","ui.gift.0":"Гладенька річкова каменюка, тепла, як свіжий хліб. Подяка Домовика — ВИТ +1, поки тримаєш її.","ui.iron.0":"Нема як нести брилу — у торбі вже {satchelWeight}/{carryCap} без заліза, а брила болотяного залізняку важить 3. Межу задає твоя СИЛ {str}. Спершу щось звари, свари настій або з'їж.","ui.iron.1":"Ти смикаєш — найглибша брила не зрушує, загрузла в чорному мулі. Перевірка СИЛ не вдалася (твоя СИЛ {str}: щоб вирвати напевно, треба СИЛ 3, або удача наступного разу). Нічого не втрачено — спробуй ще.","ui.iron.2":"Болотяний залізняк — це вже три брили! Руки повні: неси їх Радекові в кузню.","ui.iron.3":"Із хлюпаючим звуком найглибша брила ВИРИВАЄТЬСЯ! Болотяний залізняк ({n}/3 для Радека).","ui.iron.4":"Болотяний залізняк! Важка, іржаво-темна брила ({n}/3 для Радека).","ui.wish.0":"Щось блищить на цямрині — щасливий камінчик. Криниці сподобалося твоє бажання (перевірка ХАР вдалася). Він додає рукам спритності (СПР +1).","ui.wish.1":"Криниця повертає лише твоє обличчя — цього разу без камінчика. Перевірка ХАР не вдалася (твоя ХАР {cha}); криниця любить тепліше слово. Познайомся з більшою частиною Залісся й загадай знову.","ui.cook.0":"Казанку треба 1 риба й 1 трава з торби. Ставок на заході, трави світяться в траві.","ui.cook.1":"Казанку треба риба — спершу закинь вудку з західного берега ставка.","ui.cook.2":"Казанку треба трава — спершу збери будь-яку світну латку (кропива, полин, календула, звіробій, деревій).","ui.cook.3":"Юшка з карася! Куховарство, рівень {craftLevel} — ВИТ тепер {con}. З'їж її у вікні Персонажа.","ui.cook.4":"Юшка з карася, навариста й парує. · Куховарство, рівень {craftLevel} · страв у торбі: {flagCount}","ui.smith.0":"Горно холодне. Перш ніж тут щось кувати, треба болотяного залізняку з мулу ставка — три брили для Радека.","ui.smith.1":"Залізу треба хвильку в жару — і твоїй руці теж. Перепочинь і бий знову.","ui.smith.2":"Молот дзвенить чисто! Ковальство, рівень {craftLevel} — СИЛ тепер {str}.","ui.smith.3":"Шедевр! Два добрі вироби з одного нагріву (СИЛ {str}). · Ковальство, рівень {craftLevel}","ui.smith.4":"Дзень… дзень… добрий виріб. · Ковальство, рівень {craftLevel} · викуваного в торбі: {flagCount}","ui.brew.0":"Казанку треба 2 трави з торби — у тебе {herbsIn}. Світні латки дадуть.","ui.bloom.0":"Нічник зібрано — це вже три. Поклади їх на жертовний камінь, на північ від вогнища.","ui.bloom.1":"Нічник зібрано · нічних квітів {n}/3 для дару","ui.offering.0":"Жертовному каменю треба 3 нічники — нічні квіти зі схилів. У тебе {have}. Мотря знає, де вони ховаються.","ui.offering.1":"Ти кладеш нічники на холодний камінь. Один за одним вони розкриваються — і все коло стоячих каменів ніби нахиляється ближче.","ui.dance.0":"Відьми хитають головами — ніякого танцю до дару. Спершу три нічники на камінь, на північ від вогню.","ui.dance.1":"Ти стаєш у коло й тримаєш оберт — відьми гукають, чорти тупотять, а вогонь танцює з тобою. Тепер: Вельзевул чекає.","ui.sleep.0":"Соло
