ще не було. Кажуть, вона пам'ятає кожне бажання. Навіть дурні.","item.WISH_LINES.2":"Плюх. По чорній воді йде коло, а в колі — зорі. Не ті. Забагато й надто близько. А тоді знову просто криниця.","item.WISH_LINES.3":"Ти бажаєш тихо, як учили старі кобзарі: не золота й не слави, бо такі бажання киснуть, як молоко. Мотузка рипить: схвалює.","item.WISH_LINES.4":"Унизу блискає срібна рибка — там, де риби бути не може. Знахарки кажуть: криничная рибка — бажання почули.","char.myroslav.name.0":"Мирослав","char.myroslav.pron.0":"","char.myroslav.role.0":"Отаман хутора · старий запорожець","char.vesna.name.0":"Весна","char.vesna.pron.0":"","char.vesna.role.0":"Знахарка · лікує людей і худобу","char.radek.name.0":"Радек","char.radek.pron.0":"","char.radek.role.0":"Коваль · лях, що втік од пана","char.domovyk.name.0":"Домовик","char.domovyk.pron.0":"","char.domovyk.role.0":"Хатній дух · господар печі","char.lisovyk.name.0":"Лісовик","char.lisovyk.pron.0":"","char.lisovyk.role.0":"Лісовий дух · пан сосон","char.chort.name.0":"Чорт","char.chort.pron.0":"","char.chort.role.0":"Купець душ · любить музику","char.bolotianyk.name.0":"Болотяник","char.bolotianyk.pron.0":"","char.bolotianyk.role.0":"Господар ставка й очерету","char.viy.name.0":"Вій","char.viy.pron.0":"","char.viy.role.0":"Спить. Не буди.","char.domovyk.name.1":"Домовик","char.domovyk.pron.1":"","char.domovyk.role.1":"Хатній дух · господар печі","char.vesna.name.1":"Весна","char.vesna.pron.1":"","char.vesna.role.1":"Знахарка · лікує людей і худобу","char.beelzebub.name.0":"Вельзевул","char.beelzebub.pron.0":"","char.beelzebub.role.0":"Господар шабашу · пан Лисої Гори","char.chort.name.1":"Чорт","char.chort.pron.1":"","char.chort.role.1":"Сьогодні — розпорядник шабашу","char.solokha.name.0":"Солоха","char.solokha.pron.0":"","char.solokha.role.0":"Відьма з Диканьки · вдова","char.motrya.name.0":"Мотря","char.motrya.pron.0":"","char.motrya.role.0":"Відьма · знає, де цвітуть нічники","char.LYSA_DANCERS.name.0":"Відьма","char.LYSA_DANCERS.role.0":"Танцює на шабаші","input.Joystick.0":"Ігрове поле — торкнись будь-де й тягни, щоб іти","input.Joystick.1":"Торкнись будь-де й тягни, щоб іти","time.timeLabel.0":"День {day} · {hh}:{mm} {icon}","ui.continue":"Продовжити","ui.zalissya":"Залісся","ui.next":"Далі","ui.farewell":"Бувай","ui.quests":"Завдання","ui.character":"Персонаж","stat.soulless":"Без душі","quest.section.story":"Історія","ui.hud.soulLost":"☠ Без тіні — душа в Чорта (викуп: {price} риби)","ui.hud.overfull":"🎒 Переповнено ({carried}/{cap}) — нового не підняти","ui.vigil.secondsLeft":"{s} с","ui.dialogue.youAsk":"Ти питаєш: «{question}»","ui.quests.intro":"Виконано {done} з {total}. Позначка «{now}» — де зараз історія. Решта почекає: блукати не гріх.","ui.stats.from":"від: {feeds}","ui.stats.footer":"Очок тут не роздають. У Заліссі ти стаєш тим, що робиш. Чорт зараз цінує твою душу в {price} риби.","ui.skills.feeds":"→ {stat}","ui.skills.level":"Рівень {level}","ui.satchel.basics":"🌿 трав: {herbStock} · 🎣 риби: {fish}","ui.satchel.carrying":"🎒 Несеш {carried} / {cap} (межу задає СИЛ {str}). Вага: риба 1 · трава 1 · підкова 2 · залізо 3 · нічники й червінці 0.","line.chort.5b":"Ану, що то пахне? Ставком і карасем! ТРИ риби, рахую, навіть не рахуючи. Ну що, кобзарю, зведемо рахунки?","ui.language":"Мова","song.name.holota":"Дума про козака Голоту","song.name.kolyskova":"Колискова «Ой ходить сон»","song.name.hopak":"Гопак","song.name.burya":"Дума про бурю на Чорному морі","song.topic.vesna.label":"Колискова","song.topic.vesna.question":"Навчиш мене колискової?","song.topic.vesna.0":"«Ой ходить сон коло вікон, а дрімота — коло плота…» Мама мені співала, а я — всім хворим дітям на хуторі. Слухай і запам'ятовуй.","song.topic.vesna.1":"Заспівай її в хаті Домовика, як лягатимеш. Він удаватиме, що не слухає, а вранці встанеш, ніби тебе мама сповила. Статура +1 до світанку.","song.topic.chort.label":"Гопак","song.topic.chort.question":"Ти, кажуть, музика. Навчиш гопака?","song.topic.chort.0":"Навчу! Задарма! Бачиш, як мені боляче це казати? Гопак — то чортова музика, що її козаки в нас поцупили, а ми й не сердимось: гарно ж танцюють.","song.topic.chort.1":"Ось: раз-два, раз-два-три, а тоді вдар по струнах, наче за тобою сотня татар женеться. Без гопака на Лисій Горі тебе й на поріг не пустять.","song.topic.motrya.label":"Гопак","song.topic.motrya.question":"Навчиш мене гопака?","song.topic.motrya.0":"«Слухай». Мотря наспівує, притупуючи, і за хвилину твої пальці вже самі знають, куди бігти. «Чорт би теж навчив, та потім розповідав би всім, що ти йому винен».","ui.fire.name":"Вогнище","ui.fire.role":"Тут увечері збирається хутір","ui.play.audience.holota":"Дума про Голоту — як голий козак пана-ляха провчив. Радек сміється найголосніше: «Добже йому, добже!»","ui.play.audience.kolyskova":"Колискова. Говір стихає. Хтось із баб утирає очі хусткою, а отаман удає, що йому в око попав дим.","ui.play.audience.hopak":"Гопак! За мить уже весь хутір навприсядки, навіть отаман зі своєю спиною. Звідкись із темряви долинає підозріле цокання копит.","ui.play.audience.burya":"Дума про бурю на Чорному морі. Над вогнем стоїть тиша, така, що чути, як тріщить жар. Ніхто не каже ні слова. Усі знають, яку ніч ти вистояв.","ui.song.learned":"Нова пісня: {song} 🎶","ui.sleep.rested":"Уночі Домовик тихенько мугикав твою колискову. Ти виспався, як дитина. Статура +1 до світанку.","ui.dance.noHopak":"Ти береш кобзу — а що грати? Тут танцюють тільки під гопака. Його знають Чорт і Мотря.","ui.play.daytime":"Удень хутір у полі. Слухати буде нікому — приходь увечері, з шостої.","ui.play.alreadyPlayed":"Сьогодні ти вже грав. Люди розходяться — завтра попросять ще.","ui.play.first":"Ти сідаєш на колоду, і хутір потроху збирається: отаман із люлькою, Весна з кошиком, Радек сідає трохи осторонь. Чекають. Що заграєш?","ui.play.prompt":"Хутір збирається біля вогню. Що заграєш?","ui.promptLabel.play":"Заграти на кобзі 🎶","ui.satchel.songs":"🎶 Пісні: {songs}","ui.skillRows.name.music":"Кобзарство","ui.skillRows.stat.music":"ХАР","stat.rested":"Виспався під колискову","quest.evening.title":"Перший вечір біля вогню","quest.evening.done":"Хутір тебе слухав · вечорів: {played}","quest.evening.detail":"Увечері (з 18:00) сядь на колоду біля вогнища й заграй хуторові","quest.evening.now":"Вечір! Сідай біля вогнища й заграй хуторові","quest.evening.wait":"Як настане вечір (18:00), заграй біля вогнища","quest.lysa-sabbath.hopak":"Шабаш танцює тільки під гопака — навчись у Чорта або в Мотрі","char.gnat.name":"Гнат","char.gnat.pron":"","char.gnat.role":"Чумацький отаман · везе сіль із Криму","char.ostap.name":"Остап","char.ostap.pron":"","char.ostap.role":"Наймолодший чумак · горить у гарячці","char.ostap.roleWell":"Наймолодший чумак · уже на ногах","song.name.zhentsi":"«Ой на горі та й женці жнуть»","song.name.rozpriahaite":"«Розпрягайте, хлопці, коней»","song.name.voly":"«Ой ви, воли мої половії»","song.name.polechko":"«Ой полечко, поле»","song.topic.myroslav.label":"Пісня з Січі","song.topic.myroslav.question":"Що співали на Січі?","song.topic.myroslav.0":"«Ой на горі та й женці жнуть». Під неї військо йшло долиною, а ми, молоді, кричали так, що коні вуха притискали.","song.topic.myroslav.1":"Бери, кобзарю. Співай її, коли люди веселі — вона для свята. Тільки рядок про Сагайдачного й люльку співай голосніше: то мій улюблений.","song.topic.radek.label":"Козацька пісня","song.topic.radek.question":"Ти, лях, знаєш козацькі пісні?","song.topic.radek.0":"Знаю одну! «Розпрягайте, хлопці, коней». Вивчив за перший рік, щоб на весіллях мене не били. Подіяло. Наполовину.","song.topic.radek.1":"Бери. Я співаю її гірше, ніж кую, а кую я добже. Тобто — гарно. Весела пісня. На свята.","chumak.news.arrived":"Світанок. На східній дорозі — чумацький табір: віз із сіллю, сірі воли. І хтось лежить біля воза, не встаючи.","chumak.news.died":"Світанок. Біля чумацького воза копають яму. Остап не дожив до ранку.","chumak.toast.vesnaTonic":"Весна мовчки кладе тобі в торбу пляшечку настоянки. «Я тобі нічого не давала».","chumak.toast.persuaded":"Отаман махнув рукою. Весна вже біжить до табору з кошиком.","chumak.toast.treated":"Ти тримаєш Остапові голову, поки він п'є. До вечора жар спадає. Хутір про це дізнається — хутір завжди дізнається.","chumak.gnat.intro":"Сивий чумак із дьогтем на сорочці підводиться назустріч. «Кобзар? Слава Богу, хоч хтось підійшов. Я Гнат. Ведемо сіль із Криму. А цей… це Остап. Мій небіж».","chumak.gnat.again":"Гнат підводить червоні від безсоння очі. «Ну що, кобзарю?»","chumak.gnat.t.ostap.label":"Що з хлопцем?","chumak.gnat.t.ostap.question":"Що з Остапом?","chumak.gnat.ostap.0":"Гарячка. Напився з болотяної калюжі під Перекопом — молодий, дурний, спраглий. Третій день горить. Учора ще говорив. Сьогодні мене не впізнає.","chumak.gnat.ostap.1":"До ранку не доживе, якщо ніхто не допоможе. Я тридцять років по шляху. Я знаю, як воно виглядає.","chumak.gnat.t.why.label":"Чому вас не пускають?","chumak.gnat.t.why.question":"Чому ви тут, а не на хуторі?","chumak.gnat.why.0":"Ваш отаман побачив хворого — і поставив хлопців із кілками на дорозі. Каже: чумаки чуму носять. Чума, чумак — для нього одне слово.","chumak.gnat.why.1":"Я на нього не серджуся. Бачив я хутори після моровиці. Але це не моровиця, кобзарю. Це болотяна вода. А він і знахарці вашій заборонив до нас іти.","chumak.gnat.t.road.label":"Чумацький шлях","chumak.gnat.t.road.question":"Звідки ви йдете?","chumak.gnat.road.0":"З Криму, із соляних озер. Сіль, рибу, а як пощастить — то й новини. Півроку в дорозі, волам у хвости, дощам у пику.","chumak.gnat.road.1":"Ти знаєш, чому чумаки сорочки дьогтем мажуть? Щоб воші не їли й щоб мати впізнала, як привезуть. Отак, кобзарю. Ми їдемо — а за нами пісні.","chumak.gnat.healedIntro":"Гнат усміхається вперше за тиждень. «Живий, шибеник! Сидить і вже кашу просить».","chumak.gnat.t.thanks.label":"Подяка","chumak.gnat.t.thanks.question":"Як він?","chumak.gnat.thanks.0":"Слабкий, як кошеня, але живий. Завтра на світанку рушаємо — до Полтави ще далеко.","chumak.gnat.thanks.1":"Чумаки боргів не забувають. Будеш колись на шляху — кожен табір від Криму до Києва тебе нагодує. Скажеш: Гнат казав.","chumak.gnat.t.polechko.label":"Чумацька пісня","chumak.gnat.t.polechko.question":"Заспіваєш мені чумацької?","chumak.gnat.polechko.0":"Є в нас одна, «Ой полечко, поле». Її співають у дорозі, коли степ без краю, а дому не видно. Сумна. Але без неї чумак не чумак.","chumak.gnat.polechko.1":"Гнат співає тихо, хрипко, і навіть воли перестають жувати. Тепер вона твоя. Співай її, коли людям важко на серці. Веселим не співай — не зрозуміють.","chumak.gnat.deadIntro":"Гнат сидить біля свіжої могили, з батогом на колінах. Довго мовчить. «…Кобзар».","chumak.gnat.t.grief.label":"Остап","chumak.gnat.t.grief.question":"Мені шкода.","chumak.gnat.grief.0":"Шкода. Усім шкода. Отаманові вашому теж, я бачив: стояв на дорозі й дивився, як ми копаємо. Не підійшов.","chumak.gnat.grief.1":"Я не кажу, що ти винен. Ти тут чужий, як і ми. Але як будеш колись співати думу про чумаків — заспівай і про цю ніч. Хай пам'ятають.","chumak.gnat.t.polechkoDead.label":"Пісня над могилою","chumak.gnat.t.polechkoDead.question":"Що ви співали вночі над ним?","chumak.gnat.polechkoDead.0":"«Ой полечко, поле». Її співають над тими, хто лишився в степу. Остап знав її з малку, бо батько його теж не повернувся зі шляху.","chumak.gnat.polechkoDead.1":"Бери. Кобзар має знати і таку. Співай її, коли люди в горі. І ніколи — для забави.","chumak.gnat.t.voly.label":"Остапова пісня","chumak.gnat.t.voly.question":"Яку пісню любив Остап?","chumak.gnat.voly.0":"«Ой ви, воли мої половії». Співав її волам цілу дорогу — фальшиво, як молодий півень. Співай і ти. Хай хоч пісня доїде додому.","chumak.ostap.sickIntro":"Хлопець на кожусі ледь розплющує очі. Губи потріскані. «Мамо?.. Ні. Ти не мама. Пити…»","chumak.ostap.t.tonic.label":"Напоїти настоянкою ⚗","chumak.ostap.t.tonic.question":"(Піти проти отаманового слова й напоїти його.)","chumak.ostap.tonic.0":"Ти підводиш йому голову. Він п'є жадібно, давиться, п'є знову. Гнат стоїть за спиною й не дихає.","chumak.ostap.tonic.1":"За годину Остап засинає — уперше по-справжньому. Лоб мокрий. Жар спадає. Хтось із хутора бачив, як ти йшов до табору.","chumak.ostap.t.help.label":"Що тобі дати?","chumak.ostap.t.help.question":"Чим тобі допомогти?","chumak.ostap.help.0":"Він не відповідає, тільки тремтить. Без ліків тут не обійтися. Знахарка знала б, що робити. Або хтось, хто вміє варити настоянки.","chumak.ostap.t.home.label":"Дім","chumak.ostap.t.home.question":"Звідки ти?","chumak.ostap.home.0":"«З-під Полтави… Мати ворота фарбує на Великдень… Синім… Скажи їй, що я сіль віз… що не злякався…»","chumak.ostap.wellIntro":"Остап сидить біля воза, блідий, але усміхнений, і доїдає третю миску. «Ти той кобзар! Гнат казав. Я тобі тепер винен».","chumak.ostap.t.voly.label":"Твоя пісня","chumak.ostap.t.voly.question":"Чим віддячиш? Піснею?","chumak.ostap.voly.0":"«Ой ви, воли мої половії»! Я її волам співаю цілу дорогу, а вони мене терплять. Слухай.","chumak.ostap.voly.1":"Співає він фальшиво й щасливо, а Гнат за возом утирає очі, удаючи, що дим. Пісня рівна, дорожня — на будь-який вечір.","chumak.ostap.t.otaman.label":"Отаман","chumak.ostap.t.otaman.question":"Не тримаєш зла на отамана?","chumak.ostap.otaman.defied":"«Гнат каже, він боявся. Ну… я теж боявся. Тільки мене за це ніхто не судить». Він замовкає. «А тебе він тепер судитиме, га?»","chumak.ostap.otaman.relented":"«Він сам приходив. Стояв отут, кашляв, кашляв, а тоді сказав: „Ти вибач старому дурню“. І пішов. Дивний у вас отаман. Добрий».","chumak.otaman.t.ask.label":"Чумаки","chumak.otaman.t.ask.question":"Чому ти не пускаєш Весну до чумаків?","chumak.otaman.no.0":"Мені було сім, коли до нашого села прийшов чумацький обоз. З одним хворим. Через місяць із сорока хат лишилось дев'ять. Я ховав матір сам, кобзарю. Сам.","chumak.otaman.no.1":"У мене тут сорок душ. Діти. Весна в нас одна. Піде до них — принесе сюди. Хай мене за це Бог судить, а не ти.","chumak.otaman.no.2":"Ти тут кілька днів, співаче. Тебе ще не слухає хутір — то й я не слухатиму. Хай люди тебе спершу полюблять. (Потрібна ХАР 3.)","chumak.otaman.yes.0":"Мені було сім, коли чумацький обоз приніс моровицю в наше село. Я ховав матір сам. Ти це знаєш? …Знаєш. Тобі люди розповіли. Тобі люди тепер усе розповідають.","chumak.otaman.yes.1":"Щовечора ти співаєш моїм людям, а вони тебе слухають, як мене колись слухала Січ. І якщо ти кажеш, що це болотяна вода, а не моровиця…","chumak.otaman.yes.2":"…Весно! Іди. Бери що треба. Тільки потім руки мий у трьох водах, чуєш? І… скажи тому хлопцеві, що старий дурень просить вибачення.","chumak.otaman.t.after.label":"Чумаки","chumak.otaman.t.after.question":"Як ти тепер?","chumak.otaman.after.died":"Я стояв на дорозі й дивився, як вони копають. Не підійшов. Не зміг. Це була не моровиця, кобзарю. Весна каже — вода.","chumak.otaman.after.died2":"Я сорок душ уберіг від того, чого не було. А одну втратив. Запиши це в думу, як складатимеш. Хай знають, який був отаман у Заліссі.","chumak.otaman.after.defied":"Ти пішов проти мого слова. На хуторі так не роблять. За таке на Січі… — він махає рукою. — А хлопець живий.","chumak.otaman.after.defied2":"Я не знаю, що мені з тобою робити, кобзарю. Ти мав рацію. Не звикай до цього.","chumak.otaman.after.relented":"Знаєш, що найважче? Не страх. Сказати вголос, що боїшся. Ти мене змусив. Дякую.","chumak.otaman.after.relented2":"Чумаки обіцяли привезти нам сіль наступного літа. Задарма. Ну, майже — Гнат хоче, щоб ти заспівав.","chumak.vesna.t.ask.label":"Чумаки","chumak.vesna.t.ask.question":"Ти можеш допомогти тому хлопцеві?","chumak.vesna.sick.0":"Можу. Це болотяна гарячка, не моровиця, я таке сто разів лікувала. Настоянка зіб'є жар. Але отаман заборонив. А я живу серед цих людей, кобзарю. Не проти них.","chumak.vesna.sick.give":"…Але мені ніхто не забороняв варити настоянки. І класти їх у чужі торби, коли ніхто не бачить. Що ти з нею зробиш — то вже твоя совість.","chumak.vesna.sick.1":"У тебе вже є настоянка. Ти знаєш, що з нею робити. І знаєш, що скаже отаман. Обирай сам.","chumak.vesna.t.after.label":"Чумаки","chumak.vesna.t.after.question":"Як ти?","chumak.vesna.after.died":"Я могла його врятувати. Від мене до табору — триста кроків. Я їх так і не пройшла. Не питай мене про це більше.","chumak.vesna.after.healed":"Хлопець житиме. Болотяна гарячка, як я й казала. Отаман тепер ходить тихий. Може, це й на краще.","chumak.radek.t.label":"Чумаки","chumak.radek.t.question":"Що думаєш про чумаків?","chumak.radek.0":"Мене колись теж не пускали на хутір. Лях, втікач, хтозна що в торбі. Стояв під тином два дні. Пустив мене… твій отаман. Дивно, правда? Люди забувають, ким були.","chumak.radek.dead":"Я йому підкову для вола зробив. Вона тепер на хресті висить. Пся крев, кобзарю. Пся крев.","chumak.chort.t.label":"Чумаки","chumak.chort.t.question":"Ти бачив, що діється на дорозі?","chumak.chort.0":"Бачив, аякже. Отаман боїться чуми і через страх дає хлопцеві згоріти. А кажуть, що це я злий!","chumak.chort.1":"Знаєш мою найкращу таємницю, кобзарю? Мені майже не треба працювати. Люди самі собі чорти. Я тільки підписи збираю.","chumak.domovyk.t.label":"Ніч","chumak.domovyk.t.question":"Ти чув уночі?","chumak.domovyk.dead":"Чув. Уся хата чула, як вони співали над ним. Я цілу ніч топив піч, хоч було тепло. Так роблять, коли хтось іде. Щоб не замерз у дорозі.","chumak.grave.name":"Могила біля дороги","chumak.grave.role":"Остап, чумак із-під Полтави","chumak.grave.sing.0":"Ти сідаєш біля хреста й тихо береш перший акорд «Ой полечко, поле». Батіг на хресті гойдається від вітру, ніби підтакує.","chumak.grave.sing.1":"Ніхто не слухає. Тільки степ. Але після такої пісні ти розумієш щось про неї, чого не розумів раніше. (Кобзарство +1)","chumak.grave.after":"Свіжа земля вже вкривається травою. Хтось із хутора приніс польові квіти. Може, отаман.","chumak.grave.quiet":"Хрест із двох жердин і чумацький батіг. Ти довго стоїш мовчки. Пісні для такого в тебе ще нема.","ui.promptLabel.grave":"Постояти біля могили","ui.play.match":"{song} — саме те, що треба було хуторові сьогодні. Кобзарство {level}.","ui.play.fine":"{song} — хутір слухав і приніс миску кулешу. Кобзарство {level}.","ui.play.clash":"{song} — не той вечір для цієї пісні. Люди розходяться. Кобзарство {level}.","ui.play.levelUpTail":"ХАР тепер {cha}.","ui.play.clash.sad":"Ти вдаряєш весело — і бачиш, як баби підтискають губи, а отаман дивиться в землю. Сьогодні в хуторі горе. Хтось тихо каже: «Совісті нема в того співака». Кулешу тобі ніхто не несе.","ui.play.clash.happy":"Ти заводиш сумну — а люди прийшли веселитися. Молодь переглядається, дівчата позіхають, хтось шепоче: «Ну й поховав він нам свято». Кулешу ніхто не несе.","ui.mood.mourning":"Сьогодні тихо: біля дороги свіжа могила.","ui.mood.chumakFeast":"Чумаки гуляють із хутором — хлопець живий! Усі хочуть веселого.","ui.mood.wedding":"У Петренків заручини — молодь чекає чогось веселого.","ui.mood.memorial":"Сьогодні поминки по старій Явдосі. Люди тихі.","ui.mood.ordinary":"Звичайний вечір: косарі втомлені, діти сонні.","ui.songMood.happy":"весела","ui.songMood.neutral":"на будь-який вечір","ui.songMood.sad":"сумна","ui.play.audience.zhentsi":"«Ой на горі та й женці жнуть» — і отаман уже підспівує басом, відбиваючи такт люлькою по коліну. На рядку про Сагайдачного й люльку весь хутір реве разом із ним.","ui.play.audience.rozpriahaite":"«Розпрягайте, хлопці, коней» — і дівчата вже в колі. Радек підспівує з таким акцентом, що сміються навіть коні.","ui.play.audience.voly":"«Ой ви, воли мої половії» — рівна, дорожня. Старі кивають у такт, діти засинають у матерів на колінах.","ui.play.audience.polechko":"«Ой полечко, поле». Пісня тягнеться, як степова дорога. Ніхто не говорить. Весна дивиться у вогонь, отаман — кудись далеко на схід.","quest.section.chumaky":"Чумаки","quest.chumaky.title":"Гарячка","quest.chumaky.sick":"Молодий чумак Остап горить у гарячці. Отаман не пускає до табору Весну. До світанку — вирішуй.","quest.chumaky.died":"Остап помер на світанку. Біля дороги — могила.","quest.chumaky.defied":"Ти пішов проти отаманового слова — і Остап живий.","quest.chumaky.relented":"Отаман відступив, Весна пішла до табору — Остап живий.","quest.chumaky.objective":"Чумак на східній дорозі помирає. Поговори з Гнатом — до світанку","tobacco.news.dry":"Світанок. На сушарці Весни тютюн висох — темний, пахучий, аж у носі лоскоче. Неси отаманові.","tobacco.toast.started":"Отаманові потрібен тютюн. Старе тютюнове поле — за річкою, біля чумацького шляху.","tobacco.toast.leaf":"Тютюнове листя · {n}/{need}","tobacco.toast.leavesDone":"Листя досить ({n}/{need}), і прядиво є. Неси на сушарку Весни.","tobacco.toast.leavesNeedHemp":"Листя досить ({n}/{need}). Тепер конопляного прядива — зв'язати. Конопляне поле на південь від хутора.","tobacco.toast.hemp":"Ти надираєш із конопель пасмо міцного прядива. Таким і віз зв'язати можна, не те що тютюн.","tobacco.toast.hung":"Ти зв'язуєш листя прядивом і вішаєш на сушарку Весни. До ранку висохне.","tobacco.toast.lyulka":"Отаман дарує тобі свою стару люльку. На чуванні в Вія — Мужність +2.","tobacco.prompt.leaf":"Зірвати тютюнове листя 🍂","tobacco.prompt.hemp":"Надерти конопляного прядива","tobacco.prompt.hang":"Повісити тютюн сушитися","tobacco.keepsake":"🪈 Стара люлька отамана (Мужність +2 на чуванні)","tobacco.otaman.t.ask.label":"Люлька без тютюну","tobacco.otaman.t.ask.question":"Чого ти, отамане, люльку смокчеш порожню?","tobacco.otaman.ask.0":"Бо тютюну нема, синку! З весни. Чумаки не довезли, а я без люльки — як Січ без отамана: стою, а толку нема.","tobacco.otaman.ask.1":"За річкою, біля чумацького шляху, є старе тютюнове поле. Садив його Тарас Довгий, що пішов на Січ і не вернувся. Поле здичавіло, але тютюн там ще росте. Люди кажуть — бо чорт його доглядає. Тютюн же чортове зілля.","tobacco.otaman.ask.2":"Принеси мені листя, синку. Три добрі листки. Тільки сирим я його курити не буду — Весна знає, як сушити. Зроби — і я тобі віддячу так, що й дума про це буде.","tobacco.otaman.t.wait.label":"Тютюн","tobacco.otaman.t.wait.question":"Я ще шукаю тютюн.","tobacco.otaman.wait.0":"Шукай, шукай. За річкою, біля чумацького шляху. А я тут посиджу, посмокчу порожню люльку. Мені не звикати.","tobacco.otaman.wait.drying":"Сохне, кажеш? Ох, синку, ця ніч буде найдовша в моєму житті. А я ж їх бачив, тих довгих ночей.","tobacco.otaman.t.give.label":"Тютюн ✦","tobacco.otaman.t.give.question":"Ось тобі тютюн, отамане. Сухий.","tobacco.otaman.give.0":"Отаман нюхає пучок, і в нього аж вуса здригаються. Набиває люльку, кресалом викрешує іскру, затягується — і довго-довго мовчить.","tobacco.otaman.give.1":"…Тарасів тютюн. Він завжди казав, що в нього найкращий на всю округу. Брехав, звісно. Але сьогодні — правда.","tobacco.otaman.give.2":"Тримай, синку. Це моя стара люлька, ще з Січі. Я з нею на турка ходив. Закуриш перед страшною ніччю — руки не тремтітимуть. Повір старому.","tobacco.otaman.t.after.label":"Люлька","tobacco.otaman.t.after.question":"Як тютюн?","tobacco.otaman.after.0":"Добрий, як Тарасова брехня. Кожного вечора по люльці, а в неділю — по дві. Отак і живемо.","tobacco.vesna.t.label":"Тютюн","tobacco.vesna.t.question":"Як сушити тютюн?","tobacco.vesna.0":"Сирим його не курять — горло дере, і голова болить. Листя треба зв'язати пучком і повісити в тіні, на вітрі. Моя сушарка підійде.","tobacco.vesna.1":"А в'язати — конопляним прядивом, іншим не тримає. Конопляне поле на південь від хутора, за городами. До ранку висохне.","tobacco.radek.t.label":"Тютюн","tobacco.radek.t.question":"Ти знаєш, де тютюн росте?","tobacco.radek.0":"За річкою, біля чумацького шляху. Через міст і праворуч. Я туди раз ходив — побачив чорта на межі й вернувся. Може, мені здалося. А може, й ні. Пся крев.","tobacco.chort.t.label":"Тютюн","tobacco.chort.t.question":"Кажуть, тютюн — чортове зілля?","tobacco.chort.0":"Моє найкраще творіння! Не гопак, не горілка — тютюн! Посадиш його раз, а люди потім самі до тебе ходять, і ще й дякують.","tobacco.chort.1":"Тарасове поле? Бери, бери, я не жадібний. Хай твій отаман курить на здоров'я. На моє здоров'я, точніше.","quest.tobacco.title":"Люлька отамана","quest.tobacco.gather":"Тютюн за річкою, біля чумацького шляху · листя {leaves}/3. І конопляне прядиво з поля на півдні","quest.tobacco.hang":"Повісь тютюн сушитися на сушарку Весни","quest.tobacco.drying":"Тютюн сохне на сушарці Весни — до ранку","quest.tobacco.ready":"Тютюн висох — неси отаманові","quest.tobacco.done":"Отаман курить Тарасів тютюн, а в тебе — його стара люлька","quest.tobacco.none":"—","map.button":"Мапа","map.open":"Відкрити мапу","map.zoom":"Масштаб мапи","map.zoom.world":"Увесь світ","map.zoom.near":"Довкола мене","map.aria":"Мапа: хутір, поля, річка, ліси, степ і Лиса Гора","map.legend":"● — ти тут · ★ — куди веде поточне завдання · ▲ — кургани · ✣ — вітряк","map.khutir":"Залісся","map.steppe":"Степ","map.lysa":"Лиса Гора","map.river":"Річка","map.forest":"Ліс","map.fields":"Ниви","map.hemp":"Коноплі","map.tobacco":"Тютюн","map.pond":"Ставок","map.none":"У тебе нема мапи. Чумаки знають кожну дорогу — а ще, кажуть, Чорт продає все, навіть мапи.","map.title.chumak":"Чумацька мапа","map.title.chort":"Чортова мапа (пахне сіркою)","map.keepsake.chumak":"🗺 Чумацька мапа (M — відкрити)","map.keepsake.chort":"🗺 Чортова мапа (M — відкрити)","map.toast.chumak":"Гнат віддає тобі чумацьку мапу. Тепер у тебе є «Мапа» — кнопка вгорі або M.","map.toast.chort":"Три риби — і мапа твоя. Тепер у тебе є «Мапа» — кнопка вгорі або M.","map.chort.label":"Мапа","map.chort.question":"Кажуть, ти й мапи продаєш?","map.chort.buy.0":"Продаю! Найточнішу в усьому повіті: тут кожна стежка, кожен курган, кожна криниця, в яку я колись плював. Три риби.","map.chort.buy.1":"Чорт виловлює з-за пазухи згорток, від якого тягне сіркою. Рибу ховає ще швидше. «Приємно мати справу. Не дивись на неї опівночі. Ну, хіба трохи».","map.chort.poor.0":"Мапа — три риби, кобзарю. У тебе {fish}. Золото моє ж не приймаю — я не дурний. Іди до ставка, вудка не кусається. Майже. (Ціна: {price} риби.)","chumak.gnat.t.map.label":"Дорога далі","chumak.gnat.t.map.question":"Куди ви тепер?","chumak.gnat.map.0":"На Полтаву, а там додому. А тобі — ось, тримай. Чумацька мапа: дороги, броди, криниці, кургани, де ночувати. Я її сам малював, тридцять років по шляху.","chumak.gnat.map.1":"Мені вона вже не треба — я ці дороги ногами пам'ятаю. А кобзар без мапи — як віл без ярма: іде, а куди — не знає.","char.odarka.name":"Одарка","char.odarka.pron":"","char.odarka.role":"Шинкарка · тримає корчму на шляху","char.okhrim.name":"Охрім","char.okhrim.pron":"","char.okhrim.role":"Старий запорожець · п'є в борг","song.name.pidmanula":"«Ти ж мене підманула»","song.name.dunai":"«Їхав козак за Дунай»","ui.play.audience.pidmanula":"«Ти ж мене підманула» — і вже на третьому куплеті хутір співає за тебе. Весна кидає на отамана такий погляд, що той закашлюється в люльку.","ui.play.audience.dunai":"«Їхав козак за Дунай». Діди кивають, баби зітхають, а дівчата дивляться на дорогу, ніби з неї от-от хтось вийде.","korchma.name":"Корчма","korchma.role":"На чумацькому шляху, за хутором","ui.promptLabel.playKorchma":"Заграти для корчми 🎶","ui.enterHut.korchma":"Корчма. Дим під стелею, кухлі стукають об стіл, пахне горілкою і квашеними огірками. За шинквасом жінка в синій хустці міряє тебе поглядом: платитимеш чи співатимеш?","ui.hut.korchma":"🍺 Корчма","map.korchma":"Корчма","korchma.play.daytime":"Удень у корчмі тільки мухи та Охрім, і обидва сплять. Грати приходь увечері.","korchma.play.prompt":"Одарка кивнула тобі на лаву під стіною. У корчмі стихає. Що заграєш?","korchma.mood.mourning":"Сьогодні тут п'ють мовчки, за упокій. Навіть чарки ставлять обережно.","korchma.mood.chumaky":"Чумаки гуляють, і корчма гуляє з ними. Хтось уже танцює на лаві.","korchma.mood.maudlin":"Сьогодні корчма розкисла: двоє плачуть за Січчю, третій за матір'ю, четвертий сам не знає за чим.","korchma.mood.merry":"Звичайний вечір у корчмі: гамір, сміх, хтось уже спорить про коней.","korchma.play.match":"{song} — корчма гуде, кухлі б'ють об стіл у такт. Одарка ставить тобі миску вареників. Кобзарство {level}.","korchma.play.fine":"{song} — слухали, хтось навіть підтягнув. Одарка ставить тобі миску вареників. Кобзарство {level}.","korchma.play.clash":"{song} — не та пісня для цієї корчми. Вареників не буде. Кобзарство {level}.","korchma.play.room.match":"Коли ти замовкаєш, корчма ще мить мовчить, а потім реве так, що з полиці падає глечик. Одарка не сварить. Одарка всміхається.","korchma.play.room.fine":"Корчма слухає впівуха, як слухають на шляху, і все ж хтось поставив тобі чарку. Ти її не п'єш. Кобзареві треба руки.","korchma.play.room.clash.sad":"Ти вдаряєш весело, а корчма сьогодні плаче. Хтось кидає в тебе шкуркою від сала: «Совісті нема!» Одарка лише хитає головою.","korchma.play.room.clash.happy":"Ти заводиш сумну, а люди прийшли гуляти. «Ти що, на похорон нас привів?» Хтось уже грюкає дверима.","korchma.toast.supper":"Одарка ставить перед тобою миску вареників зі сметаною. Мінус рибина, плюс життя. 🥟","korchma.odarka.intro":"Жінка за шинквасом витирає кухоль і не поспішає. «Кобзар. Ну-ну. Платиш рибою, співаєш увечері, в борг не наливаю. Охрімові наливаю, але він не рахується. Я Одарка».","korchma.odarka.again":"«А, співак. Сідай, тільки не на те місце, де Охрім. Там Охрім».","korchma.odarka.t.who.label":"Про Одарку","korchma.odarka.t.who.question":"Сама тримаєш корчму?","korchma.odarka.who.0":"«Сама. Чоловік сім років тому поїхав на Січ. Сказав: до Покрови. Котрої Покрови, не сказав».","korchma.odarka.who.1":"«Спершу я кожному чумакові казала: як побачиш мого Степана, переказуй. Тепер не кажу. Наливаю й мовчу. Так легше обом».","korchma.odarka.t.supper.label":"Повечеряти (1 рибина)","korchma.odarka.t.supper.question":"Чим годуєш?","korchma.odarka.supper.0":"«Вареники з сиром, сметана своя. Давай рибу. Та не цю, оцю, більшу. От». Вона забирає рибину так, ніби робить тобі ласку. Так воно і є.","korchma.odarka.supperPoor":"«Вареники за рибу, співаче. За {price}. За гарні очі тут годують тільки Охріма, і то бо він уже не бачить, що їсть». Можна ще заграти ввечері.","korchma.odarka.t.news.label":"Що чути на шляху","korchma.odarka.t.news.question":"Що люди кажуть?","korchma.odarka.news.viy":"«Кажуть, у балці за хутором щось ворушиться ночами. Чумаки там не ночують, об'їжджають гаком. А чумака налякати, сам знаєш, треба ще вміти».","korchma.odarka.news.viySealed":"«Кажуть, ти в балці всю ніч співав, а воно слухало й не встало. Брешуть, мабуть. А вареники я тобі все одно подвійні класти буду».","korchma.odarka.news.road":"«Ще кажуть, сіль подорожчала, а горілка ні. Отже, світ ще стоїть».","korchma.odarka.t.okhrim.label":"Про Охріма","korchma.odarka.t.okhrim.question":"А він тобі хоч щось платить?","korchma.odarka.okhrim.0":"Вона киває на шинквас: там крейдою виписані рядки рисок, як пшениця в полі. «Це Охрім. Це за три зими».","korchma.odarka.okhrim.1":"«Не стягну. Він сам лишився з цілого куреня, а мій Степан теж десь там був. Може, хтось і мого так годує. То я рахую. Рахувати ж не гріх».","korchma.odarka.t.song.label":"Попросити пісню","korchma.odarka.t.song.question":"А сама співаєш, Одарко?","korchma.odarka.song.0":"«Одну. Про те, як дівка хлопця водила за ніс. Чоловік мій її страх не любив». Вона всміхається вперше за вечір.","korchma.odarka.song.1":"Вона наспівує «Ти ж мене підманула», голосно й сердито весело, і пів корчми відбиває такт. Ти запам'ятовуєш одразу.","korchma.okhrim.intro":"Над кухлем піднімається сива чуприна-оселедець, потім вуса, потім одне око. «Кобза… Давно я кобзи не чув. Сідай, синку. Я Охрім. Колись був Охрім Бугай, а тепер просто Охрім».","korchma.okhrim.again":"«А, синку. Сідай. Я тут, бачиш. Нікуди не дівся. Мені нікуди».","korchma.okhrim.t.sich.label":"Про Січ","korchma.okhrim.t.sich.question":"Яка вона була, Січ?","korchma.okhrim.sich.0":"«Січ? Січ, синку, це коли в тебе нічого нема, крім шаблі, коня і товаришів, і тобі того досить. Більше досить, ніж потім усього».","korchma.okhrim.sich.1":"«Ми там і молились, і бились, і пили. І все щиро. Отут, у корчмі, я тільки п'ю. Та й то вже не так щиро».","korchma.okhrim.t.kurin.label":"Про його курінь","korchma.okhrim.t.kurin.question":"А де твій курінь?","korchma.okhrim.kurin.0":"Він довго мовчить. «Хто під Хотином, хто в турецькій неволі, хто в землі по степу, без хреста. Сто сорок душ. Я один вернувся. Не знаю, за які гріхи».","korchma.okhrim.kurin.1":"«От Одарка рахує мене крейдою. А я рахую їх. Кожного вечора. Як дійду до ста сорока, то й піду спати». Він не всміхається.","korchma.okhrim.t.viy.label":"Про Вія","korchma.okhrim.t.viy.question":"Ти чув про те, що в балці?","korchma.okhrim.viy.0":"«Чув. Я в Києві бурсака одного знав, Хому. Розумний був хлопець, молитви знав напам'ять. А подивився. Не стерпів і подивився. І все».","korchma.okhrim.viy.1":"«Як будеш там, синку, співай і не дивись. Хоч би що кликало. Хоч би й мати. Не дивись». Він стискає тобі руку так, що болить.","korchma.okhrim.t.viySealed.label":"Про ту ніч","korchma.okhrim.t.viySealed.question":"Я вистояв ту ніч, діду.","korchma.okhrim.viySealed.0":"«Знаю. Вся корчма знає. Я за тебе чарку випив, а потім ще одну, за Хому. Хай йому там легше буде, що хоч хтось не подивився».","korchma.okhrim.t.debt.label":"Про борг","korchma.okhrim.t.debt.question":"Ти ж Одарці винен, діду.","korchma.okhrim.debt.0":"«Винен. Я всім винен, синку: Одарці, товаришам, Богові. Одарці хоч віддати можна. Вона не бере». Він дивиться в кухоль. «Тому й не беру я в неї хліба, тільки горілку. Хліб соромно».","korchma.okhrim.t.song.label":"Попросити пісню","korchma.okhrim.t.song.question":"Навчиш козацької, діду?","korchma.okhrim.song.0":"«Козацької? Ну, слухай. З цією ми виїжджали. Не з думою, не з молитвою, з оцією». Він випростується, і на мить у ньому видно того Бугая.","korchma.okhrim.song.1":"Він співає «Їхав козак за Дунай» хрипко, мимо нот і дуже правильно. На останньому рядку замовкає, а ти доспівуєш за нього.","ui.enterHut.pustka":"Пустка. Двері рипнули й не зачинилися за тобою. Пил, павутиння, холодна піч. Ікону хтось повернув лицем до стіни, і ти вирішуєш її не чіпати.","ui.hut.pustka":"🏚 Пустка","ui.promptLabel.pustkaChest":"Зазирнути в скриню","pustka.name":"Скриня Тараса Довгого","pustka.role":"Пустка біля балки","pustka.chest.0":"Під трухлявою рядниною: порожні піхви від шаблі, кисет без тютюну і лист, писаний кривими літерами.","pustka.chest.1":"«Як не вернуся до Покрови, тютюн мій хай курить отаман, а хату не чіпайте: нехай чекає. Тарас Довгий». Покров відтоді минуло сім. Хата чекає досі.","pustka.chest.again":"Порожні піхви, кисет і лист Тараса Довгого. Ти кладеш усе, як лежало.","ui.promptLabel.petDog":"Погладити пса 🐕","dog.pet.0":"Пес б'є хвостом по землі так, що курява стоїть. Отаманів, а любить усіх, хто погладить.","dog.pet.1":"Пес нюхає кобзу, чхає і робить вигляд, що так і було задумано.","dog.pet.2":"Пес підставляє вухо й заплющує очі. Кобзарів він, видно, поважає більше, ніж отамана.","dog.pet.asleep":"Пес спить біля ґанку, посмикуючи лапою. Ганяє когось уві сні. Хай ганяє.","schedule.woken.myroslav":"Отаман сідає на полу, шукає шаблю, знаходить люльку. «А, це ти, синку… Ну, кажи, раз уже розбудив».","schedule.woken.vesna":"Весна розплющує одне око. «Як не помираєш, то кажи швидко, кобзарю».","schedule.woken.radek":"Радек підводиться з соломи. «Пся крев, хто там?.. А, співак. Ну?»","schedule.woken.odarka":"Одарка визирає з печі. «Корчма зачинена. Але кажи, раз прийшов».","schedule.woken.okhrim":"Охрім, не розплющуючи очей: «Сто тридцять дев'ять… сто сорок… А, синку. Сідай».","schedule.lysa.vesna":"Весна з пучком нічників у руці навіть не здригається. «Ти мене тут не бачив, кобзарю. А я тебе, так і бути, теж».","schedule.lysa.okhrim":"Охрім тасує карти навпроти Чорта. «Не заважай, синку! Ще одна роздача, і я відіграю свою шапку. І душу, як пощастить».","schedule.lysa.myroslav":"«Мене тут нема. І тебе теж».","schedule.lysa.radek":"«Jezus Maria… Я тільки підкову приніс. На замовлення».","schedule.lysa.odarka":"«Шинок працює й тут. Не питай».","char.opanas.name":"Опанас","char.opanas.pron":"","char.opanas.role":"Відьмак · доїть чужих корів","hide.solokha.0":"Солоха сидить у вітряку на мішку з борошном і лузає насіння. «Борошно мелю, кобзарю. Чого очі вирячив? Удень я вдова як вдова».","hide.solokha.1":"«А вночі хай кожен своїм ділом займається. Ти піснями, я своїм. І Чортові не кажи, що бачив мене тут, бо ревнивий».","hide.motrya.0":"У дуплі старого дуба, на кублі з моху й пір'я, сидить Мотря, заспана й сердита. «Сонце ж іще! Та йди вже… Я тут сплю, як сова».","hide.motrya.1":"«Шабаш увечері, хіба не знаєш? Як смеркне, тоді й приходь. Та гопака вивчи, бо без гопака там нудно».","hide.opanas.0":"Під курганом, біля старої плити зі свічками, сидить худий чоловік у високій смушевій шапці. «Я Опанас. Відьмак. Не кажи нікому, а то я твоїй корові молоко зіпсую. Хоч і нема в тебе корови».","hide.opanas.1":"«Удень ми люди як люди. А як смеркне, гайда на Гору. Приходь, послухаєш, як ми співаємо. Гірше за тебе, чесно».","lysa.opanas.0":"«О, кобзар прийшов! Сідай коло нас. Тільки на мітлу не сідай, бо вона кусається».","lysa.opanas.1":"«Ти не дивись, що я з відьмами танцюю. Я й сам собі відьма, тільки з вусами».","lysa.day.empty":"Вершина вдень порожня: холодний попіл, витоптане коло, мітла, яку хтось забув. Шабаш збирається, як смеркне.","lysa.day.notYet":"Удень тут нікого. Шабаш збирається, як смеркне.","ui.enterHut.mlyn":"Вітряк. У промені з віконця стовпом стоїть борошняний пил, жорна мовчать, а над головою рипнуть крила. Пахне зерном і чимось паленим.","ui.hut.mlyn":"🌾 Вітряк","ui.enterHut.duplo":"Дупло. Тісно, тепло, пахне мохом, сухими травами й совою. На корені сушаться жаб'ячі лапки. Краще нічого не чіпати.","ui.hut.duplo":"🌳 Дупло","ui.enterHut.kurhan":"Під курганом холодно й тихо. З коріння сиплеться земля, на старій плиті горять дві свічки. Колись тут лежав хтось важливий. Тепер тут живуть.","ui.hut.kurhan":"⛰ Під курганом","ui.enterHut.pechera":"Печера. Гаряче, як у печі, тхне сіркою, з каменю капає. У глибині на кам'яному ложі щось величезне хропе.","ui.enterHut.kaplytsia":"Каплиця. Тісно, пахне воском і ладаном. Перед образами тихо горить лампадка, на аналої розгорнута книга, на кануні — тоненькі свічки за померлих.","ui.hut.kaplytsia":"⛪ Каплиця","ui.hut.pechera":"🕳 Печера","hide.beelzebub.0":"Вельзевул спить на кам'яному ложі, загорнувшись у мантію, як кажан. Хропе так, що зі стелі сиплеться камінь. Одне жовте око ліниво розплющується.","hide.beelzebub.1":"«КОБЗАР. УДЕНЬ. У МОЇЙ СПАЛЬНІ». Око заплющується. «Приходь, як смеркне. Тоді й поговоримо. А зараз геть».","trade.radek.t.label":"Підкови за золото","trade.radek.t.question":"Купиш мої підкови?","trade.radek.sell.0":"Покажи. …Рівні, добре ковані. По червінцю за кожну, щирим золотом.","trade.radek.sell.1":"Звідки в коваля золото? Козак на коні не заощаджує. Сотник платить, я мовчу. Jezus Maria, якби мій пан так платив…","trade.radek.none.0":"Принеси, що викуєш, — заплачу золотом. Червінець за підкову. Козацький кінь без підков — що шабля без руків'я.","trade.toast.sold":"Радек відлічує золото. Продано підков: {sold}. Червінців у гаманці: {total}.","ui.satchel.purse":" · 🪙 червінців: {gold}","char.prokip.name":"Дід Прокіп","char.prokip.pron":"","char.prokip.role":"ворожбит","char.perelesnyk.name":"Перелесник","char.perelesnyk.pron":"","char.perelesnyk.role":"вогняний змій","ui.enterHut.prokip":"Пахне димом, полином і чимось, про що краще не питати. З лави на тебе дивиться чорний кіт. Дід не дивиться — дід думає.","ui.hut.prokip":"🪶 Хатка діда Прокопа","map.prokip":"Дід Прокіп","prokip.keepsake":"🐾 Звірина мова (від діда Прокопа)","prokip.intro.0":"Хто там? …Співак. Тільки співака мені й бракувало. Ворон є, кіт є, мухомори є. Співака не було.","prokip.intro.1":"Ну, заходь, не стій у дверях, як теля перед новими ворітьми. І кобзу не чіпай. Я бачу, як ти на неї дивишся.","prokip.again":"Знову ти. Сідай. Тільки не співай.","prokip.again.friend":"А, шмаркач прийшов. Кіт уже й місце тобі нагрів. Не кажи йому, що я радий.","prokip.t.who.label":"Хто ти","prokip.t.who.question":"Ти справді ворожбит?","prokip.who.0":"Ворожбит. Знахар. Старий дурень — так мене Весна кличе. Шепчу на зуби, виливаю переляк, виганяю те, що не має права лишатися.","prokip.who.1":"А от співаків не лікую. Нема від вас ліків. Хіба що ціпок.","prokip.t.forest.label":"Чому в лісі","prokip.t.forest.question":"Чому ти живеш так далеко від людей?","prokip.forest.0":"Бо люди питають. «Діду, чи буде дощ?» «Діду, чи любить мене Гриць?» «Діду, де корова?»","prokip.forest.1":"А ліс нічого не питає. Ліс і так знає. Корова, до речі, в ярку за млином.","prokip.t.sieve.label":"Робота","prokip.t.sieve.question":"Можу чимось допомогти?","prokip.sieve.0":"Можеш. Ось решето. Принеси мені води з криниці в хуторі. Повне. Не розхлюпай.","prokip.sieve.1":"Що ти так дивишся? Решето як решето. Іди, поки світло.","prokip.t.sieveWait.label":"Вода","prokip.t.sieveWait.question":"Діду, а вода…","prokip.sieveWait.0":"Де вода? Нема води. Бо ти ще тут. Криниця — в хуторі. Хутір — там. Я — тут. Ноги — в тебе.","prokip.t.sieveBack.label":"Вода витекла","prokip.t.sieveBack.question":"Діду… вода витекла.","prokip.sieveBack.0":"Витекла?! Ха! ХА-ХА! Носив воду решетом! Через річку, через ліс, і назад!","prokip.sieveBack.1":"Сорок років даю це решето кожному, хто приходить. Усі питали «навіщо». Ти перший, хто пішов.","prokip.sieveBack.2":"Та не дуйся, шмаркачу. Хто не боїться бути дурнем, з того буде толк. А тепер — справжня справа.","prokip.t.message.label":"Справжня справа","prokip.t.message.question":"Яка справжня справа?","prokip.message.0":"Піди до Весни, знахарки. Скажи їй: «Прокіп каже, що ти була неправа».","prokip.message.1":"Дослівно. Нічого не додавай. І не кажи, що я питав, як вона. Я не питав.","prokip.t.messageWait.label":"Весна","prokip.t.messageWait.question":"Про Весну…","prokip.messageWait.0":"Ну? Що сказала? …Нічого, бо ти ще не ходив. Іди. І причешися, там же люди.","prokip.t.answer.label":"Відповідь Весни","prokip.t.answer.question":"Весна дещо переказала.","prokip.answer.0":"Ну?! …«Права тоді, права тепер, і борода крива»?","prokip.answer.1":"Крива. …Вона так і сказала? Крива.","prokip.answer.2":"Пам'ятає, значить.","prokip.answer.3":"П'ятдесят років тому, на Купала, я сказав, що дощу не буде. Вона сказала — буде. Полило як з відра. Я не визнав. Вона не пробачила. Ото й усе.","prokip.answer.4":"…Ні, не все. Але тобі більше знати не треба. А тепер слухай, бо далі — не до сміху.","prokip.t.perelesnyk.label":"Вогонь над корчмою","prokip.t.perelesnyk.question":"Що не до сміху?","prokip.perelesnyk.0":"Ночами над корчмою на чумацькому шляху літає вогонь. Люди кажуть — зірка падає. Зірки так не падають. Щоночі в одне місце.","prokip.perelesnyk.1":"Перелесник. Він приходить до тих, хто занадто довго тужить. До Одарки. У личині її Степана, що сім років тому поїхав на Січ.","prokip.perelesnyk.2":"Вона думає, що він повернувся. А він п'є її. По краплі, щоночі. Ще трохи — і вип'є всю.","prokip.perelesnyk.3":"Ось свячений мак. Уночі, як прилетить, сип на поріг і співай. Мак його тримає, пісня жене. А далі — як вона витримає. Це найтяжче.","prokip.t.perelesnykWait.label":"Перелесник","prokip.t.perelesnykWait.question":"Про перелесника…","prokip.perelesnykWait.0":"Ще літає. Ворон бачив. Уночі, синку, біля корчми. Вдень він — просто зірка, що впала не туди.","prokip.t.spared.label":"Я її пожалів","prokip.t.spared.question":"Я не зміг. Вона була така щаслива.","prokip.spared.0":"Пожалів. …Я теж колись жалів. Жалість — добре діло, синку. Тільки він не жаліє.","prokip.spared.1":"Подивись на неї завтра. Бліда. Подивись післязавтра. А тоді йди ще раз.","prokip.t.reward.label":"Перелесника нема","prokip.t.reward.question":"Перелесника більше нема.","prokip.reward.0":"Знаю. Ворон сказав. Одарка плаче? Хай плаче. Сльози — не кров. Від сліз ще ніхто не всох.","prokip.reward.1":"Ти зробив тяжке діло. За тяжке діло — добра плата. Нахились.","prokip.reward.2":"Ближче. Ще ближче. Та не бійся, не вкушу.","prokip.reward.3":"Дід Прокіп плює тобі у вухо. Смачно, від душі.","prokip.reward.4":"Не кривися! Тепер ти чуєш звірину мову. Пси, гуси, корови, коні — вони цілий вік говорять. Просто ніхто не слухав.","prokip.reward.5":"А тепер іди. …Заходь іноді. Не часто. …Ну, можна й часто. Кіт за тобою скучатиме. Кіт, кажу.","prokip.t.after.label":"Звірина мова","prokip.t.after.question":"Діду, гуси такого наговорили!","prokip.after.0":"Гуси пащекують, я ж казав. Ніколи не вір гусці. А от корові — вір. Корова не бреше, їй ліньки.","prokip.t.vesna.label":"А Весна?","prokip.t.vesna.question":"А може, ти до неї сам підеш?","prokip.vesna.0":"Сам? Через річку? У мої роки? …Вона б сказала, що я прийшов визнати, що дощ був.","prokip.vesna.1":"А дощ, може, й був. Але визнавати — то вже занадто. Іди, іди.","prokip.vesna.t.who.label":"Дід Прокіп","prokip.vesna.t.who.question":"Хто такий дід Прокіп?","prokip.vesna.who.0":"Ворожбит. Живе в лісі за чумацьким мостом, на схід, далі, ніж ходять порядні люди.","prokip.vesna.who.1":"Сердитий, як оса в глечику. Як побачиш — передай, що він старий дурень. Він знає.","prokip.vesna.t.msg.label":"Привіт від Прокопа","prokip.vesna.t.msg.question":"Прокіп каже, що ти була неправа.","prokip.vesna.msg.0":"Неправа. Я.","prokip.vesna.msg.1":"…Скажи йому: я була права тоді, права тепер, і борода в нього крива.","prokip.vesna.msg.2":"І хай не застудиться в тому своєму лісі. Це не я сказала. Це ти вигадав. Іди.","prokip.odarka.t.nights.label":"Ночі","prokip.odarka.t.nights.question":"Як ти спиш, Одарко?","prokip.odarka.nights.0":"Ти не повіриш, кобзарю. Він приходить. Мій Степан. Щоночі. Стоїть на порозі й мовчить.","prokip.odarka.nights.1":"Я так добре сплю. Тільки чогось холодно. І руки не слухаються. Налити тобі? Ой, розлила…","prokip.odarka.t.after.label":"Тієї ночі","prokip.odarka.t.after.question":"Як ти, Одарко?","prokip.odarka.after.0":"Я знала, що то не він. Степан ніколи без шапки не ходив. Навіть до мене.","prokip.odarka.after.1":"Сім років я не замикала дверей. Тепер замкну. І поплачу, як люди плачуть. А тоді відчиню знову, бо корчма.","prokip.odarka.after.2":"Сідай. Сьогодні наливаю за рахунок закладу. Тільки Охрімові не кажи.","prokip.well.0":"Ти опускаєш решето в криницю. Воно виходить повне — на одну мить.","prokip.well.1":"Вода дзюрчить крізь дірочки просто тобі в чоботи. Журавель криниці рипить. Здається, він сміється.","prokip.well.toast":"Решето порожнє. Чоботи — ні. Повернися до діда Прокопа.","ui.promptLabel.sieve":"Набрати води решетом","ui.promptLabel.perelesnyk":"Вийти на поріг 🔥","ui.promptLabel.animal":"Послухати 👂","perelesnyk.scene.0":"Над корчмою — вогняна смуга. Вона падає на поріг і стає чоловіком. Високий. Без шапки. Без тіні.","perelesnyk.scene.1":"Одарка стоїть у дверях у святковій хустці. Усміхається так, як не усміхалася сім років.","perelesnyk.scene.2":"«Степане… ти прийшов», — шепоче вона. Він мовчить. Від нього пахне гаром. У кишені в тебе — Прокопів мак.","perelesnyk.opt.drive":"Сипати мак і співати","perelesnyk.opt.spare":"Залишити їй цю ніч","perelesnyk.driven.0":"Мак сиплеться на поріг, і вогонь сахається, як від окропу. Ти береш кобзу і співаєш.","perelesnyk.driven.1":"Те, що було Степаном, тріщить, корчиться — і розсипається іскрами над шляхом. Кінь біля корчми голосно видихає.","perelesnyk.driven.2":"Одарка сідає на поріг. Не кричить. Просто плаче — тихо, як плачуть удови.","perelesnyk.spared.0":"Ти відступаєш у темряву. Двері корчми зачиняються. У вікні — двоє, і тільки одна тінь.","perelesnyk.spared.1":"Вранці Одарка буде щаслива. І ще трохи блідіша, ніж учора.","perelesnyk.toast.driven":"Перелесника вигнано. Повернися до діда Прокопа.","perelesnyk.toast.spared":"Ти залишив Одарці її ніч. Перелесник прилетить і завтра.","animal.dog.name":"Пес","animal.dog.role":"отаманів","animal.dog.0":"Отаман знову їв сало сам. Я бачив. Я все бачу. Мене ніхто не питає.","animal.dog.1":"Чорт біля млинового каменю пахне сіркою і парфумами. Гавкати на нього? Ні. Я не дурний.","animal.dog.2":"Ти пахнеш рибою. Ти хороший. Ні, правда, ти хороший. Почухай отут.","animal.dog.3":"Вночі Солоха вилітає з млина на мітлі. Я гавкаю. Мені кажуть «тихо». А потім дивуються.","animal.dog.night":"Хр-р… кістка… велика кістка… хр-р… не займай…","animal.goose.name":"Гуска","animal.goose.role":"зі ставка","animal.goose.0":"Га-га. Ми бачили, як Радек ховав червінці в ковадло. Нікому. Га.","animal.goose.1":"Цей ставок — наш. Болотяник думає, що його. Хай думає. Га-га-га.","animal.goose.2":"Не підходь. …Ну гаразд, підходь. Хліб є? Нема? Тоді йди.","animal.goose.3":"Весна щоранку говорить із травами. Трави їй відповідають. Ми чули. Ми все чуємо. Га.","animal.goose.night":"Ш-ш-ш. Голову під крило. Ми спимо. Ти теж спи.","animal.cow.name":"Корова","animal.cow.role":"Красуля","animal.cow.0":"Му-у… Трава. Знову трава. Ти колись думав про траву? Я — постійно.","animal.cow.1":"Вітряк крутиться. Солоха вдень спить у борошні. Хтось мусить це знати. Тепер знаєш ти. Му.","animal.cow.2":"Мене звуть Красуля. Ти не питав. Ніхто не питає. Дякую, що послухав.","animal.cow.3":"Дід Прокіп колись лікував мені вим'я. Сварився цілий день. Добрий дід. Му-у.","animal.cow.night":"Му-у… сплю… корови теж сплять, синку… му…","animal.horse.name":"Кінь","animal.horse.role":"біля корчми","animal.horse.0":"Охрім каже, що я козацький кінь. Я все життя возив дрова. Але приємно.","animal.horse.1":"Дай яблуко. Нема? Люди… Кобза є, а яблука нема.","animal.horse.2":"Чумаки кажуть, сіль у Криму біла, як сніг. Я снігу не люблю. І чумаків.","animal.horse.fire":"Знову вогонь над корчмою. Щоночі. Шинкарка виходить на поріг і усміхається. Коні таке бачать. Коням страшно.","animal.horse.calm":"Вогонь більше не літає. Шинкарка плаче, але їсть. А як людина їсть — житиме.","quest.prokip.title":"Дід Прокіп","quest.prokip.find":"Весна каже: у лісі за чумацьким мостом, на схід, живе ворожбит. Знайди його.","quest.prokip.talk":"Поговори з дідом Прокопом.","quest.prokip.sieve":"Принеси дідові Прокопу води з криниці в хуторі. Решетом.","quest.prokip.sieveBack":"Вода витекла. Повернися до діда Прокопа.","quest.prokip.message":"Передай Весні: «Прокіп каже, що ти була неправа».","quest.prokip.answer":"Віднеси дідові Прокопу відповідь Весни.","quest.prokip.perelesnyk":"Уночі біля корчми — перелесник. Мак на поріг, і співай.","quest.prokip.reward":"Перелесника нема. Повернися до діда Прокопа.","quest.prokip.done":"Ти чуєш звірину мову. Послухай пса, гусей, корову й коня."};function n5(e){try{return globalThis.localStorage?.getItem(e)??null}catch{return null}}function l5(e,t){try{globalThis.localStorage?.setItem(e,t)}catch{}}var s5=["uk","en"],yI="uk",u5={uk:"Українська",en:"English"},r5={en:o5,uk:i5},h5="zalissya-lang";function mI(){let e=n5(h5);return e==="en"||e==="uk"?e:yI}var f5=mI();function Rd(){return f5}function h(e,t){let a=r5[f5][e]??r5.en[e]??e;if(!t)return a;return a.replace(/\{(\w+)\}/g,(o,i)=>(i in t)?String(t[i]):o)}function c5(e){l5(h5,e)}var Kr=[{id:"myroslav",name:h("char.myroslav.name.0"),pron:h("char.myroslav.pron.0"),role:h("char.myroslav.role.0"),x:760,y:520,tunic:"#9a2a24",hair:"#cfc8bb",style:"elder"},{id:"vesna",name:h("char.vesna.name.0"),pron:h("char.vesna.pron.0"),role:h("char.vesna.role.0"),x:1236,y:626,tunic:"#a83c32",hair:"#5d3a1a",style:"herbalist"},{id:"radek",name:h("char.radek.name.0"),pron:h("char.radek.pron.0"),role:h("char.radek.role.0"),x:372,y:596,tunic:"#4c4a48",hair:"#2e2018",style:"smith"}],bI=[{id:"domovyk",name:h("char.domovyk.name.0"),pron:h("char.domovyk.pron.0"),role:h("char.domovyk.role.0"),x:Fu.x,y:Fu.y,tunic:"#6e5136",hair:"#8a6f4d",style:"domovyk"},{id:"lisovyk",name:h("char.lisovyk.name.0"),pron:h("char.lisovyk.pron.0"),role:h("char.lisovyk.role.0"),x:1057,y:96,tunic:"#33502e",hair:"#4c6b35",style:"lisovyk"},{id:"chort",name:h("char.chort.name.0"),pron:h("char.chort.pron.0"),role:h("char.chort.role.0"),x:545,y:1052,tunic:"#7e2430",hair:"#2b2320"
