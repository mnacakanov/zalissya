ovyk.pron.1":"","char.domovyk.role.1":"Хатній дух · господар печі","char.vesna.name.1":"Весна","char.vesna.pron.1":"","char.vesna.role.1":"Знахарка · лікує людей і худобу","char.beelzebub.name.0":"Вельзевул","char.beelzebub.pron.0":"","char.beelzebub.role.0":"Господар шабашу · пан Лисої Гори","char.chort.name.1":"Чорт","char.chort.pron.1":"","char.chort.role.1":"Сьогодні — розпорядник шабашу","char.solokha.name.0":"Солоха","char.solokha.pron.0":"","char.solokha.role.0":"Відьма з Диканьки · вдова","char.motrya.name.0":"Мотря","char.motrya.pron.0":"","char.motrya.role.0":"Відьма · знає, де цвітуть нічники","char.LYSA_DANCERS.name.0":"Відьма","char.LYSA_DANCERS.role.0":"Танцює на шабаші","input.Joystick.0":"Ігрове поле — торкнись будь-де й тягни, щоб іти","input.Joystick.1":"Торкнись будь-де й тягни, щоб іти","time.timeLabel.0":"День {day} · {hh}:{mm} {icon}","ui.continue":"Продовжити","ui.zalissya":"Залісся","ui.next":"Далі","ui.farewell":"Бувай","ui.quests":"Завдання","ui.character":"Персонаж","stat.soulless":"Без душі","quest.section.story":"Історія","ui.hud.soulLost":"☠ Без тіні — душа в Чорта (викуп: {price} риби)","ui.hud.overfull":"🎒 Переповнено ({carried}/{cap}) — нового не підняти","ui.vigil.secondsLeft":"{s} с","ui.dialogue.youAsk":"Ти питаєш: «{question}»","ui.quests.intro":"Виконано {done} з {total}. Позначка «{now}» — де зараз історія. Решта почекає: блукати не гріх.","ui.stats.from":"від: {feeds}","ui.stats.footer":"Очок тут не роздають. У Заліссі ти стаєш тим, що робиш. Чорт зараз цінує твою душу в {price} риби.","ui.skills.feeds":"→ {stat}","ui.skills.level":"Рівень {level}","ui.satchel.basics":"🌿 трав: {herbStock} · 🎣 риби: {fish}","ui.satchel.carrying":"🎒 Несеш {carried} / {cap} (межу задає СИЛ {str}). Вага: риба 1 · трава 1 · підкова 2 · залізо 3 · нічники 0.","line.chort.5b":"Ану, що то пахне? Ставком і карасем! ТРИ риби, рахую, навіть не рахуючи. Ну що, кобзарю, зведемо рахунки?","ui.language":"Мова","song.name.holota":"Дума про козака Голоту","song.name.kolyskova":"Колискова «Ой ходить сон»","song.name.hopak":"Гопак","song.name.burya":"Дума про бурю на Чорному морі","song.topic.vesna.label":"Колискова","song.topic.vesna.question":"Навчиш мене колискової?","song.topic.vesna.0":"«Ой ходить сон коло вікон, а дрімота — коло плота…» Мама мені співала, а я — всім хворим дітям на хуторі. Слухай і запам'ятовуй.","song.topic.vesna.1":"Заспівай її в хаті Домовика, як лягатимеш. Він удаватиме, що не слухає, а вранці встанеш, ніби тебе мама сповила. Статура +1 до світанку.","song.topic.chort.label":"Гопак","song.topic.chort.question":"Ти, кажуть, музика. Навчиш гопака?","song.topic.chort.0":"Навчу! Задарма! Бачиш, як мені боляче це казати? Гопак — то чортова музика, що її козаки в нас поцупили, а ми й не сердимось: гарно ж танцюють.","song.topic.chort.1":"Ось: раз-два, раз-два-три, а тоді вдар по струнах, наче за тобою сотня татар женеться. Без гопака на Лисій Горі тебе й на поріг не пустять.","song.topic.motrya.label":"Гопак","song.topic.motrya.question":"Навчиш мене гопака?","song.topic.motrya.0":"«Слухай». Мотря наспівує, притупуючи, і за хвилину твої пальці вже самі знають, куди бігти. «Чорт би теж навчив, та потім розповідав би всім, що ти йому винен».","ui.fire.name":"Вогнище","ui.fire.role":"Тут увечері збирається хутір","ui.play.audience.holota":"Дума про Голоту — як голий козак пана-ляха провчив. Радек сміється найголосніше: «Добже йому, добже!»","ui.play.audience.kolyskova":"Колискова. Говір стихає. Хтось із баб утирає очі хусткою, а отаман удає, що йому в око попав дим.","ui.play.audience.hopak":"Гопак! За мить уже весь хутір навприсядки, навіть отаман зі своєю спиною. Звідкись із темряви долинає підозріле цокання копит.","ui.play.audience.burya":"Дума про бурю на Чорному морі. Над вогнем стоїть тиша, така, що чути, як тріщить жар. Ніхто не каже ні слова. Усі знають, яку ніч ти вистояв.","ui.song.learned":"Нова пісня: {song} 🎶","ui.sleep.rested":"Уночі Домовик тихенько мугикав твою колискову. Ти виспався, як дитина. Статура +1 до світанку.","ui.dance.noHopak":"Ти береш кобзу — а що грати? Тут танцюють тільки під гопака. Його знають Чорт і Мотря.","ui.play.daytime":"Удень хутір у полі. Слухати буде нікому — приходь увечері, з шостої.","ui.play.alreadyPlayed":"Сьогодні ти вже грав. Люди розходяться — завтра попросять ще.","ui.play.first":"Ти сідаєш на колоду, і хутір потроху збирається: отаман із люлькою, Весна з кошиком, Радек сідає трохи осторонь. Чекають. Що заграєш?","ui.play.prompt":"Хутір збирається біля вогню. Що заграєш?","ui.promptLabel.play":"Заграти на кобзі 🎶","ui.satchel.songs":"🎶 Пісні: {songs}","ui.skillRows.name.music":"Кобзарство","ui.skillRows.stat.music":"ХАР","stat.rested":"Виспався під колискову","quest.evening.title":"Перший вечір біля вогню","quest.evening.done":"Хутір тебе слухав · вечорів: {played}","quest.evening.detail":"Увечері (з 18:00) сядь на колоду біля вогнища й заграй хуторові","quest.evening.now":"Вечір! Сідай біля вогнища й заграй хуторові","quest.evening.wait":"Як настане вечір (18:00), заграй біля вогнища","quest.lysa-sabbath.hopak":"Шабаш танцює тільки під гопака — навчись у Чорта або в Мотрі","char.gnat.name":"Гнат","char.gnat.pron":"","char.gnat.role":"Чумацький отаман · везе сіль із Криму","char.ostap.name":"Остап","char.ostap.pron":"","char.ostap.role":"Наймолодший чумак · горить у гарячці","char.ostap.roleWell":"Наймолодший чумак · уже на ногах","song.name.zhentsi":"«Ой на горі та й женці жнуть»","song.name.rozpriahaite":"«Розпрягайте, хлопці, коней»","song.name.voly":"«Ой ви, воли мої половії»","song.name.polechko":"«Ой полечко, поле»","song.topic.myroslav.label":"Пісня з Січі","song.topic.myroslav.question":"Що співали на Січі?","song.topic.myroslav.0":"«Ой на горі та й женці жнуть». Під неї військо йшло долиною, а ми, молоді, кричали так, що коні вуха притискали.","song.topic.myroslav.1":"Бери, кобзарю. Співай її, коли люди веселі — вона для свята. Тільки рядок про Сагайдачного й люльку співай голосніше: то мій улюблений.","song.topic.radek.label":"Козацька пісня","song.topic.radek.question":"Ти, лях, знаєш козацькі пісні?","song.topic.radek.0":"Знаю одну! «Розпрягайте, хлопці, коней». Вивчив за перший рік, щоб на весіллях мене не били. Подіяло. Наполовину.","song.topic.radek.1":"Бери. Я співаю її гірше, ніж кую, а кую я добже. Тобто — гарно. Весела пісня. На свята.","chumak.news.arrived":"Світанок. На східній дорозі — чумацький табір: віз із сіллю, сірі воли. І хтось лежить біля воза, не встаючи.","chumak.news.died":"Світанок. Біля чумацького воза копають яму. Остап не дожив до ранку.","chumak.toast.vesnaTonic":"Весна мовчки кладе тобі в торбу пляшечку настоянки. «Я тобі нічого не давала».","chumak.toast.persuaded":"Отаман махнув рукою. Весна вже біжить до табору з кошиком.","chumak.toast.treated":"Ти тримаєш Остапові голову, поки він п'є. До вечора жар спадає. Хутір про це дізнається — хутір завжди дізнається.","chumak.gnat.intro":"Сивий чумак із дьогтем на сорочці підводиться назустріч. «Кобзар? Слава Богу, хоч хтось підійшов. Я Гнат. Ведемо сіль із Криму. А цей… це Остап. Мій небіж».","chumak.gnat.again":"Гнат підводить червоні від безсоння очі. «Ну що, кобзарю?»","chumak.gnat.t.ostap.label":"Що з хлопцем?","chumak.gnat.t.ostap.question":"Що з Остапом?","chumak.gnat.ostap.0":"Гарячка. Напився з болотяної калюжі під Перекопом — молодий, дурний, спраглий. Третій день горить. Учора ще говорив. Сьогодні мене не впізнає.","chumak.gnat.ostap.1":"До ранку не доживе, якщо ніхто не допоможе. Я тридцять років по шляху. Я знаю, як воно виглядає.","chumak.gnat.t.why.label":"Чому вас не пускають?","chumak.gnat.t.why.question":"Чому ви тут, а не на хуторі?","chumak.gnat.why.0":"Ваш отаман побачив хворого — і поставив хлопців із кілками на дорозі. Каже: чумаки чуму носять. Чума, чумак — для нього одне слово.","chumak.gnat.why.1":"Я на нього не серджуся. Бачив я хутори після моровиці. Але це не моровиця, кобзарю. Це болотяна вода. А він і знахарці вашій заборонив до нас іти.","chumak.gnat.t.road.label":"Чумацький шлях","chumak.gnat.t.road.question":"Звідки ви йдете?","chumak.gnat.road.0":"З Криму, із соляних озер. Сіль, рибу, а як пощастить — то й новини. Півроку в дорозі, волам у хвости, дощам у пику.","chumak.gnat.road.1":"Ти знаєш, чому чумаки сорочки дьогтем мажуть? Щоб воші не їли й щоб мати впізнала, як привезуть. Отак, кобзарю. Ми їдемо — а за нами пісні.","chumak.gnat.healedIntro":"Гнат усміхається вперше за тиждень. «Живий, шибеник! Сидить і вже кашу просить».","chumak.gnat.t.thanks.label":"Подяка","chumak.gnat.t.thanks.question":"Як він?","chumak.gnat.thanks.0":"Слабкий, як кошеня, але живий. Завтра на світанку рушаємо — до Полтави ще далеко.","chumak.gnat.thanks.1":"Чумаки боргів не забувають. Будеш колись на шляху — кожен табір від Криму до Києва тебе нагодує. Скажеш: Гнат казав.","chumak.gnat.t.polechko.label":"Чумацька пісня","chumak.gnat.t.polechko.question":"Заспіваєш мені чумацької?","chumak.gnat.polechko.0":"Є в нас одна, «Ой полечко, поле». Її співають у дорозі, коли степ без краю, а дому не видно. Сумна. Але без неї чумак не чумак.","chumak.gnat.polechko.1":"Гнат співає тихо, хрипко, і навіть воли перестають жувати. Тепер вона твоя. Співай її, коли людям важко на серці. Веселим не співай — не зрозуміють.","chumak.gnat.deadIntro":"Гнат сидить біля свіжої могили, з батогом на колінах. Довго мовчить. «…Кобзар».","chumak.gnat.t.grief.label":"Остап","chumak.gnat.t.grief.question":"Мені шкода.","chumak.gnat.grief.0":"Шкода. Усім шкода. Отаманові вашому теж, я бачив: стояв на дорозі й дивився, як ми копаємо. Не підійшов.","chumak.gnat.grief.1":"Я не кажу, що ти винен. Ти тут чужий, як і ми. Але як будеш колись співати думу про чумаків — заспівай і про цю ніч. Хай пам'ятають.","chumak.gnat.t.polechkoDead.label":"Пісня над могилою","chumak.gnat.t.polechkoDead.question":"Що ви співали вночі над ним?","chumak.gnat.polechkoDead.0":"«Ой полечко, поле». Її співають над тими, хто лишився в степу. Остап знав її з малку, бо батько його теж не повернувся зі шляху.","chumak.gnat.polechkoDead.1":"Бери. Кобзар має знати і таку. Співай її, коли люди в горі. І ніколи — для забави.","chumak.gnat.t.voly.label":"Остапова пісня","chumak.gnat.t.voly.question":"Яку пісню любив Остап?","chumak.gnat.voly.0":"«Ой ви, воли мої половії». Співав її волам цілу дорогу — фальшиво, як молодий півень. Співай і ти. Хай хоч пісня доїде додому.","chumak.ostap.sickIntro":"Хлопець на кожусі ледь розплющує очі. Губи потріскані. «Мамо?.. Ні. Ти не мама. Пити…»","chumak.ostap.t.tonic.label":"Напоїти настоянкою ⚗","chumak.ostap.t.tonic.question":"(Піти проти отаманового слова й напоїти його.)","chumak.ostap.tonic.0":"Ти підводиш йому голову. Він п'є жадібно, давиться, п'є знову. Гнат стоїть за спиною й не дихає.","chumak.ostap.tonic.1":"За годину Остап засинає — уперше по-справжньому. Лоб мокрий. Жар спадає. Хтось із хутора бачив, як ти йшов до табору.","chumak.ostap.t.help.label":"Що тобі дати?","chumak.ostap.t.help.question":"Чим тобі допомогти?","chumak.ostap.help.0":"Він не відповідає, тільки тремтить. Без ліків тут не обійтися. Знахарка знала б, що робити. Або хтось, хто вміє варити настоянки.","chumak.ostap.t.home.label":"Дім","chumak.ostap.t.home.question":"Звідки ти?","chumak.ostap.home.0":"«З-під Полтави… Мати ворота фарбує на Великдень… Синім… Скажи їй, що я сіль віз… що не злякався…»","chumak.ostap.wellIntro":"Остап сидить біля воза, блідий, але усміхнений, і доїдає третю миску. «Ти той кобзар! Гнат казав. Я тобі тепер винен».","chumak.ostap.t.voly.label":"Твоя пісня","chumak.ostap.t.voly.question":"Чим віддячиш? Піснею?","chumak.ostap.voly.0":"«Ой ви, воли мої половії»! Я її волам співаю цілу дорогу, а вони мене терплять. Слухай.","chumak.ostap.voly.1":"Співає він фальшиво й щасливо, а Гнат за возом утирає очі, удаючи, що дим. Пісня рівна, дорожня — на будь-який вечір.","chumak.ostap.t.otaman.label":"Отаман","chumak.ostap.t.otaman.question":"Не тримаєш зла на отамана?","chumak.ostap.otaman.defied":"«Гнат каже, він боявся. Ну… я теж боявся. Тільки мене за це ніхто не судить». Він замовкає. «А тебе він тепер судитиме, га?»","chumak.ostap.otaman.relented":"«Він сам приходив. Стояв отут, кашляв, кашляв, а тоді сказав: „Ти вибач старому дурню“. І пішов. Дивний у вас отаман. Добрий».","chumak.otaman.t.ask.label":"Чумаки","chumak.otaman.t.ask.question":"Чому ти не пускаєш Весну до чумаків?","chumak.otaman.no.0":"Мені було сім, коли до нашого села прийшов чумацький обоз. З одним хворим. Через місяць із сорока хат лишилось дев'ять. Я ховав матір сам, кобзарю. Сам.","chumak.otaman.no.1":"У мене тут сорок душ. Діти. Весна в нас одна. Піде до них — принесе сюди. Хай мене за це Бог судить, а не ти.","chumak.otaman.no.2":"Ти тут кілька днів, співаче. Тебе ще не слухає хутір — то й я не слухатиму. Хай люди тебе спершу полюблять. (Потрібна ХАР 3.)","chumak.otaman.yes.0":"Мені було сім, коли чумацький обоз приніс моровицю в наше село. Я ховав матір сам. Ти це знаєш? …Знаєш. Тобі люди розповіли. Тобі люди тепер усе розповідають.","chumak.otaman.yes.1":"Щовечора ти співаєш моїм людям, а вони тебе слухають, як мене колись слухала Січ. І якщо ти кажеш, що це болотяна вода, а не моровиця…","chumak.otaman.yes.2":"…Весно! Іди. Бери що треба. Тільки потім руки мий у трьох водах, чуєш? І… скажи тому хлопцеві, що старий дурень просить вибачення.","chumak.otaman.t.after.label":"Чумаки","chumak.otaman.t.after.question":"Як ти тепер?","chumak.otaman.after.died":"Я стояв на дорозі й дивився, як вони копають. Не підійшов. Не зміг. Це була не моровиця, кобзарю. Весна каже — вода.","chumak.otaman.after.died2":"Я сорок душ уберіг від того, чого не було. А одну втратив. Запиши це в думу, як складатимеш. Хай знають, який був отаман у Заліссі.","chumak.otaman.after.defied":"Ти пішов проти мого слова. На хуторі так не роблять. За таке на Січі… — він махає рукою. — А хлопець живий.","chumak.otaman.after.defied2":"Я не знаю, що мені з тобою робити, кобзарю. Ти мав рацію. Не звикай до цього.","chumak.otaman.after.relented":"Знаєш, що найважче? Не страх. Сказати вголос, що боїшся. Ти мене змусив. Дякую.","chumak.otaman.after.relented2":"Чумаки обіцяли привезти нам сіль наступного літа. Задарма. Ну, майже — Гнат хоче, щоб ти заспівав.","chumak.vesna.t.ask.label":"Чумаки","chumak.vesna.t.ask.question":"Ти можеш допомогти тому хлопцеві?","chumak.vesna.sick.0":"Можу. Це болотяна гарячка, не моровиця, я таке сто разів лікувала. Настоянка зіб'є жар. Але отаман заборонив. А я живу серед цих людей, кобзарю. Не проти них.","chumak.vesna.sick.give":"…Але мені ніхто не забороняв варити настоянки. І класти їх у чужі торби, коли ніхто не бачить. Що ти з нею зробиш — то вже твоя совість.","chumak.vesna.sick.1":"У тебе вже є настоянка. Ти знаєш, що з нею робити. І знаєш, що скаже отаман. Обирай сам.","chumak.vesna.t.after.label":"Чумаки","chumak.vesna.t.after.question":"Як ти?","chumak.vesna.after.died":"Я могла його врятувати. Від мене до табору — триста кроків. Я їх так і не пройшла. Не питай мене про це більше.","chumak.vesna.after.healed":"Хлопець житиме. Болотяна гарячка, як я й казала. Отаман тепер ходить тихий. Може, це й на краще.","chumak.radek.t.label":"Чумаки","chumak.radek.t.question":"Що думаєш про чумаків?","chumak.radek.0":"Мене колись теж не пускали на хутір. Лях, втікач, хтозна що в торбі. Стояв під тином два дні. Пустив мене… твій отаман. Дивно, правда? Люди забувають, ким були.","chumak.radek.dead":"Я йому підкову для вола зробив. Вона тепер на хресті висить. Пся крев, кобзарю. Пся крев.","chumak.chort.t.label":"Чумаки","chumak.chort.t.question":"Ти бачив, що діється на дорозі?","chumak.chort.0":"Бачив, аякже. Отаман боїться чуми і через страх дає хлопцеві згоріти. А кажуть, що це я злий!","chumak.chort.1":"Знаєш мою найкращу таємницю, кобзарю? Мені майже не треба працювати. Люди самі собі чорти. Я тільки підписи збираю.","chumak.domovyk.t.label":"Ніч","chumak.domovyk.t.question":"Ти чув уночі?","chumak.domovyk.dead":"Чув. Уся хата чула, як вони співали над ним. Я цілу ніч топив піч, хоч було тепло. Так роблять, коли хтось іде. Щоб не замерз у дорозі.","chumak.grave.name":"Могила біля дороги","chumak.grave.role":"Остап, чумак із-під Полтави","chumak.grave.sing.0":"Ти сідаєш біля хреста й тихо береш перший акорд «Ой полечко, поле». Батіг на хресті гойдається від вітру, ніби підтакує.","chumak.grave.sing.1":"Ніхто не слухає. Тільки степ. Але після такої пісні ти розумієш щось про неї, чого не розумів раніше. (Кобзарство +1)","chumak.grave.after":"Свіжа земля вже вкривається травою. Хтось із хутора приніс польові квіти. Може, отаман.","chumak.grave.quiet":"Хрест із двох жердин і чумацький батіг. Ти довго стоїш мовчки. Пісні для такого в тебе ще нема.","ui.promptLabel.grave":"Постояти біля могили","ui.play.match":"{song} — саме те, що треба було хуторові сьогодні. Кобзарство {level}.","ui.play.fine":"{song} — хутір слухав і приніс миску кулешу. Кобзарство {level}.","ui.play.clash":"{song} — не той вечір для цієї пісні. Люди розходяться. Кобзарство {level}.","ui.play.levelUpTail":"ХАР тепер {cha}.","ui.play.clash.sad":"Ти вдаряєш весело — і бачиш, як баби підтискають губи, а отаман дивиться в землю. Сьогодні в хуторі горе. Хтось тихо каже: «Совісті нема в того співака». Кулешу тобі ніхто не несе.","ui.play.clash.happy":"Ти заводиш сумну — а люди прийшли веселитися. Молодь переглядається, дівчата позіхають, хтось шепоче: «Ну й поховав він нам свято». Кулешу ніхто не несе.","ui.mood.mourning":"Сьогодні тихо: біля дороги свіжа могила.","ui.mood.chumakFeast":"Чумаки гуляють із хутором — хлопець живий! Усі хочуть веселого.","ui.mood.wedding":"У Петренків заручини — молодь чекає чогось веселого.","ui.mood.memorial":"Сьогодні поминки по старій Явдосі. Люди тихі.","ui.mood.ordinary":"Звичайний вечір: косарі втомлені, діти сонні.","ui.songMood.happy":"весела","ui.songMood.neutral":"на будь-який вечір","ui.songMood.sad":"сумна","ui.play.audience.zhentsi":"«Ой на горі та й женці жнуть» — і отаман уже підспівує басом, відбиваючи такт люлькою по коліну. На рядку про Сагайдачного й люльку весь хутір реве разом із ним.","ui.play.audience.rozpriahaite":"«Розпрягайте, хлопці, коней» — і дівчата вже в колі. Радек підспівує з таким акцентом, що сміються навіть коні.","ui.play.audience.voly":"«Ой ви, воли мої половії» — рівна, дорожня. Старі кивають у такт, діти засинають у матерів на колінах.","ui.play.audience.polechko":"«Ой полечко, поле». Пісня тягнеться, як степова дорога. Ніхто не говорить. Весна дивиться у вогонь, отаман — кудись далеко на схід.","quest.section.chumaky":"Чумаки","quest.chumaky.title":"Гарячка","quest.chumaky.sick":"Молодий чумак Остап горить у гарячці. Отаман не пускає до табору Весну. До світанку — вирішуй.","quest.chumaky.died":"Остап помер на світанку. Біля дороги — могила.","quest.chumaky.defied":"Ти пішов проти отаманового слова — і Остап живий.","quest.chumaky.relented":"Отаман відступив, Весна пішла до табору — Остап живий.","quest.chumaky.objective":"Чумак на східній дорозі помирає. Поговори з Гнатом — до світанку"};function d3(e){try{return globalThis.localStorage?.getItem(e)??null}catch{return null}}function y3(e,t){try{globalThis.localStorage?.setItem(e,t)}catch{}}var m3=["uk","en"],AC="uk",v3={uk:"Українська",en:"English"},p3={en:h3,uk:f3},b3="zalissya-lang";function RC(){let e=d3(b3);return e==="en"||e==="uk"?e:AC}var g3=RC();function Ah(){return g3}function o(e,t){let a=p3[g3][e]??p3.en[e]??e;if(!t)return a;return a.replace(/\{(\w+)\}/g,(i,n)=>(n in t)?String(t[n]):i)}function k3(e){y3(b3,e)}var S3=[{id:"myroslav",name:o("char.myroslav.name.0"),pron:o("char.myroslav.pron.0"),role:o("char.myroslav.role.0"),x:760,y:520,tunic:"#7a4a2b",hair:"#cfc8bb",style:"elder"},{id:"vesna",name:o("char.vesna.name.0"),pron:o("char.vesna.pron.0"),role:o("char.vesna.role.0"),x:1196,y:824,tunic:"#a83c32",hair:"#5d3a1a",style:"herbalist"},{id:"radek",name:o("char.radek.name.0"),pron:o("char.radek.pron.0"),role:o("char.radek.role.0"),x:340,y:806,tunic:"#4c4a48",hair:"#2e2018",style:"smith"}],NC=[{id:"domovyk",name:o("char.domo
