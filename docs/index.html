on.0":"Чи гідний був мій дар?","topic.beelzebub.offering.0":"«ПОКЛАДЕНО ПРАВИЛЬНО, І КАМІНЬ ПАМ'ЯТАЄ. ТЕПЕР ПОКАЖИ ГОРІ СВОЮ КОБЗУ».","topic.beelzebub.3":"«ПИТАЙ, КОБЗАРЮ. ГОРА ВІДПОВІДАЄ НА ТЕ, НА ЩО ХОЧЕ».","topic.beelzebub.rules.label.1":"Закони і нічники","topic.beelzebub.rules.question.1":"Чого гора хоче від гостя?","topic.beelzebub.who.label.0":"Хто ти?","topic.beelzebub.who.question.0":"Хто тут головує?","topic.chort.rules.label.0":"Правила дому","topic.chort.rules.question.0":"Які тут правила?","topic.chort.beelzebub.label.0":"Вельзевул","topic.chort.beelzebub.question.0":"Який він?","topic.chort.beelzebub.0":"Велике крісло? Вельзевул для шабашу — як отаман для хутора. Тільки борода старша, пам'ять довша, а благословення СПРАВЖНІ. Як заграєш — іди по своє.","topic.chort.3":"Мій гість! Питай — правила ті самі: підписів нема, пліток повно.","topic.chort.blessing.label.0":"Благословення","topic.chort.blessing.question.0":"Він справді мене благословив?","topic.chort.telling.label.0":"Що сказати в Заліссі","topic.chort.telling.question.0":"Що мені розповідати на хуторі?","topic.chort.4":"Мій гість! Питай — правила ті самі: підписів нема, пліток повно.","topic.chort.dance.label.0":"Гопак","topic.chort.dance.question.0":"Як я грав?","topic.chort.5":"Мій гість! Питай — правила ті самі: підписів нема, пліток повно.","topic.chort.dance.label.1":"Гопак","topic.chort.dance.question.1":"А тепер що?","topic.chort.6":"Мій гість! Питай — правила ті самі: підписів нема, пліток повно.","topic.chort.offering.label.0":"Жертовний камінь","topic.chort.offering.question.0":"Куди нести нічники?","topic.chort.dance.label.2":"Гопак","topic.chort.dance.question.2":"Розкажи про гопак.","topic.chort.dance.0":"Спершу дар, кобзарю, а тоді гопак — у колі на південь від вогню. І грай так, щоб відьми забули, що вони старі. Я пробував за гостей грати — не можна. Двічі пробував. Були… наслідки.","topic.chort.7":"Мій гість! Питай — правила ті самі: підписів нема, пліток повно.","topic.chort.welcome.label.0":"Це місце","topic.chort.welcome.question.0":"Що це за місце?","topic.chort.nosign.label.0":"Без підписів?","topic.chort.nosign.question.0":"Сьогодні без угод?","topic.solokha.0":"Знову ти, кобзарику? Питай — відьомські вуха все чують.","topic.solokha.vesna.label.0":"Весна — твоя сестра?","topic.solokha.vesna.question.0":"Ти знаєш Весну?","topic.solokha.vesna.0":"«Весна — моя менша сестра. Вона лікує на хуторі тіла, я — таємниці. Між нами двома Залісся доглянуте повністю. Тільки не кажи їй, що я сказала „менша“».","topic.solokha.offering.label.0":"Дар","topic.solokha.offering.question.0":"Як іде дар?","topic.solokha.offering.0":"Поклав правильно, заграв гарно — більшого гора від гостя не просить. Вона пам'ятатиме тебе добром, а для гори це дуже багато пам'яті.","topic.solokha.dance.label.0":"Гопак","topic.solokha.dance.question.0":"Як я грав?","topic.solokha.dance.0":"Так грав, що старий Пацюк із Диканьки встав би з-за галушок! Відьми досі про твої пальці говорять — а відьомська похвала рідша за прокльони.","topic.solokha.cooking.label.0":"Куховарство","topic.solokha.cooking.question.0":"Ти справді найкраща куховарка гори?","topic.solokha.cooking.0":"«Найкраща, хоч що там чорти з повними ротами кажуть. Мій секрет? Не готуй тому, кого не могла б і прокляти. Приправа густіша».","topic.motrya.0":"«Уже {flowers} у руці. Гора й це рахує. Ще {n}, кобзарику».","topic.motrya.1":"Мотря відривається від вінка. «Питай, кобзарику. Квіти почекають».","topic.motrya.nichnyky.label.0":"Де нічники","topic.motrya.nichnyky.question.0":"Де ростуть нічні квіти?","topic.motrya.offering.label.0":"Жертовний камінь","topic.motrya.offering.question.0":"Розкажи про жертовний камінь.","topic.motrya.offering.0":"«На північ від вогню. Три нічники, покладені лагідно, — і гора нахиляється ближче. Я це відчуваю крізь черевики на кожному шабаші».","topic.motrya.dance.label.0":"Гопак","topic.motrya.dance.question.0":"Як тут танцюють?","topic.motrya.dance.0":"«Під гопака, і тільки під гопака. Грай у колі на південь від вогню. Але спершу дар: коло не чекає на того, хто прийшов із порожніми руками».","topic.motrya.moonstone.label.0":"Місячний камінь","topic.motrya.moonstone.question.0":"Що таке місячний камінь?","topic.motrya.moonstone.0":"«Коли велике крісло благословляє гостя, то місячним каменем: холодним, як криниця, лагідним, як місяць. Дар, гопак, тоді попроси. Саме так: гори вибагливі до порядку».","topic.LYSA_BLESSING_LINES.0":"Місячний камінь лягає в долоню — холодний, як вода з криниці, і вдвічі ясніший. Усередині обертається серпик — повільно, терпляче — обличчям до тебе.","topic.LYSA_BLESSING_LINES.1":"Відьми здіймають руки, чорти тупотять копитами, а Вельзевул схиляє рогату голову. У шабашу нова оповідка: про кобзаря, що прийшов увічливо, приніс чесно й заграв так, що гора підтанцьовувала.","topic.LYSA_BLESSING_LINES.2":"Дорога вниз до Залісся буде коротша, ніж угору. Для благословенних так завжди — у цьому, власне, і сенс.","topic.CHORT_SIGNED_LINES.0":"Підписано! ПІДПИСАНО! Ох, кобзарю, ти мені ціле століття зробив. Тримай золото. Чуєш, як воно не легшає? Оце добро. Оце ШАБАШНЕ добро.","topic.CHORT_SIGNED_LINES.1":"А повернення… ну, одне, бо ти мені подобаєшся: риба зі ставка будь-коли викупить душу назад. Ціна — у вікні Персонажа, під Харизмою. А тепер глянь собі під ноги на сонці. Хе. ХЕ.","topic.CHORT_REFUSED_LINES.0":"…Ні? НІ? Ха-ха! Ох, ти мені подобаєшся. Останній, хто мені відмовив, став отаманом, а передостанній — дуже здивованою жабою. Бережи душу, кобзарю. А як Вій заворушиться — ти знаєш, де жорно.","topic.CHORT_TRADE_LINES.0":"Риба, ще блищить. …Угода є угода. Тримай — одна душа, трохи з привидами, повертається до власника. А золото лиши. Чортове золото витрачається так само, а я не ШАХРАЙ.","topic.CHORT_TRADE_LINES.1":"Ось. Чуєш? Тепло. Вага. Тінь розливається біля ніг, ніби й не зникала. Приємно було мати справу. Нікому не кажи, що я розм'як.","topic.well.name.0":"Стара криниця","topic.well.role.0":"Кинь камінчик, загадай бажання","topic.brewbench.name.0":"Сушарка Весни","topic.brewbench.role.0":"Тут варять настоянки","topic.BREW_CHOICE_LINES.0":"Сушарка пахне полином і сонцем, казанок уже теплий. Тобі під силу два варива: звичайна настоянка (2 трави) і міцна настоянка Весни (3 трави; ІНТ +2 і МДР +2). Що вариш?","viy.myroslav.vigil-after.label.0":"Ніч, яку ти вистояв ✦","viy.myroslav.vigil-after.question.0":"Чи справді все?","viy.myroslav.vigil-after.0":"Усе. Півень заспівав, повіки впали, і улоговина тепер — просто яма з травою. Мій дід за таке поставив би тобі цілу бочку горілки, кобзарю.","viy.myroslav.vigil-after.1":"Бочки нема. Є хутір, що спить спокійно. А ще є дума, яку про тебе колись складе інший кобзар. Лишайся, скільки хочеш, — ти тут більше не гість.","viy.myroslav.oldway.label.0":"Вій ворушиться — давній звичай","viy.myroslav.oldway.question.0":"Вій ворушиться уві сні. Як його колись утримували?","viy.myroslav.oldway.0":"Бачив червону шпаринку? Мій дід бачив теж. Казав: Вій прокидається раз на кілька поколінь, і хтось мусить просидіти з ним одну ніч до півнів. Тоді засинає знову. Надовго.","viy.myroslav.oldway.1":"Тоді сидів бурсак. Читав молитви всю ніч у крейдяному колі. А ти — кобзар. Співатимеш думу. Дума, синку, — та сама молитва, тільки козацька.","viy.myroslav.oldway.2":"Слухай найголовніше. Коли він закричить «ПІДНІМІТЬ МЕНІ ПОВІКИ» — не дивись. Хоч що чуєш, хоч хто кличе. Хто глянув Вієві в очі, той додому не вертається.","viy.myroslav.oldway.3":"Ось тобі крейда, освячена, з церковної скрині. І дума — «Про бурю на Чорному морі», я її ще від діда знаю. Весна знає вінок проти його погляду, а Радекове залізо пече нечисть. Спитай їх. А тоді обирай ніч.","viy.myroslav.vigil.label.0":"Чування","viy.myroslav.vigil.question.0":"Нагадай, як воно.","viy.myroslav.vigil.0":"Після дев'ятої вечора крейдою коло біля улоговини. Співай думу — нечисть від неї відступає. Як повіки піднімаються — відвернися й не дивись, доки знову не впадуть. І так до півнів.","viy.myroslav.vigil.1":"Пробував уже {broken}× і щоразу вертався на своїх ногах. То вже більше, ніж у бурсака. Попоїж, виспися — і ще раз. Міцніше тіло (Статура) більше страху вміщає.","viy.myroslav.vigil.3":"І попоїж перед тим. Порожнє черево — то половина страху. Так моя баба казала, а вона трьох чоловіків поховала й жодного не злякалася.","viy.vesna.vigil-after.label.0":"Після чування","viy.vesna.vigil-after.question.0":"Вінок допоміг?","viy.vesna.vigil-after.0":"Допоміг. Але вистояв ти. Вінок тільки притуплює те, від чого тобі вистачило духу відвернутися. Відтоді й левада легша, і сон мій.","viy.vesna.wreath.label.0":"Вінок проти його очей","viy.vesna.wreath.question.0":"Отаман каже, ти знаєш вінок проти Вієвого погляду.","viy.vesna.wreath.0":"Знаю. Полин — бо нечисть гіркого не терпить. Звіробій — бо в ньому сонце. І деревій, щоб зв'язати. Дай три трави.","viy.vesna.wreath.1":"Ось. Надінь низько на чоло. Його погляд заплутається в листі, перш ніж дістане тебе, — візьме лише половину. Половину, травнику. Однаково не дивись.","viy.vesna.wreath.2":"Знаю: полин, звіробій, деревій, сплетені щільно. Він ловить половину Вієвого погляду.","viy.vesna.wreath.3":"Але звіробій треба впізнати, а твоє око ще не дозріло (МДР {wis}, треба {WREATH_WIS}). Рви інші трави — око росте зі збиранням.","viy.vesna.wreath.4":"Принеси {WREATH_HERBS} трави — у тебе {herbStock}. Світні латки в траві дадуть.","viy.radek.vigil-after.label.0":"Після чування","viy.radek.vigil-after.question.0":"Залізо співало?","viy.radek.vigil-after.0":"Співало? ВЕРЕЩАЛО, кажуть! Добре залізо. І добра рука, що кувала. У нас під Любліном твоє ім'я вирізали б над кузнею. Тут я тобі підкову з літерою зроблю.","viy.radek.ironward.label.0":"Залізо для чування","viy.radek.ironward.question.0":"Залізо допоможе проти Вієвої нечисті?","viy.radek.ironward.0":"Ще й як! Нечисть холодного заліза не терпить. Дай один виріб, що сам викував. Витягну з нього три цвяхи — заб'єш у крейдяне коло.","viy.radek.ironward.1":"Тримай. Перші троє, що торкнуться твого кола, згорять, як солома. Далі — твоя дума і твої нерви, кобзарю.","viy.radek.ironward.2":"Допоможе. Принеси виріб, що сам викував на моєму ковадлі, — і будуть цвяхи. Іди попрацюй.","viy.radek.ironward.3":"Допоможе, але горно холодне, пся крев. Спершу болотяне залізо з мулу, тоді виріб власною рукою.","viy.domovyk.vigil-after.label.0":"Після чування","viy.domovyk.vigil-after.question.0":"Ти чув півня?","viy.domovyk.vigil-after.0":"Чув? Я сам того півня окрайцем годував! Уся хата зітхнула. Спи в моєму ліжку, скільки хочеш. Я навіть перестану ховати твої чоботи. Майже.","viy.domovyk.vigil.label.0":"Чування","viy.domovyk.vigil.question.0":"Порадиш щось на ніч?","viy.domovyk.vigil.0":"Спершу виспись. Ляж у моє ліжко — розбуджу надвечір. І НЕ ДИВИСЬ. Я бачив, що буває з тими, хто дивився. Не хочу потім вимітати.","viy.lisovyk.vigil-after.label.0":"Після чування","viy.lisovyk.vigil-after.question.0":"У лісі тихіше.","viy.lisovyk.vigil-after.0":"Тихіше? Ліс СЛУХАЄ. Сто зим не чув він ту улоговину порожньою. Тепер там пташки. Може, я тобі й стежки рівно стелитиму. Іноді.","viy.lisovyk.vigil.label.0":"Чування","viy.lisovyk.vigil.question.0":"Ліс мені допоможе?","viy.lisovyk.vigil.0":"Ліс не допомагає — ліс дивиться. Але скажу лісову річ: нечисть іде з усіх боків разом. Мудрий підпускає ближче й відганяє всю гуртом одним рядком думи. Не трать слів на одну тінь.","viy.chort.vigil-after.label.0":"Після чування","viy.chort.vigil-after.question.0":"Ти дивився?","viy.chort.vigil-after.0":"Дивився? У мене було МІСЦЕ! Перший ряд, на жорні. Як та нечисть на Радековому залізі верещала — музика! А як півень заспівав… ну, скажімо, я пішов раніше. Справи.","viy.chort.vigil.label.0":"Чування","viy.chort.vigil.question.0":"Допоможеш із Вієм?","viy.chort.vigil.0":"Я чорт, а не отаман! …Але задарма скажу, хоч і болить: повіки піднімаються ПОВІЛЬНО. Поки піднімаються — співай, відганяй. А відвертайся в останню мить. Нікому не кажи, що я був корисний.","viy.bolotianyk.vigil-after.label.0":"Після чування","viy.bolotianyk.vigil-after.question.0":"Болото відчуло?","viy.bolotianyk.vigil-after.0":"«Болото відчуло, як він ПОТОНУВ, сухоногий. Глибоко, повз мої дзвони, повз дно всього. Крізь мою воду він не підніметься. Я вперше радий гостеві».","viy.bolotianyk.vigil.label.0":"Чування","viy.bolotianyk.vigil.question.0":"Що ти знаєш про Вієву нечисть?","viy.bolotianyk.vigil.0":"«Поки повіки піднімаються — нечисть повзе. Коли повіки ВІДКРИТІ — навіть нечисть завмирає: боїться того, що під ними. І принеси залізо. Вони ненавидять залізо».","viy.viyNarration.0":"Удень улоговина лише дихає. Слуги дрімають, спершись на вила. До темряви тут нічого не буде. Приходь після дев'ятої вечора — або виспися в ліжку Домовика до сутінків.","viy.viyNarration.1":"Уночі улоговина дихає гучніше. Слуги не сплять: шепочуть до повік. Червона шпаринка ширша, ніж була.","viy.viyNarration.2":"Із порожніми руками сюди не ходять. Отаман досить старий, щоб пам'ятати, як це робили колись. Спитай його.","viy.VIGIL_INTRO_LINES.0":"Ти стаєш на коліна й ведеш крейдою коло — одну нерозривну лінію. Слуги замовкають. Десь у темряві щось сміється. Потім — багато чогось.","viy.VIGIL_INTRO_LINES.1":"Береш кобзу. Пам'ятай: ДУМА відганяє нечисть від крейди. Як Вій закричить про повіки — вони піднімаються повільно. Відвернися, поки не розкрилися, і НЕ ДИВИСЬ, доки не впадуть. До півнів.","viy.VIGIL_WON_LINES.0":"Далеко в Заліссі кукурікає півень. Раз. Удруге. Нечисть верещить і розсипається, як попіл на вітрі.","viy.VIGIL_WON_LINES.1":"Слуги впускають вила. Повіки падають, наче під землею грюкнули двері. Тоді улоговина осідає: голова, повіки, слуги — усе під коріння. Трава змикається.","viy.VIGIL_WON_LINES.2":"Над соснами рожевіє. Ти досі в колі, і струни ще гудуть. Ти так і не глянув. ✦","viy.VIGIL_BROKEN_LINES.0":"Нерви не витримують. Ти вже за колом і біжиш, притискаючи кобзу до грудей. Гілля, тин, двері Домовика…","viy.VIGIL_BROKEN_LINES.1":"Прокидаєшся вранці в його ліжку, роззутий, укритий до підборіддя. Крейда в кишені. Вій спить. Ніч можна спробувати знову.","ui.bed.name.0":"Ліжко Домовика","ui.bed.role.0":"Солома, кожух і тепло від печі","ui.vigil.name.0":"Чування","ui.vigil.role.0":"Вієва улоговина · одна ніч","ui.enterHut.0":"Ти пригинаєшся під одвірок. Тепло від печі, пахне хлібом і димом. Десь за піччю хтось сопе.","ui.enterHut.1":"Хата Весни: під стелею пучки трав, а в казані дихає щось зелене. Краще не питати що.","ui.enterHut.2":"Сіни пахнуть дьогтем, квашеною капустою і владою. Ліворуч піч, праворуч світлиця, де отаман приймає людей. Хто йде з повинною, витирає ноги двічі.","ui.exitHut.0":"Знову надворі.","ui.chortChoice.0":"Підписав. Золото важке — а де це твоя тінь поділася?","ui.eatMeal.0":"Гарячий куліш з рибою. Аж вуса, яких у тебе нема, задоволено ворушаться. Статура +1, поки ситий.","ui.drinkTonic.0":"Гірко, ясно, прозоро. ІНТ +1 і МДР +1 до світанку.","ui.drinkStrongTonic.0":"Темна, густа, як ніч на Івана Купала. ІНТ +2 і МДР +2 до світанку.","ui.sleepUntil.0":"{msg} Учорашній куліш і настоянки вже не діють.","ui.pickOption.0":"Спиш як убитий і прокидаєшся від півнів.","ui.pickOption.1":"Продрімав увесь день. Щось маленьке смикає за рукав: смеркає. Домовик дотримав слова.","ui.applyGrant.0":"Освячена крейда і дума про бурю. Тепер до Вія можна йти після смеркання.","ui.applyGrant.1":"Вінок Весни з полину й звіробою. Вієвий погляд візьме лише половину.","ui.applyGrant.2":"Три залізні цвяхи для крейди. Перші троє з нечисті згорять.","ui.endVigil.0":"Вій під землею. Ти вистояв ніч: МДР +1, ХАР +1 ✦","ui.carryBlockedToast.0":"Заважко: несеш {carriedWeight}/{carryCap}, а треба ще {addWeight}. Межу задає СИЛ {str} — ковальство її підніме. Звари щось, з'їж або віддай залізо Радекові.","ui.performBrew.0":"Міцній настоянці треба 3 трави — у тебе {herbsIn}.","ui.performBrew.1":"Казанку треба 2 трави — у тебе {herbsIn}.","ui.performBrew.2":"Міцна настоянка вистоялась, темна, як криниця вночі! Алхімія {craftLevel} — ІНТ тепер {int}. Вип'єш у вікні Персонажа.","ui.performBrew.3":"Настоянка проясніла, як ранок у пляшці! Алхімія {craftLevel} — ІНТ тепер {int}. Вип'єш у вікні Персонажа.","ui.performBrew.4":"Дві пляшки міцної з одного казанка — ясна голова нічого не марнує (ІНТ {intNow}). · Алхімія {craftLevel}","ui.performBrew.5":"Дві пляшки з одного казанка — ясна голова нічого не марнує (ІНТ {intNow}). · Алхімія {craftLevel}","ui.performBrew.6":"Міцна настоянка Весни. · Алхімія {craftLevel} · у торбі: {stock}","ui.performBrew.7":"Настоянка, гірка і ясна. · Алхімія {craftLevel} · у торбі: {stock}","ui.doInteract.0":"Місячний камінь Лисої Гори твій. МДР +1, ХАР +1. 🌙","ui.doInteract.1":"Чобіт. Лівий. Ставок повертає те, що в нього кидають.","ui.doInteract.2":"Улов: {fish} — і вислизнув назад! Нема місця: несеш {carriedWeight}/{carryCap}. Межу задає СИЛ {str}.","ui.doInteract.3":"Улов: {caught}! Рибальство {fishLevel} — СПР тепер {total}.","ui.doInteract.4":"Улов: {caught}! · Рибальство {fishLevel} · усього {total}","ui.talk.0":"Душа — і тінь — знову твої.","ui.talk.1":"Радек тицяє тобі в руку гарячу ще підкову. СИЛ +1, поки носиш.","ui.gather.0":"Тягнешся до звіробою — і вагаєшся. Не знаєш ти ще цієї трави: МДР {wisNow}, треба 2. Нарви спершу інших.","ui.gather.1":"Зірвано: {name}. Травництво {herbLevel} — МДР тепер {wis}.","ui.gather.2":"{name} — і під нею ще стеблинка! Гостре око (МДР {wis}).","ui.gather.3":"Зірвано: {name} · Травництво {herbLevel} · у торбі: {flagCount}","ui.cast.0":"Закинув. Тепер чекай, поки поплавець пірне.","ui.crust.0":"Береш окраєць і дрібку солі. Для Домовика.","ui.offer.0":"Кладеш окраєць за піч. Щось у хаті задоволено зітхає.","ui.gift.0":"Гладенька річкова каменюка, тепла, як свіжий хліб. Подяка Домовика: Статура +1.","ui.iron.0":"Нема як нести: у торбі вже {satchelWeight}/{carryCap}, а брила важить 3. Межу задає СИЛ {str}.","ui.iron.1":"Тягнеш — найглибша брила й не ворухнеться. Треба СИЛ 3 (у тебе {str}) або везіння. Спробуй ще.","ui.iron.2":"Три брили болотяного заліза! Руки
