f(e>i.x+4&&e<i.x+i.w-4&&t>i.y+4&&t<i.y+i.h-10)return a}return null}var Pn=hf("hut0",{x:114,y:162}),Z3=hf("hut0",{x:106,y:60}),Ys=hf("hut0",{x:62,y:106}),J3=(e)=>hf(e,{x:zt[e].w/2,y:150});var X3={"line.myroslav.0":"Oh! A kobzar! Alive, and with his kobza too. I'm Myroslav, otaman of this khutir. Sit by the fire, son — Zalissya doesn't chase a singer off.","line.myroslav.1":"Walk the forest edge politely. That's the Lisovyk's land. Whoever takes without asking spends three days circling three pines.","line.myroslav.2":"We'll put you up in the north hut. It's empty — that is, there's only the Domovyk. Leave him bread behind the pich and you'll be warm. Don't — and you'll be entertained.","line.myroslav.3":"There's a crust by the campfire. Take it to him. Just don't thank him out loud — domovyky can't stand it, the way I can't stand clerks.","line.myroslav.4":"Now listen, because I won't say it twice. In the north-east hollow sleeps Viy. Eyelids down to the ground. You may look. You may NOT wake him.","line.myroslav.5":"Radek at the forge is a Pole. Ran from his lord and took root here. Swears in his own tongue, forges in ours. Don't needle him: a good smith on a khutir is worth a good sabre.","line.myroslav.6":"One more thing. A Chort lounges by the old millstone. Polite as a clerk and just as much a thief. Don't sell him your soul, whatever he sings. And keep out of the reeds: the Bolotianyk lives there, and he doesn't listen to kobzars — he collects them.","line.myroslav.7":"Take the trail east — Lysa Hora. On sabbath nights the devils and witches carouse so loud they hear it in Kyiv. Going isn't forbidden. But bring a gift, know the hopak, and don't drink what they pour. Well — maybe a little.","line.myroslav.8":"And remember, kobzar: here a man becomes what he does. Pick herbs and your eye sharpens. Catch fish and your hands quicken. Sing by the fire in the evening and people warm to you. It's all written in the Character sheet.","line.vesna.0":"Oh, look in your basket: kropyva, polyn, kalendula, zvirobiy, dereviy! You'll make a herbalist yet.","line.vesna.1":"You don't learn herbs from a book. You gather them — a stem at a time, a morning at a time.","line.vesna.2":"Your hands are good for more now. There's a cauldron over the fire: a fish and a herb make kulish, and a fed Cossack walks brisker. By the north-east hut stands my drying rack: two herbs make a tonic that clears the whole world.","line.vesna.3":"Your head's clear now — INT 3. Then take my strong tonic: three herbs, and mind and eye are twice as sharp (INT +2, WIS +2).","line.vesna.4":"I have a strong tonic too, three herbs' worth. But only for a clear head — INT 3. Yours is {intTotal}. Brew the common one — the rack remembers every batch.","line.vesna.5":"And fish in the satchel too. Well, kobzar, you're nearly a proper householder.","line.vesna.6":"When the herbs are resting, take a line to the west shore. Fish like the patient. So do I.","line.vesna.7":"A kobzar? Good. I'm Vesna, the znakharka. I heal people, cattle, and when needed — the otaman's hangovers.","line.vesna.8":"See the glow in the grass? Kropyva, polyn, kalendula, zvirobiy, dereviy. Pick them for me, and you'll get a herbalist's eye.","line.vesna.9":"But zvirobiy hides from a green eye. Until your Wisdom reaches 2, you won't know it even if you trip over it.","line.vesna.10":"Bring me five herbs, and I'll know the forest has taken to you.","line.radek.0":"Słyszysz? The forge is singing! Your bog iron, kobzar. Now that's a forge, a nie a shed.","line.radek.1":"Keep that horseshoe on you. Not for luck — for the arm: iron in the pocket, strength in the palm. First lesson of smithing. Free, because I'm in a good mood.","line.radek.2":"The anvil's yours. Hammer and your arm grows stronger. Strong enough, and you'll turn out a masterwork. My lord used to say a Pole with skilled hands was a sin. Let him look now.","line.radek.3":"Jezus Maria, three lumps of bog iron! Kobzar, you've just lit my forge.","line.radek.4":"Here — the first thing off the anvil: a horseshoe, still hot. Iron remembers who fed the fire.","line.radek.5":"Now Zalissya will have iron. And when that Viy of yours stirs, we'll have something to greet him with.","line.radek.6":"Radek. I shoe horses, mend ploughs, and suffer the otaman's jokes. Careful with the anvil — she bites.","line.radek.7":"Where from? Near Lublin. My lord wanted me forging shackles for his own people. I thought it over — and forged myself a road east. Here a Pole is an enemy, but a smith is a friend. I choose to be a smith.","line.radek.8":"Bog iron! Good eye. {n} more and this forge roars again.","line.radek.9":"The forge is cold, psiakrew. I need bog iron — it sleeps in the pond mud, dark lumps glinting where the bank is soft. Three lumps, and there'll be fire.","line.radek.10":"The Lisovyk bothering you? Come to me. Cold iron keeps conversations with forest lords short. Back near Lublin and here alike.","line.radek.11":"I've heard of Viy. Eyelids so heavy his servants lift them with pitchforks. They say iron sings against such things. When that day comes, let my forge already be hot.","line.domovyk.0":"Hmph. You again. …The bread was good. Crisp crust, salt just right. A hundred winters I've lived here, and decency still surprises me.","line.domovyk.1":"The stone I left — keep it by your pillow. On the bitterest night it'll be warm. That's not a promise. That's a Domovyk. We're better than promises.","line.domovyk.2":"Sleep, kobzar. The pich is warm, the mice are polite, your kobza won't go out of tune. I'm watching.","line.domovyk.3":"…The crust's gone, did you notice? Only crumbs behind the pich. I'm saying nothing. Domovyky don't say thank you.","line.domovyk.4":"But look by the pich when you've a moment. Sometimes gratitude falls out of our pockets. By accident.","line.domovyk.5":"Shh! Who's stomping? …Ah, the kobzar. The otaman said. I'm the Domovyk. This is my hut, my pich, and my mice. You're a lodger. Behave.","line.domovyk.6":"No bread yet. Well, well. New ones always forget the first night. Then they wonder why their boots are in the pich.","line.domovyk.7":"There's a crust by the campfire. Bring it here, to the pich, and set it down quietly. No songs. Not yet, anyway.","line.domovyk.8":"The Lisovyk out there plays the grand lord with his pines. Let him. Kingdoms fall; a pich stands.","line.domovyk.9":"…You smell of the hollow. You've been to Viy. Don't go stomping about up there. If those lids lift, no pich in Zalissya will keep anyone warm.","line.lisovyk.0":"Stop, two-legs. …You walk quietly, for a singer. I'm the Lisovyk. The pines are mine. The paths are mine. The lost are mine too.","line.lisovyk.1":"Take your herbs: kropyva, polyn, those little suns. The forest gives to those who ask. The greedy ones it walks in circles until they start greeting their own footprints.","line.lisovyk.2":"Vesna has her eye on you. That's a good eye to be under. Don't spoil it.","line.lisovyk.3":"You've seen him, then. Viy. Even I go round that hollow, and I am the forest. Only sleep holds him. Don't file at that chain.","line.chort.0":"My very favourite customer! Bought back the soul, kept the gold, sewed the shadow back on — you haggle better than half of hell, and they have horns!","line.chort.1":"No hard feelings, kobzar. A deal's a deal. Though… I miss your shadow. It used to dance so nicely to the kobza.","line.chort.2":"Speaking of dancing. There's a sabbath on Lysa Hora that makes the roofs in Dykanka jump! Trail to the east. Come with a gift and a hopak, and you'll leave with more than you brought. That's a promise, not a bargain. Mostly.","line.chort.3":"Ah, my shadowless friend! Noon, and nothing at your feet. Beautiful! But the gold is real. Drink it away in some warm tavern.","line.chort.4":"And when the khutir bores you — Lysa Hora, east trail. My guest is Beelzebub's own guest. Shadow or no shadow.","line.chort.5":"Hey, what's that smell? Pond and karas! TWO fish, I count without counting. Well, kobzar, shall we settle accounts?","line.chort.7":" Two, not three — with a tongue like yours you could out-sing a devil. And I, incidentally, am one.","line.chort.6":"Miss the little thing? I'm not a beast: {price} pond fish and your soul's yours again.{n} Devils love fish. Don't ask. NOBODY knows why.","line.chort.8":"Psst! Over here, kobzar, by the millstone! What, a devil can't warm himself in the sun? I'm the Chort: merchant, musician, and modest collector of… signatures.","line.chort.9":"Back in the day we threw such sabbaths at the old mill — fiddles, hopak, Cossack weddings turned inside out! A Cossack soul, kobzar, is wine, not kvass. These days we carouse on Lysa Hora. And today I'm buying.","line.chort.10":"So, the bargain. Your soul — slightly worn, one careful owner. In return: gold that never runs out. A horse that never tires. A kobza that plays by itself while you sleep! Sign here. And here. And in blood, here — kidding! Ink will do. Mostly.","line.bolotianyk.0":"The reeds part. Eyes rise out of the duckweed, then a head like a drowned log, water pouring off it. The Bolotianyk looks at you the way deep water looks at a stone.","line.bolotianyk.1":"“Dry-foot… My pond. My mud. My bells — church bells, sunk before your khutir existed. I ring them. For those who wade too far.”","line.bolotianyk.2":"“The znakharka takes my polyn and goes no further. Wise. You — pick your herbs on dry land. What grows in MY water is not for your basket.”","line.bolotianyk.3":"“And yet you fish my pond, and I allow it. Your line is polite. But your shadow… your shadow smells of that devil by the millstone.” The eyes sink lower. Watching.","line.bolotianyk.4":"“Tell the villagers: the Bolotianyk is patient. The pond was here before the khutir. The pond — and the one asleep in the hollow — will be here after. Everything sinks to us, in the end.” The ripples close as if nothing happened.","line.viy.0":"The hollow is wrong-quiet. Not a bird, not a cricket. Only a sound like a mountain breathing — slow, wet, patient.","line.viy.1":"He is enormous. A head like a stone from a burial mound, grey as old ash. Eyelids hang to the ground, heavy as a wet sail. Two withered servants lean on pitchforks. They don't look at you. They look at the lids.","line.viy.2":"Under one lid, something shifts. A seam of dull red light opens — only a seam — and every hair on you stands up. The servants freeze. The breathing stops.","line.viy.3":"…The seam closes. The breathing returns. Whatever Viy dreams, it isn't you. Not yet. You back away very, very quietly, and the birds sing again only once the campfire is in sight.","line.beelzebub.0":"Beelzebub inclines his horned head — a small, terrible courtesy. “THE MOUNTAIN REMEMBERS ITS GUESTS, KOBZAR. GO DOWN WARM.”","line.beelzebub.1":"Below, the witches are still dancing. They'll be dancing when Zalissya is a grandmother's tale. You walk down the trail with moonlight on your shoulders like a borrowed sheepskin.","line.beelzebub.2":"Beelzebub rises — slowly, the way a storm rolls in. The fiddles falter. Every devil on the summit turns to you, and the fire leans in to listen.","line.beelzebub.3":"“YOU BROUGHT THE MOUNTAIN FLOWERS. YOU PLAYED IT THE HOPAK. THE SABBATH DOES NOT SEND SUCH A GUEST AWAY EMPTY-HANDED.” He opens a palm. On it — a moonstone, cold and kind.","line.beelzebub.4":"“TAKE IT. NOT A BARGAIN — A BLESSING. THEY ARE DIFFERENT THINGS, AND TONIGHT YOU HAVE EARNED THE DIFFERENCE.” Somewhere below the mountain a bell that doesn't exist rings once — and the Bolotianyk answers.","line.beelzebub.5":"From his throne of black stone Beelzebub regards you over the fire. His voice isn't loud. The mountain carries it like thunder.","line.beelzebub.6":"“THE GIFT IS LAID. GOOD. NOW THE HOPAK, KOBZAR. A GUEST WHO ONLY WATCHES IS HALF A GUEST. PLAY IN THE RING SOUTH OF THE FIRE.”","line.beelzebub.7":"You approach the throne and the sabbath goes quiet: fiddles stop, witches freeze mid-turn, a hundred imps suddenly find their hooves fascinating.","line.beelzebub.8":"Beelzebub is older than this mountain's baldness and dressed like the finest funeral. “A KOBZAR. ON MY MOUNTAIN. WITHOUT A GIFT.” He says it the way an otaman notes a stolen fence-post: not angry — taking note.","line.beelzebub.9":"“THE LAWS ARE OLD, AND I OBEY THEM. NICHNYKY BLOOM ON THE SLOPES, PALE AS BONE. THREE ON THE OFFERING STONE. THEN WE SHALL SEE WHAT SORT OF SINGER YOU ARE.”","line.chort.11":"You came, you gave, you played — and Beelzebub himself blessed you! Know what that does for my reputation? Nothing. It was already magnificent.","line.chort.12":"Wear the stone well. And if they ask in Zalissya where you got it — say a devil gave it. Let the otaman choke on his pipe.","line.chort.13":"You PLAYED! Did everyone see? A kobzar played the hopak and the mountain didn't even crack! Now off to the big chair — a blessing's waiting for you.","line.chort.14":"The gift is laid and the stone is happy — and stones are never happy, that's how well it went! Now the hopak, kobzar! Into the ring south of the fire. The witches are already stamping their hooves… their feet, I mean.","line.chort.15":"Nichnyky! Three pale beauties, not a petal bruised. Take them to the offering stone, north of the fire. The mountain likes gentle.","line.chort.16":"MY GUEST! Welcome to Lysa Hora — my office, my tavern, my ballroom! Beelzebub presides, witches dance, and the fire is older than your khutir and twice as honest.","line.chort.17":"The rules here are Beelzebub's, so they're carved in stone: a guest brings the mountain a gift. Nichnyky bloom on the slopes — three for the offering stone. Then — the hopak. A kobzar without a hopak at a sabbath is like a Cossack without a moustache.","line.chort.18":"And no signatures tonight! Sabbath rules. Even I am honest once a week. …Mostly.","line.solokha.0":"Solokha curtseys — a witch's curtsey, with more sky in it than necessary. “Blessed by the big one himself! Walk proud, little kobzar. And tell Vesna the mountain is keeping her sister well.”","line.solokha.1":"She presses nothing into your hand and asks for nothing. From a witch of Lysa Hora, that's the rarest gift of all.","line.solokha.2":"Oh, how you played! My skirt went dancing on its own. Run to Beelzebub while the fire's high: a blessing given at high fire keeps longer.","line.solokha.3":"The stone took your flowers — I felt it through my shoes. Now the hopak, little kobzar! The ring's south of the fire. And don't count the beats — counting is how mortals fall out of the music.","line.solokha.4":"Three nichnyky, picked at the bloom's first breath — Vesna taught you well. The offering stone is north of the fire. No need to bow: the mountain isn't a priest, it's a hostess.","line.solokha.5":"Oh, look — a kobzar! I'm Solokha: witch, widow, and the best cook on this mountain, whatever the devils say with their mouths full.","line.solokha.6":"Want the sabbath to take you in? Then do it properly. Nichnyky bloom on the bare slopes, pale as little moons. Three on the offering stone, north of the fire. That's the mountain's price, and it's fairer than any devil's.","line.solokha.7":"And after — the hopak! A guest who won't play or dance, the mountain forgets. And its memory is long, and its manners non-existent.","line.motrya.0":"Motrya touches two fingers to the stone's glow and grins with every tooth. “It suits you. Come back when it fades, little kobzar — mountains renew.”","line.motrya.1":"Motrya is still spinning in the hopak's echo, humming. “You kept the beat. The big chair noticed. Go get your blessing.”","line.motrya.2":"Motrya nods at the offering stone where your nichnyky faintly glow. “Laid right. Now the hopak — south of the fire. And don't think about your fingers: fingers hate being thought about.”","line.motrya.3":"A small witch with a nightjar's voice looks up from a wreath of night-blooms. “Motrya. I know where the nichnyky hide. And I'm not too proud to say.”","line.motrya.4":"“On the slopes, little kobzar. Where the rock is baldest and the moonlight gathers in puddles. Three for the stone. Pick them gently: a bruised night-bloom is a bruised promise, and this mountain counts promises.”","line.motrya.5":"“{flowers} in hand already. The mountain counts that too. {n} more, little kobzar.”","topic.myroslav.0":"Ah, the kobzar. Sit. I've a pipe, no tobacco, and conversation's free.","topic.myroslav.forest.label.0":"The forest & the Lisovyk","topic.myroslav.forest.question.0":"Who walks the forest?","topic.myroslav.domovyk.label.0":"The Domovyk & the bread","topic.myroslav.domovyk.question.0":"What do I do about the Domovyk?","topic.myroslav.viy.label.0":"Viy","topic.myroslav.viy.question.0":"Who is Viy?","topic.myroslav.radek.label.0":"The Polish smith","topic.myroslav.radek.question.0":"Why is there a Pole here?","topic.myroslav.dark.label.0":"The Chort & the pond","topic.myroslav.dark.question.0":"What should I fear here?","topic.myroslav.lysa.label.0":"Lysa Hora","topic.myroslav.lysa.question.0":"What's Lysa Hora?","topic.myroslav.growth.label.0":"How one becomes someone","topic.myroslav.growth.question.0":"How does one become one of you?","topic.vesna.0":"Your head is clear — take the strong tonic: three herbs, INT +2 and WIS +2. The rack will offer it.","topic.vesna.1":"The strong tonic is for a clear head, INT 3. Yours is {intTotal}. Brew the common one for now — the rack remembers every one.","topic.vesna.2":"You smell like a whole meadow. Ask, herbalist.","topic.vesna.3":"Well, kobzar — something hurt, or just curious?","topic.vesna.herbs.label.0":"The five herbs","topic.vesna.herbs.question.0":"Teach me the herbs.","topic.vesna.zvirobiy.label.0":"Zvirobiy","topic.vesna.zvirobiy.question.0":"Why does zvirobiy hide from me?","topic.vesna.zvirobiy.0":"It doesn't hide any more. Your eye knows it — stem and yellow star. Doors opened by doing stay open.","topic.vesna.cooking.label.0":"Kulish","topic.vesna.cooking.question.0":"What can I cook?","topic.vesna.cooking.0":"There's a cauldron over the fire. A fish and a herb from your satchel make kulish, Sich-style. A fed man walks brisker. Eat it in the Character sheet.","topic.vesna.alchemy.label.0":"Tonics","topic.vesna.alchemy.question.0":"Teach me tonics.","topic.vesna.alchemy.0":"My drying rack stands by the north-east hut. Two herbs, some patience — a tonic. Drink it and the world clears.","topic.vesna.pond.label.0":"The pond","topic.vesna.pond.question.0":"And the pond?","topic.vesna.pond.0":"The west shore is for fishing. A patient line catches karas and quiet both. Just don't annoy the Bolotianyk: it's his water.","topic.vesna.errand.label.0":"How can I help","topic.vesna.errand.question.0":"Do you need anything?","topic.vesna.errand.0":"No, kobzar. The forest has taken you in. Now just sing to us in the evenings — that's all we need.","topic.radek.0":"Near Lublin. My lord wanted shackles, I wanted freedom. We couldn't agree on a price.","topic.radek.1":"Mind the sparks, kobzar. Ask.","topic.radek.2":"No? Careful with the anvil — she bites. Ask.","topic.radek.forge.label.0":"The forge is lit","topic.radek.forge.question.0":"How's the forge?","topic.radek.horseshoe.label.0":"The horseshoe","topic.radek.horseshoe.question.0":"Why a horseshoe?","topic.radek.smithing.label.0":"Smithing","topic.radek.smithing.question.0":"Teach me the anvil.","topic.radek.home.label.0":"Where you're from","topic.radek.home.question.0":"How does a Pole end up among Cossacks?","topic.radek.home.label.1":"Where you're from","topic.radek.home.question.1":"How does a Pole end up among Cossacks?","topic.radek.iron.label.0":"Bog iron","topic.radek.iron.question.0":"What does the forge need?","topic.radek.lisovyk.label.0":"Iron & the Lisovyk","topic.radek.lisovyk.question.0":"Will iron settle the Lisovyk?","topic.radek.viy.label.0":"Iron & Viy","topic.radek.viy.question.0":"Will iron work against Viy?","topic.domovyk.0":"Hmph. You again. Fine, sit. Ask — quietly.","topic.domovyk.1":"Quieter, lodger. Ask.","topic.domovyk.bread.label.0":"The bread","topic.domovyk.bread.question.0":"What do you want from me?","topic.domovyk.hearth.0":"The warm stone","topic.domovyk.hearth.1":"The hut & the pich","topic.domovyk.hearth.2":"Tell me about the stone.","topic.domovyk.hearth.3":"Tell me about this hut.","topic.domovyk.hearth.4":"A hundred winters here: pich warm, bread risen, mice polite. Not grand work. But no other work happens without it.","topic.domovyk.lisovyk.label.0":"The Lisovyk","topic.domovyk.lisovyk.question.0":"And the Lisovyk?","topic.domovyk.lisovyk.0":"A show-off with pinecones. Let him be. Kingdoms fall; a pich stands.","topic.domovyk.viy.label.0":"Viy","topic.domovyk.viy.question.0":"And Viy?","topic.domovyk.viy.0":"You smell of the hollow. Don't go stomping about up there. If those lids lift, no pich will keep anyone warm.","topic.lisovyk.0":"You again, singer. You walk quietly. Ask.","topic.lisovyk.rules.label.0":"The forest's laws","topic.lisovyk.rules.question.0":"What are the forest's laws?","topic.lisovyk.vesna.label.0":"Vesna","topic.lisovyk.vesna.question.0":"And Vesna?","topic.lisovyk.viy.label.0":"Viy","topic.lisovyk.viy.question.0":"And Viy?","topic.lisovyk.domovyk.label.0":"The Domovyk","topic.lisovyk.domovyk.question.0":"And the Domovyk?","topic.lisovyk.domovyk.0":"A crumb-god in a warm box. Let him guard his pich — I guard the world that grows its firewood. We don't quarrel. Much.","topic.lisovyk.lost.label.0":"The lost","topic.lisovyk.lost.question.0":"What happens to the lost?","topic.lisovyk.lost.0":"Walk greedy or loud, and the paths turn until you're greeting your own footprints at nightfall. Walk soft, and the pines step aside like polite neighbours. Sing well, and sometimes I sing along. Did you hear the wind?","topic.chort.0":"My very favourite customer! Ask — no pen on me. Devil's honour.","topic.chort.settled.label.0":"Our bargain","topic.chort.settled.question.0":"No hard feelings?","topic.chort.lysa.label.0":"The sabbath","topic.chort.lysa.question.0":"Tell me about the sabbath.","topic.chort.mill.label.0":"The old mill","topic.chort.mill.question.0":"What went on at the old mill?","topic.chort.mill.0":"Oh-ho! Fiddles, hopak, Cossack weddings turned inside out, Beelzebub himself at the head of the table! Now we carouse on Lysa Hora, but I've a soft spot for the millstone. I bought my first soul here. A Zaporozhian's. He won it back at cards, the rascal.","topic.chort.1":"My shadowless friend! Ask — everything's negotiable. Almost everything.","topic.chort.soul.label.0":"The price of my soul","topic.chort.soul.question.0":"What does my soul cost back?","topic.chort.gold.label.0":"The gold & my shadow","topic.chort.gold.question.0":"Was it a fair deal?","topic.chort.lysa.label.1":"Lysa Hora","topic.chort.lysa.question.1":"Tell me about the mountain.","topic.chort.2":"Psst. You again? Ask — I know all sorts. Some of it's even true.","topic.chort.who.label.0":"Who are you?","topic.chort.who.question.0":"What exactly are you?","topic.chort.mill.label.1":"The sabbath","topic.chort.mill.question.1":"What sabbath?","topic.chort.viy.label.0":"What devils fear","topic.chort.viy.question.0":"Do devils fear anything?","topic.chort.viy.0":"Viy. …See, even I lower my voice. A devil deals in souls. Viy deals in endings. If those lids lift, my whole sabbath will dance for his pleasure — from very, very far away.","topic.chort.refused.label.0":"Your refusal","topic.chort.refused.question.0":"Any regrets, devil?","topic.chort.refused.0":"Me? Regret? Ha! The last man who refused me became an otaman. The offer's closed; a devil keeps his word. But when Viy stirs and you need a friend with a pitchfork — you know where the millstone is. My prices only go up.","topic.chort.bargain.label.0":"The bargain ✒","topic.chort.bargain.question.0":"What are you offering?","topic.bolotianyk.0":"The eyes rise again from the duckweed. “Dry-foot. Ask. The pond has time.”","topic.bolotianyk.bells.label.0":"The drowned bells","topic.bolotianyk.bells.question.0":"What bells are under the water?","topic.bolotianyk.water.label.0":"What grows in the water","topic.bolotianyk.water.question.0":"May I take what grows here?","topic.bolotianyk.fishing.label.0":"Fishing","topic.bolotianyk.fishing.question.0":"Do you mind my line?","topic.bolotianyk.fishing.0":"“You haven't troubled my water yet. Fish if you must — from the west shore, politely. Take what the pond gives. What it keeps, it keeps.”","topic.bolotianyk.old.label.0":"The oldest things","topic.bolotianyk.old.question.0":"What's oldest here?","topic.beelzebub.viy.label.0":"Viy","topic.beelzebub.viy.question.0":"What does the mountain fear?","topic.beelzebub.viy.0":"“VIY. YES. EVEN THE MOUNTAIN HAS A NEIGHBOUR IT DOES NOT VISIT. UNDER HIS LIDS — AN ENDING. LET HIM SLEEP. SOME GUESTS EVEN I DO NOT RECEIVE.”","topic.beelzebub.court.label.0":"Your court","topic.beelzebub.court.question.0":"Who gathers here?","topic.beelzebub.court.0":"“WITCHES WHO OUTLIVED THEIR VILLAGES. DEVILS WHO OUTGREW THEIR MILLS. AND ONE KOBZAR WHO CAME POLITELY. THE FIRE IS OLDER THAN THE SICH. THE DANCE IS OLDER THAN THE FIRE.”","topic.beelzebub.0":"“THE MOUNTAIN'S GUEST RETURNS. ASK, KOBZAR.”","topic.beelzebub.moonstone.label.0":"The Moonstone","topic.beelzebub.moonstone.question.0":"What did you give me?","topic.beelzebub.leaving.label.0":"Going down","topic.beelzebub.leaving.question.0":"May I go in peace?","topic.beelzebub.1":"“YOU PLAYED, KOBZAR. THERE IS A BLESSING WITH YOUR NAME ON IT. ASK, AND IT IS YOURS.”","topic.beelzebub.blessing.label.0":"Receive the blessing ✦","topic.beelzebub.blessing.question.0":"I brought the gift and played the hopak. I've come for the blessing.","topic.beelzebub.rules.label.0":"The mountain's laws","topic.beelzebub.rules.question.0":"What are the laws here?","topic.beelzebub.rules.0":"“THE GIFT IS LAID. THE HOPAK IS PLAYED. THE REST IS MINE TO GIVE. SUCH ARE THE LAWS, AND I OBEY THEM.”","topic.beelzebub.2":"“THE STONE REMEMBERS YOUR FLOWERS. ASK.”","topic.beelzebub.dance.label.0":"The hopak","topic.beelzebub.dance.question.0":"What now?","topic.beelzebub.offering.label.0":"The gift","topic.beelzebub.offering.question.0":"Was my gift worthy?","topic.beelzebub.offering.0":"“LAID RIGHT, AND THE STONE REMEMBERS. NOW SHOW THE MOUNTAIN YOUR KOBZA.”","topic.beelzebub.3":"“ASK, KOBZAR. THE MOUNTAIN ANSWERS WHAT IT CHOOSES.”","topic.beelzebub.rules.label.1":"The laws & the nichnyky","topic.beelzebub.rules.question.1":"What does the mountain ask of a guest?","topic.beelzebub.who.label.0":"Who are you?","topic.beelzebub.who.question.0":"Who presides here?","topic.chort.rules.label.0":"House rules","topic.chort.rules.question.0":"What are the rules here?","topic.chort.beelzebub.label.0":"Beelzebub","topic.chort.beelzebub.question.0":"What's he like?","topic.chort.beelzebub.0":"The big chair? Beelzebub is to the sabbath what the otaman is to the khutir. Only his beard is older, his memory longer, and his blessings REAL. Once you've played — go collect yours.","topic.chort.3":"My guest! Ask — same rules: no signatures, plenty of gossip.","topic.chort.blessing.label.0":"The blessing","topic.chort.blessing.question.0":"Did he really bless me?","topic.chort.telling.label.0":"What to tell Zalissya","topic.chort.telling.question.0":"What do I tell the khutir?","topic.chort.4":"My guest! Ask — same rules: no signatures, plenty of gossip.","topic.chort.dance.label.0":"The hopak","topic.chort.dance.question.0":"How did I play?","topic.chort.5":"My guest! Ask — same rules: no signatures, plenty of gossip.","topic.chort.dance.label.1":"The hopak","topic.chort.dance.question.1":"What now?","topic.chort.6":"My guest! Ask — same rules: no signatures, plenty of gossip.","topic.chort.offering.label.0":"The offering stone","topic.chort.offering.question.0":"Where do the nichnyky go?","topic.chort.dance.label.2":"The hopak","topic.chort.dance.question.2":"Tell me about the hopak.","topic.chort.dance.0":"First the gift, kobzar, then the hopak — in the ring south of the fire. And play so the witches forget they're old. I tried playing in a guest's place once — not allowed. Tried twice. There were… consequences.","topic.chort.7":"My guest! Ask — same rules: no signatures, plenty of gossip.","topic.chort.welcome.label.0":"This place","topic.chort.welcome.question.0":"What is this place?","topic.chort.nosign.label.0":"No signatures?","topic.chort.nosign.question.0":"No bargains tonight?","topic.solokha.0":"You again, little kobzar? Ask — a witch's ears hear everything.","topic.solokha.vesna.label.0":"Vesna — your sister?","topic.solokha.vesna.question.0":"You know Vesna?","topic.solokha.vesna.0":"“Vesna's my little sister. She tends the khutir's bodies, I tend its secrets. Between the two of us Zalissya is fully looked after. Just don't tell her I said ‘little’.”","topic.solokha.offering.label.0":"The gift","topic.solokha.offering.question.0":"How's the gift going?","topic.solokha.offering.0":"Laid right, played well — the mountain asks no more of a guest. It'll remember you kindly, and for a mountain that's a great deal of remembering.","topic.solokha.dance.label.0":"The hopak","topic.solokha.dance.question.0":"How did I play?","topic.solokha.dance.0":"You played so well old Patsiuk from Dykanka would've left his dumplings! The witches still talk about your fingers — and a witch's praise is rarer than her curses.","topic.solokha.cooking.label.0":"Cooking","topic.solokha.cooking.question.0":"Are you really the mountain's best cook?","topic.solokha.cooking.0":"“The best, whatever the devils say with their mouths full. My secret? Never cook for anyone you couldn't also curse. Thickens the seasoning.”","topic.motrya.0":"“{flowers} in hand already. The mountain counts that too. {n} more, little kobzar.”","topic.motrya.1":"Motrya looks up from her wreath. “Ask, little kobzar. The flowers can wait.”","topic.motrya.nichnyky.label.0":"Where the nichnyky are","topic.motrya.nichnyky.question.0":"Where do the night-blooms grow?","topic.motrya.offering.label.0":"The offering stone","topic.motrya.offering.question.0":"Tell me about the offering stone.","topic.motrya.offering.0":"“North of the fire. Three nichnyky, laid gently, and the mountain leans closer. I feel it through my shoes every sabbath.”","topic.motrya.dance.label.0":"The hopak","topic.motrya.dance.question.0":"How does one dance here?","topic.motrya.dance.0":"“To the hopak, and only the hopak. Play in the ring south of the fire. But the gift first: the ring doesn't wait for empty hands.”","topic.motrya.moonstone.label.0":"The Moonstone","topic.motrya.moonstone.question.0":"What's the Moonstone?","topic.motrya.moonstone.0":"“When the big chair blesses a guest, it's with a moonstone: cold as a well, kind as the moon. Gift, hopak, then ask. In that order: mountains are fussy about order.”","topic.LYSA_BLESSING_LINES.0":"The moonstone settles in your palm — cold as well-water and twice as clear. Inside, a crescent turns — slowly, patiently — to face you.","topic.LYSA_BLESSING_LINES.1":"The witches raise their arms, the devils stamp their hooves, and Beelzebub bows his horned head. The sabbath has a new tale: of a kobzar who came politely, gave honestly, and played so the mountain danced.","topic.LYSA_BLESSING_LINES.2":"The road down to Zalissya will be shorter than the road up. It always is, for the blessed — that's rather the point.","topic.CHORT_SIGNED_LINES.0":"Signed! SIGNED! Oh, kobzar, you've made my century. Here's your gold. Feel how it never gets lighter? That's the good stuff. That's SABBATH stuff.","topic.CHORT_SIGNED_LINES.1":"As for returns… well, one, because I like you: pond fish buys your soul back any time. The price is in the Character sheet, under Charisma. Now look down at your feet in the sun. Heh. HEH.","topic.CHORT_REFUSED_LINES.0":"…No? NO? Ha-ha! Oh, I like you. The last man who refused me became an otaman; the one before that, a very surprised frog. Keep your soul, kobzar. And when Viy stirs — you know where the millstone is.","topic.CHORT_TRADE_LINES.0":"Fish, still shining. …A deal's a deal. Here — one soul, slightly haunted, returns to its owner. Keep the gold. Devil's gold spends just the same, and I'm no CHEAT.","topic.CHORT_TRADE_LINES.1":"There. Feel it? Warmth. Weight. A shadow pooling at your feet as if it never left. Pleasure doing business. Tell no one I went soft.","topic.well.name.0":"The old well","topic.well.role.0":"Drop a pebble, make a wish","topic.brewbench.name.0":"Vesna's drying rack","topic.brewbench.role.0":"Where tonics are brewed","topic.BREW_CHOICE_LINES.0":"The rack smells of polyn and sun, the little cauldron is already warm. Two brews are within your craft: the common tonic (2 herbs) and Vesna's strong tonic (3 herbs; INT +2 and WIS +2). Which will it be?","viy.myroslav.vigil-after.label.0":"The night you held ✦","viy.myroslav.vigil-after.question.0":"Is it really over?","viy.myroslav.vigil-after.0":"Over. The rooster crowed, the lids fell, and the hollow's just a grassy pit now. My grandfather would have stood you a whole barrel of horilka for this, kobzar.","viy.myroslav.vigil-after.1":"No barrel. But a khutir that sleeps easy. And a duma some other kobzar will one day make about you. Stay as long as you like — you're no guest here any more.","viy.myroslav.oldway.label.0":"Viy stirs — the old way","viy.myroslav.oldway.question.0":"Viy stirs in his sleep. How was he held before?","viy.myroslav.oldway.0":"You saw the red seam? My grandfather saw it too. He said Viy wakes once every few generations, and someone must sit up with him one night until the cockcrow. Then he sleeps again. For a long time.","viy.myroslav.oldway.1":"Back then a seminarian sat up. Read prayers all night in a chalk circle. You're a kobzar. You'll sing a duma. A duma, son, is the same as a prayer — just a Cossack one.","viy.myroslav.oldway.2":"Now the most important part. When he shouts “LIFT MY EYELIDS” — don't look. Whatever you hear, whoever calls. Whoever meets Viy's eyes doesn't come home.","viy.myroslav.oldway.3":"Here's the chalk, blessed, from the church chest. And a duma — “The Black Sea Storm”, I learned it from my grandfather. Vesna knows a wreath against his gaze, and Radek's iron burns the unclean. Ask them. Then pick your night.","viy.myroslav.vigil.label.0":"The vigil","viy.myroslav.vigil.question.0":"Remind me how it goes.","viy.myroslav.vigil.0":"After nine in the evening, a chalk circle by the hollow. Sing your duma — the unclean shy from it. When the lids rise, turn away and don't look until they fall. Until the rooster crows.","viy.myroslav.vigil.1":"You've tried {broken}× and come back on your own feet each time. That's more than the seminarian managed. Eat, sleep — and again. A sturdier body (Constitution) holds more fear.","viy.myroslav.vigil.3":"And eat first. An empty belly is half of fear. So my granny said, and she buried three husbands without being scared of one.","viy.vesna.vigil-after.label.0":"After the vigil","viy.vesna.vigil-after.question.0":"Did the wreath help?","viy.vesna.vigil-after.0":"It helped. But you held. A wreath only dulls what you had the nerve to turn from. The meadow's lighter since that night, and so is my sleep.","viy.vesna.wreath.label.0":"A wreath against his eyes","viy.vesna.wreath.question.0":"The otaman says you know a wreath against Viy's gaze.","viy.vesna.wreath.0":"I do. Polyn — the unclean can't stand bitterness. Zvirobiy — it holds the sun. And dereviy to bind them. Give me three herbs.","viy.vesna.wreath.1":"There. Wear it low on your brow. His gaze will tangle in the leaves before it reaches you — it'll take only half. Half, herbalist. Still don't look.","viy.vesna.wreath.2":"I do: polyn, zvirobiy, dereviy, woven tight. It catches half of Viy's gaze.","viy.vesna.wreath.3":"But you need to know zvirobiy, and your eye isn't ready (WIS {wis}, needs {WREATH_WIS}). Pick the other herbs — the eye grows with gathering.","viy.vesna.wreath.4":"Bring {WREATH_HERBS} herbs — you have {herbStock}. The glowing patches will provide.","viy.radek.vigil-after.label.0":"After the vigil","viy.radek.vigil-after.question.0":"Did the iron sing?","viy.radek.vigil-after.0":"Sing? It SCREAMED, they say! Good iron. And a good arm that forged it. Back near Lublin they'd carve your name over the smithy. Here I'll make you a horseshoe with your initial.","viy.radek.ironward.label.0":"Iron for the vigil","viy.radek.ironward.question.0":"Will iron help against Viy's host?","viy.radek.ironward.0":"And how! The unclean can't stand cold iron. Give me a piece you forged yourself. I'll draw three nails from it — drive them into the chalk circle.","viy.radek.ironward.1":"Here. The first three to touch your circle will burn like straw. After that — your duma and your nerve, kobzar.","viy.radek.ironward.2":"It will. Bring a piece you forged yourself on my anvil, and you'll have nails. Go and work.","viy.radek.ironward.3":"It will, but the forge is cold, psiakrew. First bog iron from the mud, then a piece by your own hand.","viy.domovyk.vigil-after.label.0":"After the vigil","viy.domovyk.vigil-after.question.0":"Did you hear the rooster?","viy.domovyk.vigil-after.0":"Hear him? I fed that rooster a crust myself! The whole hut sighed. Sleep in my bed as long as you like. I'll even stop hiding your boots. Almost.","viy.domovyk.vigil.label.0":"The vigil","viy.domovyk.vigil.question.0":"Any advice for the night?","viy.domovyk.vigil.0":"Sleep first. Lie in my bed — I'll wake you at dusk. And DON'T LOOK. I've seen what happens to those who looked. I don't want to sweep it up.","viy.lisovyk.vigil-after.label.0":"After the vigil","viy.lisovyk.vigil-after.question.0":"The forest is quieter.","viy.lisovyk.vigil-after.0":"Quieter? The forest is LISTENING. A hundred winters it hasn't heard that hollow empty. Now there are birds. Maybe I'll lay the paths straight for you. Sometimes.","viy.lisovyk.vigil.label.0":"The vigil","viy.lisovyk.vigil.question.0":"Will the forest help me?","viy.lisovyk.vigil.0":"The forest doesn't help — it watches. But here's a forest thing: the host comes from every side at once. The wise one lets them close and drives them all back with one line of the duma. Don't waste words on a single shadow.","viy.chort.vigil-after.label.0":"After the vigil","viy.chort.vigil-after.question.0":"Were you watching?","viy.chort.vigil-after.0":"Watching? I had a SEAT! Front row, on the millstone. The way that host screeched on Radek's iron — music! And when the rooster crowed… let's say I left early. Business.","viy.chort.vigil.label.0":"The vigil","viy.chort.vigil.question.0":"Will you help with Viy?","viy.chort.vigil.0":"I'm a devil, not an otaman! …But I'll tell you for free, though it hurts: the lids rise SLOWLY. While they rise — sing, drive them back. Turn away at the last moment. Tell no one I was useful.","viy.bolotianyk.vigil-after.label.0":"After the vigil","viy.bolotianyk.vigil-after.question.0":"Did the pond feel it?","viy.bolotianyk.vigil-after.0":"“The pond felt him SINK, dry-foot. Deep, past my bells, past the bottom of everything. He won't rise through my water. For the first time, I'm glad of a guest.”","viy.bolotianyk.vigil.label.0":"The vigil","viy.bolotianyk.vigil.question.0":"What do you know about Viy's host?","viy.bolotianyk.vigil.0":"“While the lids are rising, the host crawls. When the lids are OPEN, even the host goes still: it fears what's under them. And bring iron. They hate iron.”","viy.viyNarration.0":"By day the hollow only breathes. The servants doze on their pitchforks. Nothing will happen here before dark. Come back after nine in the evening — or sleep in the Domovyk's bed until dusk.","viy.viyNarration.1":"At night the hollow breathes louder. The servants are awake, whispering to the lids. The red seam is wider than before.","viy.viyNarration.2":"One doesn't come here empty-handed. The otaman is old enough to remember how it was done. Ask him.","viy.VIGIL_INTRO_LINES.0":"You kneel and draw the chalk circle — one unbroken line. The servants fall silent. Somewhere in the dark, something laughs. Then many somethings.","viy.VIGIL_INTRO_LINES.1":"You take up the kobza. Remember: the DUMA drives the host back from the chalk. When Viy shouts for his lids, they rise slowly. Turn away before they open, and DON'T LOOK until they fall. Until the cockcrow.","viy.VIGIL_WON_LINES.0":"Far off in Zalissya a rooster crows. Once. Twice. The host shrieks and scatters like ash in the wind.","viy.VIGIL_WON_LINES.1":"The servants drop their pitchforks. The lids fall like a door slamming under the earth. Then the hollow sinks: head, lids, servants — all beneath the roots. The grass closes over.","viy.VIGIL_WON_LINES.2":"Pink light over the pines. You're still in the circle, the strings still humming. You never looked. ✦","viy.VIGIL_BROKEN_LINES.0":"Your nerve breaks. You're out of the circle and running, the kobza clutched to your chest. Branches, the fence, the Domovyk's door…","viy.VIGIL_BROKEN_LINES.1":"You wake in the morning in his bed, boots off, tucked in to the chin. The chalk is in your pocket. Viy sleeps. The night can be tried again.","ui.bed.name.0":"The Domovyk's bed","ui.bed.role.0":"Straw, a sheepskin, and the pich's warmth","ui.vigil.name.0":"The vigil","ui.vigil.role.0":"Viy's hollow · one night","ui.enterHut.0":"You duck under the lintel. Warmth from the pich, a smell of bread and smoke. Something behind the pich is snuffling.","ui.enterHut.1":"Vesna's hut: bundles of herbs under the ceiling, and something green breathing in the cauldron. Better not to ask what.","ui.enterHut.2":"The passage smells of tar, sauerkraut and authority. Left is the pich; right is the best room, where the otaman receives people. Whoever comes to confess wipes his feet twice.","ui.exitHut.0":"Back outside.","ui.chortChoice.0":"Signed. The gold is heavy — and where did your shadow go?","ui.eatMeal.0":"Hot kulish with fish. Even the moustache you don't have twitches with pleasure. CON +1 while well fed.","ui.drinkTonic.0":"Bitter, bright, clear. INT +1 and WIS +1 until dawn.","ui.drinkStrongTonic.0":"Dark and thick as Kupala night. INT +2 and WIS +2 until dawn.","ui.sleepUntil.0":"{msg} Yesterday's kulish and tonics have worn off.","ui.pickOption.0":"You sleep like a log and wake to the roosters.","ui.pickOption.1":"You doze the day away. Something small tugs your sleeve: dusk. The Domovyk kept his word.","ui.applyGrant.0":"Blessed chalk and the storm duma. Now Viy can be faced after dark.","ui.applyGrant.1":"Vesna's wreath of polyn and zvirobiy. Viy's gaze will take only half.","ui.applyGrant.2":"Three iron nails for the chalk. The first three of the host will burn.","ui.endVigil.0":"Viy is under the earth. You held the night: WIS +1, CHA +1 ✦","ui.carryBlockedToast.0":"Too heavy: carrying {carriedWeight}/{carryCap}, need {addWeight} more. Your STR {str} sets the limit — smithing raises it. Cook, eat, or hand the iron to Radek.","ui.performBrew.0":"The strong tonic wants 3 herbs — you have {herbsIn}.","ui.performBrew.1":"The cauldron wants 2 herbs — you have {herbsIn}.","ui.performBrew.2":"The strong tonic settles, dark as a well at night! Alchemy {craftLevel} — INT is now {int}. Drink it in the Character sheet.","ui.performBrew.3":"The tonic clears like morning in a bottle! Alchemy {craftLevel} — INT is now {int}. Drink it in the Character sheet.","ui.performBrew.4":"Two bottles of the strong one from one pot — a clear head wastes nothing (INT {intNow}). · Alchemy {craftLevel}","ui.performBrew.5":"Two bottles from one pot — a clear head wastes nothing (INT {intNow}). · Alchemy {craftLevel}","ui.performBrew.6":"Vesna's strong tonic. · Alchemy {craftLevel} · in satchel: {stock}","ui.performBrew.7":"A tonic, bitter and bright. · Alchemy {craftLevel} · in satchel: {stock}","ui.doInteract.0":"The Moonstone of Lysa Hora is yours. WIS +1, CHA +1. 🌙","ui.doInteract.1":"A boot. The left one. The pond gives back what it's given.","ui.doInteract.2":"Catch: {fish} — and it slips back! No room: carrying {carriedWeight}/{carryCap}. Your STR {str} sets the limit.","ui.doInteract.3":"Catch: {caught}! Fishing {fishLevel} — DEX is now {total}.","ui.doInteract.4":"Catch: {caught}! · Fishing {fishLevel} · {total} in all","ui.talk.0":"Soul — and shadow — yours again.","ui.talk.1":"Radek presses a still-hot horseshoe into your hand. STR +1 while you carry it.","ui.gather.0":"You reach for the zvirobiy — and hesitate. You don't know this herb yet: WIS {wisNow}, needs 2. Pick the others first.","ui.gather.1":"Picked: {name}. Herbalism {herbLevel} — WIS is now {wis}.","ui.gather.2":"{name} — and another stem underneath! Keen eye (WIS {wis}).","ui.gather.3":"Picked: {name} · Herbalism {herbLevel} · in satchel: {flagCount}","ui.cast.0":"Cast. Now wait for the float to dip.","ui.crust.0":"You take the crust and a pinch of salt. For the Domovyk.","ui.offer.0":"You set the crust behind the pich. Something in the hut sighs contentedly.","ui.gift.0":"A smooth river stone, warm as fresh bread. The Domovyk's thanks: CON +1.","ui.iron.0":"No way to carry it: your satchel is at {satchelWeight}/{carryCap}, and a lump weighs 3. Your STR {str} sets the limit.","ui.iron.1":"You heave — the deepest lump won't budge. It takes STR 3 (you have {str}) or luck. Try again.","ui.iron.2":"Three lumps of bog iron! Arms full — take them to Radek.","ui.iron.3":"Shlup! The deepest lump comes free! Iron ({n}/3 for Radek).","ui.iron.4":"Bog iron! A heavy rust-dark lump ({n}/3 for Radek).","ui.wish.0":"Something glints on the well's rim — a lucky pebble! The well liked the singer. DEX +1.","ui.wish.1":"The well is silent. It likes those the khutir likes (CHA {cha}). Play for people in the evening — then wish again.","ui.cook.0":"The cauldron wants a fish and a herb. The pond is west; the herbs glow in the grass.","ui.cook.1":"The cauldron wants a fish — cast from the west shore first.","ui.cook.2":"The cauldron wants a herb — pick any glowing one.","ui.cook.3":"Kulish! Cooking {craftLevel} — CON is now {con}. Eat it in the Character sheet.","ui.cook.4":"Kulish, thick and fragrant. · Cooking {craftLevel} · in satchel: {flagCount}","ui.smith.0":"The forge is cold. First Radek needs three lumps of bog iron.","ui.smith.1":"The iron needs to heat, and your arm needs a breath.","ui.smith.2":"The hammer rings true! Smithing {craftLevel} — STR is now {str}.","ui.smith.3":"A masterwork! Two horseshoes from one heat (STR {str}). · Smithing {craftLevel}","ui.smith.4":"Clang… clang… a good horseshoe. · Smithing {craftLevel} · in satchel: {flagCount}","ui.brew.0":"The cauldron wants 2 herbs — you have {herbsIn}.","ui.bloom.0":"The third nichnyk! Take them to the offering stone, north of the fire.","ui.bloom.1":"Nichnyk · {n}/3 for the gift","ui.offering.0":"The stone wants 3 nichnyky; you have {have}. Motrya knows where they hide.","ui.offering.1":"You lay the nichnyky on the cold stone. They open one by one — and the whole ring of stones seems to lean closer.","ui.dance.0":"The witches shake their heads: the gift first. Three nichnyky on the stone north of the fire.","ui.dance.1":"You strike up the hopak! Witches whoop, devils squat-kick, the fire dances. Beelzebub nods, barely, to the beat.","ui.sleep.0":"Straw, a sheepskin, the warm pich through the wall. {timeLabel}. How long will you lie down?","ui.sleep.morning.label.0":"Sleep until morning 🌅","ui.sleep.morning.aria.0":"Sleep until seven in the morning","ui.sleep.night.label.0":"Nap until nightfall 🌙","ui.sleep.night.aria.0":"Nap until nine in the evening","ui.sleep.cancel.label.0":"Not now","ui.sleep.cancel.aria.0":"Get up","ui.frame.0":"Dawn over Zalissya. Yesterday's kulish and tonics have worn off.","ui.frame.1":"“LIFT MY EYELIDS: I CANNOT SEE!” The servants heave on their pitchforks. Turn away before they open!","ui.frame.2":"You met his eyes! Nerve −{damage}.","ui.frame.3":"The lids fall. You never looked.","ui.frame.4":"The steppe rises, the grass thins, and there's bare rock under your boots. Lysa Hora. Up top, something is dancing round a fire — and it's clearly not Cossacks.","ui.frame.5":"Lysa Hora. The sabbath roars on.","ui.frame.7":"Got away! The float settles.","ui.tagText.0":"Viy","ui.objective.0":"Sing the duma and hold until the cockcrow","ui.promptLabel.0":"Approach · Viy","ui.promptLabel.1":"Talk · {name}","ui.promptLabel.2":"Go in 🚪","ui.promptLabel.3":"Go outside","ui.promptLabel.4":"Pick: {herb} 🌿","ui.promptLabel.5":"Cast a line 🎣","ui.promptLabel.6":"STRIKE! 🎣","ui.promptLabel.7":"Take the crust 🍞","ui.promptLabel.8":"Leave the crust behind the pich","ui.promptLabel.9":"Something glints by the pich…","ui.promptLabel.10":"Dig bog iron","ui.promptLabel.11":"Cook kulish 🍲","ui.promptLabel.12":"Forge 🔨","ui.promptLabel.13":"Brew — choose a tonic ⚗","ui.promptLabel.14":"Brew a tonic ⚗","ui.promptLabel.15":"Pick a nichnyk 🌙","ui.promptLabel.16":"Lay the gift 🌙","ui.promptLabel.17":"Play the hopak 🎶","ui.promptLabel.18":"Lie down 🛏","ui.promptLabel.19":"Draw the chalk circle ◯","ui.promptLabel.20":"Make a wish ✨","ui.promptAria.0":"Approach Viy — carefully","ui.promptAria.1":"Talk to {name}","ui.promptAria.2":"Draw the chalk circle and begin the vigil","ui.keepsakes.0":"✦ Held the night at Viy's (WIS +1, CHA +1)","ui.keepsakes.1":"◯ Blessed chalk","ui.keepsakes.2":"🌿 Vesna's wreath","ui.keepsakes.3":"⚒ Radek's three nails","ui.keepsakes.4":"🌙 Moonstone (WIS +1, CHA +1)","ui.keepsakes.5":"🪙 Devil's gold (CHA +2)","ui.keepsakes.6":"🪨 Warm stone (CON +1)","ui.keepsakes.7":"✦ Horseshoe (STR +1)","ui.keepsakes.8":"✨ Lucky pebble (DEX +1)","ui.keepsakes.9":"🍞 A crust for the Domovyk","ui.skillRows.name.0":"Herbalism","ui.skillRows.stat.0":"WIS","ui.skillRows.name.1":"Fishing","ui.skillRows.stat.1":"DEX","ui.skillRows.name.2":"Cooking","ui.skillRows.stat.2":"CON","ui.skillRows.name.3":"Smithing","ui.skillRows.stat.3":"STR","ui.skillRows.name.4":"Alchemy","ui.s leeps in the north-east hollow — go and see","quest.oldway.title.0":"The old way","quest.oldway.0":"The otaman gave you the chalk and the storm duma","quest.oldway.1":"Ask the otaman how Viy was held before","quest.oldway.2":"Viy stirs — ask the otaman about the old way","quest.wreath.title.0":"Vesna's wreath","quest.wreath.0":"A wreath of polyn and zvirobiy — the gaze takes half","quest.wreath.1":"Optional · Vesna weaves a wreath against Viy's eyes: 3 herbs and WIS 2","quest.wreath.2":"Ask Vesna for the wreath · 3 herbs","quest.ironward.title.0":"Radek's nails","quest.ironward.0":"Three iron nails in the chalk — the first three burn","quest.ironward.1":"Optional · bring Radek a piece from his anvil","quest.ironward.2":"Bring Radek a forged piece","quest.vigil.title.0":"The vigil","quest.vigil.0":"You held until the cockcrow. Viy sleeps under the earth — for good","quest.vigil.2":" · tries: {vigilsBroken}","quest.vigil.1":"At night (21:00–04:00) draw the circle by the hollow and sing your duma until the cockcrow","quest.vigil.3":"Night — go to the hollow and draw the chalk circle","quest.vigil.4":"When night falls (21:00) — to Viy. Or sleep at the Domovyk's until dusk","quest.domovyk.title.0":"Bread for the Domovyk","quest.domovyk.0":"Bread left, thanks received — the warm stone is yours","quest.domovyk.1":"The crust is eaten. Look by the pich","quest.domovyk.2":"Leave the crust by the pich in his hut","quest.domovyk.3":"Take the crust by the campfire to the Domovyk","quest.domovyk.4":"Something glints by the Domovyk's pich — look","quest.domovyk.5":"Take the Domovyk the crust — he's in the north hut, by the pich","quest.forge.title.0":"Light the forge","quest.forge.0":"The forge burns, the horseshoe is yours","quest.forge.1":"Take the bog iron to Radek","quest.forge.2":"Dig bog iron from the pond mud · {iron}/3","quest.forge.3":"Take the bog iron to Radek","quest.forge.4":"Dig bog iron for Radek · {iron}/3","quest.soul.title.0":"The Chort's bargain","quest.soul.0":
