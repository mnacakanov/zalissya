годні — розпорядник шабашу","char.solokha.name.0":"Солоха","char.solokha.pron.0":"","char.solokha.role.0":"Відьма з Диканьки · вдова","char.motrya.name.0":"Мотря","char.motrya.pron.0":"","char.motrya.role.0":"Відьма · знає, де цвітуть нічники","char.LYSA_DANCERS.name.0":"Відьма","char.LYSA_DANCERS.role.0":"Танцює на шабаші","input.Joystick.0":"Ігрове поле — торкнись будь-де й тягни, щоб іти","input.Joystick.1":"Торкнись будь-де й тягни, щоб іти","time.timeLabel.0":"День {day} · {hh}:{mm} {icon}","ui.continue":"Продовжити","ui.zalissya":"Залісся","ui.next":"Далі","ui.farewell":"Бувай","ui.quests":"Завдання","ui.character":"Персонаж","stat.soulless":"Без душі","quest.section.story":"Історія","ui.hud.soulLost":"☠ Без тіні — душа в Чорта (викуп: {price} риби)","ui.hud.overfull":"🎒 Переповнено ({carried}/{cap}) — нового не підняти","ui.vigil.secondsLeft":"{s} с","ui.dialogue.youAsk":"Ти питаєш: «{question}»","ui.quests.intro":"Виконано {done} з {total}. Позначка «{now}» — де зараз історія. Решта почекає: блукати не гріх.","ui.stats.from":"від: {feeds}","ui.stats.footer":"Очок тут не роздають. У Заліссі ти стаєш тим, що робиш. Чорт зараз цінує твою душу в {price} риби.","ui.skills.feeds":"→ {stat}","ui.skills.level":"Рівень {level}","ui.satchel.basics":"🌿 трав: {herbStock} · 🎣 риби: {fish}","ui.satchel.carrying":"🎒 Несеш {carried} / {cap} (межу задає СИЛ {str}). Вага: риба 1 · трава 1 · підкова 2 · залізо 3 · нічники 0.","line.chort.5b":"Ану, що то пахне? Ставком і карасем! ТРИ риби, рахую, навіть не рахуючи. Ну що, кобзарю, зведемо рахунки?","ui.language":"Мова","song.name.holota":"Дума про козака Голоту","song.name.kolyskova":"Колискова «Ой ходить сон»","song.name.hopak":"Гопак","song.name.burya":"Дума про бурю на Чорному морі","song.topic.vesna.label":"Колискова","song.topic.vesna.question":"Навчиш мене колискової?","song.topic.vesna.0":"«Ой ходить сон коло вікон, а дрімота — коло плота…» Мама мені співала, а я — всім хворим дітям на хуторі. Слухай і запам'ятовуй.","song.topic.vesna.1":"Заспівай її в хаті Домовика, як лягатимеш. Він удаватиме, що не слухає, а вранці встанеш, ніби тебе мама сповила. Статура +1 до світанку.","song.topic.chort.label":"Гопак","song.topic.chort.question":"Ти, кажуть, музика. Навчиш гопака?","song.topic.chort.0":"Навчу! Задарма! Бачиш, як мені боляче це казати? Гопак — то чортова музика, що її козаки в нас поцупили, а ми й не сердимось: гарно ж танцюють.","song.topic.chort.1":"Ось: раз-два, раз-два-три, а тоді вдар по струнах, наче за тобою сотня татар женеться. Без гопака на Лисій Горі тебе й на поріг не пустять.","song.topic.motrya.label":"Гопак","song.topic.motrya.question":"Навчиш мене гопака?","song.topic.motrya.0":"«Слухай». Мотря наспівує, притупуючи, і за хвилину твої пальці вже самі знають, куди бігти. «Чорт би теж навчив, та потім розповідав би всім, що ти йому винен».","ui.fire.name":"Вогнище","ui.fire.role":"Тут увечері збирається хутір","ui.play.audience.holota":"Дума про Голоту — як голий козак пана-ляха провчив. Радек сміється найголосніше: «Добже йому, добже!»","ui.play.audience.kolyskova":"Колискова. Говір стихає. Хтось із баб утирає очі хусткою, а отаман удає, що йому в око попав дим.","ui.play.audience.hopak":"Гопак! За мить уже весь хутір навприсядки, навіть отаман зі своєю спиною. Звідкись із темряви долинає підозріле цокання копит.","ui.play.audience.burya":"Дума про бурю на Чорному морі. Над вогнем стоїть тиша, така, що чути, як тріщить жар. Ніхто не каже ні слова. Усі знають, яку ніч ти вистояв.","ui.song.learned":"Нова пісня: {song} 🎶","ui.sleep.rested":"Уночі Домовик тихенько мугикав твою колискову. Ти виспався, як дитина. Статура +1 до світанку.","ui.dance.noHopak":"Ти береш кобзу — а що грати? Тут танцюють тільки під гопака. Його знають Чорт і Мотря.","ui.play.daytime":"Удень хутір у полі. Слухати буде нікому — приходь увечері, з шостої.","ui.play.alreadyPlayed":"Сьогодні ти вже грав. Люди розходяться — завтра попросять ще.","ui.play.first":"Ти сідаєш на колоду, і хутір потроху збирається: отаман із люлькою, Весна з кошиком, Радек сідає трохи осторонь. Чекають. Що заграєш?","ui.play.prompt":"Хутір збирається біля вогню. Що заграєш?","ui.promptLabel.play":"Заграти на кобзі 🎶","ui.satchel.songs":"🎶 Пісні: {songs}","ui.skillRows.name.music":"Кобзарство","ui.skillRows.stat.music":"ХАР","stat.rested":"Виспався під колискову","quest.evening.title":"Перший вечір біля вогню","quest.evening.done":"Хутір тебе слухав · вечорів: {played}","quest.evening.detail":"Увечері (з 18:00) сядь на колоду біля вогнища й заграй хуторові","quest.evening.now":"Вечір! Сідай біля вогнища й заграй хуторові","quest.evening.wait":"Як настане вечір (18:00), заграй біля вогнища","quest.lysa-sabbath.hopak":"Шабаш танцює тільки під гопака — навчись у Чорта або в Мотрі","char.gnat.name":"Гнат","char.gnat.pron":"","char.gnat.role":"Чумацький отаман · везе сіль із Криму","char.ostap.name":"Остап","char.ostap.pron":"","char.ostap.role":"Наймолодший чумак · горить у гарячці","char.ostap.roleWell":"Наймолодший чумак · уже на ногах","song.name.zhentsi":"«Ой на горі та й женці жнуть»","song.name.rozpriahaite":"«Розпрягайте, хлопці, коней»","song.name.voly":"«Ой ви, воли мої половії»","song.name.polechko":"«Ой полечко, поле»","song.topic.myroslav.label":"Пісня з Січі","song.topic.myroslav.question":"Що співали на Січі?","song.topic.myroslav.0":"«Ой на горі та й женці жнуть». Під неї військо йшло долиною, а ми, молоді, кричали так, що коні вуха притискали.","song.topic.myroslav.1":"Бери, кобзарю. Співай її, коли люди веселі — вона для свята. Тільки рядок про Сагайдачного й люльку співай голосніше: то мій улюблений.","song.topic.radek.label":"Козацька пісня","song.topic.radek.question":"Ти, лях, знаєш козацькі пісні?","song.topic.radek.0":"Знаю одну! «Розпрягайте, хлопці, коней». Вивчив за перший рік, щоб на весіллях мене не били. Подіяло. Наполовину.","song.topic.radek.1":"Бери. Я співаю її гірше, ніж кую, а кую я добже. Тобто — гарно. Весела пісня. На свята.","chumak.news.arrived":"Світанок. На східній дорозі — чумацький табір: віз із сіллю, сірі воли. І хтось лежить біля воза, не встаючи.","chumak.news.died":"Світанок. Біля чумацького воза копають яму. Остап не дожив до ранку.","chumak.toast.vesnaTonic":"Весна мовчки кладе тобі в торбу пляшечку настоянки. «Я тобі нічого не давала».","chumak.toast.persuaded":"Отаман махнув рукою. Весна вже біжить до табору з кошиком.","chumak.toast.treated":"Ти тримаєш Остапові голову, поки він п'є. До вечора жар спадає. Хутір про це дізнається — хутір завжди дізнається.","chumak.gnat.intro":"Сивий чумак із дьогтем на сорочці підводиться назустріч. «Кобзар? Слава Богу, хоч хтось підійшов. Я Гнат. Ведемо сіль із Криму. А цей… це Остап. Мій небіж».","chumak.gnat.again":"Гнат підводить червоні від безсоння очі. «Ну що, кобзарю?»","chumak.gnat.t.ostap.label":"Що з хлопцем?","chumak.gnat.t.ostap.question":"Що з Остапом?","chumak.gnat.ostap.0":"Гарячка. Напився з болотяної калюжі під Перекопом — молодий, дурний, спраглий. Третій день горить. Учора ще говорив. Сьогодні мене не впізнає.","chumak.gnat.ostap.1":"До ранку не доживе, якщо ніхто не допоможе. Я тридцять років по шляху. Я знаю, як воно виглядає.","chumak.gnat.t.why.label":"Чому вас не пускають?","chumak.gnat.t.why.question":"Чому ви тут, а не на хуторі?","chumak.gnat.why.0":"Ваш отаман побачив хворого — і поставив хлопців із кілками на дорозі. Каже: чумаки чуму носять. Чума, чумак — для нього одне слово.","chumak.gnat.why.1":"Я на нього не серджуся. Бачив я хутори після моровиці. Але це не моровиця, кобзарю. Це болотяна вода. А він і знахарці вашій заборонив до нас іти.","chumak.gnat.t.road.label":"Чумацький шлях","chumak.gnat.t.road.question":"Звідки ви йдете?","chumak.gnat.road.0":"З Криму, із соляних озер. Сіль, рибу, а як пощастить — то й новини. Півроку в дорозі, волам у хвости, дощам у пику.","chumak.gnat.road.1":"Ти знаєш, чому чумаки сорочки дьогтем мажуть? Щоб воші не їли й щоб мати впізнала, як привезуть. Отак, кобзарю. Ми їдемо — а за нами пісні.","chumak.gnat.healedIntro":"Гнат усміхається вперше за тиждень. «Живий, шибеник! Сидить і вже кашу просить».","chumak.gnat.t.thanks.label":"Подяка","chumak.gnat.t.thanks.question":"Як він?","chumak.gnat.thanks.0":"Слабкий, як кошеня, але живий. Завтра на світанку рушаємо — до Полтави ще далеко.","chumak.gnat.thanks.1":"Чумаки боргів не забувають. Будеш колись на шляху — кожен табір від Криму до Києва тебе нагодує. Скажеш: Гнат казав.","chumak.gnat.t.polechko.label":"Чумацька пісня","chumak.gnat.t.polechko.question":"Заспіваєш мені чумацької?","chumak.gnat.polechko.0":"Є в нас одна, «Ой полечко, поле». Її співають у дорозі, коли степ без краю, а дому не видно. Сумна. Але без неї чумак не чумак.","chumak.gnat.polechko.1":"Гнат співає тихо, хрипко, і навіть воли перестають жувати. Тепер вона твоя. Співай її, коли людям важко на серці. Веселим не співай — не зрозуміють.","chumak.gnat.deadIntro":"Гнат сидить біля свіжої могили, з батогом на колінах. Довго мовчить. «…Кобзар».","chumak.gnat.t.grief.label":"Остап","chumak.gnat.t.grief.question":"Мені шкода.","chumak.gnat.grief.0":"Шкода. Усім шкода. Отаманові вашому теж, я бачив: стояв на дорозі й дивився, як ми копаємо. Не підійшов.","chumak.gnat.grief.1":"Я не кажу, що ти винен. Ти тут чужий, як і ми. Але як будеш колись співати думу про чумаків — заспівай і про цю ніч. Хай пам'ятають.","chumak.gnat.t.polechkoDead.label":"Пісня над могилою","chumak.gnat.t.polechkoDead.question":"Що ви співали вночі над ним?","chumak.gnat.polechkoDead.0":"«Ой полечко, поле». Її співають над тими, хто лишився в степу. Остап знав її з малку, бо батько його теж не повернувся зі шляху.","chumak.gnat.polechkoDead.1":"Бери. Кобзар має знати і таку. Співай її, коли люди в горі. І ніколи — для забави.","chumak.gnat.t.voly.label":"Остапова пісня","chumak.gnat.t.voly.question":"Яку пісню любив Остап?","chumak.gnat.voly.0":"«Ой ви, воли мої половії». Співав її волам цілу дорогу — фальшиво, як молодий півень. Співай і ти. Хай хоч пісня доїде додому.","chumak.ostap.sickIntro":"Хлопець на кожусі ледь розплющує очі. Губи потріскані. «Мамо?.. Ні. Ти не мама. Пити…»","chumak.ostap.t.tonic.label":"Напоїти настоянкою ⚗","chumak.ostap.t.tonic.question":"(Піти проти отаманового слова й напоїти його.)","chumak.ostap.tonic.0":"Ти підводиш йому голову. Він п'є жадібно, давиться, п'є знову. Гнат стоїть за спиною й не дихає.","chumak.ostap.tonic.1":"За годину Остап засинає — уперше по-справжньому. Лоб мокрий. Жар спадає. Хтось із хутора бачив, як ти йшов до табору.","chumak.ostap.t.help.label":"Що тобі дати?","chumak.ostap.t.help.question":"Чим тобі допомогти?","chumak.ostap.help.0":"Він не відповідає, тільки тремтить. Без ліків тут не обійтися. Знахарка знала б, що робити. Або хтось, хто вміє варити настоянки.","chumak.ostap.t.home.label":"Дім","chumak.ostap.t.home.question":"Звідки ти?","chumak.ostap.home.0":"«З-під Полтави… Мати ворота фарбує на Великдень… Синім… Скажи їй, що я сіль віз… що не злякався…»","chumak.ostap.wellIntro":"Остап сидить біля воза, блідий, але усміхнений, і доїдає третю миску. «Ти той кобзар! Гнат казав. Я тобі тепер винен».","chumak.ostap.t.voly.label":"Твоя пісня","chumak.ostap.t.voly.question":"Чим віддячиш? Піснею?","chumak.ostap.voly.0":"«Ой ви, воли мої половії»! Я її волам співаю цілу дорогу, а вони мене терплять. Слухай.","chumak.ostap.voly.1":"Співає він фальшиво й щасливо, а Гнат за возом утирає очі, удаючи, що дим. Пісня рівна, дорожня — на будь-який вечір.","chumak.ostap.t.otaman.label":"Отаман","chumak.ostap.t.otaman.question":"Не тримаєш зла на отамана?","chumak.ostap.otaman.defied":"«Гнат каже, він боявся. Ну… я теж боявся. Тільки мене за це ніхто не судить». Він замовкає. «А тебе він тепер судитиме, га?»","chumak.ostap.otaman.relented":"«Він сам приходив. Стояв отут, кашляв, кашляв, а тоді сказав: „Ти вибач старому дурню“. І пішов. Дивний у вас отаман. Добрий».","chumak.otaman.t.ask.label":"Чумаки","chumak.otaman.t.ask.question":"Чому ти не пускаєш Весну до чумаків?","chumak.otaman.no.0":"Мені було сім, коли до нашого села прийшов чумацький обоз. З одним хворим. Через місяць із сорока хат лишилось дев'ять. Я ховав матір сам, кобзарю. Сам.","chumak.otaman.no.1":"У мене тут сорок душ. Діти. Весна в нас одна. Піде до них — принесе сюди. Хай мене за це Бог судить, а не ти.","chumak.otaman.no.2":"Ти тут кілька днів, співаче. Тебе ще не слухає хутір — то й я не слухатиму. Хай люди тебе спершу полюблять. (Потрібна ХАР 3.)","chumak.otaman.yes.0":"Мені було сім, коли чумацький обоз приніс моровицю в наше село. Я ховав матір сам. Ти це знаєш? …Знаєш. Тобі люди розповіли. Тобі люди тепер усе розповідають.","chumak.otaman.yes.1":"Щовечора ти співаєш моїм людям, а вони тебе слухають, як мене колись слухала Січ. І якщо ти кажеш, що це болотяна вода, а не моровиця…","chumak.otaman.yes.2":"…Весно! Іди. Бери що треба. Тільки потім руки мий у трьох водах, чуєш? І… скажи тому хлопцеві, що старий дурень просить вибачення.","chumak.otaman.t.after.label":"Чумаки","chumak.otaman.t.after.question":"Як ти тепер?","chumak.otaman.after.died":"Я стояв на дорозі й дивився, як вони копають. Не підійшов. Не зміг. Це була не моровиця, кобзарю. Весна каже — вода.","chumak.otaman.after.died2":"Я сорок душ уберіг від того, чого не було. А одну втратив. Запиши це в думу, як складатимеш. Хай знають, який був отаман у Заліссі.","chumak.otaman.after.defied":"Ти пішов проти мого слова. На хуторі так не роблять. За таке на Січі… — він махає рукою. — А хлопець живий.","chumak.otaman.after.defied2":"Я не знаю, що мені з тобою робити, кобзарю. Ти мав рацію. Не звикай до цього.","chumak.otaman.after.relented":"Знаєш, що найважче? Не страх. Сказати вголос, що боїшся. Ти мене змусив. Дякую.","chumak.otaman.after.relented2":"Чумаки обіцяли привезти нам сіль наступного літа. Задарма. Ну, майже — Гнат хоче, щоб ти заспівав.","chumak.vesna.t.ask.label":"Чумаки","chumak.vesna.t.ask.question":"Ти можеш допомогти тому хлопцеві?","chumak.vesna.sick.0":"Можу. Це болотяна гарячка, не моровиця, я таке сто разів лікувала. Настоянка зіб'є жар. Але отаман заборонив. А я живу серед цих людей, кобзарю. Не проти них.","chumak.vesna.sick.give":"…Але мені ніхто не забороняв варити настоянки. І класти їх у чужі торби, коли ніхто не бачить. Що ти з нею зробиш — то вже твоя совість.","chumak.vesna.sick.1":"У тебе вже є настоянка. Ти знаєш, що з нею робити. І знаєш, що скаже отаман. Обирай сам.","chumak.vesna.t.after.label":"Чумаки","chumak.vesna.t.after.question":"Як ти?","chumak.vesna.after.died":"Я могла його врятувати. Від мене до табору — триста кроків. Я їх так і не пройшла. Не питай мене про це більше.","chumak.vesna.after.healed":"Хлопець житиме. Болотяна гарячка, як я й казала. Отаман тепер ходить тихий. Може, це й на краще.","chumak.radek.t.label":"Чумаки","chumak.radek.t.question":"Що думаєш про чумаків?","chumak.radek.0":"Мене колись теж не пускали на хутір. Лях, втікач, хтозна що в торбі. Стояв під тином два дні. Пустив мене… твій отаман. Дивно, правда? Люди забувають, ким були.","chumak.radek.dead":"Я йому підкову для вола зробив. Вона тепер на хресті висить. Пся крев, кобзарю. Пся крев.","chumak.chort.t.label":"Чумаки","chumak.chort.t.question":"Ти бачив, що діється на дорозі?","chumak.chort.0":"Бачив, аякже. Отаман боїться чуми і через страх дає хлопцеві згоріти. А кажуть, що це я злий!","chumak.chort.1":"Знаєш мою найкращу таємницю, кобзарю? Мені майже не треба працювати. Люди самі собі чорти. Я тільки підписи збираю.","chumak.domovyk.t.label":"Ніч","chumak.domovyk.t.question":"Ти чув уночі?","chumak.domovyk.dead":"Чув. Уся хата чула, як вони співали над ним. Я цілу ніч топив піч, хоч було тепло. Так роблять, коли хтось іде. Щоб не замерз у дорозі.","chumak.grave.name":"Могила біля дороги","chumak.grave.role":"Остап, чумак із-під Полтави","chumak.grave.sing.0":"Ти сідаєш біля хреста й тихо береш перший акорд «Ой полечко, поле». Батіг на хресті гойдається від вітру, ніби підтакує.","chumak.grave.sing.1":"Ніхто не слухає. Тільки степ. Але після такої пісні ти розумієш щось про неї, чого не розумів раніше. (Кобзарство +1)","chumak.grave.after":"Свіжа земля вже вкривається травою. Хтось із хутора приніс польові квіти. Може, отаман.","chumak.grave.quiet":"Хрест із двох жердин і чумацький батіг. Ти довго стоїш мовчки. Пісні для такого в тебе ще нема.","ui.promptLabel.grave":"Постояти біля могили","ui.play.match":"{song} — саме те, що треба було хуторові сьогодні. Кобзарство {level}.","ui.play.fine":"{song} — хутір слухав і приніс миску кулешу. Кобзарство {level}.","ui.play.clash":"{song} — не той вечір для цієї пісні. Люди розходяться. Кобзарство {level}.","ui.play.levelUpTail":"ХАР тепер {cha}.","ui.play.clash.sad":"Ти вдаряєш весело — і бачиш, як баби підтискають губи, а отаман дивиться в землю. Сьогодні в хуторі горе. Хтось тихо каже: «Совісті нема в того співака». Кулешу тобі ніхто не несе.","ui.play.clash.happy":"Ти заводиш сумну — а люди прийшли веселитися. Молодь переглядається, дівчата позіхають, хтось шепоче: «Ну й поховав він нам свято». Кулешу ніхто не несе.","ui.mood.mourning":"Сьогодні тихо: біля дороги свіжа могила.","ui.mood.chumakFeast":"Чумаки гуляють із хутором — хлопець живий! Усі хочуть веселого.","ui.mood.wedding":"У Петренків заручини — молодь чекає чогось веселого.","ui.mood.memorial":"Сьогодні поминки по старій Явдосі. Люди тихі.","ui.mood.ordinary":"Звичайний вечір: косарі втомлені, діти сонні.","ui.songMood.happy":"весела","ui.songMood.neutral":"на будь-який вечір","ui.songMood.sad":"сумна","ui.play.audience.zhentsi":"«Ой на горі та й женці жнуть» — і отаман уже підспівує басом, відбиваючи такт люлькою по коліну. На рядку про Сагайдачного й люльку весь хутір реве разом із ним.","ui.play.audience.rozpriahaite":"«Розпрягайте, хлопці, коней» — і дівчата вже в колі. Радек підспівує з таким акцентом, що сміються навіть коні.","ui.play.audience.voly":"«Ой ви, воли мої половії» — рівна, дорожня. Старі кивають у такт, діти засинають у матерів на колінах.","ui.play.audience.polechko":"«Ой полечко, поле». Пісня тягнеться, як степова дорога. Ніхто не говорить. Весна дивиться у вогонь, отаман — кудись далеко на схід.","quest.section.chumaky":"Чумаки","quest.chumaky.title":"Гарячка","quest.chumaky.sick":"Молодий чумак Остап горить у гарячці. Отаман не пускає до табору Весну. До світанку — вирішуй.","quest.chumaky.died":"Остап помер на світанку. Біля дороги — могила.","quest.chumaky.defied":"Ти пішов проти отаманового слова — і Остап живий.","quest.chumaky.relented":"Отаман відступив, Весна пішла до табору — Остап живий.","quest.chumaky.objective":"Чумак на східній дорозі помирає. Поговори з Гнатом — до світанку","tobacco.news.dry":"Світанок. На сушарці Весни тютюн висох — темний, пахучий, аж у носі лоскоче. Неси отаманові.","tobacco.toast.started":"Отаманові потрібен тютюн. Старе тютюнове поле — за річкою, біля чумацького шляху.","tobacco.toast.leaf":"Тютюнове листя · {n}/{need}","tobacco.toast.leavesDone":"Листя досить ({n}/{need}), і прядиво є. Неси на сушарку Весни.","tobacco.toast.leavesNeedHemp":"Листя досить ({n}/{need}). Тепер конопляного прядива — зв'язати. Конопляне поле на південь від хутора.","tobacco.toast.hemp":"Ти надираєш із конопель пасмо міцного прядива. Таким і віз зв'язати можна, не те що тютюн.","tobacco.toast.hung":"Ти зв'язуєш листя прядивом і вішаєш на сушарку Весни. До ранку висохне.","tobacco.toast.lyulka":"Отаман дарує тобі свою стару люльку. На чуванні в Вія — Мужність +2.","tobacco.prompt.leaf":"Зірвати тютюнове листя 🍂","tobacco.prompt.hemp":"Надерти конопляного прядива","tobacco.prompt.hang":"Повісити тютюн сушитися","tobacco.keepsake":"🪈 Стара люлька отамана (Мужність +2 на чуванні)","tobacco.otaman.t.ask.label":"Люлька без тютюну","tobacco.otaman.t.ask.question":"Чого ти, отамане, люльку смокчеш порожню?","tobacco.otaman.ask.0":"Бо тютюну нема, синку! З весни. Чумаки не довезли, а я без люльки — як Січ без отамана: стою, а толку нема.","tobacco.otaman.ask.1":"За річкою, біля чумацького шляху, є старе тютюнове поле. Садив його Тарас Довгий, що пішов на Січ і не вернувся. Поле здичавіло, але тютюн там ще росте. Люди кажуть — бо чорт його доглядає. Тютюн же чортове зілля.","tobacco.otaman.ask.2":"Принеси мені листя, синку. Три добрі листки. Тільки сирим я його курити не буду — Весна знає, як сушити. Зроби — і я тобі віддячу так, що й дума про це буде.","tobacco.otaman.t.wait.label":"Тютюн","tobacco.otaman.t.wait.question":"Я ще шукаю тютюн.","tobacco.otaman.wait.0":"Шукай, шукай. За річкою, біля чумацького шляху. А я тут посиджу, посмокчу порожню люльку. Мені не звикати.","tobacco.otaman.wait.drying":"Сохне, кажеш? Ох, синку, ця ніч буде найдовша в моєму житті. А я ж їх бачив, тих довгих ночей.","tobacco.otaman.t.give.label":"Тютюн ✦","tobacco.otaman.t.give.question":"Ось тобі тютюн, отамане. Сухий.","tobacco.otaman.give.0":"Отаман нюхає пучок, і в нього аж вуса здригаються. Набиває люльку, кресалом викрешує іскру, затягується — і довго-довго мовчить.","tobacco.otaman.give.1":"…Тарасів тютюн. Він завжди казав, що в нього найкращий на всю округу. Брехав, звісно. Але сьогодні — правда.","tobacco.otaman.give.2":"Тримай, синку. Це моя стара люлька, ще з Січі. Я з нею на турка ходив. Закуриш перед страшною ніччю — руки не тремтітимуть. Повір старому.","tobacco.otaman.t.after.label":"Люлька","tobacco.otaman.t.after.question":"Як тютюн?","tobacco.otaman.after.0":"Добрий, як Тарасова брехня. Кожного вечора по люльці, а в неділю — по дві. Отак і живемо.","tobacco.vesna.t.label":"Тютюн","tobacco.vesna.t.question":"Як сушити тютюн?","tobacco.vesna.0":"Сирим його не курять — горло дере, і голова болить. Листя треба зв'язати пучком і повісити в тіні, на вітрі. Моя сушарка підійде.","tobacco.vesna.1":"А в'язати — конопляним прядивом, іншим не тримає. Конопляне поле на південь від хутора, за городами. До ранку висохне.","tobacco.radek.t.label":"Тютюн","tobacco.radek.t.question":"Ти знаєш, де тютюн росте?","tobacco.radek.0":"За річкою, біля чумацького шляху. Через міст і праворуч. Я туди раз ходив — побачив чорта на межі й вернувся. Може, мені здалося. А може, й ні. Пся крев.","tobacco.chort.t.label":"Тютюн","tobacco.chort.t.question":"Кажуть, тютюн — чортове зілля?","tobacco.chort.0":"Моє найкраще творіння! Не гопак, не горілка — тютюн! Посадиш його раз, а люди потім самі до тебе ходять, і ще й дякують.","tobacco.chort.1":"Тарасове поле? Бери, бери, я не жадібний. Хай твій отаман курить на здоров'я. На моє здоров'я, точніше.","quest.tobacco.title":"Люлька отамана","quest.tobacco.gather":"Тютюн за річкою, біля чумацького шляху · листя {leaves}/3. І конопляне прядиво з поля на півдні","quest.tobacco.hang":"Повісь тютюн сушитися на сушарку Весни","quest.tobacco.drying":"Тютюн сохне на сушарці Весни — до ранку","quest.tobacco.ready":"Тютюн висох — неси отаманові","quest.tobacco.done":"Отаман курить Тарасів тютюн, а в тебе — його стара люлька","quest.tobacco.none":"—","map.button":"Мапа","map.open":"Відкрити мапу","map.zoom":"Масштаб мапи","map.zoom.world":"Увесь світ","map.zoom.near":"Довкола мене","map.aria":"Мапа: хутір, поля, річка, ліси, степ і Лиса Гора","map.legend":"● — ти тут · ★ — куди веде поточне завдання · ▲ — кургани · ✣ — вітряк","map.khutir":"Залісся","map.steppe":"Степ","map.lysa":"Лиса Гора","map.river":"Річка","map.forest":"Ліс","map.fields":"Ниви","map.hemp":"Коноплі","map.tobacco":"Тютюн","map.pond":"Ставок","map.none":"У тебе нема мапи. Чумаки знають кожну дорогу — а ще, кажуть, Чорт продає все, навіть мапи.","map.title.chumak":"Чумацька мапа","map.title.chort":"Чортова мапа (пахне сіркою)","map.keepsake.chumak":"🗺 Чумацька мапа (M — відкрити)","map.keepsake.chort":"🗺 Чортова мапа (M — відкрити)","map.toast.chumak":"Гнат віддає тобі чумацьку мапу. Тепер у тебе є «Мапа» — кнопка вгорі або M.","map.toast.chort":"Три риби — і мапа твоя. Тепер у тебе є «Мапа» — кнопка вгорі або M.","map.chort.label":"Мапа","map.chort.question":"Кажуть, ти й мапи продаєш?","map.chort.buy.0":"Продаю! Найточнішу в усьому повіті: тут кожна стежка, кожен курган, кожна криниця, в яку я колись плював. Три риби.","map.chort.buy.1":"Чорт виловлює з-за пазухи згорток, від якого тягне сіркою. Рибу ховає ще швидше. «Приємно мати справу. Не дивись на неї опівночі. Ну, хіба трохи».","map.chort.poor.0":"Мапа — три риби, кобзарю. У тебе {fish}. Золото моє ж не приймаю — я не дурний. Іди до ставка, вудка не кусається. Майже. (Ціна: {price} риби.)","chumak.gnat.t.map.label":"Дорога далі","chumak.gnat.t.map.question":"Куди ви тепер?","chumak.gnat.map.0":"На Полтаву, а там додому. А тобі — ось, тримай. Чумацька мапа: дороги, броди, криниці, кургани, де ночувати. Я її сам малював, тридцять років по шляху.","chumak.gnat.map.1":"Мені вона вже не треба — я ці дороги ногами пам'ятаю. А кобзар без мапи — як віл без ярма: іде, а куди — не знає.","char.odarka.name":"Одарка","char.odarka.pron":"","char.odarka.role":"Шинкарка · тримає корчму на шляху","char.okhrim.name":"Охрім","char.okhrim.pron":"","char.okhrim.role":"Старий запорожець · п'є в борг","song.name.pidmanula":"«Ти ж мене підманула»","song.name.dunai":"«Їхав козак за Дунай»","ui.play.audience.pidmanula":"«Ти ж мене підманула» — і вже на третьому куплеті хутір співає за тебе. Весна кидає на отамана такий погляд, що той закашлюється в люльку.","ui.play.audience.dunai":"«Їхав козак за Дунай». Діди кивають, баби зітхають, а дівчата дивляться на дорогу, ніби з неї от-от хтось вийде.","korchma.name":"Корчма","korchma.role":"На чумацькому шляху, за хутором","ui.promptLabel.playKorchma":"Заграти для корчми 🎶","ui.enterHut.korchma":"Корчма. Дим під стелею, кухлі стукають об стіл, пахне горілкою і квашеними огірками. За шинквасом жінка в синій хустці міряє тебе поглядом: платитимеш чи співатимеш?","ui.hut.korchma":"🍺 Корчма","map.korchma":"Корчма","korchma.play.daytime":"Удень у корчмі тільки мухи та Охрім, і обидва сплять. Грати приходь увечері.","korchma.play.prompt":"Одарка кивнула тобі на лаву під стіною. У корчмі стихає. Що заграєш?","korchma.mood.mourning":"Сьогодні тут п'ють мовчки, за упокій. Навіть чарки ставлять обережно.","korchma.mood.chumaky":"Чумаки гуляють, і корчма гуляє з ними. Хтось уже танцює на лаві.","korchma.mood.maudlin":"Сьогодні корчма розкисла: двоє плачуть за Січчю, третій за матір'ю, четвертий сам не знає за чим.","korchma.mood.merry":"Звичайний вечір у корчмі: гамір, сміх, хтось уже спорить про коней.","korchma.play.match":"{song} — корчма гуде, кухлі б'ють об стіл у такт. Одарка ставить тобі миску вареників. Кобзарство {level}.","korchma.play.fine":"{song} — слухали, хтось навіть підтягнув. Одарка ставить тобі миску вареників. Кобзарство {level}.","korchma.play.clash":"{song} — не та пісня для цієї корчми. Вареників не буде. Кобзарство {level}.","korchma.play.room.match":"Коли ти замовкаєш, корчма ще мить мовчить, а потім реве так, що з полиці падає глечик. Одарка не сварить. Одарка всміхається.","korchma.play.room.fine":"Корчма слухає впівуха, як слухають на шляху, і все ж хтось поставив тобі чарку. Ти її не п'єш. Кобзареві треба руки.","korchma.play.room.clash.sad":"Ти вдаряєш весело, а корчма сьогодні плаче. Хтось кидає в тебе шкуркою від сала: «Совісті нема!» Одарка лише хитає головою.","korchma.play.room.clash.happy":"Ти заводиш сумну, а люди прийшли гуляти. «Ти що, на похорон нас привів?» Хтось уже грюкає дверима.","korchma.toast.supper":"Одарка ставить перед тобою миску вареників зі сметаною. Мінус рибина, плюс життя. 🥟","korchma.odarka.intro":"Жінка за шинквасом витирає кухоль і не поспішає. «Кобзар. Ну-ну. Платиш рибою, співаєш увечері, в борг не наливаю. Охрімові наливаю, але він не рахується. Я Одарка».","korchma.odarka.again":"«А, співак. Сідай, тільки не на те місце, де Охрім. Там Охрім».","korchma.odarka.t.who.label":"Про Одарку","korchma.odarka.t.who.question":"Сама тримаєш корчму?","korchma.odarka.who.0":"«Сама. Чоловік сім років тому поїхав на Січ. Сказав: до Покрови. Котрої Покрови, не сказав».","korchma.odarka.who.1":"«Спершу я кожному чумакові казала: як побачиш мого Степана, переказуй. Тепер не кажу. Наливаю й мовчу. Так легше обом».","korchma.odarka.t.supper.label":"Повечеряти (1 рибина)","korchma.odarka.t.supper.question":"Чим годуєш?","korchma.odarka.supper.0":"«Вареники з сиром, сметана своя. Давай рибу. Та не цю, оцю, більшу. От». Вона забирає рибину так, ніби робить тобі ласку. Так воно і є.","korchma.odarka.supperPoor":"«Вареники за рибу, співаче. За {price}. За гарні очі тут годують тільки Охріма, і то бо він уже не бачить, що їсть». Можна ще заграти ввечері.","korchma.odarka.t.news.label":"Що чути на шляху","korchma.odarka.t.news.question":"Що люди кажуть?","korchma.odarka.news.viy":"«Кажуть, у балці за хутором щось ворушиться ночами. Чумаки там не ночують, об'їжджають гаком. А чумака налякати, сам знаєш, треба ще вміти».","korchma.odarka.news.viySealed":"«Кажуть, ти в балці всю ніч співав, а воно слухало й не встало. Брешуть, мабуть. А вареники я тобі все одно подвійні класти буду».","korchma.odarka.news.road":"«Ще кажуть, сіль подорожчала, а горілка ні. Отже, світ ще стоїть».","korchma.odarka.t.okhrim.label":"Про Охріма","korchma.odarka.t.okhrim.question":"А він тобі хоч щось платить?","korchma.odarka.okhrim.0":"Вона киває на шинквас: там крейдою виписані рядки рисок, як пшениця в полі. «Це Охрім. Це за три зими».","korchma.odarka.okhrim.1":"«Не стягну. Він сам лишився з цілого куреня, а мій Степан теж десь там був. Може, хтось і мого так годує. То я рахую. Рахувати ж не гріх».","korchma.odarka.t.song.label":"Попросити пісню","korchma.odarka.t.song.question":"А сама співаєш, Одарко?","korchma.odarka.song.0":"«Одну. Про те, як дівка хлопця водила за ніс. Чоловік мій її страх не любив». Вона всміхається вперше за вечір.","korchma.odarka.song.1":"Вона наспівує «Ти ж мене підманула», голосно й сердито весело, і пів корчми відбиває такт. Ти запам'ятовуєш одразу.","korchma.okhrim.intro":"Над кухлем піднімається сива чуприна-оселедець, потім вуса, потім одне око. «Кобза… Давно я кобзи не чув. Сідай, синку. Я Охрім. Колись був Охрім Бугай, а тепер просто Охрім».","korchma.okhrim.again":"«А, синку. Сідай. Я тут, бачиш. Нікуди не дівся. Мені нікуди».","korchma.okhrim.t.sich.label":"Про Січ","korchma.okhrim.t.sich.question":"Яка вона була, Січ?","korchma.okhrim.sich.0":"«Січ? Січ, синку, це коли в тебе нічого нема, крім шаблі, коня і товаришів, і тобі того досить. Більше досить, ніж потім усього».","korchma.okhrim.sich.1":"«Ми там і молились, і бились, і пили. І все щиро. Отут, у корчмі, я тільки п'ю. Та й то вже не так щиро».","korchma.okhrim.t.kurin.label":"Про його курінь","korchma.okhrim.t.kurin.question":"А де твій курінь?","korchma.okhrim.kurin.0":"Він довго мовчить. «Хто під Хотином, хто в турецькій неволі, хто в землі по степу, без хреста. Сто сорок душ. Я один вернувся. Не знаю, за які гріхи».","korchma.okhrim.kurin.1":"«От Одарка рахує мене крейдою. А я рахую їх. Кожного вечора. Як дійду до ста сорока, то й піду спати». Він не всміхається.","korchma.okhrim.t.viy.label":"Про Вія","korchma.okhrim.t.viy.question":"Ти чув про те, що в балці?","korchma.okhrim.viy.0":"«Чув. Я в Києві бурсака одного знав, Хому. Розумний був хлопець, молитви знав напам'ять. А подивився. Не стерпів і подивився. І все».","korchma.okhrim.viy.1":"«Як будеш там, синку, співай і не дивись. Хоч би що кликало. Хоч би й мати. Не дивись». Він стискає тобі руку так, що болить.","korchma.okhrim.t.viySealed.label":"Про ту ніч","korchma.okhrim.t.viySealed.question":"Я вистояв ту ніч, діду.","korchma.okhrim.viySealed.0":"«Знаю. Вся корчма знає. Я за тебе чарку випив, а потім ще одну, за Хому. Хай йому там легше буде, що хоч хтось не подивився».","korchma.okhrim.t.debt.label":"Про борг","korchma.okhrim.t.debt.question":"Ти ж Одарці винен, діду.","korchma.okhrim.debt.0":"«Винен. Я всім винен, синку: Одарці, товаришам, Богові. Одарці хоч віддати можна. Вона не бере». Він дивиться в кухоль. «Тому й не беру я в неї хліба, тільки горілку. Хліб соромно».","korchma.okhrim.t.song.label":"Попросити пісню","korchma.okhrim.t.song.question":"Навчиш козацької, діду?","korchma.okhrim.song.0":"«Козацької? Ну, слухай. З цією ми виїжджали. Не з думою, не з молитвою, з оцією». Він випростується, і на мить у ньому видно того Бугая.","korchma.okhrim.song.1":"Він співає «Їхав козак за Дунай» хрипко, мимо нот і дуже правильно. На останньому рядку замовкає, а ти доспівуєш за нього."};function f_(e){try{return globalThis.localStorage?.getItem(e)??null}catch{return null}}function d_(e,t){try{globalThis.localStorage?.setItem(e,t)}catch{}}var p_=["uk","en"],aN="uk",m_={uk:"Українська",en:"English"},y_={en:h_,uk:c_},b_="zalissya-lang";function iN(){let e=f_(b_);return e==="en"||e==="uk"?e:aN}var v_=iN();function kf(){return v_}function r(e,t){let a=y_[v_][e]??y_.en[e]??e;if(!t)return a;return a.replace(/\{(\w+)\}/g,(i,o)=>(o in t)?String(t[o]):i)}function g_(e){d_(b_,e)}var k_=[{id:"myroslav",name:r("char.myroslav.name.0"),pron:r("char.myroslav.pron.0"),role:r("char.myroslav.role.0"),x:760,y:520,tunic:"#7a4a2b",hair:"#cfc8bb",style:"elder"},{id:"vesna",name:r("char.vesna.name.0"),pron:r("char.vesna.pron.0"),role:r("char.vesna.role.0"),x:1150,y:840,tunic:"#a83c32",hair:"#5d3a1a",style:"herbalist"},{id:"radek",name:r("char.radek.name.0"),pron:r("char.radek.pron.0"),role:r("char.radek.role.0"),x:340,y:806,tunic:"#4c4a48",hair:"#2e2018",style:"smith"}],oN=[{id:"domovyk",name:r("char.domovyk.name.0"),pron:r("char.domovyk.pron.0"),role:r("char.domovyk.role.0"),x:Zs.x,y:Zs.y,tunic:"#6e5136",hair:"#8a6f4d",style:"domovyk"},{id:"lisovyk",name:r("char.lisovyk.name.0"),pron:r("char.lisovyk.pron.0"),role:r("char.lisovyk.role.0"),x:1010,y:196,tunic:"#33502e",hair:"#4c6b35",style:"lisovyk"},{id:"chort",name:r("char.chort.name.0"),pron:r("char.chort.pron.0"),role:r("char.chort.role.0"),x:545,y:1052,tunic:"#7e2430",hair:"#2b2320",style:"chort"},{id:"bolotianyk",name:r("char.bolotianyk.name.0"),pron:r("char.bolotianyk.pron.0"),role:r("char.bolotianyk.role.0"),x:1182,y:1032,tunic:"#3d5548",hair:"#5d7050",style:"bolotianyk"},{id:"viy",name:r("char.viy.name.0"),pron:r("char.viy.pron.0"),ro
