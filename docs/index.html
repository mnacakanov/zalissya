r tobacco, otaman. Dry.","tobacco.otaman.give.0":"The otaman sniffs the bundle, and his moustache actually quivers. He packs the pipe, strikes a spark with his flint, draws — and is silent for a long, long time.","tobacco.otaman.give.1":"…Taras's tobacco. He always said his was the best in the district. A lie, of course. But today it's true.","tobacco.otaman.give.2":"Here, son. This is my old pipe, from the Sich. I went against the Turk with it. Smoke it before a terrible night and your hands won't shake. Trust an old man.","tobacco.otaman.t.after.label":"The pipe","tobacco.otaman.t.after.question":"How's the tobacco?","tobacco.otaman.after.0":"Good as Taras's tall tales. A pipe every evening, and two on Sundays. That's how we live.","tobacco.vesna.t.label":"Tobacco","tobacco.vesna.t.question":"How do you dry tobacco?","tobacco.vesna.0":"You don't smoke it raw — it scrapes your throat and makes your head ache. Tie the leaves in a bundle and hang them in the shade, in the wind. My rack will do.","tobacco.vesna.1":"And tie them with hemp fibre — nothing else holds. The hemp field is south of the khutir, past the gardens. By morning it'll be dry.","tobacco.radek.t.label":"Tobacco","tobacco.radek.t.question":"Do you know where tobacco grows?","tobacco.radek.0":"Across the river, by the chumak road. Over the bridge and to the right. I went once — saw a devil on the field's edge and came back. Maybe I imagined it. Maybe not. Psiakrew.","tobacco.chort.t.label":"Tobacco","tobacco.chort.t.question":"They say tobacco is the devil's herb?","tobacco.chort.0":"My finest creation! Not the hopak, not horilka — tobacco! Plant it once, and people come to you on their own ever after, and thank you for it.","tobacco.chort.1":"Taras's field? Take it, take it, I'm not greedy. Let your otaman smoke to his health. To mine, rather.","quest.tobacco.title":"The otaman's pipe","quest.tobacco.gather":"Tobacco across the river, by the chumak road · leaves {leaves}/3. And hemp fibre from the field to the south","quest.tobacco.hang":"Hang the tobacco to dry on Vesna's rack","quest.tobacco.drying":"The tobacco is drying on Vesna's rack — until morning","quest.tobacco.ready":"The tobacco is dry — take it to the otaman","quest.tobacco.done":"The otaman smokes Taras's tobacco, and you have his old pipe","quest.tobacco.none":"—","map.button":"Map","map.open":"Open the map","map.zoom":"Map zoom","map.zoom.world":"Whole world","map.zoom.near":"Around me","map.aria":"Map: the khutir, fields, river, forests, steppe and Lysa Hora","map.legend":"● — you are here · ★ — where your current quest leads · ▲ — burial mounds · ✣ — windmill","map.khutir":"Zalissya","map.steppe":"The steppe","map.lysa":"Lysa Hora","map.river":"The river","map.forest":"Forest","map.fields":"Fields","map.hemp":"Hemp","map.tobacco":"Tobacco","map.pond":"Pond","map.none":"You have no map. The chumaky know every road — and they say the Chort sells everything, maps included.","map.title.chumak":"The chumak map","map.title.chort":"The devil's map (smells of sulphur)","map.keepsake.chumak":"🗺 The chumak map (M to open)","map.keepsake.chort":"🗺 The devil's map (M to open)","map.toast.chumak":"Hnat gives you the chumak map. You now have the Map — the button at the top, or M.","map.toast.chort":"Three fish — and the map is yours. You now have the Map — the button at the top, or M.","map.chort.label":"A map","map.chort.question":"They say you sell maps too?","map.chort.buy.0":"I do! The most accurate in the whole district: every path, every kurhan, every well I've ever spat into. Three fish.","map.chort.buy.1":"The Chort fishes a scroll out of his coat; it reeks of sulphur. The fish vanish even faster. “Pleasure doing business. Don't look at it at midnight. Well, maybe a little.”","map.chort.poor.0":"The map is three fish, kobzar. You have {fish}. My own gold I won't take back — I'm no fool. Go to the pond; the rod doesn't bite. Mostly. (Price: {price} fish.)","chumak.gnat.t.map.label":"The road ahead","chumak.gnat.t.map.question":"Where are you headed now?","chumak.gnat.map.0":"To Poltava, then home. And for you — here, take this. A chumak map: roads, fords, wells, kurhany, where to spend the night. I drew it myself, thirty years on the road.","chumak.gnat.map.1":"I don't need it any more — my feet remember these roads. And a kobzar without a map is like an ox without a yoke: walking, but who knows where.","char.odarka.name":"Odarka","char.odarka.pron":"o-DAR-ka","char.odarka.role":"Shynkarka · keeps the korchma on the road","char.okhrim.name":"Okhrim","char.okhrim.pron":"OKH-rim","char.okhrim.role":"Old Zaporozhian · drinks on credit","song.name.pidmanula":"“You fooled me”","song.name.dunai":"“A Cossack rode beyond the Danube”","ui.play.audience.pidmanula":"“You fooled me” — by the third verse the khutir is singing it for you. Vesna gives the otaman such a look that he coughs into his pipe.","ui.play.audience.dunai":"“A Cossack rode beyond the Danube.” The old men nod, the women sigh, and the girls watch the road as if someone might walk up it any moment.","korchma.name":"The korchma","korchma.role":"On the chumak road, past the khutir","ui.promptLabel.playKorchma":"Play for the korchma 🎶","ui.enterHut.korchma":"The korchma. Smoke under the ceiling, mugs banging on the table, a smell of horilka and pickles. Behind the counter a woman in a blue kerchief sizes you up: will you pay, or will you sing?","ui.hut.korchma":"🍺 The korchma","map.korchma":"Korchma","korchma.play.daytime":"By day the korchma holds only flies and Okhrim, and both are asleep. Come and play in the evening.","korchma.play.prompt":"Odarka nods you to the bench by the wall. The korchma quiets down. What will you play?","korchma.mood.mourning":"Tonight they drink in silence here, for the dead. Even the cups are set down gently.","korchma.mood.chumaky":"The chumaky are celebrating, and the korchma celebrates with them. Someone is already dancing on a bench.","korchma.mood.maudlin":"The korchma has gone soft tonight: two are weeping for the Sich, a third for his mother, a fourth doesn't know what for.","korchma.mood.merry":"An ordinary evening at the korchma: noise, laughter, somebody already arguing about horses.","korchma.play.match":"{song} — the korchma roars and the mugs beat the table in time. Odarka sets a bowl of varenyky in front of you. Music {level}.","korchma.play.fine":"{song} — they listened, and somebody even joined in. Odarka sets a bowl of varenyky in front of you. Music {level}.","korchma.play.clash":"{song} — the wrong song for this korchma. No varenyky tonight. Music {level}.","korchma.play.room.match":"When you stop, the korchma is silent for a moment, then roars so loud a jug falls off the shelf. Odarka doesn't scold. Odarka smiles.","korchma.play.room.fine":"The korchma listens with half an ear, the way people on the road do, and still somebody stands you a cup. You don't drink it. A kobzar needs his hands.","korchma.play.room.clash.sad":"You strike up something merry, and tonight the korchma is weeping. Someone throws a bacon rind at you: “Have you no shame!” Odarka only shakes her head.","korchma.play.room.clash.happy":"You start a sad one, and people came here to make merry. “Did you bring us to a funeral?” Somebody is already banging the door.","korchma.toast.supper":"Odarka puts a bowl of varenyky with sour cream in front of you. One fish less, one life more. 🥟","korchma.odarka.intro":"The woman behind the counter wipes a mug and takes her time. “A kobzar. Well, well. You pay in fish, you sing in the evening, and I pour nothing on credit. I pour for Okhrim, but he doesn't count. I'm Odarka.”","korchma.odarka.again":"“Ah, the singer. Sit down, only not where Okhrim is. That's Okhrim's.”","korchma.odarka.t.who.label":"About Odarka","korchma.odarka.t.who.question":"You keep the korchma on your own?","korchma.odarka.who.0":"“On my own. Seven years ago my husband rode off to the Sich. He said: back by Pokrova. He didn't say which Pokrova.”","korchma.odarka.who.1":"“At first I told every chumak: if you see my Stepan, give him word. I don't any more. I pour and keep quiet. It's easier for both of us.”","korchma.odarka.t.supper.label":"Have supper (1 fish)","korchma.odarka.t.supper.question":"What's to eat?","korchma.odarka.supper.0":"“Varenyky with curd cheese, the sour cream is my own. Give me the fish. Not that one, that one, the bigger one. There.” She takes it as if doing you a favour. She is.","korchma.odarka.supperPoor":"“Varenyky are for fish, singer. For {price}. Only Okhrim gets fed for his pretty eyes, and only because he can't see what he's eating any more.” You could still play here in the evening.","korchma.odarka.t.news.label":"News from the road","korchma.odarka.t.news.question":"What are people saying?","korchma.odarka.news.viy":"“They say something stirs at night in the hollow past the khutir. The chumaky won't camp there; they go the long way round. And it takes some doing to frighten a chumak, you know.”","korchma.odarka.news.viySealed":"“They say you sang all night in the hollow, and the thing listened and didn't get up. Lies, most likely. I'll give you double varenyky anyway.”","korchma.odarka.news.road":"“They also say salt's gone up and horilka hasn't. So the world's still standing.”","korchma.odarka.t.okhrim.label":"About Okhrim","korchma.odarka.t.okhrim.question":"Does he ever pay you anything?","korchma.odarka.okhrim.0":"She nods at the counter: rows of chalk marks run across it like wheat in a field. “That's Okhrim. That's three winters.”","korchma.odarka.okhrim.1":"“I won't collect. He's all that's left of a whole kurin, and my Stepan was out there somewhere too. Maybe someone's feeding mine the same way. So I keep count. Counting's no sin.”","korchma.odarka.t.song.label":"Ask for a song","korchma.odarka.t.song.question":"Do you sing yourself, Odarka?","korchma.odarka.song.0":"“Just one. About a girl leading a lad by the nose. My husband couldn't stand it.” She smiles for the first time tonight.","korchma.odarka.song.1":"She sings “You fooled me”, loud and angrily cheerful, and half the korchma beats time. You have it at once.","korchma.okhrim.intro":"Above the mug rises a grey oseledets, then moustaches, then one eye. “A kobza… I've not heard a kobza in a long time. Sit, son. I'm Okhrim. I used to be Okhrim the Bull; now I'm just Okhrim.”","korchma.okhrim.again":"“Ah, son. Sit down. I'm here, you see. Haven't gone anywhere. Nowhere to go.”","korchma.okhrim.t.sich.label":"About the Sich","korchma.okhrim.t.sich.question":"What was the Sich like?","korchma.okhrim.sich.0":"“The Sich, son, is when you've nothing but a sabre, a horse and your comrades, and it's enough. More enough than everything after.”","korchma.okhrim.sich.1":"“We prayed there, and fought, and drank. All of it honestly. Here in the korchma I only drink. And not so honestly any more.”","korchma.okhrim.t.kurin.label":"About his kurin","korchma.okhrim.t.kurin.question":"Where's your kurin now?","korchma.okhrim.kurin.0":"He is quiet for a long time. “Some at Khotyn, some in Turkish chains, some in the steppe under no cross. A hundred and forty souls. I alone came back. I don't know for which sins.”","korchma.okhrim.kurin.1":"“Odarka counts me in chalk. I count them. Every evening. When I get to a hundred and forty, I go to sleep.” He doesn't smile.","korchma.okhrim.t.viy.label":"About Viy","korchma.okhrim.t.viy.question":"Have you heard about the thing in the hollow?","korchma.okhrim.viy.0":"“I have. In Kyiv I knew a seminary student, Khoma. A clever lad, knew his prayers by heart. And he looked. He couldn't bear it and he looked. And that was that.”","korchma.okhrim.viy.1":"“When you're there, son, sing and don't look. Whatever calls you. Even if it's your mother. Don't look.” He grips your hand until it hurts.","korchma.okhrim.t.viySealed.label":"About that night","korchma.okhrim.t.viySealed.question":"I made it through that night, grandad.","korchma.okhrim.viySealed.0":"“I know. The whole korchma knows. I drank a cup to you, then another to Khoma. May it ease him, wherever he is, that at least somebody didn't look.”","korchma.okhrim.t.debt.label":"About the debt","korchma.okhrim.t.debt.question":"You owe Odarka, grandad.","korchma.okhrim.debt.0":"“I owe. I owe everyone, son: Odarka, my comrades, God. Odarka at least could be paid back. She won't take it.” He looks into the mug. “That's why I take only horilka from her, never bread. Bread would be shameful.”","korchma.okhrim.t.song.label":"Ask for a song","korchma.okhrim.t.song.question":"Will you teach me a Cossack song, grandad?","korchma.okhrim.song.0":"“A Cossack one? Listen, then. We rode out to this one. Not a duma, not a prayer: this.” He straightens, and for a moment you can see the Bull in him.","korchma.okhrim.song.1":"He sings “A Cossack rode beyond the Danube”, hoarse, off the note and exactly right. On the last line he falls silent, and you sing it to the end for him.","ui.enterHut.pustka":"The abandoned hut. The door creaks and doesn't close behind you. Dust, cobwebs, a cold pich. Somebody turned the icon to face the wall, and you decide to leave it that way.","ui.hut.pustka":"🏚 The abandoned hut","ui.promptLabel.pustkaChest":"Look in the chest","pustka.name":"Taras Dovhyi's chest","pustka.role":"The empty hut by the hollow","pustka.chest.0":"Under a rotten cloth: an empty sabre scabbard, a tobacco pouch with no tobacco, and a letter in crooked letters.","pustka.chest.1":"“If I'm not back by Pokrova, let the otaman smoke my tobacco, and leave the hut be: let it wait. Taras Dovhyi.” Seven Pokrovas have passed since. The hut is waiting still.","pustka.chest.again":"The empty scabbard, the pouch and Taras Dovhyi's letter. You put everything back as it lay.","ui.promptLabel.petDog":"Pet the dog 🐕","dog.pet.0":"The dog thumps its tail so hard the dust flies. It belongs to the otaman, but it loves anyone who pets it.","dog.pet.1":"The dog sniffs the kobza, sneezes, and acts as if it meant to.","dog.pet.2":"The dog offers an ear and shuts its eyes. Clearly it respects kobzars more than the otaman.","dog.pet.asleep":"The dog sleeps by the porch, a paw twitching. Chasing something in its dreams. Let it.","schedule.woken.myroslav":"The otaman sits up on the pil, gropes for his sabre, finds his pipe. “Ah, it's you, son… Well, speak, since you've woken me.”","schedule.woken.vesna":"Vesna opens one eye. “If you're not dying, kobzar, be quick.”","schedule.woken.radek":"Radek rises out of the straw. “Psia krew, who's there?.. Ah, the singer. Well?”","schedule.woken.odarka":"Odarka peers down from the pich. “The korchma's shut. But speak, since you're here.”","schedule.woken.okhrim":"Okhrim, eyes still shut: “A hundred and thirty-nine… a hundred and forty… Ah, son. Sit.”","schedule.lysa.vesna":"Vesna, a bunch of nichnyky in her hand, does not even start. “You didn't see me here, kobzar. And I, so be it, didn't see you.”","schedule.lysa.okhrim":"Okhrim is shuffling cards across from the Chort. “Don't put me off, son! One more hand and I win back my hat. And my soul, if luck holds.”","schedule.lysa.myroslav":"“I'm not here. Neither are you.”","schedule.lysa.radek":"“Jezus Maria… I only brought a horseshoe. To order.”","schedule.lysa.odarka":"“The tavern's open here too. Don't ask.”","char.opanas.name":"Opanas","char.opanas.pron":"o-PAH-nas","char.opanas.role":"Warlock · milks other people's cows","hide.solokha.0":"Solokha sits inside the windmill on a sack of flour, cracking sunflower seeds. “I'm grinding flour, kobzar. What are you staring at? By day I'm a widow like any widow.”","hide.solokha.1":"“And by night, let everyone mind their own business. You your songs, me mine. And don't tell the Chort you saw me here; he's the jealous sort.”","hide.motrya.0":"In the old oak's hollow, on a nest of moss and feathers, sits Motrya, sleepy and cross. “The sun's still up! Go on, go… I sleep here like an owl.”","hide.motrya.1":"“The sabbath's at night, didn't you know? Come when it's dark. And learn the hopak; without the hopak it's dull up there.”","hide.opanas.0":"Under the kurhan, by an old slab with candles on it, sits a thin man in a tall sheepskin hat. “I'm Opanas. A warlock. Tell no one, or I'll sour your cow's milk. Though you've no cow.”","hide.opanas.1":"“By day we're folk like any folk. But when it's dark, off to the Mountain. Come and hear us sing. Worse than you, honestly.”","lysa.opanas.0":"“Oh, the kobzar's come! Sit with us. Only don't sit on the broom; it bites.”","lysa.opanas.1":"“Don't mind that I dance with the witches. I'm a witch myself, only with a moustache.”","lysa.day.empty":"By day the summit is empty: cold ash, a trodden ring, a broom somebody forgot. The sabbath gathers when it gets dark.","lysa.day.notYet":"Nobody here by day. The sabbath gathers when it gets dark.","ui.enterHut.mlyn":"The windmill. Flour dust hangs in the shaft of light from the little window, the millstones are still, and the sails creak overhead. It smells of grain and of something burnt.","ui.hut.mlyn":"🌾 The windmill","ui.enterHut.duplo":"The hollow. Cramped and warm; it smells of moss, dried herbs and owl. Frog legs are drying on a root. Better touch nothing.","ui.hut.duplo":"🌳 The hollow oak","ui.enterHut.kurhan":"It is cold and quiet under the kurhan. Earth trickles from the roots, and two candles burn on an old slab. Someone important lay here once. Now someone lives here.","ui.hut.kurhan":"⛰ Under the kurhan","ui.enterHut.pechera":"The cave. Hot as an oven, stinking of sulphur, water dripping from the stone. Deep inside, on a stone bed, something huge is snoring.","ui.enterHut.kaplytsia":"The chapel. Close and quiet, smelling of wax and incense. The lampadka burns low before the icons, a book lies open on the analoy, and thin candles for the dead stand on the kanun.","ui.hut.kaplytsia":"⛪ The chapel","ui.hut.pechera":"🕳 The cave","hide.beelzebub.0":"Beelzebub sleeps on his stone bed, wrapped in his robe like a bat, snoring so hard that pebbles fall from the ceiling. One yellow eye lazily opens.","hide.beelzebub.1":"“A KOBZAR. BY DAY. IN MY BEDCHAMBER.” The eye closes. “Come when it's dark. Then we'll talk. Now get out.”","trade.radek.t.label":"Horseshoes for gold","trade.radek.t.question":"Will you buy my horseshoes?","trade.radek.sell.0":"Show me. …Straight, well forged. A chervinets apiece, true gold.","trade.radek.sell.1":"Where does a smith get gold? A Cossack doesn't skimp on his horse. The sotnyk pays, I keep quiet. Jezus Maria, if my lord had paid like that…","trade.radek.none.0":"Bring me what you forge and I'll pay in gold. A chervinets a horseshoe. A Cossack horse unshod is a sabre without a hilt.","trade.toast.sold":"Radek counts out the gold. Horseshoes sold: {sold}. Chervintsi in your purse: {total}.","char.prokip.name":"Did Prokip","char.prokip.pron":"deed PRO-keep","char.prokip.role":"the vorozhbyt","char.perelesnyk.name":"Perelesnyk","char.perelesnyk.pron":"pe-re-LES-nyk","char.perelesnyk.role":"the fiery serpent","ui.enterHut.prokip":"It smells of smoke, wormwood and something better not asked about. A black cat watches you from the bench. The old man doesn't. The old man is thinking.","ui.hut.prokip":"🪶 Did Prokip's hut","map.prokip":"Did Prokip","prokip.keepsake":"🐾 Beast speech (from Did Prokip)","prokip.intro.0":"Who's there? …A singer. Just what I was missing. I've got a raven, a cat, toadstools. Didn't have a singer.","prokip.intro.1":"Well, come in, don't stand in the door like a calf at a new gate. And leave the kobza alone. I see how you're looking at it.","prokip.again":"You again. Sit. Just don't sing.","prokip.again.friend":"Ah, the snot-nose is here. The cat's even warmed you a spot. Don't tell him I'm glad.","prokip.t.who.label":"Who you are","prokip.t.who.question":"Are you really a vorozhbyt?","prokip.who.0":"Vorozhbyt. Healer. Old fool, that's what Vesna calls me. I whisper away toothache, pour out fright, drive off what has no right to stay.","prokip.who.1":"Singers I don't cure. There's no cure for you lot. Except a stick.","prokip.t.forest.label":"Why the forest","prokip.t.forest.question":"Why do you live so far from people?","prokip.forest.0":`Because people ask. "Grandad, will it rain?" "Grandad, does Hryts love me?" "Grandad, where's the cow?"`,"prokip.forest.1":"The forest asks nothing. The forest already knows. The cow, by the way, is in the gully past the mill.","prokip.t.sieve.label":"Work","prokip.t.sieve.question":"Can I help with anything?","prokip.sieve.0":"You can. Here's a sieve. Fetch me water from the well in the khutir. A full one. Don't spill.","prokip.sieve.1":"Why are you looking at me like that? A sieve's a sieve. Go, while it's light.","prokip.t.sieveWait.label":"The water","prokip.t.sieveWait.question":"Grandad, about the water…","prokip.sieveWait.0":"Where's the water? No water. Because you're still here. The well's in the khutir. The khutir's that way. I'm here. The legs are yours.","prokip.t.sieveBack.label":"The water ran out","prokip.t.sieveBack.question":"Grandad… the water ran out.","prokip.sieveBack.0":"Ran out?! Ha! HA-HA! Carried water in a sieve! Over the river, through the forest, and back!","prokip.sieveBack.1":`Forty years I've handed that sieve to everyone who comes. They all asked "why". You're the first who went.`,"prokip.sieveBack.2":"Oh, don't sulk, snot-nose. Whoever isn't afraid to look a fool will come to something. Now, the real job.","prokip.t.message.label":"The real job","prokip.t.message.question":"What's the real job?","prokip.message.0":"Go to Vesna, the znakharka. Give her my regards. And ask her, nice and polite, whether it'll rain on Kupala.","prokip.message.1":"What's wrong with that? A question about the weather. Neighbourly. Go on, go. And stop grinning.","prokip.t.messageWait.label":"Vesna","prokip.t.messageWait.question":"About Vesna…","prokip.messageWait.0":"Well? Did you ask about the rain? …No? Then why are you standing here? Go. And comb your hair, there are people there.","prokip.t.answer.label":"Vesna got cross","prokip.t.answer.question":"Grandad, Vesna chased me out with a broom!","prokip.answer.0":"With a broom?! HA-HA-HA! Oh, I can't! Oh, hold me up!","prokip.answer.1":"I've waited and waited for someone to ask her about that rain!","prokip.answer.2":"She learned from me, when she was just a girl. That Kupala I said it wouldn't rain. She said it would. It poured buckets. I never admitted it. And she took her herbs and went off to heal on her own.","prokip.answer.3":"Hits true, eh? My teaching. …Best pupil I ever had. Just don't tell her.","prokip.answer.4":"Go and apologize. Say you didn't know. You really didn't. Now listen, because the next part is no joke.","prokip.t.perelesnyk.label":"Fire over the korchma","prokip.t.perelesnyk.question":"What's no joke?","prokip.perelesnyk.0":"At night, fire flies over the korchma on the chumak road. People say it's a falling star. Stars don't fall like that. Every night, to the same place.","prokip.perelesnyk.1":"A perelesnyk. It comes to those who grieve too long. To Odarka. In the shape of her Stepan, who rode to the Sich seven years ago.","prokip.perelesnyk.2":"She thinks he's come back. And it's drinking her. Drop by drop, every night. A little more and it'll drink her dry.","prokip.perelesnyk.3":"Here's blessed poppy seed. At night, when it comes, scatter it on the threshold and sing. The poppy holds it, the song drives it off. After that, it's whether she can bear it. That's the hardest part.","prokip.t.perelesnykWait.label":"The perelesnyk","prokip.t.perelesnykWait.question":"About the perelesnyk…","prokip.perelesnykWait.0":"Still flying. The raven saw. At night, son, by the korchma. By day it's just a star that fell in the wrong place.","prokip.t.spared.label":"I spared her","prokip.t.spared.question":"I couldn't. She was so happy.","prokip.spared.0":"Spared her. …I spared someone once too. Pity's a good thing, son. Only it has none.","prokip.spared.1":"Look at her tomorrow. Pale. Look the day after. Then go again.","prokip.t.reward.label":"The perelesnyk is gone","prokip.t.reward.question":"The perelesnyk is gone.","prokip.reward.0":"I know. The raven told me. Odarka's crying? Let her cry. Tears aren't blood. Nobody ever withered from tears.","prokip.reward.1":"You did a hard thing. A hard thing earns good pay. Lean down.","prokip.reward.2":"Closer. Closer still. Don't be scared, I won't bite.","prokip.reward.3":"Did Prokip spits in your ear. Heartily, with feeling.","prokip.reward.4":"Don't make faces! Now you understand the speech of beasts. Dogs, geese, cows, horses: they've been talking their whole lives. Nobody listened, that's all.","prokip.reward.5":"Now go. …Drop in sometimes. Not often. …Well, often's fine. The cat will miss you. The cat, I said.","prokip.t.after.label":"Beast speech","prokip.t.after.question":"Grandad, the things the geese said!","prokip.after.0":"Geese gossip, I told you. Never trust a goose. A cow you can trust. A cow doesn't lie, she can't be bothered.","prokip.t.vesna.label":"And Vesna?","prokip.t.vesna.question":"Why don't you go and see her yourself?","prokip.vesna.0":"Myself? Over the river? At my age? …She'd say I'd come to admit it rained.","prokip.vesna.1":"And maybe it did rain. But admitting it, that's going too far. Go on, go.","prokip.vesna.t.who.label":"Did Prokip","prokip.vesna.t.who.question":"Who's Did Prokip?","prokip.vesna.who.0":"A vorozhbyt. Lives in the forest past the chumak bridge, to the east, further than decent people go.","prokip.vesna.who.1":"Cross as a wasp in a jug. I learned from him once, so I'd know. If you see him, tell him he's an old fool. He knows.","prokip.vesna.t.msg.label":"Regards from Prokip","prokip.vesna.t.msg.question":"Did Prokip sends his regards. And asks whether it'll rain on Kupala.","prokip.vesna.msg.0":"…What is he asking?","prokip.vesna.msg.1":"RAIN?! All these years he won't admit it, and now he MOCKS me?!","prokip.vesna.msg.2":"And you, the messenger! Out of my sight! Out, I said, before I see you off with the broom!","prokip.odarka.t.nights.label":"The nights","prokip.odarka.t.nights.question":"How are you sleeping, Odarka?","prokip.odarka.nights.0":"You won't believe it, kobzar. He comes. My Stepan. Every night. He stands on the threshold and says nothing.","prokip.odarka.nights.1":"I sleep so well. Only I'm cold somehow. And my hands won't mind me. Pour you one? Oh, I've spilled it…","prokip.odarka.t.after.label":"That night","prokip.odarka.t.after.question":"How are you, Odarka?","prokip.odarka.after.0":"I knew it wasn't him. Stepan never went without his hat. Not even to me.","prokip.odarka.after.1":"Seven years I didn't lock the door. Now I'll lock it. And cry, the way people cry. And then I'll open it again, because it's a korchma.","prokip.odarka.after.2":"Sit down. Tonight it's on the house. Just don't tell Okhrim.","prokip.well.0":"You lower the sieve into the well. It comes up full, for one moment.","prokip.well.1":"The water trickles through the holes straight into your boots. The well's crane creaks. It seems to be laughing.","prokip.well.toast":"The sieve is empty. Your boots are not. Go back to Did Prokip.","ui.promptLabel.sieve":"Fill the sieve at the well","ui.promptLabel.perelesnyk":"Step onto the threshold 🔥","ui.promptLabel.animal":"Listen 👂","perelesnyk.scene.0":"Over the korchma, a streak of fire. It falls onto the threshold and becomes a man. Tall. Bareheaded. No shadow.","perelesnyk.scene.1":"Odarka stands in the doorway in her feast-day kerchief. She smiles the way she hasn't smiled in seven years.","perelesnyk.scene.2":`"Stepan… you came," she whispers. He says nothing. He smells of burning. In your pocket: Prokip's poppy seed.`,"perelesnyk.opt.drive":"Scatter the poppy and sing","perelesnyk.opt.spare":"Leave her this night","perelesnyk.driven.0":"The poppy falls on the threshold and the fire shies as if from boiling water. You take up the kobza and sing.","perelesnyk.driven.1":"What was Stepan crackles, writhes, and scatters in sparks over the road. The horse at the korchma lets out a long breath.","perelesnyk.driven.2":"Odarka sits down on the threshold. She doesn't scream. She just cries, quietly, the way widows cry.","perelesnyk.spared.0":"You step back into the dark. The korchma door closes. In the window, two people, and only one shadow.","perelesnyk.spared.1":"In the morning Odarka will be happy. And a little paler than yesterday.","perelesnyk.toast.driven":"The perelesnyk is driven off. Go back to Did Prokip.","perelesnyk.toast.spared":"You left Odarka her night. The perelesnyk will come again tomorrow.","animal.dog.name":"The dog","animal.dog.role":"the otaman's","animal.dog.0":"The otaman ate salo by himself again. I saw. I see everything. Nobody asks me.","animal.dog.1":"The Chort by the millstone smells of sulphur and perfume. Bark at him? No. I'm not stupid.","animal.dog.2":"You smell of fish. You're good. No, really, you're good. Scratch here.","animal.dog.3":'At night Solokha flies out of the mill on a broom. I bark. They tell me "quiet". Then they wonder.',"animal.dog.night":"Hrr… a bone… a big bone… hrr… don't touch it…","animal.goose.name":"A goose","animal.goose.role":"of the pond","animal.goose.0":"Honk. We saw Radek hiding chervintsi in the anvil. Tell no one. Honk.","animal.goose.1":"This pond is ours. The Bolotianyk, off in his bog over the river, thinks all water is his. Let him think. Honk-honk-honk.","animal.goose.2":"Don't come closer. …Fine, come closer. Got bread? No? Then go.","animal.goose.3":"Every morning Vesna talks to the herbs. The herbs answer her. We heard. We hear everything. Honk.","animal.goose.night":"Shhh. Head under the wing. We're sleeping. You sleep too.","animal.cow.name":"The cow","animal.cow.role":"Krasulya","animal.cow.0":"Moo… Grass. Grass again. Have you ever thought about grass? I do. All the time.","animal.cow.1":"The windmill turns. Solokha sleeps in the flour by day. Someone has to know. Now you do. Moo.","animal.cow.2":"My name is Krasulya. You didn't ask. Nobody asks. Thank you for listening.","animal.cow.3":"Did Prokip once treated my udder. Grumbled all day. Good old man. Moo-oo.","animal.cow.night":"Moo… sleeping… cows sleep too, son… moo…","animal.horse.name":"The horse","animal.horse.role":"at the korchma","animal.horse.0":"Okhrim says I'm a Cossack horse. I've hauled firewood all my life. But it's nice.","animal.horse.1":"Give me an apple. None? People… You've got a kobza, and no apple.","animal.horse.2":"The chumaky say the salt in the Crimea is white as snow. I don't like snow. Or chumaky.","animal.horse.fire":"Fire over the korchma again. Every night. The shynkarka comes out onto the threshold and smiles. Horses see such things. Horses are afraid.","animal.horse.calm":"The fire doesn't fly any more. The shynkarka cries, but she eats. If a person eats, she'll live.","quest.prokip.title":"Did Prokip","quest.prokip.find":"Vesna says a vorozhbyt lives in the forest past the chumak bridge, to the east. Find him.","quest.prokip.talk":"Talk to Did Prokip.","quest.prokip.sieve":"Bring Did Prokip water from the well in the khutir. In a sieve.","quest.prokip.sieveBack":"The water ran out. Go back to Did Prokip.","quest.prokip.message":"Give Vesna Did Prokip's regards and ask whether it'll rain on Kupala.","quest.prokip.answer":"Vesna chased you out with a broom. Tell Did Prokip.","quest.prokip.perelesnyk":"At night by the korchma: the perelesnyk. Poppy on the threshold, and sing.","quest.prokip.reward":"The perelesnyk is gone. Go back to Did Prokip.","quest.prokip.done":"You understand the beasts. Listen to the dog, the geese, the cow and the horse.","char.omelko.name":"Omelko","char.omelko.pron":"o-MEL-ko","char.omelko.role":"Blind kobzar · sees fine in the dark","char.zmiy.name":"Zmiy","char.zmiy.pron":"ZMEEY","char.zmiy.role":"The old serpent · lies on a dowry","char.vohnyk.name":"Vohnyk","char.vohnyk.pron":"VOH-nyk","char.vohnyk.role":"A wandering flame · forgets quickly","char.sydir.name":"Sydir","char.sydir.pron":"sy-DEER","char.sydir.role":"Chumak · smuggler","cave.omelko.intro":"Who's there? Don't say; I hear it in the step: a lad, kobza on his back, a small sin to carry. I'm Omelko. Sit, brother.","cave.omelko.introWish":"Don't mind the cave, it isn't a home, only where I ended up. A man wants four walls of his own and a fire he can tend, but that's an old man's dream.","cave.omelko.again":"Ah, it's you. The kobza's there; I heard a string creak. Ask.","cave.omelko.t.who.label":"About the blind kobzar","cave.omelko.t.who.question":"Who are you, grandfather?","cave.omelko.who.0":"Walked the fairs forty years. Sang while there was a mug, and drank while there was a song.","cave.omelko.who.1":"Then I went blind. People say from smoke. I say from seeing too much.","cave.omelko.t.eyes.label":"About the dark","cave.omelko.t.eyes.question":"How do you live here without light?","cave.omelko.eyes.0":"Day or night, it's all one to me. It's you who can see that fear the dark; to me it's just a house.","cave.omelko.eyes.1":"I hear where the bats are. I hear where the water is. The old serpent I hear best of all: he breathes like a very tired cow.","cave.omelko.t.marusia.label":"Teach me a duma","cave.omelko.t.marusia.question":"Will you teach me a duma?","cave.omelko.marusia.0":"There's one. “Marusia Bohuslavka,” about a girl who in captivity forgot neither her faith nor her people, and led the captives to freedom. Listen.","cave.omelko.marusia.1":"Omelko sings low and slow, and you catch every note. Now the duma is in your fingers. It is sad, as it should be. Sing it when someone's heart is heavy.","cave.omelko.t.singAgain.label":"About the duma","cave.omelko.t.singAgain.question":"How is “Marusia” best sung?","cave.omelko.singAgain.0":"Slowly. Don't hurry it: a duma is not a hopak, it has nowhere to be.","cave.omelko.singAgain.1":"And sing to the serpent with no frills. A hundred years he heard flattery; he knows the truth from the first note.","cave.omelko.singAgain.lulled":"Hear the quiet? That's him asleep. Even stone sighs at a duma like that.","cave.omelko.t.zmiy.label":"About the Zmiy","cave.omelko.t.zmiy.question":"Why does the Zmiy only like sad songs?","cave.omelko.zmiy.0":"What would you want, if you'd lost the only one? Merry songs are salt on a wound to him.","cave.omelko.zmiy.1":"Sing a merry one, and you wake and anger him. An ordinary one, he listens and doesn't stir. A sad one, and he sleeps. Simple, like everything true.","cave.omelko.t.kobza.label":"About the kobza","cave.omelko.t.kobza.question":"Where did you get your kobza?","cave.omelko.kobza.0":"My brother-in-song left it to me when he died. The wood still remembers his hands.","cave.omelko.kobza.1":"Yours is the same: a sister to mine. Just see you don't hit people with it. Unless they've earned it.","cave.omelko.t.tunnel.label":"About the draught","cave.omelko.t.tunnel.question":"Where does that draught come from?","cave.omelko.tunnel.0":"From behind the serpent, where the back wall has a crack. It draws like a cellar. An old way, from the grandfathers.","cave.omelko.tunnel.1":"While he's awake you won't get past him. Without knowing it, he guards that way.","cave.omelko.tunnel.open.0":"You went through? Then you know: the tunnel runs under the river to the kaplytsia. Grandfathers' work, hiding from the Tatars.","cave.omelko.tunnel.open.1":"I never went; I'm blind. Just don't tell me what's down there worth stealing.","cave.zmiy.intro":"Who's this? Smells of smoke, road and youth. I am the Zmiy. Don't be afraid; I haven't eaten anyone in a hundred years. You're not tasty.","cave.zmiy.again":"You again. Make it short; I'm old and tired.","cave.zmiy.t.who.label":"About the serpent","cave.zmiy.t.who.question":"Who are you?","cave.zmiy.who.0":"I was a fiery serpent. I flew over the Dnipro and the girls hid behind their huts. I enjoyed it.","cave.zmiy.who.1":"Now I lie. My wings wore away on the stone long ago. Old age is when even flying is too much trouble.","cave.zmiy.t.bride.label":"About the dowry's owner","cave.zmiy.t.bride.question":"Whose dowry is it?","cave.zmiy.bride.0":"Maryna's. From Verbivka. She was walking with her buckets, I saw her and thought that to love was to want to have.","cave.zmiy.bride.1":"I brought her here. Three springs she said nothing. I brought her gold, flowers, stars from the sky, and she looked through me.","cave.zmiy.bride.2":"On the fourth she did not wake. I can't eat without her, or sleep. I lie on her dowry, and that's all.","cave.zmiy.t.hoard.label":"About the gold","cave.zmiy.t.hoard.question":"What is the gold under you?","cave.zmiy.hoard.0":"A dowry. A kerchief of chervintsi that a girl's father tied. Not mine. I never touched it. I lie on it as on a palm.","cave.zmiy.hoard.1":"Whoever touches them while I'm awake will regret it. But when I sleep… well, a dream is no watchman.","cave.zmiy.t.sing.label":"About a song","cave.zmiy.t.sing.question":"What would you like to hear?","cave.zmiy.sing.0":"Sing me something true. Not about wine, not a hopak. I've watched enough of other people's laughter, and it frightens me.","cave.zmiy.sing.1":"Play how bitter it is for you, kobzar. And maybe I'll sleep for the first time in a whole life.","cave.zmiy.sleepIntro":"The Zmiy sleeps, nose in the dowry. Through his sleep he mutters: “Maryna…”","cave.zmiy.t.dream.label":"Listen","cave.zmiy.t.dream.question":"What are you muttering, old one?","cave.zmiy.dream.0":"“…went off with the buckets… laughing… didn't look back…”","cave.zmiy.dream.1":"He claws at the air, then goes quiet. You pity him, but it is good that he can sleep.","cave.zmiy.t.hoardSleep.label":"About the kerchief","cave.zmiy.t.hoardSleep.question":"What is under his tail?","cave.zmiy.hoardSleep.0":"Under his tail, in an embroidered kerchief, lie chervintsi: a dowry no one will carry home. You could take it; he sleeps.","cave.zmiy.hoardSleep.1":"A conscience is like a kerchief: thin, yet it holds. Decide for yourself.","cave.zmiy.hoardTaken":"The kerchief under his tail is empty. The Zmiy sighs in his sleep and doesn't wake.","cave.vohnyk.intro":"Oh! Someone's glowing! No, not you, me. I'm bright. I'm somebody. I'm Vohnyk… I think. Or Vohon. Or Ohnyk.","cave.vohnyk.again":"Oh, you! Do we know each other? I forgot. Do you glow too? No? Pity.","cave.vohnyk.t.who.label":"About the flame","cave.vohnyk.t.who.question":"How did you get here?","cave.vohnyk.who.0":"I wandered the marsh, then the forest, then wandered into the cave. It's warm here and nobody asks me to lead them home.","cave.vohnyk.who.1":"I used to lead people. I don't remember where. I think they don't either.","cave.vohnyk.t.name.label":"About his name","cave.vohnyk.t.name.question":"What's your name?","cave.vohnyk.name.0":"Vohnyk! Or… wait. No, Vohnyk. Definitely. Unless not.","cave.vohnyk.name.1":"Yesterday I knew. Today I know that I knew yesterday. That's nearly the same.","cave.vohnyk.t.pool.label":"About the pool","cave.vohnyk.t.pool.question":"What is glowing in the pool?","cave.vohnyk.pool.0":"That's me! No, it's it. No, both of us. Look: it flickered, I flickered. We're talking.","cave.vohnyk.pool.1":"It says nothing, but it listens. It understands me better than people do.","cave.vohnyk.t.lure.label":"About the marsh","cave.vohnyk.t.lure.question":"Did you really lead people into the bog?","cave.vohnyk.lure.0":"Me?! Never. I only shone. They walked. Where they walked was none of my business.","cave.vohnyk.lure.1":"Now I'm just a speck of light in a cave. Nobody follows me. I even like it. I don't remember why.","cave.sydir.intro":"Sh! Quieter, lad… Ah, a kobza. One of ours. I'm Sydir, a chumak. Was. Now I'm the one who carries salt past other men's tollgates. Sit, the lamp is for two.","cave.sydir.again":"Oh, one of ours. Want to learn something, or just to hear me grumble?","cave.sydir.t.who.label":"About Sydir","cave.sydir.t.who.question":"What are you doing down here?","cave.sydir.who.0":"Hauled salt from Crimea forty years. The tolls at the tollgates are such that the oxen would sooner sell themselves.","cave.sydir.who.1":"So I found a way round, underground. No tollgate sees it, none takes its cut.","cave.sydir.t.tunnel.label":"About the tunnel","cave.sydir.t.tunnel.question":"Who dug this tunnel?","cave.sydir.tunnel.0":"The first people of Zalissya. When the Tatars came raiding, they hid children and grain underground. Dug it three winters.","cave.sydir.tunnel.1":"One end is in the cave, behind the old serpent. The other under the kaplytsia. Where else to hide but under God?","cave.sydir.tunnel.2":"I only cleared it and hung the lamps. They say it was once longer, all the way to the Sich. But beyond here it caved in.","cave.sydir.t.bones.label":"About the bones","cave.sydir.t.bones.question":"Whose bones are those by the wall?","cave.sydir.bones.0":"A sentry's. He stood here while the Tatars poked about above. Whether his own people came for him, I don't know.","cave.sydir.bones.1":"His purse lies beside him. My conscience wouldn't let me. Maybe yours will.","cave.sydir.t.goods.label":"About the goods","cave.sydir.t.goods.question":"What are you hiding here?","cave.sydir.goods.0":"Salt, tobacco, a little tar, a cask of horilka. All honest but the road.","cave.sydir.goods.1":"I'd sell you some, but who pays a kobzar? Sleep easy: what you don't have can't be stolen.","cave.sydir.t.song.label":"A song for the road","cave.sydir.t.song.question":"Do you know a song for the road?","cave.sydir.song.0":"I do. “Oh, don't go, Hrytsiu,” about a lad whom the evening gatherings will bring to no good. Merry, though it's about trouble.","cave.sydir.song.1":"Sydir mutters it in a hoarse bass, and the lamp seems to wink. Now it's yours. Play it when you want laughter.","cave.rumor.myroslav.label":"About a cave","cave.rumor.myroslav.question":"Is there a cave anywhere near?","cave.rumor.myroslav.0":"Across the river, south of the old oak, there's a hill of stone. The children say a Zmiy sleeps in it. And the children are probably right.","cave.rumor.myroslav.1":"I never went; I'm too old for foolishness. But they say a blind old kobzar lives there, alive and well, so the Zmiy can't be raging. Careful with the kobza: the Zmiy likes only sad songs.","cave.rumor.okhrim.label":"About a way underground","cave.rumor.okhrim.question":"I heard someone dug under the river. True?","cave.rumor.okhrim.0":"True, son. My grandfather said that when the Tatars came, the first Zalissya folk dug a way from the cave to under the kaplytsia. There's a hatch under the rug by the analoy.","cave.rumor.okhrim.1":"Nobody's gone down in ages. But they say a lamp burns there. Likely someone's trading past the toll. I'll tell nobody; I'm no saint myself.","song.name.marusia":"“Marusia Bohuslavka”","song.name.hrytsiu":"“Oh, don't go, Hrytsiu”","ui.play.audience.marusia":"“Marusia Bohuslavka.” The duma pours out slowly, like a river in bondage. Nobody laughs. Vesna turns away; the otaman stares into the fire.","ui.play.audience.hrytsiu":"“Oh, don't go, Hrytsiu.” First everyone laughs, then they join in, and Radek is already thumping his mug on the bench and winking at the girls.","ui.enterHut.zmiieva":"The Serpent's Cave. Dark, cool, smelling of wet stone. Somewhere water drips, and somewhere something large is breathing.","ui.hut.zmiieva":"🕯 The Serpent's Cave","ui.enterHut.lazna":"The tunnel. A narrow way under the river. Candles in niches in the walls, and far ahead a lamp flickers.","ui.hut.lazna":"🕳 The tunnel","cave.sing.lulled.toast":"{song}: the Zmiy listens and falls asleep. His coils draw back, leaving a crack in the back wall.","cave.sing.lulled.0":"…Maryna… No. It isn't her, it's a song. Thank you, kobzar.","cave.sing.lulled.1":"I'll sleep. You do what you must. Only know: it is her dowry, not mine and not yours.","cave.sing.listens.toast":"{song}: the Zmiy opens one eye, listens, and does not stir. This is not what he is waiting for.","cave.sing.listens.0":"Pretty. But I've heard that before. A hundred times.","cave.sing.listens.1":"Not about me. Play something that hurts.","cave.sing.wakes.toast":"{song}: the Zmiy jerks awake! His head snaps up, and the bats burst from the ceiling.","cave.sing.wakes.0":"SILENCE! Who dares make merry in my cave?!","cave.sing.wakes.1":"Forgive me, kobzar. I am angry not at you but at gladness. Try another.","cave.toast.caveHeard":"Now you know where the Serpent's Cave is: across the river, south of the old oak.","cave.toast.lazKnown":"In the kaplytsia there is a hatch under the rug. A tunnel runs underground all the way to the cave.","cave.toast.hoard":"You carefully slide the kerchief of chervintsi out from under his tail. Chervintsi: +{n}.","cave.toast.pouch":"A few chervintsi are left in the sentry's purse. Chervintsi: +{n}.","cave.prompt.crack":"Squeeze into the crack 🕳","cave.prompt.tunnelWest":"Climb up to the cave ⬆","cave.prompt.tunnelEast":"Climb the ladder to the kaplytsia ⬆","cave.prompt.chapelHatch":"Lift the hatch ⬇","cave.prompt.hoard":"Take the chervintsi 🪙","cave.prompt.pouch":"Take the purse 🪙","cave.pass.crack":"Back through the crack.","cave.pass.crackFirst":"You squeeze into the crack in the back wall. Tight and cold, the earth smells of damp, and far ahead a lamp flickers.","cave.pass.tunnelWest":"You climb up to the cave.","cave.pass.tunnelWestFirst":"You climb out into the cave, into the Zmiy's lair, behind his coils.","cave.pass.tunnelEast":"You climb the ladder.","cave.pass.tunnelEastFirst":"You climb the ladder and push at the hatch, and above you it smells of wax and incense: the Zalissya kaplytsia.","cave.pass.chapelHatch":"You go down the hatch.","cave.pass.chapelHatchFirst":"You fold back the rug, and under it is a hatch with an iron ring. A ladder leads down into the dark, where a light flickers.","map.cave":"The Serpent's Cave","ui.promptLabel.bathe":"Go for a swim 🌊","ui.promptLabel.shore":"Climb out","pond.bathe.fresh":"Coat on the bank, yourself in the water. Warm on top, icy by the bottom. The road's dust washes off: until morning you are fresh as a cucumber. CHA +1","pond.bathe.again":"Back in the water. The karas swim off, offended.","pond.bathe.night":"The night water is black and warm. They say drowned maidens swim here on May nights. Something brushes your leg. Lily stems. Probably.","pond.shore":"You climb out onto the bank, shake yourself like a dog and pull your coat on over the wet.","ui.buff.bathed":"Had a swim (CHA +1)","stat.bathed":"A swim in the pond","map.boloto":"Boloto","prokip.vesna.angry.0":"You?! And you dare show your face! Out!","prokip.vesna.angry.1":"I don't talk to old fools' messengers. Out.","prokip.vesna.angry.2":"The broom is right here, singer. Don't test me.","prokip.vesna.t.sorry.label":"Apologize","prokip.vesna.t.sorry.question":"Vesna, I'm sorry. I didn't know what that question meant.","prokip.vesna.sorry.0":"Didn't know. …Of course you didn't. That's what he was counting on, the old fox.","prokip.vesna.sorry.1":"It's not your fault. You're just a fool sent by another fool. An older one.","prokip.vesna.sorry.2":"Sit down. Mint tea? …And so you know: it DID rain. Tell him that. No, don't tell him anything.","prokip.vesna.toast.chased":"Vesna chases you out with a broom. Accurately.","prokip.vesna.toast.forgiven":"Vesna isn't cross any more.","quest.vesnaSorry.title":"Vesna is cross","quest.vesnaSorry.why":"Vesna chased you out with a broom. Did Prokip knows why.","quest.vesnaSorry.sorry":"Apologize to Vesna.","quest.vesnaSorry.done":"Vesna has forgiven you. And it did rain.","ui.quests.found":"✦ Found: {title}","ui.quests.secret":"Not everything is written in this book. The khutir tells the rest to whoever asks and looks about.","ui.enterHut.pustkaHint":"The abandoned hut. A cold pich, cobwebs, a hole in the thatch… but the walls are sound and the beam is good oak. With a mended roof and a fire in the pich, somebody could live here.","ui.enterHut.pustkaWork":"Taras's old khata. Wood for the pich, reeds for the roof: it is slowly coming back.","ui.enterHut.pustkaHome":"Omelko's khata now: swept, warm, smelling of smoke and kulish.","pustka.prompt.chop":"Chop wood","pustka.prompt.reed":"Cut reeds","pustka.prompt.thatch":"Mend the roof","pustka.prompt.stack":"Stack the wood and light the pich","pustka.toast.chopQuest":"You split a log: {n} of {need} for the stove.","pustka.toast.chopFullFire":"The pile is full. The pich will see to it through the night; come back in the morning.","pustka.toast.chopFull":"The pile is full: six logs are all the stove will take.","pustka.toast.chopFree":"You split a log for the pich: {n} of {need} in the pile. The arm remembers.","pustka.toast.reed":"You cut a bundle of reeds: {n} of {need}.","pustka.toast.thatch":"You bind fresh thatch over the hole. The roof is whole.","pustka.toast.stack":"You stack the wood by the pich and light it. For the first time in seven years the khata smells of smoke.","pustka.toast.level":"Carpentry level {level}. Strength {str}.","pustka.toast.ready":"The khata is ready for its tenant. Go and tell Omelko.","pustka.toast.omelkoHome":"Omelko dreams of a home of his own. The empty khata by Viy's hollow might do.","pustka.toast.leave":"Myroslav lets you have Taras's empty khata for Omelko. Chop wood, cut reeds, mend the roof.","pustka.toast.moved":"Omelko takes his kobza and his blanket and walks to the old khata on your arm.","ui.skillRows.name.carpentry":"Carpentry","ui.skillRows.stat.carpentry":"STR","quest.omelkoHome.title":"A roof for Omelko","quest.omelkoHome.permission":"Omelko dreams of a home of his own instead of the damp cave. Taras Dovhyi's khata stands empty: ask Myroslav, whose say it is.","quest.omelkoHome.work":"Make the old khata fit to live in: firewood {logs} of {wood}, reeds {reeds} of {reedsNeed}; then mend the roof and light the pich.","quest.omelkoHome.ready":"The khata is ready. Tell Omelko.","quest.omelkoHome.done":"Omelko lives in Taras's old khata, and the khutir approves.","pustka.myroslav.ask.label":"About the empty khata","pustka.myroslav.ask.question":"Whose is Taras Dovhyi's empty khata?","pustka.myroslav.ask.0":"Taras's? Seven years it has stood there, and every winter the roof gives a little more. If he were coming back he'd have come by now. The khutir's, then, and I am the khutir, God help me.","pustka.myroslav.ask.1":"If you want it mended for the blind old kobzar, mend it. Wood for the pich, reeds for the roof; you know what a roof wants. Do it well and I'll say a good word for you at the next gathering.","pustka.myroslav.work.0":"Wood for the pich, reeds from the pond for the roof. Don't stand there asking: the thatch won't mend itself.","pustka.myroslav.work.1":"Taras's axe is still in the stump by the door, if the rust hasn't had it.","pustka.praise.myroslav.label":"About Omelko's khata","pustka.praise.myroslav.question":"Omelko has moved into Taras's khata.","pustka.praise.myroslav.0":"I saw. There's smoke from that chimney for the first time in seven years. A khutir with a lit chimney in every khata is a khutir that lives.","pustka.praise.myroslav.1":"Well done, kobzar. I said I'd put in a word, and I will: it was a good deed, and a quiet one. Those are the best.","pustka.praise.vesna.label":"About Omelko's khata","pustka.praise.vesna.question":"Omelko has moved into the empty khata.","pustka.praise.vesna.0":"I know. I took him honey and a bundle of herbs for his chest. He can't see them, but he said he could smell me coming. Cheeky old man.","pustka.praise.vesna.1":"You did a good thing, kobzar. Don't let it go to your head; it's only a roof.","pustka.praise.radek.label":"About Omelko's khata","pustka.praise.radek.question":"The old kobzar has the empty khata now.","pustka.praise.radek.0":"Jezus Maria, I walked past: a roof like a lid on a pot! I didn't think that hole would ever close. You have hands, kobzarzu, not only fingers.","pustka.praise.radek.1":"A man who mends a roof for another man is worth two who sing about it. Psiakrew, now I sound like a priest. Forget I said it.","pustka.praise.odarka.label":"About Omelko's khata","pustka.praise.odarka.question":"Omelko lives in the empty khata now.","pustka.praise.odarka.0":"He sits by the window and listens to the road. He asked for a bowl of kulish and wouldn't hear of paying. I wouldn't take his money either.","pustka.praise.odarka.1":"You gave an old man a roof, and you gave me back my nights. A person remembers that. Sit down, I'll pour you something.","pustka.praise.okhrim.label":"About Omelko's khata","pustka.praise.okhrim.question":"Omelko has a roof now.","pustka.praise.okhrim.0":"A blind kobzar under a roof and a Sich man by the fire. So the world is arranged after all.","pustka.praise.okhrim.1":"Good work, son. At the Sich we said a man is measured by what he does for someone who can't repay him. You'd have passed.","cave.omelko.t.home.label":"About a roof","cave.omelko.t.home.question":"Would you rather live somewhere else, grandfather?","cave.omelko.home.0":"Somewhere else? I want a place to call home, lad: a roof that doesn't drip, a pich to warm my hands at, a door I can shut myself. The stone here is cold, the damp gets into the bones, and a serpent breathes down my neck all night.","cave.omelko.home.1":"But who gives a blind man a roof? Forget it. It's only talk; the old like to complain.","cave.omelko.homeWait.0":"Have you found me a roof? Don't build my hopes up for nothing; an old man's hope is a thin thing.","cave.omelko.homeWait.1":"If there's a khata standing empty, the starosta decides who may have it. Go and ask him.","cave.omelko.t.move.label":"About the khata","cave.omelko.t.move.question":"The khata is ready, grandfather.","cave.omelko.move.0":"Ready? With a roof that doesn't let the rain in, and a pich with a fire? Don't tease an old man.","cave.omelko.move.1":"Then I'll go. Give me your arm, lad. I'll take only the kobza and the blanket; the cave can keep the rest.","cave.omelko.homeIntro":"Is that you, lad? Come in; the door shuts properly now. Do you smell that? Real smoke, and real kulish.","cave.omelko.homeAgain":"Come in, come in. My own roof. Sit by the pich.","cave.omelko.t.homeLife.label":"About the khata","cave.omelko.t.homeLife.question":"How do you like your khata?","cave.omelko.homeLife.0":"I sleep warm now, and in the morning I hear the khutir wake: the geese, the well, the smith. In the cave it was only water, forever, dripping.","cave.omelko.homeLife.1":"You gave a blind man a door that is his own. I have no way to repay that, only a song, and you already have it.","ui.tab.satchel":"Satchel","ui.tab.satchel.aria":"Show the satchel","ui.satchel.load":"Carrying {carried} / {cap}","ui.satchel.limit":"The limit comes from STR {str}.","ui.satchel.group.food":"Food and tonics","ui.satchel.group.gather":"Gathered","ui.satchel.group.iron":"Iron","ui.satchel.group.purse":"Purse","ui.satchel.item.meals":"Kulish","ui.satchel.item.potions":"Tonic","ui.satchel.item.strongPotions":"Strong tonic","ui.satchel.item.fish":"Fish","ui.satchel.item.herbStock":"Herbs","ui.satchel.item.lysaFlower":"Nichnyky","ui.satchel.item.iron":"Bog iron","ui.satchel.item.forged":"Horseshoes","ui.satchel.item.chervintsi":"Chervintsi","ui.satchel.rowWeight":"weight {unit} · {total} in all","ui.satchel.rowWeightIron":"weight {unit} · {total} in all · hauled in your arms for Radek","ui.satchel.weightless":"weighs nothing","ui.satchel.act.eat":"Eat","ui.satchel.act.drink":"Drink","ui.satchel.empty":"Nothing in the satchel yet. Herbs, fish and kulish will turn up here.","ui.satchel.songsBtn":"Songs · {n}","ui.satchel.keepsBtn":"Keepsakes · {n}","ui.satchel.keepsEmpty":"No keepsakes yet."};var M8={"line.myroslav.0":"О! Кобзар! Та ще й живий, та ще й з кобзою. Я Мирослав, отаман цього хутора. Сідай до вогню, синку, — у Заліссі співака не женуть.","line.myroslav.1":"Узліссям ходи чемно. Там Лісовик господарює. Хто бере без спросу — той потім три дні кружляє між трьох сосон.","line.myroslav.2":"Поселимо тебе в північній хаті. Хата пустує — тобто там лише Домовик. Покладеш йому хліба за піч — буде тобі тепло. Не покладеш — буде тобі цікаво.","line.myroslav.3":"Біля вогнища лежить окраєць. Віднеси йому. Тільки не дякуй уголос — домовики того не терплять, як я не терплю писарів.","line.myroslav.4":"А тепер слухай, бо двічі не скажу. У північно-східній улоговині спить Вій. Повіки до землі. Подивитися можна. Будити — НІ.","line.myroslav.5":"Радек у кузні — лях. Утік од свого пана, а в нас, бачиш, прижився. Лається по-своєму, кує по-нашому. Не цькуй його: добрий коваль на хуторі — як добра шабля.","line.myroslav.6":"Ще одне. Біля старого жорна вилежується Чорт. Чемний, як писар, і такий самий злодій. Душу не продавай, хоч би що він співав. І за річку, на болото, не ходи: там Болотяник, а він кобзарів не слухає — він їх збирає.","line.myroslav.7":"Стежкою на схід — Лиса Гора. Там у шабашні ночі чорти з відьмами гуляють так, що в Києві чути. Ходити не заборонено. Але йди з дарунком, гопака вмій, а що наллють — не пий. Ну, хіба трохи.","line.myroslav.8":"І запам'ятай, кобзарю: у нас людина стає тим, що робить. Траву рвеш — око гострішає. Рибу ловиш — руки спритніють. А як співаєш увечері біля вогню — то й люди до тебе тягнуться. Усе записано у вікні Персонажа.","line.vesna.0":"О, ти тільки глянь у свій кошик: кропива, полин, календула, звіробій, деревій! Та з тебе ще травник буде.","line.vesna.1":"Травам не вчаться з книжки. Їх збирають — по стеблинці, по ранку.","line.vesna.2":"Тепер руки твої годяться на більше. Навпроти моєї хати, на стежці до ставка, кабиця з горщиком: риба й трава — і буде куліш, а ситий козак і ходить жвавіше. А біля хати, на подвір'ї, сушарка: дві трави — і настоянка, після якої світ стає ясний.","line.vesna.3":"Ти вже й голову маєш ясну — ІНТ 3. Тоді бери в мене міцну настоянку: три трави, і розум та око удвічі гостріші (ІНТ +2, МДР +2).","line.vesna.4":"Є в мене й міцна настоянка, на три трави. Але тільки для ясної голови — ІНТ 3. У тебе {intTotal}. Вари звичайну — сушарка все пам'ятає.","line.vesna.5":"І риба в торбі є. Ну, кобзарю, ти вже майже господар.","line.vesna.6":"Як трави відпочивають — іди з вудкою на західний берег. Риба любить терплячих. Як і я.","line.vesna.7":"Кобзар? От добре. Я Весна, знахарка. Лікую людей, худобу, а коли треба — то й отамана від похмілля.","line.vesna.8":"Бачиш, як у траві світиться? Кропива, полин, календула, звіробій, деревій. Нарви мені — і око в тебе стане травницьке.","line.vesna.9":"Тільки звіробій ховається від зеленого ока. Поки Мудрість не дійде до 2 — не впізнаєш його, хоч носом тицяйся.","line.vesna.10":"Принеси п'ять трав — і знатиму, що ліс тебе прийняв.","line.radek.0":"Słyszysz? Горно співає! Твоє болотяне залізо, кобзарю. Оце кузня, a nie сарай.","line.radek.1":"Підкову носи. Не на щастя, а для руки: залізо в кишені — сила в долоні. Перший урок ковальства. Безплатно, бо я сьогодні добрий.","line.radek.2":"Ковадло твоє. Бий — і рука сильнішає. А коли дуже сильна, то й шедевр вийде. Пан мій казав, що лях з руками — це гріх. Хай тепер подивиться.","line.radek.3":"Jezus Maria, три брили болотяного заліза! Кобзарю, ти щойно розпалив мою кузню.","line.radek.4":"Тримай — перше, що зійшло з ковадла: підкова, ще гаряча. Залізо пам'ятає, хто годував вогонь.","line.radek.5":"Тепер у Заліссі буде залізо. А коли той ваш Вій заворушиться — буде й чим зустріти.","line.radek.6":"Радек. Кую коней, лагоджу плуги, терплю отаманові жарти. Обережно з ковадлом — кусається.","line.radek.7":"Звідки я? З-під Любліна. Пан мій хотів, щоб я кував йому кайдани для його ж людей. Я подумав — і кував собі дорогу на схід. Тут лях — ворог, а коваль — друг. Я обираю бути ковалем.","line.radek.8":"Болотяне залізо! Добре око. Ще {n} — і горно знову загуде.","line.radek.9":"Кузня холодна, пся крев. Треба болотяного заліза — воно спить у мулі ставка, темні брили поблискують, де берег м'який. Три брили — і буде вогонь.","line.radek.10":"Лісовик дошкуляє? Приходь до мене. Холодне залізо з лісовими панами розмовляє коротко. І в нас під Любліном, і тут.","line.radek.11":"Про Вія чув. Повіки такі важкі, що слуги вилами піднімають. Кажуть, залізо проти таких співає. Коли прийде той день — хай моє горно вже буде гаряче.","line.domovyk.0":"Гм. Знову ти. …Хліб був добрий. Скоринка хрустка, солі в міру. Сто зим тут живу, а все одно дивуюся, коли хтось по-людськи.","line.domovyk.1":"Камінь, що я лишив, тримай у головах. У найлютішу ніч буде теплий. Це не обіцянка. Це Домовик. Ми кращі за обіцянки.","line.domovyk.2":"Спи, кобзарю. Піч гріє, миші чемні, кобза твоя не розстроїться. Я пильную.","line.domovyk.3":"…Окрайця нема, помітив? Самі крихти за піччю. Я нічого не кажу. Домовики «дякую» не кажуть.","line.domovyk.4":"Але глянь коло печі, як матимеш час. Іноді вдячність випадає в нас із кишені. Ненароком.","line.domovyk.5":"Тсс! Хто тупотить? …А, кобзар. Отаман казав. Я Домовик. Це моя хата, моя піч і мої миші. Ти тут на постої. Поводься.","line.domovyk.6":"Хліба ще не лишив. Ну-ну. Нові завжди забувають першої ночі. А потім дивуються, чого чоботи в печі.","line.domovyk.7":"Біля вогнища окраєць лежить. Принеси його сюди, до печі, і поклади тихо. Без пісень. Принаймні поки що.","line.domovyk.8":"Лісовик там зі своїми соснами задаваку корчить. Хай. Царства падають, а піч стоїть.","line.domovyk.9":"…Від тебе пахне улоговиною. Ти ходив до Вія. Не тупоти там, господарику. Як ті повіки піднімуться, жодна піч у Заліссі не вгріє.","line.lisovyk.0":"Стій, двоногий. …Тихо ходиш, як на співака. Я Лісовик. Сосни — мої. Стежки — мої. Заблукані — теж мої.","line.lisovyk.1":"Трави бери: кропиву, полин, ті маленькі сонця. Ліс дає тому, хто просить. А жадібному — крутить стежки, поки той не почне вітатися з власними слідами.","line.lisovyk.2":"Весна на тебе дивиться. Під таким оком добре. Не зіпсуй.","line.lisovyk.3":"Бачив його, так? Вія. Навіть я ту улоговину обходжу, а я — ліс. Його тримає тільки сон. Не підпилюй той ланцюг.","line.chort.0":"Мій найулюбленіший клієнт! Душу викупив, золото лишив, тінь пришив назад — та ти торгуєшся краще за половину пекла, а в них, між іншим, роги!","line.chort.1":"Без образ, кобзарю. Угода є угода. Хоча… сумую за твоєю тінню. Вона так гарно під кобзу пританцьовувала.","line.chort.2":"До речі, про танці. На Лисій Горі такий шабаш — у Дикані дахи підскакують! Стежкою на схід. Приходь із дарунком і з гопаком — і підеш звідти з більшим, ніж прийшов. Це обіцянка, а не угода. Майже.","line.chort.3":"А-а, мій безтінний друже! Опівдні під ногами — пусто. Красота! Зате золото справжнє. Пропий його десь у теплій корчмі.","line.chort.4":"А як набридне хутір — Лиса Гора, стежкою на схід. Мій гість — гість самого Вельзевула. З тінню чи без.","line.chort.5":"Ану, що то пахне? Ставком і карасем! ДВІ риби, рахую, навіть не рахуючи. Ну що, кобзарю, зведемо рахунки?","line.chort.7":" Дві, а не три — бо таким язиком і чорта переспіваєш. А я, між іншим, чорт.","line.chort.6":"Скучив за тією дрібничкою? Я не звір: {price} рибин зі ставка — і душа твоя.{n} Чорти люблять рибу. Не питай. НІХТО не знає чому.","line.chort.8":"Псст! Сюди, кобзарю, до жорна! Що, чорт не може на сонечку погрітися? Я Чорт: купець, музика й скромний збирач… підписів.","line.chort.9":"Колись ми на старому млині такі шабаші справляли — скрипки, гопак, козацькі весілля навиворіт! Козацька душа, кобзарю, — то вино, а не квас. Тепер гуляємо на Лисій Горі. А сьогодні я купую.","line.chort.10":"Отже, угода. Твоя душа — трохи ношена, власник один, дбайливий. Навзамін: золото, що не кінчається. Кінь, що не втомлюється. Кобза, що грає сама, поки ти спиш! Підпиши тут. І тут. І кров'ю ось тут — жартую! Чорнило теж годиться. Здебільшого.","line.bolotianyk.0":"Очерет розступається. З чорної твані виринають очі, тоді голова, як утоплена колода, і з неї ллється вода. Болотяник дивиться на тебе, як глибина на камінь.","line.bolotianyk.1":"«Сухоногий… Моє болото. Мій мул. Мої дзвони — церковні, що потонули тут, коли твого хутора ще й не було. Я дзвоню в них. Для тих, хто забрів задалеко».","line.bolotianyk.2":"«Знахарка бере мій полин і не лізе далі. Мудро. А ти рви траву на сухому. Що в МОЇЙ воді росте — не для твого кошика».","line.bolotianyk.3":"«А проте рибалиш у хутірському ставку, і я дозволяю: та вода зрештою стікає до мене. Волосінь у тебе чемна. А от тінь… тінь твоя пахне тим чортом від жорна». Очі опускаються нижче. Стежать.","line.bolotianyk.4":"«Перекажи селянам: Болотяник терплячий. Болото було до хутора. Болото — і той, хто спить в улоговині, — буде й після. Усе колись опускається до нас». Брижі змикаються, наче нічого й не було.","line.viy.0":"В улоговині недобра тиша. Ні пташки, ні коника. Тільки звук, ніби дихає гора — повільно, мокро, терпляче.","line.viy.1":"Він величезний. Голова — як камінь із кургану, сіра, мов давній попіл. Повіки звисають аж до землі, важкі, як мокре вітрило. Двоє висохлих слуг спираються на вила. Вони не дивляться на тебе. Вони дивляться на повіки.","line.viy.2":"Під однією повікою щось ворушиться. Розкривається шпаринка тьмяного червоного світла — тільки шпаринка — і кожна волосина на тобі стає дибки. Слуги завмирають. Дихання стихає.","line.viy.3":"…Шпаринка закривається. Дихання повертається. Що б не снилося Вієві — це не ти. Поки що. Ти задкуєш дуже-дуже тихо, і пташки знову співають, лише коли вже видно вогнище.","line.beelzebub.0":"Вельзевул схиляє рогату голову — маленька й страшна ввічливість. «ГОРА ПАМ'ЯТАЄ СВОЇХ ГОСТЕЙ, КОБЗАРЮ. ІДИ ВНИЗ У ТЕПЛІ».","line.beelzebub.1":"Унизу відьми досі танцюють. Вони танцюватимуть, коли Залісся вже стане бабусиною казкою. Ти сходиш стежкою з місячним сяйвом на плечах, як із позиченим кожухом.","line.beelzebub.2":"Вельзевул підводиться — повільно, як насувається гроза. Скрипки збиваються. Кожен чорт на вершині обертається до тебе, а вогонь нахиляється послухати.","line.beelzebub.3":"«ТИ ПРИНІС ГОРІ КВІТИ. ТИ ЗАГРАВ ЇЙ ГОПАКА. ТАКОГО ГОСТЯ ШАБАШ З ПОРОЖНІМИ РУКАМИ НЕ ВІДПУСКАЄ». Він розкриває долоню. На ній — місячний камінь, холодний і лагідний.","line.beelzebub.4":"«БЕРИ. НЕ УГОДА — БЛАГОСЛОВЕННЯ. ЦЕ РІЗНІ РЕЧІ, І СЬОГОДНІ ТИ ЗАСЛУЖИВ РІЗНИЦЮ». Десь під горою раз дзвонить дзвін, якого нема, — і Болотяник йому відповідає.","line.beelzebub.5":"З чорного кам'яного трону Вельзевул дивиться на тебе понад вогнем. Голос у нього не гучний. Гора несе його, як грім.","line.beelzebub.6":"«ДАР ПОКЛАДЕНО. ДОБРЕ. ТЕПЕР ГОПАК, КОБЗАРЮ. ГІСТЬ, ЯКИЙ ЛИШЕ ДИВИТЬСЯ, — ПІВГОСТЯ. ГРАЙ У КОЛІ НА ПІВДЕНЬ ВІД ВОГНЮ».","line.beelzebub.7":"Ти підходиш до трону, і шабаш стихає: скрипки замовкають, відьми застигають посеред оберту, сотня чортенят раптом дуже цікавиться своїми копитцями.","line.beelzebub.8":"Вельзевул старший за лисину цієї гори й вбраний, як найкращий похорон. «КОБЗАР. НА МОЇЙ ГОРІ. БЕЗ ДАРУ». Він каже це, як отаман помічає, що з тину вкрали кілок: не гнівно — записуючи.","line.beelzebub.9":"«ЗАКОНИ ДАВНІ, І Я ЇМ КОРЮСЯ. НА СХИЛАХ ЦВІТУТЬ НІЧНИКИ, БЛІДІ, ЯК КІСТКА. ТРИ — НА ЖЕРТОВНИЙ КАМІНЬ. ТОДІ Й ПОБАЧИМО, ЩО ТИ ЗА СПІВАК».","line.chort.11":"Прийшов, приніс, заграв — і сам Вельзевул тебе благословив! Знаєш, що це робить із моєю репутацією? Нічого. Вона й так розкішна.","line.chort.12":"Носи камінь гідно. А як у Заліссі спитають, звідки, — кажи: чорт подарував. Хай отаман подавиться люлькою.","line.chort.13":"Ти ЗАГРАВ! Усі бачили? Кобзар грав гопака, а гора навіть не тріснула! Тепер до великого крісла, там на тебе благословення чекає.","line.chort.14":"Дар покладено, камінь щасливий — а каміння щасливим не буває, отак добре вийшло! Тепер гопака, кобзарю! У коло на південь від вогню. Відьми вже копитами… тобто ногами тупотять.","line.chort.15":"Нічники! Три бліді красуні, жодної пом'ятої пелюстки. Неси їх на жертовний камінь, на північ від вогню. Гора любить, коли лагідно.","line.chort.16":"МІЙ ГІСТЬ! Ласкаво просимо на Лису Гору — мою контору, мій шинок, мою бальну залу! Вельзевул головує, відьми танцюють, а вогонь старший за твій хутір і вдвічі чесніший.","line.chort.17":"Правила тут Вельзевулові, тож вирізьблені в камені: гість приносить горі дар. На схилах цвітуть нічники — три на жертовний камінь. А тоді — гопак. Кобзар без гопака на шабаші — як козак без вуса.","line.chort.18":"І жодних підписів сьогодні! Шабашні правила. Навіть я раз на тиждень чесний. …Переважно.","line.solokha.0":"Солоха робить реверанс — відьомський, у якому неба більше, ніж треба. «Благословений самим великим! Іди гордо, кобзарику. А Весні перекажи, що гора добре береже її сестру».","line.solokha.1":"Вона нічого не тицяє тобі в руку й нічого не просить. Від відьми з Лисої Гори це найрідкісніший подарунок.","line.solokha.2":"Ох і грав! У мене аж спідниця сама в танець пішла. Біжи до Вельзевула, поки вогонь високий: благословення при високому вогні тримається довше.","line.solokha.3":"Камінь прийняв твої квіти — я відчула крізь черевики. Тепер гопака, кобзарику! Коло на південь від вогню. І не рахуй тактів — від рахунку смертні з музики випадають.","line.solokha.4":"Три нічники, і зірвані на першому подиху цвіту — добре тебе Весна вчила. Жертовний камінь — на північ від вогню. Кланятися не треба: гора не піп, гора — господиня.","line.solokha.5":"Ой, гляньте — кобзар! Я Солоха: відьма, вдова й найкраща куховарка на цій горі, хоч що там чорти з повними ротами кажуть.","line.solokha.6":"Хочеш, щоб шабаш тебе прийняв? Тоді як годиться. На голих схилах цвітуть нічники, бліді, мов місяченьки. Три — на жертовний камінь, на північ від вогню. Така ціна гори, і вона чесніша за чортову.","line.solokha.7":"А потім — гопака! Гостя, що не грає й не танцює, гора забуває. А пам'ять у неї довга, а манер — жодних.","line.motrya.0":"Мотря торкається двома пальцями сяйва каменя й усміхається на всі зуби. «Тобі личить. Повертайся, як згасне, кобзарику, — гори оновлюються».","line.motrya.1":"Мотря ще кружляє в луні гопака й наспівує. «Ти тримав темп. Велике крісло помітило. Іди по благословення».","line.motrya.2":"Мотря киває на жертовний камінь, де ледь світяться твої нічники. «Покладено правильно. Тепер гопак — на південь від вогню. І не думай про пальці: пальці не люблять, коли про них думають».","line.motrya.3":"Маленька відьма з голосом дрімлюги відривається від вінка з нічних квітів. «Мотря. Знаю, де ховаються нічники. І не така горда, щоб не сказати».","line.motrya.4":"«На схилах, кобзарику. Де камінь найлисіший, а місячне світло збирається калюжками. Три для каменя. Рви лагідно: пом'ятий нічник — пом'ята обіцянка, а ця гора рахує обіцянки».","line.motrya.5":"«Уже {flowers} у руці. Гора й це рахує. Ще {n}, кобзарику».","topic.myroslav.0":"А, кобзар. Сідай. Люлька є, тютюну нема, розмова — будь ласка.","topic.myroslav.forest.label.0":"Ліс і Лісовик","topic.myroslav.forest.question.0":"Хто ходить лісом?","topic.myroslav.domovyk.label.0":"Домовик і хліб","topic.myroslav.domovyk.question.0":"Що мені робити з Домовиком?","topic.myroslav.viy.label.0":"Вій","topic.myroslav.viy.question.0":"Хто такий Вій?","topic.myroslav.radek.label.0":"Коваль-лях","topic.myroslav.radek.question.0":"Звідки у вас лях?","topic.myroslav.dark.label.0":"Чорт і ставок","topic.myroslav.dark.question.0":"Чого тут боятися?","topic.myroslav.lysa.label.0":"Лиса Гора","topic.myroslav.lysa.question.0":"Що за Лиса Гора?","topic.myroslav.growth.label.0":"Як тут стають кимось","topic.myroslav.growth.question.0":"Як у Заліссі стати своїм?","topic.vesna.0":"Голова в тебе ясна — бери міцну настоянку: три трави, ІНТ +2 і МДР +2. Сушарка тобі її запропонує.","topic.vesna.1":"Міцна настоянка — для ясної голови, ІНТ 3. У тебе {intTotal}. Вари поки звичайну — сушарка пам'ятає кожну.","topic.vesna.2":"Від тебе пахне цілою левадою. Питай, травнику.","topic.vesna.3":"Що, кобзарю, болить чи просто цікаво?","topic.vesna.herbs.label.0":"П'ять трав","topic.vesna.herbs.question.0":"Навчи мене трав.","topic.vesna.zvirobiy.label.0":"Звіробій","topic.vesna.zvirobiy.question.0":"Чому звіробій від мене ховається?","topic.vesna.zvirobiy.0":"Уже не ховається. Твоє око його знає — і стебло, і жовту зірочку. Двері, що відчинило діло, не зачиняються.","topic.vesna.cooking.label.0":"Куліш","topic.vesna.cooking.question.0":"Що можна зварити?","topic.vesna.cooking.0":"Навпроти моєї хати, на стежці до ставка, кабиця. Риба і трава з торби — і буде куліш, як на Січі. Ситий ходить жвавіше. З'їси його у вікні Персонажа.","topic.vesna.alchemy.label.0":"Настоянки","topic.vesna.alchemy.question.0":"Навчи мене настоянок.","topic.vesna.alchemy.0":"У мене на подвір'ї, біля хати, сушарка. Дві трави, терпіння — і настоянка. Вип'єш — і світ ясніє.","topic.vesna.pond.label.0":"Ставок","topic.vesna.pond.question.0":"А що зі ставком?","topic.vesna.pond.0":"Західний берег — для вудки. Терпляча волосінь ловить і карася, і тишу. А хочеш — скупайся: вода чиста, Болотяник сидить у своєму болоті за річкою.","topic.vesna.errand.label.0":"Чим тобі допомогти","topic.vesna.errand.question.0":"Тобі щось треба?","topic.vesna.errand.0":"Ні, кобзарю. Ліс тебе прийняв. Тепер співай нам увечері — більше нічого й не треба.","topic.radek.0":"З-під Любліна. Пан хотів кайдани, я хотів волі. Ми не зійшлися в ціні.","topic.radek.1":"Бережися іскор, кобзарю. Питай.","topic.radek.2":"No? Обережно з ковадлом — кусається. Питай.","topic.radek.forge.label.0":"Кузня горить","topic.radek.forge.question.0":"Як кузня?","topic.radek.horseshoe.label.0":"Підкова","topic.radek.horseshoe.question.0":"Чому саме підкова?","topic.radek.smithing.label.0":"Ковальство","topic.radek.smithing.question.0":"Навчи мене ковадла.","topic.radek.home.label.0":"Звідки ти","topic.radek.home.question.0":"Як лях опинився серед козаків?","topic.radek.home.label.1":"Звідки ти","topic.radek.home.question.1":"Як лях опинився серед козаків?","topic.radek.iron.label.0":"Болотяне залізо","topic.radek.iron.question.0":"Чого бракує кузні?","topic.radek.lisovyk.label.0":"Залізо і Лісовик","topic.radek.lisovyk.question.0":"Залізо вгамує Лісовика?","topic.radek.viy.label.0":"Залізо і Вій","topic.radek.viy.question.0":"А проти Вія залізо допоможе?","topic.domovyk.0":"Гм. Знову ти. Ну, сідай. Питай — тихенько.","topic.domovyk.1":"Тихіше, постояльцю. Питай.","topic.domovyk.bread.label.0":"Хліб","topic.domovyk.bread.question.0":"Чого ти від мене хочеш?","topic.domovyk.hearth.0":"Тепла каменюка","topic.domovyk.hearth.1":"Хата і піч","topic.domovyk.hearth.2":"Розкажи про камінь.","topic.domovyk.hearth.3":"Розкажи про цю хату.","topic.domovyk.hearth.4":"Сто зим я тут: піч тепла, хліб пухкий, миші чемні. Робота не велика. Але без неї жодна інша не робиться.","topic.domovyk.lisovyk.label.0":"Лісовик","topic.domovyk.lisovyk.question.0":"А що Лісовик?","topic.domovyk.lisovyk.0":"Задавака з шишками. Хай собі. Царства падають, а піч стоїть.","topic.domovyk.viy.label.0":"Вій","topic.domovyk.viy.question.0":"А що Вій?","topic.domovyk.viy.0":"Від тебе улоговиною пахне. Не тупоти там, господарику. Як ті повіки піднімуться — жодна піч не вгріє.","topic.lisovyk.0":"Знову ти, співаче. Ходиш тихо. Питай.","topic.lisovyk.rules.label.0":"Закони лісу","topic.lisovyk.rules.question.0":"Які в лісі закони?","topic.lisovyk.vesna.label.0":"Весна","topic.lisovyk.vesna.question.0":"А що Весна?","topic.lisovyk.viy.label.0":"Вій","topic.lisovyk.viy.question.0":"А що Вій?","topic.lisovyk.domovyk.label.0":"Домовик","topic.lisovyk.domovyk.question.0":"А що Домовик?","topic.lisovyk.domovyk.0":"Божок крихт у теплій скрині. Хай стереже піч — я стережу світ, що ростить для неї дрова. Ми не сваримося. Майже.","topic.lisovyk.lost.label.0":"Заблукані","topic.lisovyk.lost.question.0":"Що буває із заблуканими?","topic.lisovyk.lost.0":"Хто йде жадібно чи гучно — тому стежки крутяться, і він до ночі вітається з власними слідами. Хто тихо — тому сосни розступаються, як чемні сусіди. А хто співає гарно — тому я іноді підспівую. Ти чув вітер?","topic.chort.0":"Мій найулюбленіший клієнт! Питай — пера в мене нема. Чесне чортівське.","topic.chort.settled.label.0":"Наша угода","topic.chort.settled.question.0":"Без образ?","topic.chort.lysa.label.0":"Шабаш","topic.chort.lysa.question.0":"Розкажи про шабаш.","topic.chort.mill.label.0":"Старий млин","topic.chort.mill.question.0":"Що бувало на старому млині?","topic.chort.mill.0":"О-о! Скрипки, гопак, козацькі весілля навиворіт, сам Вельзевул на почесному місці! Тепер гуляємо на Лисій Горі, але до жорна в мене слабкість. Тут я вперше купив душу. Запорожця. Він потім її відіграв у карти, шельма.","topic.chort.1":"Мій безтінний друг! Питай — усе обговорюється. Майже все.","topic.chort.soul.label.0":"Ціна моєї душі","topic.chort.soul.question.0":"Скільки коштує моя душа назад?","topic.chort.gold.label.0":"Золото і тінь","topic.chort.gold.question.0":"Чесна була угода?","topic.chort.lysa.label.1":"Лиса Гора","topic.chort.lysa.question.1":"Розкажи про гору.","topic.chort.2":"Псст. Знову ти? Питай — я знаю всяке. Дещо навіть правда.","topic.chort.who.label.0":"Хто ти?","topic.chort.who.question.0":"Що ти таке, власне?","topic.chort.mill.label.1":"Шабаш","topic.chort.mill.question.1":"Що за шабаш?","topic.chort.viy.label.0":"Чого бояться чорти","topic.chort.viy.question.0":"А чорти чогось бояться?","topic.chort.viy.0":"Вія. …Бачиш, навіть я стишую голос. Чорт торгує душами. Вій — кінцями. Як ті повіки піднімуться, весь мій шабаш танцюватиме йому на втіху — з дуже-дуже далекої відстані.","topic.chort.refused.label.0":"Відмова","topic.chort.refused.question.0":"Шкодуєш, чорте?","topic.chort.refused.0":"Я? Шкодую? Ха! Останній, хто мені відмовив, став отаманом. Пропозицію закрито, чорт тримає слово. Але як Вій заворушиться і тобі знадобиться друг із вилами — ти знаєш, де жорно. Ціни в мене тільки ростуть.","topic.chort.bargain.label.0":"Угода ✒","topic.chort.bargain.question.0":"Що ти пропонуєш?","topic.bolotianyk.0":"Очі знову виринають із ряски. «Сухоногий. Питай. У болота є час».","topic.bolotianyk.bells.label.0":"Утоплені дзвони","topic.bolotianyk.bells.question.0":"Що за дзвони під водою?","topic.bolotianyk.water.label.0":"Що росте у воді","topic.bolotianyk.water.question.0":"Можна брати те, що тут росте?","topic.bolotianyk.fishing.label.0":"Риболовля","topic.bolotianyk.fishing.question.0":"Ти не проти моєї вудки?","topic.bolotianyk.fishing.0":"«Ти ще не каламутив хутірського ставка. Лови, якщо мусиш, — із західного берега, чемно. Уся та вода стікає до мене. Що вона віддає — бери. Що тримає — те тримає».","topic.bolotianyk.old.label.0":"Найстаріше","topic.bolotianyk.old.question.0":"Що тут найстаріше?","topic.beelzebub.viy.label.0":"Вій","topic.beelzebub.viy.question.0":"Чого боїться гора?","topic.beelzebub.viy.0":"«ВІЙ. ТАК. НАВІТЬ У ГОРИ Є СУСІД, ДО ЯКОГО ВОНА НЕ ХОДИТЬ. ПІД ЙОГО ПОВІКАМИ — КІНЕЦЬ. ХАЙ СПИТЬ. ДЕЯКИХ ГОСТЕЙ НЕ ПРИЙМАЮ НАВІТЬ Я».","topic.beelzebub.court.label.0":"Твій двір","topic.beelzebub.court.question.0":"Хто тут збирається?","topic.beelzebub.court.0":"«ВІДЬМИ, ЩО ПЕРЕЖИЛИ СВОЇ СЕЛА. ЧОРТИ, ЩО ПЕРЕРОСЛИ СВОЇ МЛИНИ. І ОДИН КОБЗАР, ЩО ПРИЙШОВ УВІЧЛИВО. ВОГОНЬ СТАРШИЙ ЗА СІЧ. ТАНЕЦЬ СТАРШИЙ ЗА ВОГОНЬ».","topic.beelzebub.0":"«ГІСТЬ ГОРИ ПОВЕРНУВСЯ. ПИТАЙ, КОБЗАРЮ».","topic.beelzebub.moonstone.label.0":"Місячний камінь","topic.beelzebub.moonstone.question.0":"Що ти мені дав?","topic.beelzebub.leaving.label.0":"Спуск із гори","topic.beelzebub.leaving.question.0":"Можна йти з миром?","topic.beelzebub.1":"«ТИ ЗАГРАВ, КОБЗАРЮ. Є БЛАГОСЛОВЕННЯ З ТВОЇМ ІМ'ЯМ. ПОПРОСИ — І ВОНО ТВОЄ».","topic.beelzebub.blessing.label.0":"Прийняти благословення ✦","topic.beelzebub.blessing.question.0":"Я приніс дар і заграв гопака. Я прийшов по благословення.","topic.beelzebub.rules.label.0":"Закони гори","topic.beelzebub.rules.question.0":"Які тут закони?","topic.beelzebub.rules.0":"«ДАР ПОКЛАДЕНО. ГОПАК ЗАГРАНО. РЕШТА — МОЄ, ЩОБ ДАРУВАТИ. ТАКІ ЗАКОНИ, І Я ЇМ КОРЮСЯ».","topic.beelzebub.2":"«КАМІНЬ ПАМ'ЯТАЄ ТВОЇ КВІТИ. ПИТАЙ».","topic.beelzebub.dance.label.0":"Гопак","topic.beelzebub.dance.question.0":"Що мені тепер робити?","topic.beelzebub.offering.label.0":"Дар","topic.beelzebub.offering.questi
