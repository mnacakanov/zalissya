# Export the Godot project for the web and publish it on GitHub Pages.
#   · on pull requests touching godot-demo/: export only (a check).
#   · on pushes to main touching godot-demo/: also publish — the export is
#     committed to docs/godot-demo/, which Pages serves next to the game.
# Single-threaded web export (no cross-origin isolation headers needed),
# installable as a PWA. Linux and mobile exports come later.
# The publish commit is made with GITHUB_TOKEN, so it does not trigger this
# workflow (or pages.yml) again. Never edit docs/godot-demo/ by hand.
name: Godot web

on:
  pull_request:
    paths: ["godot-demo/**", ".github/workflows/godot.yml"]
  push:
    branches: [main]
    paths: ["godot-demo/**", ".github/workflows/godot.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: godot-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Godot and its web template, downloaded once and cached by version
      # (the full template archive is 1.3 GB; only the web one is kept)
      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-web-nothreads
      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot
          curl -sSL -o /tmp/godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -oq /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          curl -sSL -o /tmp/templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          dest=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$dest"
          unzip -oqj /tmp/templates.tpz templates/web_nothreads_release.zip templates/version.txt -d "$dest"
          rm /tmp/templates.tpz /tmp/godot.zip

      - name: Import and export
        working-directory: godot-demo
        run: |
          set -euo pipefail
          ~/godot/godot --headless --path . --import
          mkdir -p build
          ~/godot/godot --headless --path . --export-release "Web" build/index.html
          # a new build must not be filled from the browser's HTTP cache
          python3 tools/patch_sw.py build/index.service.worker.js
          test -s build/index.wasm && test -s build/index.pck && test -s build/index.manifest.json
          ls -la build

      - name: Publish to docs/godot-demo/ on main
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          # main moves fast (other sessions and the game's own publish job push
          # too). A rebase of a build over another build conflicts on the
          # binary files, so each try starts from the latest main and lays the
          # build on top afresh. If main has moved on past this commit's
          # godot-demo/, a newer run publishes that; this one steps aside.
          for i in 1 2 3 4 5; do
            git fetch -q origin main
            if ! git diff --quiet "$GITHUB_SHA" origin/main -- godot-demo .github/workflows/godot.yml; then
              echo "main has newer godot-demo changes: their own run publishes them"
              exit 0
            fi
            git reset -q --hard origin/main
            rm -rf docs/godot-demo
            mkdir -p docs/godot-demo
            cp godot-demo/build/index.* docs/godot-demo/
            touch docs/.nojekyll
            git add -A docs/godot-demo docs/.nojekyll
            if git diff --cached --quiet; then
              echo "docs/godot-demo/ already up to date"
              exit 0
            fi
            git commit -q -m "Publish Godot web build from ${GITHUB_SHA::7}"
            git push -q origin HEAD:main && exit 0
            sleep $((i * 3))
          done
          exit 1

      # Also upload the same build to itch.io, once the owner has set it up:
      #   · secret BUTLER_API_KEY (itch.io → Settings → API keys)
      #   · variable ITCH_GAME, the page as "user/game" (e.g. "name/zalissya")
      # Until both exist, this step only says so and passes.
      - name: Upload to itch.io on main
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_GAME: ${{ vars.ITCH_GAME }}
        run: |
          set -euo pipefail
          if [ -z "${BUTLER_API_KEY}" ] || [ -z "${ITCH_GAME}" ]; then
            echo "itch.io not set up yet (BUTLER_API_KEY / ITCH_GAME): skipping"
            exit 0
          fi
          # the page's address works too: https://user.itch.io/game -> user/game
          if [[ "${ITCH_GAME}" =~ ^https?://([^./]+)\.itch\.io/([^/?#]+) ]]; then
            ITCH_GAME="${BASH_REMATCH[1]}/${BASH_REMATCH[2]}"
          fi
          curl -sSL -o /tmp/butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -oq /tmp/butler.zip -d ~/butler
          chmod +x ~/butler/butler
          mkdir -p /tmp/itch
          cp godot-demo/build/index.* /tmp/itch/
          ~/butler/butler push /tmp/itch "${ITCH_GAME}:web" --userversion "${GITHUB_SHA::7}"
