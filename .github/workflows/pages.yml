# Typecheck, test and build the GitHub Pages version.
#   · on pull requests: check only.
#   · on pushes to main: also publish — the build is committed as
#     docs/index.html, which GitHub Pages serves (Settings → Pages:
#     "Deploy from a branch", main, /docs). No settings change needed.
# The publish commit is made with GITHUB_TOKEN, so it does not trigger this
# workflow again. Never edit docs/index.html by hand.
name: Pages

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ["docs/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pages
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - name: Publish to docs/ on main
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        working-directory: .
        run: |
          mkdir -p docs
          cp pages/dist/index.html docs/index.html
          touch docs/.nojekyll
          git add docs/index.html docs/.nojekyll
          if git diff --cached --quiet; then
            echo "docs/ already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish Pages build from ${GITHUB_SHA::7}"
          git push
